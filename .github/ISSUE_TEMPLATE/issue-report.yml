name: Issue report
description: Report a reproducible bug with your console, build, loader and settings
title: "[ISSUE]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please report the exact build and configuration used when the issue occurred.
        Preview and combined test builds are welcome; include their artifact link and build flavour.
        Example: PS2 MODEL: SCPH-30001; OPL VERSION: RiptOPL V3 (exact revision/build flavour);
        LOADER: UDPFS; SETTINGS CHANGED: UDPFS enabled; VMC: Not applicable; PADEMU: Enabled.
        Chassis revision is optional; add it if known.

  - type: checkboxes
    id: terms
    attributes:
      label: Checks
      description: "Check before posting"
      options:
        - label: I have checked existing [__OPL issues__](https://github.com/NathanNeurotic/Open-PS2-Loader/issues) for duplicates and found none
        - label: I have provided the exact version, build flavour and download source below.

  - type: textarea
    id: explanation
    attributes:
      label: Describe the issue
      description: A clear and concise description of what the issue is.
      placeholder: My issue is...
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Configuration
        > (please complete the following information):

  - type: input
    id: console
    attributes:
      label: "PS2 MODEL:"
      description: You can see it on the console sticker or inside OSDSYS (press triangle on main menu)
      placeholder: SCPH-?????
    validations:
      required: true

  - type: input
    id: oplver
    attributes:
      label: "OPL VERSION:"
      description: "Open OPL, press START and look for the About option; the version number will be at the top."
      placeholder: "Exact About-screen version, build flavour, commit SHA or artifact link; do not write latest."
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: "LOADER (MMCE, HDD, SMB, ETC):"
      multiple: true
      options:
        - Not related to a loader
        - MMCE
        - USB
        - SMB
        - HDD
        - iLink
        - MX4SIO
        - UDPBD
        - UDPFS
        - HTTP
        - Apps
        - Other (describe below)
    validations:
      required: true

  - type: textarea
    id: settings-changed
    attributes:
      label: "SETTINGS CHANGED:"
      description: List global and per-game settings changed from defaults, including core (Native/Neutrino/Ember/POPSTARTER), GSM, cheats and compatibility modes. Write None if unchanged.
      placeholder: "Core: Neutrino; global settings: ...; per-game settings: ...; or None"
    validations:
      required: true

  - type: dropdown
    id: vmc
    attributes:
      label: "VMC ENABLED/DISABLED:"
      description: State the setting used when the issue occurred. If enabled, include card size and slots in the context below.
      options:
        - Enabled
        - Disabled
        - Not applicable
    validations:
      required: true

  - type: dropdown
    id: pademu
    attributes:
      label: "PADEMU ENABLED/DISABLED:"
      description: State the setting used when the issue occurred. If enabled, include controller and adapter details below.
      options:
        - Enabled
        - Disabled
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the steps from launching OPL to the failure, and how often it happens.
      placeholder: "1. Launch ...
2. Select ...
3. Observe ...
Frequency: every time / intermittent"
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behavior
      description: Describe what should happen and what actually happens. Include exact error text or where the screen freezes.
    validations:
      required: true

  - type: input
    id: compat-modes
    attributes:
      label: Compatibility modes
      description: Which compatibility modes were tested?
      placeholder: "e.g. mode 6, 6+3, 1+3+6..."
    validations:
      required: true

  - type: textarea
    id: context-and-data
    attributes:
      label: Context and extra information
      description: Information about affected games (Game name, [Game ID], link to redump.org) and expected behavior
      placeholder: "game affected is Kingdom Hearts: II Final Mix [SLPM_666.75], http://redump.org/disc/7733/"
    validations:
      required: true

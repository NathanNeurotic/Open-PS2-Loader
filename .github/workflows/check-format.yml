
name: CI-format-check

on:
  push:
    paths:
      - '**.h'
      - '**.c'
      - '.github/workflows/check-format.yml'
      - '.clang-format'
  pull_request:
    paths:
      - '**.h'
      - '**.c'
      - '.github/workflows/check-format.yml'
      - '.clang-format'

permissions:
  contents: read

jobs:
  check-format:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: DoozyX/clang-format-lint-action@v0.18.2
      with:
        source: '.'
        extensions: 'h,c'
        clangFormatVersion: 12
        inplace: False

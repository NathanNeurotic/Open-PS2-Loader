name: Korium background diagnostic

on:
  pull_request:
    paths:
      - '.github/scripts/prepare_korium_background_diagnostic.py'
      - '.github/workflows/korium-background-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    container: ghcr.io/ps2homebrew/ps2homebrew@sha256:a1b1f87f09a88f64efbe11356aae47098d4d54b3b3a84f0609fa42369244e25d
    strategy:
      fail-fast: false
      matrix:
        variant: [control, single-pass]
    steps:
      - name: Install host dependencies
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash make git zip unzip python3 py3-yaml gmp mpfr4 mpc1 gawk
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq bash make git zip unzip python3 python3-yaml gawk
          fi
      - uses: actions/checkout@v6
        with:
          path: audit-tools
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: d41785a6e455637188234d9e3ad9b3a3590a24a2
          fetch-depth: 0
          path: released-source
          persist-credentials: false
      - name: Prepare exact-release comparison
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/released-source"
          python3 audit-tools/.github/scripts/prepare_korium_background_diagnostic.py released-source '${{ matrix.variant }}'
      - name: Build labelled diagnostic
        working-directory: released-source
        run: |
          sh .github/scripts/install_coherent_mmce.sh
          make clean
          make LOCALVERSION=KORIUM-BG-${{ matrix.variant }} RELEASE_CHANNEL=Korium REVISION=3608 release
          mkdir -p diagnostic-output
          cp RIPTOPL.ELF diagnostic-output/
          cp KORIUM-BACKGROUND-DIAGNOSTIC.txt diagnostic-output/
      - uses: actions/upload-artifact@v6
        with:
          name: Korium-BG-${{ matrix.variant }}
          path: released-source/diagnostic-output/
          if-no-files-found: error

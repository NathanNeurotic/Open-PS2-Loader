name: Analyze Korium menu-strip duplication

on:
  push:
    branches:
      - test/korium-audit-remediation
    paths:
      - .github/workflows/analyze-korium-menu-strips.yml

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/korium-audit-remediation

      - name: Analyze exact pixel differences
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          from PIL import Image
          from collections import Counter
          from pathlib import Path
          import json

          names = ["usb","usb_bd","ilk_bd","m4s_bd","hdd_bd","mmce","hdd","eth","udp_bd","udp_fs","app","fav"]
          imgs = {}
          for n in names:
              im = Image.open(Path("gfx") / f"{n}.png").convert("RGBA")
              imgs[n] = im
          sizes = {im.size for im in imgs.values()}
          if len(sizes) != 1:
              raise SystemExit(f"mixed dimensions: {sizes}")
          w,h = next(iter(sizes))

          px = {n:list(im.getdata()) for n,im in imgs.items()}
          count = w*h

          # Per-pixel modal baseline. Ties use the first name's value deterministically.
          modal = []
          variable_positions = []
          for i in range(count):
              vals = [px[n][i] for n in names]
              c = Counter(vals)
              best_count = max(c.values())
              best = next(v for v in vals if c[v] == best_count)
              modal.append(best)
              if len(c) > 1:
                  variable_positions.append(i)

          report = {
              "size":[w,h],
              "variant_count":len(names),
              "variable_pixels":len(variable_positions),
              "variable_percent":100*len(variable_positions)/count,
              "modal_unique_colors":len(set(modal)),
              "variants":{}
          }

          total_patch_area = 0
          max_union_colors = 0
          any_nonopaque_diff = False
          for n in names:
              diff = [i for i in range(count) if px[n][i] != modal[i]]
              if diff:
                  xs = [i % w for i in diff]
                  ys = [i // w for i in diff]
                  x0,x1 = min(xs),max(xs)
                  y0,y1 = min(ys),max(ys)
                  area = (x1-x0+1)*(y1-y0+1)
                  total_patch_area += area
                  alphas = [px[n][i][3] for i in diff]
                  nonopaque = sum(1 for a in alphas if a != 255)
                  any_nonopaque_diff |= nonopaque != 0
                  crop_colors = set()
                  for y in range(y0,y1+1):
                      for x in range(x0,x1+1):
                          crop_colors.add(px[n][y*w+x])
                  max_union_colors = max(max_union_colors, len(crop_colors))
                  report["variants"][n] = {
                      "diff_pixels":len(diff),
                      "bbox":[x0,y0,x1+1,y1+1],
                      "bbox_wh":[x1-x0+1,y1-y0+1],
                      "bbox_area":area,
                      "diff_nonopaque_alpha_pixels":nonopaque,
                      "diff_alpha_min":min(alphas),
                      "diff_alpha_max":max(alphas),
                      "crop_unique_colors":len(crop_colors),
                  }
              else:
                  report["variants"][n] = {
                      "diff_pixels":0,
                      "bbox":None,
                      "bbox_wh":[0,0],
                      "bbox_area":0,
                      "diff_nonopaque_alpha_pixels":0,
                      "diff_alpha_min":None,
                      "diff_alpha_max":None,
                      "crop_unique_colors":0,
                  }

          report["total_patch_bbox_area"] = total_patch_area
          report["original_total_area"] = w*h*len(names)
          report["area_ratio_base_plus_patches_vs_original"] = (w*h + total_patch_area)/(w*h*len(names))
          report["any_nonopaque_diff"] = any_nonopaque_diff
          report["max_patch_crop_unique_colors"] = max_union_colors

          # Alpha distribution specifically where variants differ from modal.
          alpha_counter = Counter()
          for n in names:
              for i in range(count):
                  if px[n][i] != modal[i]:
                      alpha_counter[px[n][i][3]] += 1
          report["diff_alpha_histogram"] = dict(sorted(alpha_counter.items()))

          print("KORIUM_MENU_STRIP_ANALYSIS=" + json.dumps(report, sort_keys=True))
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

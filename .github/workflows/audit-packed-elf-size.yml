name: Audit packed ELF contributors

on:
  push:
    branches:
      - test/korium-audit-remediation
    paths:
      - .github/workflows/audit-packed-elf-size.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    steps:
      - name: Install host dependencies
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash make git zip unzip python3 py3-yaml gawk coreutils findutils grep sed diffutils || true
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq bash make git zip unzip python3 python3-yaml gawk || true
          fi

      - uses: actions/checkout@v6
        with:
          ref: test/korium-audit-remediation
          fetch-depth: 0
          persist-credentials: false

      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin rebuild/main

      - name: Install coherent MMCE
        run: sh .github/scripts/install_coherent_mmce.sh

      - name: Measure packed-size contribution by resource class
        shell: bash
        run: |
          set -euo pipefail

          build_size() {
            label="$1"
            make clean >/dev/null
            make LOCALVERSION=SIZEAUDIT OPLDIAG=0 RETROACHIEVEMENTS=0 release >/dev/null
            bytes=$(stat -c %s RIPTOPL.ELF)
            echo "SIZE_RESULT $label $bytes"
          }

          tiny_png=gfx/fav_mark.png

          echo "=== KORIUM BASELINE ==="
          build_size KORIUM_BASE

          echo "=== BACKGROUNDS ONLY ==="
          cp "$tiny_png" /tmp/tiny.png
          cp /tmp/tiny.png gfx/background.png
          cp /tmp/tiny.png gfx/background_info.png
          build_size NO_KORIUM_BACKGROUNDS
          git restore -- gfx/background.png gfx/background_info.png

          echo "=== 640x128 MENU STRIPS ==="
          for n in usb usb_bd ilk_bd m4s_bd hdd_bd mmce hdd eth udp_bd udp_fs app fav; do
            cp /tmp/tiny.png "gfx/$n.png"
          done
          build_size NO_KORIUM_MENU_STRIPS
          git restore -- gfx/usb.png gfx/usb_bd.png gfx/ilk_bd.png gfx/m4s_bd.png gfx/hdd_bd.png gfx/mmce.png gfx/hdd.png gfx/eth.png gfx/udp_bd.png gfx/udp_fs.png gfx/app.png gfx/fav.png

          echo "=== KORIUM EXTRA CASE/PLAYER ASSETS ==="
          for n in case_ps1 apps_case disc_ps1 Players_1 Players_2 Players_3 Players_4; do
            cp /tmp/tiny.png "gfx/$n.png"
          done
          build_size NO_KORIUM_EXTRAS
          git restore -- gfx/case_ps1.png gfx/apps_case.png gfx/disc_ps1.png gfx/Players_1.png gfx/Players_2.png gfx/Players_3.png gfx/Players_4.png

          echo "=== BUILT-IN UI AUDIO ==="
          for f in audio/boot.adp audio/cancel.adp audio/confirm.adp audio/cursor.adp audio/message.adp audio/transition.adp audio/bd_connect.adp audio/bd_disconnect.adp; do
            dd if=/dev/zero of="$f" bs=16 count=1 status=none
          done
          build_size NO_BUILTIN_SFX
          git restore -- audio/boot.adp audio/cancel.adp audio/confirm.adp audio/cursor.adp audio/message.adp audio/transition.adp audio/bd_connect.adp audio/bd_disconnect.adp

          echo "=== FONT + BUILTIN THEME CFG + MC ICON DATA ==="
          for f in thirdparty/PoeVeticaNew.ttf misc/conf_theme_OPL.cfg misc/theme_coverflow.cfg misc/list.icn misc/icon.sys misc/icon_A.sys misc/icon_J.sys misc/icon_C.sys; do
            dd if=/dev/zero of="$f" bs=16 count=1 status=none
          done
          build_size NO_MISC_EMBEDDED
          git restore -- thirdparty/PoeVeticaNew.ttf misc/conf_theme_OPL.cfg misc/theme_coverflow.cfg misc/list.icn misc/icon.sys misc/icon_A.sys misc/icon_J.sys misc/icon_C.sys

          echo "=== ALL CURRENT EMBEDDED PNGS TINY (upper-bound visual payload) ==="
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          lines=Path("Makefile").read_text().splitlines()
          names=[]
          for i,line in enumerate(lines):
              m=re.match(r"^PNG_ASSETS\s*=\s*(.*)$",line)
              if not m: continue
              rhs=m.group(1)
              while True:
                  cont=rhs.rstrip().endswith("\\")
                  rhs=rhs.rstrip()
                  if cont: rhs=rhs[:-1]
                  rhs=rhs.split("#",1)[0]
                  names += rhs.split()
                  if not cont: break
                  i+=1; rhs=lines[i]
              break
          tiny=Path("/tmp/tiny.png").read_bytes()
          for n in names:
              p=Path("gfx")/(n+".png")
              if p.exists(): p.write_bytes(tiny)
          print("tiny png replacements",len(names))
          PY
          build_size NO_EMBEDDED_PNG_PAYLOAD
          git restore -- gfx

          echo "=== REBUILD/MAIN BASELINE SAME TOOLCHAIN ==="
          git reset --hard origin/rebuild/main >/dev/null
          sh .github/scripts/install_coherent_mmce.sh
          build_size REBUILD_MAIN_BASE

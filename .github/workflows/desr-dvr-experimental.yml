name: DESR DVR experimental source build

# Build-only sandbox for the codex DESR branch. NO publication or release.
# The PSX DVR partition is never mounted by these Linux jobs; real DESR
# behavior still requires separate hardware evidence and backed-up media.
on:
  push:
    branches:
      - codex/desr-dvr-neutrino
    paths:
      - '.github/workflows/desr-dvr-experimental.yml'
      - '.github/scripts/test_desr_dvr_source.py'
      - '.github/scripts/test_neutrino_dvr.py'
      - 'Makefile'
      - 'src/**'
      - 'include/**'
      - 'docs/NEUTRINO.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-desr-source:
    name: ${{ matrix.variant }} source and PS2SDK build
    runs-on: ubuntu-24.04
    container: ghcr.io/ps2homebrew/ps2homebrew@sha256:a1b1f87f09a88f64efbe11356aae47098d4d54b3b3a84f0609fa42369244e25d
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            dvrp: '0'
          - variant: desr-dvr-experimental
            dvrp: '1'
    steps:
      - name: Install build dependencies
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash make git zip unzip tar python3 py3-yaml gawk coreutils || true
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq bash make git unzip zip python3 python3-yaml gawk || true
          fi
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Source invariants and static regression tests
        run: |
          python3 .github/scripts/test_neutrino_dvr.py
          python3 .github/scripts/test_desr_dvr_source.py
      - name: Pin module-family compatibility
        run: sh .github/scripts/install_coherent_mmce.sh
      - name: Confirm DVR driver availability in PS2SDK
        if: matrix.dvrp == '1'
        run: |
          for f in dvrdrv.irx dvrfile.irx; do
            if [ ! -s "$PS2SDK/iop/irx/$f" ]; then
              echo "::error::Missing $PS2SDK/iop/irx/$f; need DVR-capable PS2SDK build environment"
              exit 1
            fi
          done
      - name: Build exact source and selected feature flags
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make --trace clean
          make --trace DVRP=${{ matrix.dvrp }} NOT_PACKED=1 LOCALVERSION=DESR-EXPERIMENTAL all
          test -s opl.elf
          mkdir -p artifact
          cp opl.elf artifact/RIPTOPL-${{ matrix.variant }}.ELF
          {
            echo "EXPERIMENTAL BUILD - NOT HARDWARE VALIDATED"
            echo "Variant: ${{ matrix.variant }}"
            echo "DVRP=${{ matrix.dvrp }}"
            echo "Source: $(git rev-parse HEAD)"
            echo "Image: ghcr.io/ps2homebrew/ps2homebrew@sha256:a1b1f87f09a88f64efbe11356aae47098d4d54b3b3a84f0609fa42369244e25d"
            echo "No modifications to firmware or media; DVR source is disabled by default."
          } > artifact/BUILD-MANIFEST.txt
      - name: Upload private-to-CI test artifact (no release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: riptopl-${{ matrix.variant }}-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7

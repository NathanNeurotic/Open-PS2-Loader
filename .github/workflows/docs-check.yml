name: Check documentation

on:
  pull_request:
    branches: [rebuild/main]
    paths:
      - '**/*.md'
      - 'lng_fork/*.yml'
      - 'lng_tmpl/_base.yml'
      - 'tools/audit_translations.py'
      - 'Makefile'
      - '.github/scripts/*docs*'
      - '.github/scripts/*site_sync*'
      - '.github/scripts/*wiki_sync*'
      - '.github/requirements-docs.txt'
      - '.github/workflows/docs-check.yml'
  push:
    branches: [rebuild/main]
    paths:
      - '**/*.md'
      - 'lng_fork/*.yml'
      - 'lng_tmpl/_base.yml'
      - 'tools/audit_translations.py'
      - 'Makefile'
      - '.github/scripts/*docs*'
      - '.github/scripts/*site_sync*'
      - '.github/scripts/*wiki_sync*'
      - '.github/requirements-docs.txt'
      - '.github/workflows/docs-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/requirements-docs.txt
      - run: python tools/audit_translations.py --strict
      - run: python .github/scripts/check_docs.py
      - run: python .github/scripts/test_site_sync.py
      - run: python .github/scripts/test_wiki_sync.py

name: Korium PR 894 hardware test

# Disposable test ELF: combine Korium's built-in theme with PR 894's latest code.
# Neither the established Korium branch nor rebuild/main is modified.
on:
  pull_request:
    branches:
      - rebuild/main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  korium-pr-test:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 894
    runs-on: ubuntu-24.04
    container: ghcr.io/ps2homebrew/ps2homebrew@sha256:a1b1f87f09a88f64efbe11356aae47098d4d54b3b3a84f0609fa42369244e25d
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: normal
            flavour: KORIUM-PR894
            diag: '0'
            artifact: RIPTOPL-KORIUM-PR894
          - variant: diag
            flavour: KORIUM-PR894-DIAG
            diag: '1'
            artifact: RIPTOPL-KORIUM-PR894-DIAG
    steps:
      - name: Install host dependencies
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash make git zip unzip python3 py3-yaml gmp mpfr4 mpc1 gawk
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq bash make git zip unzip python3 python3-yaml gawk
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Overlay Korium theme onto the current PR code
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          PR_HEAD=$(git rev-parse HEAD)
          git fetch --no-tags origin refs/heads/test/korium-audit-remediation
          KORIUM_SHA=$(git rev-parse FETCH_HEAD)
          BASE_SHA=$(git merge-base "$PR_HEAD" "$KORIUM_SHA")
          # ONLY Korium's theme-specific changes. PR source changes are retained by
          # git apply --3way, or the job fails rather than discarding a conflicting fix.
          git diff --binary "$BASE_SHA" "$KORIUM_SHA" -- \
            Makefile audio/ gfx/ misc/ include/textures.h \
            src/opl.c src/textures.c src/themes.c > /tmp/korium-theme.patch
          test -s /tmp/korium-theme.patch
          git apply --3way --index /tmp/korium-theme.patch
          git diff --cached --check
          grep -q 'Korium Komblete' misc/conf_theme_OPL.cfg
          test -f gfx/background.png
          test -f gfx/background_info.png
          printf 'PR 894 source: %s\nKorium theme source: %s\nCommon base: %s\n' \
            "$PR_HEAD" "$KORIUM_SHA" "$BASE_SHA" > KORIUM-PR894-BUILD.txt
          echo 'Build overlays only Korium theme changes onto current PR implementation.' >> KORIUM-PR894-BUILD.txt
          echo 'This is a hardware test artifact, not a validated stable release.' >> KORIUM-PR894-BUILD.txt
          echo 'Diagnostic mode: ${{ matrix.diag }} (1 = on-screen boot module stages)' >> KORIUM-PR894-BUILD.txt
          cat KORIUM-PR894-BUILD.txt

      - name: Build current RiptOPL with Korium theme
        shell: bash
        run: |
          set -euo pipefail
          sh .github/scripts/install_coherent_mmce.sh
          make clean
          make LOCALVERSION=${{ matrix.flavour }} OPLDIAG=${{ matrix.diag }} RELEASE_CHANNEL=Korium-PR894 release
          test -s RIPTOPL.ELF
          mkdir -p korium-test
          cp RIPTOPL.ELF KORIUM-PR894-BUILD.txt korium-test/
          sha256sum korium-test/RIPTOPL.ELF | tee korium-test/SHA256SUMS.txt

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: korium-test/
          if-no-files-found: error
          retention-days: 30

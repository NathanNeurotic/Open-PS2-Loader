name: Publish Unicode title guide to Wiki

# The GitHub Wiki is a separate Git repository, not the gh-pages branch.
# Publish one owned Markdown page and preserve every other existing Wiki page.
on:
  push:
    branches: [rebuild/main]
    paths:
      - 'docs/wiki/Unicode-Game-Titles.md'
      - '.github/workflows/publish-unicode-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unicode-title-wiki-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out authoritative Wiki page
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Publish only Unicode Game Titles and minimally link it
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_file="docs/wiki/Unicode-Game-Titles.md"
          wiki_dir="$RUNNER_TEMP/riptopl-wiki"
          test -s "$source_file"

          # Authenticate only in this step's process environment; never
          # write credentials into the Wiki git configuration or its remote.
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${authorization}"
          unset authorization

          # No 'git init', --mirror, --force, or wholesale directory sync.
          # A clone failure requires manual diagnosis, never an overwrite.
          if ! git clone --quiet "https://github.com/${GITHUB_REPOSITORY}.wiki.git" "$wiki_dir"; then
            echo '::error::Could not clone the existing Wiki; check Wiki initialization and GITHUB_TOKEN contents:write access.'
            exit 1
          fi
          branch="$(git -C "$wiki_dir" symbolic-ref --quiet --short HEAD)"
          if [[ -z "$branch" ]]; then
            echo '::error::Wiki does not expose a checked-out branch; declining to push.'
            exit 1
          fi

          cp "$source_file" "$wiki_dir/Unicode-Game-Titles.md"
          git -C "$wiki_dir" add -- Unicode-Game-Titles.md

          # Add discoverability links ONLY if those files already exist.
          # Never replace an existing Home or Sidebar layout.
          if [[ -f "$wiki_dir/_Sidebar.md" ]] && ! grep -Fq 'Unicode-Game-Titles' "$wiki_dir/_Sidebar.md"; then
            printf '\n* [Japanese / Unicode Game Titles](Unicode-Game-Titles)\n' >> "$wiki_dir/_Sidebar.md"
            git -C "$wiki_dir" add -- _Sidebar.md
          fi
          if [[ -f "$wiki_dir/Home.md" ]] && ! grep -Fq 'Unicode-Game-Titles' "$wiki_dir/Home.md"; then
            printf '\n[Japanese / Unicode Game Titles](Unicode-Game-Titles) — optional CJK font activation with English menus.\n' >> "$wiki_dir/Home.md"
            git -C "$wiki_dir" add -- Home.md
          fi

          if git -C "$wiki_dir" diff --cached --quiet; then
            echo 'Wiki page is already current.'
            exit 0
          fi
          git -C "$wiki_dir" config user.name 'github-actions[bot]'
          git -C "$wiki_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$wiki_dir" commit -m 'docs: publish Unicode and Japanese title setup'
          git -C "$wiki_dir" push origin "HEAD:${branch}"
          echo "Published https://github.com/${GITHUB_REPOSITORY}/wiki/Unicode-Game-Titles"

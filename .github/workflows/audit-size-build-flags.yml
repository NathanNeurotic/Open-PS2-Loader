name: Audit size-oriented build flags

on:
  push:
    branches:
      - test/korium-audit-remediation
    paths:
      - .github/workflows/audit-size-build-flags.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    steps:
      - name: Install host dependencies
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash make git zip unzip python3 py3-yaml gawk coreutils findutils grep sed diffutils || true
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq bash make git zip unzip python3 python3-yaml gawk || true
          fi
      - uses: actions/checkout@v6
        with:
          ref: test/korium-audit-remediation
          fetch-depth: 0
          persist-credentials: false
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh .github/scripts/install_coherent_mmce.sh

      - name: Benchmark compiler/linker size variants
        shell: bash
        run: |
          set -euo pipefail
          cp Makefile /tmp/Makefile.original

          build_size() {
            label="$1"
            make clean >/dev/null
            if make LOCALVERSION=FLAGAUDIT OPLDIAG=0 RETROACHIEVEMENTS=0 release >/tmp/build.log 2>&1; then
              elf=$(find . -maxdepth 1 -type f -name 'RIPTOPL*.ELF' | head -1)
              stripped=opl_stripped.elf
              echo "FLAG_RESULT $label packed=$(stat -c %s "$elf") stripped=$(stat -c %s "$stripped")"
            else
              echo "FLAG_RESULT $label BUILD_FAILED"
              tail -80 /tmp/build.log
            fi
          }

          cp /tmp/Makefile.original Makefile
          build_size O2_BASE

          cp /tmp/Makefile.original Makefile
          sed -i 's/EE_CFLAGS += -O2/EE_CFLAGS += -Os/' Makefile
          build_size Os

          cp /tmp/Makefile.original Makefile
          sed -i 's/EE_CFLAGS += -O2/EE_CFLAGS += -Oz/' Makefile
          build_size Oz

          cp /tmp/Makefile.original Makefile
          sed -i 's/EE_CFLAGS += -O2/EE_CFLAGS += -O2 -flto/' Makefile
          sed -i 's/EE_LDFLAGS += -fdata-sections -ffunction-sections -Wl,--gc-sections/EE_LDFLAGS += -fdata-sections -ffunction-sections -flto -Wl,--gc-sections/' Makefile
          build_size O2_LTO

          cp /tmp/Makefile.original Makefile
          sed -i 's/EE_CFLAGS += -O2/EE_CFLAGS += -Os -flto/' Makefile
          sed -i 's/EE_LDFLAGS += -fdata-sections -ffunction-sections -Wl,--gc-sections/EE_LDFLAGS += -fdata-sections -ffunction-sections -flto -Wl,--gc-sections/' Makefile
          build_size Os_LTO

          cp /tmp/Makefile.original Makefile
          sed -i 's/EE_CFLAGS += -O2/EE_CFLAGS += -Oz -flto/' Makefile
          sed -i 's/EE_LDFLAGS += -fdata-sections -ffunction-sections -Wl,--gc-sections/EE_LDFLAGS += -fdata-sections -ffunction-sections -flto -Wl,--gc-sections/' Makefile
          build_size Oz_LTO

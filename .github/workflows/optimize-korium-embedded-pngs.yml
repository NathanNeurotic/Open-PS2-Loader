name: Optimize Korium embedded PNGs

on:
  push:
    branches:
      - test/korium-audit-remediation
    paths:
      - .github/workflows/optimize-korium-embedded-pngs.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Korium parity branch
        uses: actions/checkout@v4
        with:
          ref: test/korium-audit-remediation
          fetch-depth: 0

      - name: Install lossless PNG optimizer
        run: |
          sudo apt-get update
          sudo apt-get install -y optipng
          python3 -m pip install --disable-pip-version-check pillow

      - name: Optimize embedded PNG assets and verify exact decoded pixels
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          from PIL import Image
          import hashlib
          import re
          import struct
          import subprocess

          MAKEFILE = Path("Makefile")
          GFX = Path("gfx")

          def png_asset_names(makefile: Path) -> list[str]:
              lines = makefile.read_text(encoding="utf-8").splitlines()
              names: list[str] = []
              i = 0
              while i < len(lines):
                  match = re.match(r"^PNG_ASSETS\s*(\+?=)\s*(.*)$", lines[i])
                  if not match:
                      i += 1
                      continue

                  rhs = match.group(2)
                  while True:
                      continued = rhs.rstrip().endswith("\\")
                      rhs = rhs.rstrip()
                      if continued:
                          rhs = rhs[:-1]
                      rhs = rhs.split("#", 1)[0]
                      names.extend(rhs.split())
                      if not continued:
                          break
                      i += 1
                      if i >= len(lines):
                          break
                      rhs = lines[i]
                  i += 1
              return list(dict.fromkeys(names))

          def color_chunks(data: bytes) -> dict[str, str]:
              sig = b"\x89PNG\r\n\x1a\n"
              if not data.startswith(sig):
                  raise RuntimeError("not a PNG")
              pos = len(sig)
              keep = {b"gAMA", b"cHRM", b"sRGB", b"iCCP"}
              found: dict[str, str] = {}
              while pos + 12 <= len(data):
                  length = struct.unpack(">I", data[pos:pos+4])[0]
                  kind = data[pos+4:pos+8]
                  chunk = data[pos+8:pos+8+length]
                  if kind in keep:
                      found[kind.decode("ascii")] = hashlib.sha256(chunk).hexdigest()
                  pos += 12 + length
                  if kind == b"IEND":
                      break
              return found

          def image_signature(path: Path) -> dict:
              data = path.read_bytes()
              with Image.open(path) as image:
                  frames = getattr(image, "n_frames", 1)
                  if frames != 1:
                      raise RuntimeError(f"animated PNG ({frames} frames)")
                  rgba = image.convert("RGBA")
                  return {
                      "size": tuple(image.size),
                      "rgba_sha256": hashlib.sha256(rgba.tobytes()).hexdigest(),
                      "color_chunks": color_chunks(data),
                      "file_size": len(data),
                  }

          def semantics_equal(a: dict, b: dict) -> bool:
              return (
                  a["size"] == b["size"]
                  and a["rgba_sha256"] == b["rgba_sha256"]
                  and a["color_chunks"] == b["color_chunks"]
              )

          assets = []
          for name in png_asset_names(MAKEFILE):
              path = GFX / f"{name}.png"
              if path.exists():
                  assets.append(path)

          if not assets:
              raise RuntimeError("No PNG_ASSETS files were found")

          reductions = []
          skipped = []
          total_before = 0
          total_after = 0

          for path in assets:
              original = path.read_bytes()
              before = image_signature(path)
              total_before += before["file_size"]

              proc = subprocess.run(
                  ["optipng", "-o7", "-quiet", str(path)],
                  capture_output=True,
                  text=True,
              )

              if proc.returncode != 0:
                  path.write_bytes(original)
                  reason = (proc.stderr or proc.stdout or f"exit {proc.returncode}").strip().splitlines()
                  skipped.append((str(path), reason[-1] if reason else f"exit {proc.returncode}"))
                  total_after += before["file_size"]
                  continue

              after = image_signature(path)
              saved = before["file_size"] - after["file_size"]

              if not semantics_equal(before, after):
                  path.write_bytes(original)
                  skipped.append((str(path), "optimizer changed decoded pixels/dimensions/color metadata; restored original"))
                  total_after += before["file_size"]
                  continue

              if saved <= 0:
                  path.write_bytes(original)
                  total_after += before["file_size"]
                  continue

              total_after += after["file_size"]
              reductions.append((saved, str(path), before["file_size"], after["file_size"]))

          reductions.sort(reverse=True)
          total_saved = total_before - total_after

          # Final verification of every file that remains modified.
          for _, key, _, _ in reductions:
              path = Path(key)
              # Git diff will contain only files that passed per-file semantic verification.
              if not path.exists():
                  raise RuntimeError(f"{path} disappeared during optimization")

          print(f"Checked {len(assets)} embedded PNGs.")
          print(f"Embedded PNG bytes: {total_before} -> {total_after} (saved {total_saved}).")
          print(f"Optimized {len(reductions)} files; safely skipped {len(skipped)} files.")
          for saved, key, old_size, new_size in reductions:
              print(f"{saved:8d}  {old_size:8d} -> {new_size:8d}  {key}")
          for key, reason in skipped:
              print(f"SKIP {key}: {reason}")

          summary = Path("/tmp/korium_png_summary.md")
          with summary.open("w", encoding="utf-8") as out:
              out.write("## Korium embedded PNG optimization\n\n")
              out.write(f"- Checked: **{len(assets)} embedded PNGs**\n")
              out.write(f"- Optimized: **{len(reductions)} files**\n")
              out.write(f"- Before: **{total_before:,} bytes**\n")
              out.write(f"- After: **{total_after:,} bytes**\n")
              out.write(f"- Saved: **{total_saved:,} bytes**\n")
              out.write("- Safety gate: every retained change preserves dimensions, decoded RGBA pixels, and PNG color-management chunks exactly.\n\n")
              if reductions:
                  out.write("| Saved | Before | After | Asset |\n")
                  out.write("|---:|---:|---:|---|\n")
                  for saved, key, old_size, new_size in reductions:
                      out.write(f"| {saved:,} | {old_size:,} | {new_size:,} | `{key}` |\n")
              if skipped:
                  out.write("\n### Safely skipped\n\n")
                  for key, reason in skipped:
                      out.write(f"- `{key}`: {reason}\n")
          PY

          cat /tmp/korium_png_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit only genuine reductions
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- gfx; then
            echo "OptiPNG found no smaller verified representations."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gfx
          git commit -m "assets: losslessly optimize Korium embedded PNGs"
          git push origin HEAD:test/korium-audit-remediation

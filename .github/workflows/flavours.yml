name: build-flavours

# PR/push CI builds the two ROLLING toolchains only (plus their DIAG/FREEZEDIAG/RA variants):
#
#   ps2dev             PS2DEVROLLING      (ghcr.io/ps2dev/ps2dev:latest)
#   official OPL CI    OFFICIALROLLING    (ghcr.io/ps2homebrew/ps2homebrew:main)
#
# The digest-pinned PS2DEVPINNED/OFFICIALPINNED flavours were dropped from per-PR CI: they doubled
# the build matrix without catching anything the rolling pair did not. They still exist where
# reproducibility is the point -- the rolling/RA release workflows publish pinned assets, and the
# iLink driver job below builds in its own ps2dev pin (taken 2026-08-13) because it checks exact bytes.
# That pin is not PS2DEVPINNED: PS2DEVPINNED is the 2026-07-28 digest the release workflows build with.
#
# Rolling means the toolchain moves without us changing anything (issue #382). When a build or a
# console result regresses, rebuild the SAME commit in the PS2DEVPINNED image (README.md has the
# command) before blaming the source -- a pinned release asset may come from a different commit.
#
# ⚠ EVERY BUG REPORT MUST NAME ITS FLAVOUR. Each artifact carries BUILD-MANIFEST.txt recording the
# image, the resolved digest where known, the compiler version and the source commit -- so a report
# identifies exactly what ran.
#
# Each ELF also self-identifies via LOCALVERSION ("-<FLAVOUR>" suffix), so a stray ELF with no zip
# around it is still identifiable.

# push is restricted to the two INTEGRATION branches on purpose. Adding pull_request while leaving
# push on 'rebuild/**' made every PR build TWICE (once for the branch push, once for the PR event) --
# observed on PR #410. Feature branches are covered by their PR; these two are covered by the merge
# that lands on them.
on:
  push:
    branches:
      - master
      - rebuild/main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apa-safety-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check the APA table write fence, driver write policy and raw hdd0 paths
        run: python3 .github/scripts/test_apa_table_safety.py
      - name: Check the APA recovery tool against synthetic damaged disks
        run: python3 .github/scripts/test_apa_recover.py
      - name: Check the RIPPS2 backend port (POPS files check, IOP-reset latches, FreeType trim, MMCE Game ID wait)
        run: python3 .github/scripts/test_ripps2_backend_port.py
      - name: Check the RIPPS2 art port (any-case art index, OPL Manager names, JPG decode)
        run: python3 .github/scripts/test_ripps2_art_port.py
      - name: Check the RIPPS2 library port (recents, Favourites Recent stop, Random Game)
        run: python3 .github/scripts/test_ripps2_library_port.py
      - name: Check the RIPPS2 All Games list (gathering, duplicate tags, stars, tabs, L3 ring)
        run: python3 .github/scripts/test_ripps2_all_games.py
      - name: Check the RIPPS2 Hide Game and Delete everything (hidden.txt, rows, files that go)
        run: python3 .github/scripts/test_ripps2_game_manage.py
      - name: Check the About page (full version, NathanNeurotic credited, row count kept)
        run: python3 .github/scripts/test_about_credits_layout.py
      - name: Check the YAOPL theme fixes, the Background art hold and the RIPPS2 boot theme hold
        run: python3 .github/scripts/test_yaopl_ripps2_b125_ports.py
      - name: Check the RIPPS2 right-to-left and CJK text (Arabic joining, line order, CJK/Thai breaks, wrap)
        run: python3 .github/scripts/test_ripps2_text_port.py
      - name: Check the RIPPS2 boot video mode (saved mode read before the screen starts)
        run: python3 .github/scripts/test_ripps2_boot_video_mode.py
      - name: Check the RIPPS2 Drive Status page and DIAG.TXT (hardware log, free-space devctl, log sites)
        run: python3 .github/scripts/test_ripps2_drive_status.py
      - name: Check the RIPPS2 GUI port (dimmed and collapsed rows, scroll bar, right-stick peek, return to opener)
        run: python3 .github/scripts/test_ripps2_gui_port.py
      - name: Check the RIPPS2 VMC Saves port (list, copy out, copy in, delete; checked by an independent card reader)
        run: python3 .github/scripts/test_ripps2_vmc_saves.py
      - name: Check the File Manager (copy, move, rename, delete on a real folder; dialog, menu, strings, docs)
        run: python3 .github/scripts/test_file_manager.py
      - name: Check Apps launch paths and argument limits before teardown
        run: python3 .github/scripts/test_app_launch_args.py
      - name: Check Auto Loading settings discovery and APA+exFAT hybrid detection
        run: python3 .github/scripts/test_autolaunch_settings.py
      - name: Check Automatic Refresh never suppresses a source's first list population
        run: python3 .github/scripts/test_autorefresh_initial_population.py
      - name: Check L3 triggers a PS1 scan from a cached USB device root
        run: python3 .github/scripts/test_libview_l3_rescan.py
      - name: Check that background music never holds audsrv across an open-ended wait
        run: python3 .github/scripts/test_audio_threads.py
      - name: Check that background music survives a card that loses the file's descriptor
        run: python3 .github/scripts/test_bgm_source.py
      - name: Check that the newest menu sound cuts the one still playing
        run: python3 .github/scripts/test_sfx_oneshot_cut.py
      - name: Check that a held button keeps repeating across the tick-counter wrap
        run: python3 .github/scripts/test_pad_repeat_clock.py
      - name: Check that a missed pad read is not a release, and rumble alignment waits for a quiet pad
        run: python3 .github/scripts/test_pad_missed_read.py
      - name: Check that the DualShock stays locked in analog mode, so its ANALOG button cannot stall the menu
        run: python3 .github/scripts/test_pad_mode_lock.py
      - name: Check masked pattern scan bounds and rejection of short ranges
        run: python3 .github/scripts/test_pad_pattern_bounds.py short
      - name: Check IGR samples from the VBLANK_END handler in every build, and RA Mode 6
        run: python3 .github/scripts/test_igr_polling.py
      - name: Check IGR and power-off stop the USB host controller before the IOP reset
        run: python3 .github/scripts/test_igr_usb_host_stop.py
      - name: Check SMB VMC I/O releases smb_io_sema, reports failed pages and trusts only the server's write Count
        run: python3 .github/scripts/test_smb_vmc_io_result.py
      - name: Check an SMB read reply cut off by the server fails instead of hanging the game
        run: python3 .github/scripts/test_smb_read_closed.py
      - name: Check the menu's smbman (every flavour) trusts only the server's write Count
        run: python3 .github/scripts/test_smbman_ra_write_count.py
      - name: Check BDM and MMCE VMC writes, reads and erases report device failures
        run: python3 .github/scripts/test_vmc_write_result.py
      - name: Check MX4SIO partial-transfer retries
        run: python3 .github/scripts/test_mx4sio_retry.py
      - name: Check IGR and power-off let an in-flight VMC save finish, bounded
        run: python3 .github/scripts/test_igr_vmc_drain.py
      - name: Check a failed ZSO device read is a read error, through the sector cache too, and an SMB image's last sector reads
        run: python3 .github/scripts/test_zso_read_errors.py
      - name: Check docs/VCD.md documents the shipped i.LINK usbhdfsd.irx size and hash
        run: python3 .github/scripts/test_vcd_doc_ilink_hash.py
      - name: Check audit_translations --strict still rejects a bad fork string after the overlay merge
        run: python3 .github/scripts/test_audit_translations_overlay_owner.py
      - name: Check the in-game freeze report stays in its flavour and cannot hang IGR
        run: python3 .github/scripts/test_ingame_freeze_diag.py
      - name: Check the in-game freeze report text
        run: |
          cc -std=gnu99 -Wall -Wextra -Werror -Iee_core/include ee_core/tests/test_freeze_diag_format.c ee_core/src/freeze_diag_format.c -o /tmp/test_freeze_diag_format
          /tmp/test_freeze_diag_format
      - name: Check the in-game freeze report's TV page
        run: |
          cc -std=gnu99 -Wall -Wextra -Werror -DFREEZE_DIAG_SCREEN_HOST_TEST -Iee_core/include ee_core/tests/test_freeze_diag_screen.c ee_core/src/freeze_diag_screen.c -o /tmp/test_freeze_diag_screen
          /tmp/test_freeze_diag_screen
      - name: Check the in-game menu's pages and its cheat list
        run: |
          c++ -std=gnu++17 -Wall -Wextra -Werror -Iee_core/tests/stub -Iee_core/include -I. ee_core/tests/test_igrmenu.cpp -o /tmp/test_igrmenu
          /tmp/test_igrmenu
      - name: Check IOP reset command bounds and payload offsets
        run: python3 .github/scripts/test_reset_arg_bounds.py
      - name: Check IOP reset failure cleanup and caller gates
        run: python3 .github/scripts/test_reset_failure_lifecycle.py
      - name: Check repeated HDD/APA probes preserve one DEV9 owner and retry failed loads
        run: python3 .github/scripts/test_hdd_module_lifetime.py
      - name: Check that the handoff probe only refuses a target the child cannot load
        run: python3 .github/scripts/test_handoff_probe.py
      - name: Check that a blind button press cannot keep a video mode the TV cannot show
        run: python3 .github/scripts/test_vmode_confirm.py
      - name: Check that long text wraps on the warning, text, video-mode and remove-settings screens
        run: python3 .github/scripts/test_message_wrap.py
      - name: Check that leaving a 704-wide, 720p or 1080i mode gives the GUI thread its priority back
        run: python3 .github/scripts/test_hires_thread_priority.py
      - name: Check that the 480i/576i HIRES modes draw inside a 4:3 safe area
        run: python3 .github/scripts/test_vmode_safe_area.py
      - name: Check that the flicker-filtered HIRES modes blend each line with the next in the merge circuit
        run: python3 .github/scripts/test_hires_line_blend.py
      - name: Check that a missing settings file is opened once, not twice
        run: python3 .github/scripts/test_config_missing_open_once.py
      - name: Check 3D save icons parse real icons and card images, and refuse damaged ones
        run: python3 .github/scripts/test_save_icons.py
      - name: Check native PS2 logo validation including descriptor zero
        run: |
          python3 .github/scripts/test_ps2_logo_validation.py
          python3 .github/scripts/test_zso_probe_fd.py
      - name: Check PS1 VMC save icons and reject damaged cards
        run: python3 .github/scripts/test_ps1_save_icons.py
      - name: Check packaged BDMA pairs against both production validators
        run: python3 .github/scripts/test_bdma_shipped_pairs.py
      - name: Check a launch names an older release's device BDMA pair instead of copying it
        run: python3 .github/scripts/test_bdma_stale_pair.py
      - name: Check POPSTARTER's i.LINK driver logs back in after an IOP reset
        run: python3 .github/scripts/test_ilink_bd_assault_reset.py
      - name: Check POPS UDPFS game-device population and MC save rollback
        run: python3 .github/scripts/test_pops_udpfs.py
      - name: Check unsupported MMCE ioctls cannot report VMC fragmentation
        run: python3 .github/scripts/test_vmc_contiguity.py
      - name: Check FAT fragment walker disk errors, corrupt chains and module installation
        run: |
          python3 .github/scripts/test_bdmfs_frag_walk.py
          python3 .github/scripts/test_safe_bdmfs_install.py
          python3 .github/scripts/test_vmc_contiguous_create.py
          python3 .github/scripts/test_vmc_fatfs_images.py
      - name: Check native VMC mapping refusals and both slot lifetimes
        run: python3 .github/scripts/test_native_vmc_layout.py
      - name: Check HDD VMC creation reserves PFS space and only committed inodes are mapped
        run: |
          python3 .github/scripts/test_vmc_pfs_reserve.py
          python3 .github/scripts/test_pfs_vmc_inode.py
      - name: Check rebuilding a fragmented VMC keeps the card through every fault, and fixes a real image
        run: |
          python3 .github/scripts/test_vmc_rebuild.py
          python3 .github/scripts/test_vmc_rebuild_fatfs.py
      - name: Check Back on a Settings page keeps its edits and only a real change reconnects SMB
        run: python3 .github/scripts/test_settings_back_keeps_edits.py
      - name: Check a memory-card settings path saves and POPSTARTER is made only when needed, with icons
        run: python3 .github/scripts/test_mc_folders.py
      - name: Check a failed ul.cfg rewrite or UL rename loses no game and splits none
        run: python3 .github/scripts/test_ulcfg_rebuild.py
      - name: Check Settings pages fit before they scroll, BDM rows indent, and RiptOPL's plasma
        run: python3 .github/scripts/test_settings_fit.py
      - name: Check settings text stays on screen (long notes wrap, labels leave room, values fit)
        run: python3 .github/scripts/test_dia_text_room.py
      - name: Check Settings and its prompts follow the user's confirm button
        run: python3 .github/scripts/test_confirm_button.py
      - name: Check language changes refresh menus when returning to English
        run: python3 .github/scripts/test_language_switch.py
      - name: Check the Language page keeps edits, separates OSD defaults and owns its name list
        run: |
          python3 .github/scripts/test_language_page.py
          python3 .github/scripts/test_osd_defaults.py
      - name: Check CWD language precedence, file filtering and dynamic language count
        run: python3 .github/scripts/test_language_discovery.py
      - name: Check translations that would misread their printf arguments fall back to English
        run: python3 .github/scripts/test_lang_format_guard.py
      - name: Check that a broken cheat file is never reported as a missing one
        run: python3 .github/scripts/test_cheat_load.py
      - name: Check full cheat tables preserve accepted entries
        run: python3 .github/scripts/test_cheat_capacity.py
      - name: Check that a -bsdfs=bd launch without a device number is refused before teardown
        run: python3 .github/scripts/test_neutrino_bsdfs.py
      - name: Check Neutrino SMB writes bsd-smb.toml safely and falls back to the OPL core
        run: python3 .github/scripts/test_neutrino_smb.py
      - name: Check PSX DVR Neutrino discovery and safety gates
        run: python3 .github/scripts/test_neutrino_dvr.py
      - name: Check DVR refresh and Neutrino mount handoff
        run: python3 .github/scripts/test_dvr_scan_lifecycle.py
      - name: Check Neutrino argument editing preserves full values and rejects overlong saves
        run: python3 .github/scripts/test_neutrino_args_editor.py
      - name: Check Neutrino launch arguments fit before teardown without dropping tokens
        run: python3 .github/scripts/test_neutrino_argv_budget.py
      - name: Check Neutrino pad emulation warnings and forced-core settings
        run: python3 .github/scripts/test_neutrino_pademu.py
      - name: Check cheats reach Neutrino and Select-mode picks are remembered on both cores
        run: python3 .github/scripts/test_neutrino_cheats.py
      - name: Check the UDPFS/UDPBD toml ip sync leaves a parseable file on a memory card (#1010)
        run: python3 .github/scripts/test_neutrino_toml_sync.py
      - name: Check every way back to the menu after sbPrepare restores the cdvdman patch zone
        run: python3 .github/scripts/test_patch_zone_restore.py
      - name: Check a launch that returned to the menu leaves the next one its VMC slots
        run: python3 .github/scripts/test_mcemu_slots.py
      - name: Check the media size CDVDMAN bounds reads by is exact or unknown, never a partial guess
        run: python3 .github/scripts/test_media_lsn_count.py
      - name: Check Accurate Reads keeps its CD/DVD rates and Slow Reads (Mode 8) gives DVD the CD rate
        run: python3 .github/scripts/test_accurate_read_rate.py
      - name: Check .hack//Infection gets 2 KB more for every IOP allocation, never a failed allocation
        run: python3 .github/scripts/test_iop_pad.py
      - name: Check an HDD mini argv autolaunch resolves its HDL partition and refuses unmatched sectors
        run: python3 .github/scripts/test_hdd_mini_autolaunch.py
      - name: Check that turning Network Connectivity off and on keeps the chosen protocol
        run: python3 .github/scripts/test_net_protocol_pick.py
      - name: Check quoted config values survive repeated save and reload
        run: python3 .github/scripts/test_config_escape_roundtrip.py
      - name: Check config allocation failures handle NULL safely without dereferencing
        run: python3 .github/scripts/test_config_null_allocation.py
      - name: Check config saves retain files on allocation failures and propagate true I/O errors
        run: python3 .github/scripts/test_config_save_integrity.py
      - name: Check a settings home on a never-mounted mass slot falls back to the booted ELF's slot
        run: python3 .github/scripts/test_bdm_empty_literal_slot.py
      - name: Check that a host (PCSX2) boot never loads MX4SIO
        run: python3 .github/scripts/test_mx4sio_host_boot.py
      - name: Check that long theme text stops at the next element and scrolls instead of overlapping
        run: python3 .github/scripts/test_theme_text_room.py
      - name: Check optional game titles fall back without changing metadata
        run: python3 .github/scripts/test_theme_metadata.py
      - name: Check PSBBN Flow rendering, the theme catalog and view switching
        run: python3 .github/scripts/test_psbbn_flow.py
      - name: Check multi-view theme resolution (views, view blocks, fallbacks, key length)
        run: python3 .github/scripts/test_themeviews.py
      - name: Check the Grid view (shape limits, scrolling, Up/Down rows, wiring)
        run: python3 .github/scripts/test_grid.py
      - name: Check custom theme font reads start with an unknown file size
        run: python3 .github/scripts/test_custom_font_load.py
      - name: Check font sizes preserve layout, cache and boot configuration contracts
        run: python3 .github/scripts/test_font_size.py
      - name: Check UTF-8 CJK fallback uses only missing glyphs
        run: python3 .github/scripts/test_cjk_font_fallback.py
      - name: Check automatic VMC creation assigns only a card that exists
        run: python3 .github/scripts/test_auto_vmc.py
      - name: Check saving Favorites never leaves a truncated list
        run: python3 .github/scripts/test_fav_writer.py
      - name: Check optional CFG Titles in game lists are display-only and opt-in
        run: python3 .github/scripts/test_cfg_titles.py
      - name: Check VMC creation can recover after failed or short writes
        run: python3 .github/scripts/test_genvmc_recovery.py
      - name: Check genvmc owns one job, never overlaps, and cancels without blocking
        run: python3 .github/scripts/test_genvmc_lifecycle.py
      - name: Check VMC resizing cannot erase an existing image implicitly
        run: python3 .github/scripts/test_vmc_preserve_existing.py
      - name: Check Create VMC on First Launch creates, reuses, skips and reports correctly
        run: python3 .github/scripts/test_auto_create_vmc.py
      - name: Check a read-only UDPBD/UDPFS IMG server is found and never written to
        run: python3 .github/scripts/test_udpbd_read_only.py
      - name: Check the screen position is kept for each video mode (RIPPS2 build 124)
        run: python3 .github/scripts/test_screen_pos_per_mode.py
      - name: Check Neutrino VMC budget recovery and #831 compat defaults
        run: python3 .github/scripts/test_issues_830_831.py
      - name: Check per-title compat defaults and per-core routing
        run: python3 .github/scripts/test_title_compat_defaults.py
      - name: Check UDPBD and UDPFS IMG games boot the OPL core on their own <OPL> key
        run: python3 .github/scripts/test_netblock_oplcore.py
      - name: Check UDPFS Files games boot the OPL core, with VMC saves, on their own <OPL> key
        run: python3 .github/scripts/test_udpfs_files_oplcore.py
      - name: Check menu rumble is off by default
        run: python3 .github/scripts/test_rumble_default.py
      - name: Check network-share art bypasses the directory index
        run: python3 .github/scripts/test_artindex_network.py

  release-notes-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check compact release notes and changelog
        run: python3 .github/scripts/test_release_notes.py
      - name: Check every release ZIP name ends with the version
        run: python3 .github/scripts/test_version_last.py
      - name: Check release edition titles and classification policy
        run: python3 .github/scripts/test_release_titles.py
      - name: Check release versions use complete Git history for every SDK
        run: python3 .github/scripts/test_release_version.py
      - name: Check pinned ORBIT extraction and RA package isolation
        run: python3 .github/scripts/test_package_orbit_neutrino.py
      - name: Check ORBIT Neutrino Watch reports pin changes without moving the pin
        run: python3 .github/scripts/test_orbit_neutrino_watch.py
      - name: Check both RA themes, provenance gates and upload rollback
        run: python3 .github/scripts/test_ra_release.py
      - name: Check a rolling publish never leaves the release missing files when GitHub fails mid-way
        run: python3 .github/scripts/test_rolling_publish_order.py
      - name: Check the MEGA mirror upload is bounded and cannot fail a release
        run: python3 .github/scripts/test_mega_upload_bounded.py

  ra-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check Neutrino RA handoff, network ownership and watch limits
        run: python3 .github/scripts/test_neutrino_ra.py
      - name: Check RA menu actions leave a selected UDP transport's NIC alone
        run: python3 .github/scripts/test_ra_nic_reserved.py
      - name: Check RA menu requests use the mstack link while UDPFS owns the NIC
        run: python3 .github/scripts/test_ra_mstack_link.py
      - name: Check the RA support check runs on UDPFS games
        run: python3 .github/scripts/test_ra_udpfs_check.py
      - name: Check PS1 VCD identification, module ownership and POPS snapshot reads
        run: python3 .github/scripts/test_ra_ps1.py
      - name: Check RA row ownership and badge-independent alphabetical sorting
        run: |
          python3 .github/scripts/test_ra_badge_rows.py
          python3 .github/scripts/test_menu_sort.py
          python3 .github/scripts/test_cfg_titles.py
      - name: Check PS1 scan recovery, launch readiness and optional IOP startup failures
        run: python3 .github/scripts/test_pr894_hardening.py
      - name: Check disc hashing, disc key lock, history names, font wrap and SYSTEM.CNF parsing
        run: |
          python3 .github/scripts/test_ra_disc.py
          python3 .github/scripts/test_disc_key_semaphore.py
          python3 .github/scripts/test_history_filename_bounds.py
          python3 .github/scripts/test_font_fit_bounds.py
          python3 .github/scripts/test_cnf_missing_equals.py
      - name: Check RA language isolation and stable string IDs
        run: python3 .github/scripts/test_ra_language_isolation.py
      - name: Check RA watch validation, persistent layout and EE sampling
        run: python3 .github/scripts/test_ra_watch.py
      - name: Check RA launch resources, optional IOP module failures and card opt-in gates
        run: python3 .github/scripts/test_ra_launch_resources.py
      - name: Check RA snapshot scheduling and transmission retries
        run: python3 .github/scripts/test_ra_sender.py
      - name: Check raw RA notices cannot consume stale frame tails
        run: python3 .github/scripts/test_ra_receive_frame.py
      - name: Check the SMAP notice tap hands raudp each RA datagram once, with its sender
        run: python3 .github/scripts/test_ra_ingame_events.py
      - name: Check Caduceus in-game card bounds and event handling
        run: python3 .github/scripts/test_caduceus_overlay.py
      - name: Check experimental cards default Off and persist only explicit opt-in
        run: python3 .github/scripts/test_ra_cards_setting.py
      - name: Check Caduceus achievement browsing and pairing
        run: python3 .github/scripts/test_caduceus_browser.py
      - name: Check the Xerabora-mode achievement browser and its HTTP client
        run: python3 .github/scripts/test_ra_xerabora_browser.py
      - name: Check mbedTLS is vendored from its release archive, RA-only, with six pinned roots
        run: python3 .github/scripts/test_mbedtls_vendor.py
      - name: Check the ps2ips DNS reply carries the IPv4 address, not a pointer
        run: python3 .github/scripts/test_ps2ips_dns.py
      - name: Check ps2ips receives keep every TCP byte and never overrun the EE buffers
        run: python3 .github/scripts/test_ps2ips_recv_tail.py
      - name: Check the verified HTTPS client (TLS 1.3/1.2, certificates, clock, deadline) against local servers
        run: python3 .github/scripts/test_ratls_host.py
      - name: Compile vendored mbedTLS with the RiptOPL configuration (host)
        run: |
          D=third_party/mbedtls
          mkdir -p /tmp/mbedtls-host
          for f in $D/library/*.c; do
            cc -c -O1 -I$D/include -I$D -DMBEDTLS_CONFIG_FILE='"riptopl_mbedtls_config.h"' "$f" -o /tmp/mbedtls-host/$(basename "$f" .c).o
          done
      - name: Check Xerabora and Caduceus discovery and offline sessions
        run: python3 .github/scripts/test_ra_client_mode.py
      - name: Check exact RA watch-list chunk boundaries and counts
        run: python3 .github/scripts/test_ra_chunk_integrity.py
      - name: Check passive RA host stays bound to a verified peer and current settings
        run: python3 .github/scripts/test_ra_verified_peer.py
      - name: Check Caduceus menu and in-game host selection are consistent
        run: python3 .github/scripts/test_ra_caduceus_host.py


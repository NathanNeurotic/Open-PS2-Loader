name: build-flavours

# FOUR FLAVOURS, along two independent axes: WHICH toolchain, and PINNED vs ROLLING.
#
#                      pinned (reproducible)          rolling (early warning)
#   ps2dev             PS2DEVPINNED                   PS2DEVROLLING
#   official OPL CI    OFFICIALPINNED                 OFFICIALROLLING
#
# WHY THIS SPLIT EXISTS. Issue #382: one tester ran the same build in three flavours and got three
# different results -- official worked, ps2dev-latest started the game then black-screened, the
# pinned build failed outright. Identical source. There was then no way to tell whether that spread
# was our bug or the toolchain moving underneath us, because "latest" means something different every
# day: a report from last week was not comparable to a report from today, and neither could be
# reproduced on demand.
#
# The two columns answer two different questions and should be read that way:
#   PINNED  -- what testers should use. Reproducible, comparable across weeks, and the only builds a
#              bug report can meaningfully name. If a pinned build breaks, it is us.
#   ROLLING -- early warning. Tracks upstream so a toolchain regression surfaces here rather than in
#              a release. If a rolling build breaks while its pinned twin does not, it is upstream,
#              and that is a different bug with a different owner.
#
# ⚠ EVERY BUG REPORT MUST NAME ITS FLAVOUR. Each artifact carries BUILD-MANIFEST.txt recording the
# image, the resolved digest where known, the compiler version and the source commit -- so a report
# identifies exactly what ran. Without that this is four names and the same ambiguity as before.
#
# ⚠ THE PINS ARE A DELIBERATE, DATED DECISION, not a snapshot to refresh casually. Moving one
# invalidates comparability with every report gathered against it. Bump them on purpose, note the
# date, and expect to re-baseline.
#
# Each ELF also self-identifies via LOCALVERSION ("-<FLAVOUR>" suffix), so a stray ELF with no zip
# around it is still identifiable.

# push is restricted to the two INTEGRATION branches on purpose. Adding pull_request while leaving
# push on 'rebuild/**' made every PR build TWICE (once for the branch push, once for the PR event) --
# observed on PR #410. Feature branches are covered by their PR; these two are covered by the merge
# that lands on them.
on:
  push:
    branches:
      - master
      - rebuild/main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apa-safety-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check the APA table write fence, driver write policy and raw hdd0 paths
        run: python3 .github/scripts/test_apa_table_safety.py
      - name: Check the APA recovery tool against synthetic damaged disks
        run: python3 .github/scripts/test_apa_recover.py
      - name: Check Apps launch paths and argument limits before teardown
        run: python3 .github/scripts/test_app_launch_args.py
      - name: Check Auto Loading settings discovery and APA+exFAT hybrid detection
        run: python3 .github/scripts/test_autolaunch_settings.py
      - name: Check Automatic Refresh never suppresses a source's first list population
        run: python3 .github/scripts/test_autorefresh_initial_population.py
      - name: Check that background music never holds audsrv across an open-ended wait
        run: python3 .github/scripts/test_audio_threads.py
      - name: Check that background music survives a card that loses the file's descriptor
        run: python3 .github/scripts/test_bgm_source.py
      - name: Check that a held button keeps repeating across the tick-counter wrap
        run: python3 .github/scripts/test_pad_repeat_clock.py
      - name: Check IGR polls without a VBLANK handler, except in RetroAchievements builds
        run: python3 .github/scripts/test_igr_polling.py
      - name: Check that the handoff probe only refuses a target the child cannot load
        run: python3 .github/scripts/test_handoff_probe.py
      - name: Check that a blind button press cannot keep a video mode the TV cannot show
        run: python3 .github/scripts/test_vmode_confirm.py
      - name: Check 3D save icons parse real icons and card images, and refuse damaged ones
        run: python3 .github/scripts/test_save_icons.py
      - name: Check PS1 VMC save icons and reject damaged cards
        run: python3 .github/scripts/test_ps1_save_icons.py
      - name: Check unsupported MMCE ioctls cannot report VMC fragmentation
        run: python3 .github/scripts/test_vmc_contiguity.py
      - name: Check Back on a Settings page keeps its edits and only a real change reconnects SMB
        run: python3 .github/scripts/test_settings_back_keeps_edits.py
      - name: Check a memory-card settings path saves and POPSTARTER is made only when needed, with icons
        run: python3 .github/scripts/test_mc_folders.py
      - name: Check Settings pages fit before they scroll, BDM rows indent, and RiptOPL's plasma
        run: python3 .github/scripts/test_settings_fit.py
      - name: Check Settings and its prompts follow the user's confirm button
        run: python3 .github/scripts/test_confirm_button.py
      - name: Check that a broken cheat file is never reported as a missing one
        run: python3 .github/scripts/test_cheat_load.py
      - name: Check that a -bsdfs=bd launch without a device number is refused before teardown
        run: python3 .github/scripts/test_neutrino_bsdfs.py
      - name: Check Neutrino argument editing preserves full values and rejects overlong saves
        run: python3 .github/scripts/test_neutrino_args_editor.py
      - name: Check Neutrino launch arguments fit before teardown without dropping tokens
        run: python3 .github/scripts/test_neutrino_argv_budget.py
      - name: Check Neutrino pad emulation warnings and forced-core settings
        run: python3 .github/scripts/test_neutrino_pademu.py
      - name: Check cheats reach Neutrino and Select-mode picks are remembered on both cores
        run: python3 .github/scripts/test_neutrino_cheats.py
      - name: Check every way back to the menu after sbPrepare restores the cdvdman patch zone
        run: python3 .github/scripts/test_patch_zone_restore.py
      - name: Check a launch that returned to the menu leaves the next one its VMC slots
        run: python3 .github/scripts/test_mcemu_slots.py
      - name: Check the media size CDVDMAN bounds reads by is exact or unknown, never a partial guess
        run: python3 .github/scripts/test_media_lsn_count.py
      - name: Check that turning Network Connectivity off and on keeps the chosen protocol
        run: python3 .github/scripts/test_net_protocol_pick.py
      - name: Check that long theme text stops at the next element and scrolls instead of overlapping
        run: python3 .github/scripts/test_theme_text_room.py
      - name: Check custom theme font reads start with an unknown file size
        run: python3 .github/scripts/test_custom_font_load.py
      - name: Check Create VMC on First Launch creates, reuses, skips and reports correctly
        run: python3 .github/scripts/test_auto_create_vmc.py

  release-notes-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check compact release notes and changelog
        run: python3 .github/scripts/test_release_notes.py
      - name: Check a rolling publish never leaves the release missing files when GitHub fails mid-way
        run: python3 .github/scripts/test_rolling_publish_order.py

  ra-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check disc hashing, reset image and launch gates
        run: python3 .github/scripts/test_ra_disc.py
      - name: Check RA snapshot scheduling and transmission retries
        run: python3 .github/scripts/test_ra_sender.py

  bdm-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check the games.bin cache answers as before without O(n^2) work per scan
        run: python3 .github/scripts/test_iso_cache.py
      - name: Check the BDM block cache never returns stale data on a failed refill
        run: python3 .github/scripts/test_bdm_cache.py
      - name: Check BDM partition I/O bounds and sector-size refusal
        run: python3 .github/scripts/test_bdm_partitions.py
      - name: Check the game-list sort keeps the old order in O(n log n)
        run: python3 .github/scripts/test_menu_sort.py
      - name: Check a failed first PS2 scan runs once and names the folder
        run: python3 .github/scripts/test_bdm_scan_retry.py
      - name: Check a settings re-apply keeps the page of a USB/BDM device that is still there (#806)
        run: python3 .github/scripts/test_bdm_keep_page_on_reapply.py
      - name: Check the IO worker skips duplicate module passes and APPS rebuilds on L3
        run: python3 .github/scripts/test_io_queue_trims.py
      - name: Check the selected cover is read first and an abandoned background is aborted (#772)
        run: python3 .github/scripts/test_art_queue_order.py
      - name: Check Ember settings are only written once changed in RiptOPL
        run: python3 .github/scripts/test_ember_settings.py
      - name: Check a missing Ember core still lists its games and never fails the PS1 scan
        run: python3 .github/scripts/test_ember_scan_missing_core.py

  udpfs-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check cumulative ACK order and sequence wrap
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic modules/network/udpfs_ioman/tests/test_ack_sequence.c -o /tmp/test_udpfs_ack
          /tmp/test_udpfs_ack
      - name: Check UDPFS themes are registered only after the server answers
        run: python3 .github/scripts/test_udpfs_themes.py

  site-sync-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check the generator for the site search index and RetroAchievements page
        run: |
          python3 -m venv "$RUNNER_TEMP/site-sync"
          "$RUNNER_TEMP/site-sync/bin/pip" install --quiet beautifulsoup4==4.15.0 markdown-it-py==4.0.0
          "$RUNNER_TEMP/site-sync/bin/python" .github/scripts/test_site_sync.py

  build-flavour:
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- PINNED: reproducible. Give these to testers. ---
          # ps2dev, pinned 2026-08-13.
          - flavour: PS2DEVPINNED
            image: ps2dev/ps2dev@sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
            digest: sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
            pinned: "yes (2026-08-13)"
            opldiag: "0"
          # Official OPL's own CI container, pinned 2026-08-13.
          - flavour: OFFICIALPINNED
            image: ghcr.io/ps2homebrew/ps2homebrew@sha256:a1b1f87f09a88f64efbe11356aae47098d4d54b3b3a84f0609fa42369244e25d
            digest: sha256:a1b1f87f09a88f64efbe11356aae47098d4d54b3b3a84f0609fa42369244e25d
            pinned: "yes (2026-08-13)"
            opldiag: "0"
          # --- ROLLING: early warning. Expect these to move without us changing anything. ---
          - flavour: PS2DEVROLLING
            image: ps2dev/ps2dev:latest
            digest: ""
            pinned: "no (tracks ps2dev/ps2dev:latest)"
            opldiag: "0"
          - flavour: OFFICIALROLLING
            image: ghcr.io/ps2homebrew/ps2homebrew:main
            digest: ""
            pinned: "no (tracks ps2homebrew:main)"
            opldiag: "0"
          # --- DIAGNOSTIC: same pinned toolchain as PS2DEVPINNED, built with OPLDIAG=1.
          # Adds the on-screen boot-stage labels and the error-code detail suffix. Those are raw
          # untranslated developer strings, which is exactly why they must never reach a build a
          # normal user runs -- and exactly why a tester needs a build that HAS them. This is the
          # ELF to hand out when the question is WHERE a console wedges.
          # It is NOT a DEBUG build: no TTY link, no -g. Everything else matches its pinned twin,
          # so a result gathered here is directly comparable with one gathered on PS2DEVPINNED.
          - flavour: PS2DEVPINNED-DIAG
            image: ps2dev/ps2dev@sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
            digest: sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
            pinned: "yes (2026-08-13)"
            opldiag: "1"
          # RA is separately compiled; keep its disc core and modules covered on PRs.
          - flavour: PS2DEVPINNED-RA
            image: ps2dev/ps2dev@sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
            digest: sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
            pinned: "yes (2026-08-13)"
            opldiag: "0"
            ra: "1"
          # Combined PR test candidate: RA plus iLink diagnostic coverage in one ELF.
          - flavour: STACK-TEST-RA-DIAG
            image: ghcr.io/ps2homebrew/ps2homebrew:main
            digest: ""
            pinned: "no (tracks ps2homebrew:main)"
            opldiag: "1"
            ra: "1"
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      # git must exist BEFORE checkout (ps2dev images are minimal Alpine): without it,
      # actions/checkout falls back to an API tarball, git describe fails, and the version
      # string collapses to "-dirty". Guarded installs no-op where tools already exist
      # (the ps2homebrew image ships official OPL's full build deps).
      - name: Install host dependencies (either package manager)
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash make git zip unzip tar gzip xz python3 py3-pip py3-yaml gmp mpfr4 mpc1 gawk coreutils findutils grep sed diffutils || true
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq bash make git zip unzip python3 python3-yaml gawk || true
          fi

      - name: git checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --prune --unshallow || true

      - name: Install menu-coherent mmceman (#254)
        run: sh .github/scripts/install_coherent_mmce.sh

      - name: Compile -> make clean release (${{ matrix.flavour }})
        run: make --trace clean && make --trace LOCALVERSION=${{ matrix.flavour }} OPLDIAG=${{ matrix.opldiag }} RETROACHIEVEMENTS=${{ matrix.ra || '0' }} release

      # Written AFTER the build so the compiler probe reflects what actually compiled. Every probe is
      # `|| true`: this file is a diagnostic and must never be the reason a good build fails to ship.
      # A rolling flavour has no digest to record here (the tag is resolved by the runner before this
      # step exists) -- the compiler version below is what identifies it, and it is the part that
      # actually matters when a toolchain change breaks something.
      - name: Record build manifest (${{ matrix.flavour }})
        if: ${{ always() }}
        run: |
          {
            echo "flavour:      ${{ matrix.flavour }}"
            echo "pinned:       ${{ matrix.pinned }}"
            echo "retroachievements: ${{ matrix.ra || '0' }}"
            echo "opldiag:      ${{ matrix.opldiag }}"
            echo "image:        ${{ matrix.image }}"
            echo "digest:       ${{ matrix.digest }}"
            echo "built (UTC):  $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "run:          ${{ github.run_id }}"
            echo "ref:          ${{ github.ref }}"
            echo "commit:       ${{ github.sha }}"
            echo "---- toolchain ----"
            (mips64r5900el-ps2-elf-gcc --version 2>/dev/null || ee-gcc --version 2>/dev/null || echo "ee compiler: not probed") | head -1
            (iop-gcc --version 2>/dev/null || mipsel-none-elf-gcc --version 2>/dev/null || echo "iop compiler: not probed") | head -1
            echo "PS2SDK=${PS2SDK:-unset}"
            for v in "$PS2SDK/../.version" "$PS2SDK/.version" /usr/local/ps2dev/.version; do
              [ -f "$v" ] && { echo "sdk version file ($v):"; cat "$v"; break; }
            done
          } > BUILD-MANIFEST.txt 2>/dev/null || true
          cat BUILD-MANIFEST.txt || true

      - name: Upload ELF (${{ matrix.flavour }})
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        with:
          name: OPL-${{ matrix.flavour }}
          path: |
            RIPTOPL-*.ELF
            OPNPS2LD-*.ELF
            BUILD-MANIFEST.txt
            STACKED-PRS.json
          if-no-files-found: error
          retention-days: 14

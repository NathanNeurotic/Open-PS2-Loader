    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check the games.bin cache answers as before without O(n^2) work per scan
        run: python3 .github/scripts/test_iso_cache.py
      - name: Check the BDM block cache never returns stale data on a failed refill

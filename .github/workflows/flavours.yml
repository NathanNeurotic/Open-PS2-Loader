  udpfs-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check both UDPFS variants compile the same canonical transport sources
        run: python3 .github/scripts/test_udpfs_shared_transport.py
      - name: Check cumulative ACK order and sequence wrap
        run: |
          for variant in udpfs_ioman udpfs_bd; do
            cc -std=c99 -Wall -Wextra -Werror -pedantic -Imodules/network/$variant/src modules/network/udpfs_ioman/tests/test_ack_sequence.c -o /tmp/test_udpfs_ack_$variant
            /tmp/test_udpfs_ack_$variant
          done
          test "$(grep -c 'if (udprdma_ack_covers(' modules/network/udpfs_shared/src/udprdma.c)" -eq 1
          test "$(grep -c 'covered = _wait_ack(socket, sent_seq_nr);' modules/network/udpfs_shared/src/udprdma.c)" -eq 2
          cmp modules/network/udpfs_ioman/src/udprdma_seq.h modules/network/udpfs_bd/src/udprdma_seq.h
      - name: Check stale ACKs keep waiting and a reconnect restarts the session at sequence 0
        run: |
          N=modules/network
          for variant in udpfs_ioman udpfs_bd; do
            cc -std=gnu99 -Wall -Wextra -Wno-unused-parameter -Werror -I$N/udpfs_shared/tests/stubs -I$N/$variant/src -I$N/$variant/include -I$N/udpfs_ministack/include -I$N/udpfs_smap/include $N/udpfs_shared/tests/test_udprdma_session.c -o /tmp/test_udprdma_session_$variant
            /tmp/test_udprdma_session_$variant
          done
      - name: Check another device claiming the PS2's IP is detected and reported
        run: |
          N=modules/network
          cc -std=gnu99 -Wall -Wextra -Wno-unused-parameter -Werror -I$N/udpfs_shared/tests/stubs -I$N/udpfs_ministack/include -I$N/udpfs_smap/include $N/udpfs_shared/tests/test_ministack_conflict.c -o /tmp/test_ministack_conflict
          /tmp/test_ministack_conflict
      - name: Check DEV9-gated UDP chains, UDPFS sub-make dependencies and the IP-conflict notice
        run: python3 .github/scripts/test_udpfs_network_hardening.py
      - name: Check UDPFS delivers the last byte of odd-sized reads
        run: python3 .github/scripts/test_udpfs_smap_fifo_tail.py
      - name: Check UDPFS discovery announces the PS2's IP before the server replies
        run: |
          N=modules/network
          cc -std=gnu99 -Wall -Wextra -Wno-unused-parameter -Werror -I$N/udpfs_shared/tests/stubs -I$N/udpfs_ministack/include -I$N/udpfs_smap/include $N/udpfs_shared/tests/test_ministack_announce.c -o /tmp/test_ministack_announce
          /tmp/test_ministack_announce
      - name: Check the mstack UDP exchange device the RA support check uses under UDPFS
        run: |
          N=modules/network
          cc -std=gnu99 -Wall -Wextra -Wno-unused-parameter -Werror -I$N/udpfs_shared/tests/stubs -I$N/udpfs_ministack/include -I$N/udpfs_ministack/src -I$N/udpfs_smap/include $N/udpfs_shared/tests/test_ministack_xchg.c -o /tmp/test_ministack_xchg
          /tmp/test_ministack_xchg
      - name: Check UDPFS themes are registered only after the server answers
        run: python3 .github/scripts/test_udpfs_themes.py
      - name: Check UDPFS artwork index integrity and case-sensitive ART paths
        run: python3 .github/scripts/test_udpfs_art.py
      - name: Check UDPFS lists launchable ISO games without probing ul.cfg
        run: python3 .github/scripts/test_udpfs_iso_only.py
      - name: Check UDPFS serializes fileXio and LOADFILE operations
        run: python3 .github/scripts/test_udpfs_serialization.py

  site-sync-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check the generator for the site search index and RetroAchievements page
        run: |
          python3 -m venv "$RUNNER_TEMP/site-sync"
          "$RUNNER_TEMP/site-sync/bin/pip" install --quiet beautifulsoup4==4.15.0 markdown-it-py==4.0.0
          "$RUNNER_TEMP/site-sync/bin/python" .github/scripts/test_site_sync.py

  # POPS/usbhdfsd.irx.ilink is a checked-in binary built from modules/bdmassault/ilink_bd_assault.
  # Rebuild it with that module's own Makefile in the iLink driver pin (ps2dev, 2026-08-13; not the
  # release PS2DEVPINNED digest) and require the bytes to match every checked-in copy, so the shipped
  # driver is always the output of the committed source (#1018). This container reproduces both the pre-#1018 binary and the current one exactly.
  # A source change therefore needs the rebuilt binary in the same PR: take it from this job's
  # artifact, or build it locally in the same image.
  popstarter-ilink-driver:
    runs-on: ubuntu-24.04
    container: ghcr.io/ps2dev/ps2dev@sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
    steps:
      - name: Install make
        run: apk add --no-cache make
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build ilink_bd_assault.irx with its Makefile
        run: |
          make -C modules/bdmassault/ilink_bd_assault clean
          make -C modules/bdmassault/ilink_bd_assault
          mipsel-none-elf-gcc --version | head -1
      - name: Build and stage the matching iLink recovery modules
        run: |
          make -C modules/ilink/iLinkman
          make -C modules/ilink/IEEE1394_bd MINI=1
          mkdir -p build/ilink-recovery
          cp modules/ilink/iLinkman/iLinkman.irx build/ilink-recovery/
          cp modules/ilink/IEEE1394_bd/IEEE1394_bd_mini.irx build/ilink-recovery/
          cp modules/bdmassault/ilink_bd_assault/ilink_bd_assault.irx build/ilink-recovery/usbhdfsd.irx.ilink
          cp POPS/usbd.irx.ilink build/ilink-recovery/
          {
            echo "Source head: ${{ github.event.pull_request.head.sha || github.sha }}"
            echo "Checkout: $GITHUB_SHA"
            echo "Toolchain: ps2dev iLink driver pin (2026-08-13), not the release PS2DEVPINNED"
            mipsel-none-elf-gcc --version | head -1
            sha256sum build/ilink-recovery/*.irx build/ilink-recovery/*.ilink
          } > build/ilink-recovery/BUILD-MANIFEST.txt
      - name: Require the checked-in usbhdfsd.irx.ilink copies to be this build
        run: |
          built=modules/bdmassault/ilink_bd_assault/ilink_bd_assault.irx
          echo "built: $(wc -c < "$built") bytes, $(sha256sum "$built" | cut -d' ' -f1)"
          status=0
          for copy in modules/bdmassault/usbhdfsd.irx.ilink POPS/usbhdfsd.irx.ilink \
                      Example/APP_RIPTOPL-OFFICIALROLLING-VERSION.ZIP/usbhdfsd.irx.ilink; do
            if cmp -s "$built" "$copy"; then
              echo "OK   $copy"
            else
              echo "DIFF $copy: $(wc -c < "$copy") bytes, $(sha256sum "$copy" | cut -d' ' -f1)" >&2
              status=1
            fi
          done
          if [ "$status" != 0 ]; then
            echo "Checked-in usbhdfsd.irx.ilink is not the output of modules/bdmassault/ilink_bd_assault." >&2
            echo "Replace every copy with this job's artifact and update the pinned size/sha256" >&2
            echo "(src/vcdsupport.c, modules/bdmassault/PROVENANCE.md, docs/VCD.md)." >&2
          fi
          exit $status
      - name: Upload the built driver
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: popstarter-usbhdfsd-irx-ilink
          path: modules/bdmassault/ilink_bd_assault/ilink_bd_assault.irx
          if-no-files-found: ignore
      - name: Upload the matching recovery modules for console testing
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: ilink-recovery-modules-ilink-driver-pin
          path: build/ilink-recovery/
          if-no-files-found: ignore

  build-flavour:
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- ROLLING: early warning. Expect these to move without us changing anything. ---
          - flavour: PS2DEVROLLING
            image: ghcr.io/ps2dev/ps2dev:latest
            digest: ""
            pinned: "no (tracks ps2dev/ps2dev:latest)"
            opldiag: "0"
          - flavour: OFFICIALROLLING
            image: ghcr.io/ps2homebrew/ps2homebrew:main
            digest: ""
            pinned: "no (tracks ps2homebrew:main)"
            opldiag: "0"
          # --- DIAGNOSTIC: PS2DEVROLLING built with OPLDIAG=1.
          # Adds the on-screen boot-stage labels and the error-code detail suffix. Those are raw
          # untranslated developer strings, which is exactly why they must never reach a build a
          # normal user runs -- and exactly why a tester needs a build that HAS them. This is the
          # ELF to hand out when the question is WHERE a console wedges.
          # It is NOT a DEBUG build: no TTY link, no -g. Everything else matches PS2DEVROLLING.
          - flavour: PS2DEVROLLING-DIAG
            image: ghcr.io/ps2dev/ps2dev:latest
            digest: ""
            pinned: "no (tracks ps2dev/ps2dev:latest)"
            opldiag: "1"
          # --- FREEZE REPORT: OFFICIALROLLING (the toolchain the release app uses) built with
          # INGAMEDIAG=1. When a game freezes, the IGR combo (L1+L2+R1+R2+Start+Select) saves what
          # the console was doing -- the game's threads, the IOP's disc and VMC activity -- to
          # mc0:/RIPTFRZ.TXT, then exits as usual. An inert combo can also mean IGR input monitoring failed.
          # Hand it out when a tester reports in-game freezes. Compatibility Mode 6 turns IGR off,
          # and with it the report.
          - flavour: OFFICIALROLLING-FREEZEDIAG
            image: ghcr.io/ps2homebrew/ps2homebrew:main
            digest: ""
            pinned: "no (tracks ps2homebrew:main)"
            opldiag: "0"
            ingamediag: "1"
          # RA follows the official rolling toolchain used by the release app.
          - flavour: OFFICIALROLLING-RA
            image: ghcr.io/ps2homebrew/ps2homebrew:main
            digest: ""
            pinned: "no (tracks ps2homebrew:main)"
            opldiag: "0"
            ra: "1"
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      # git must exist BEFORE checkout (ps2dev images are minimal Alpine): without it,
      # actions/checkout falls back to an API tarball, git describe fails, and the version
      # string collapses to "-dirty". Guarded installs no-op where tools already exist
      # (the ps2homebrew image ships official OPL's full build deps).
      - name: Install host dependencies (either package manager)
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash make git zip unzip tar gzip xz python3 py3-pip py3-yaml gmp mpfr4 mpc1 gawk coreutils findutils grep sed diffutils || true
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq bash make git zip unzip python3 python3-yaml gawk || true
          fi

      - name: git checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install menu-coherent mmceman (#254)
        run: sh .github/scripts/install_coherent_mmce.sh
      - name: Install verified native VMC fragment walker
        run: python3 .github/scripts/install_safe_bdmfs.py

      - name: Compile -> make clean release (${{ matrix.flavour }})
        run: make --trace clean && make --trace LOCALVERSION=${{ matrix.flavour }} OPLDIAG=${{ matrix.opldiag }} RETROACHIEVEMENTS=${{ matrix.ra || '0' }} INGAMEDIAG=${{ matrix.ingamediag || '0' }} release

      - name: Verify the freeze report exists only in its flavour
        env:
          INGAMEDIAG_BUILD: ${{ matrix.ingamediag || '0' }}
        run: |
          sed -n -E 's/^[[:space:]]+0x[0-9a-fA-F]+[[:space:]]+([A-Za-z0-9_]+)[[:space:]]*$/ \1/p' ee_core/ee_core.map > core-symbols.txt
          if [ "$INGAMEDIAG_BUILD" = 1 ]; then
            grep -q ' FreezeDiag_Begin$' core-symbols.txt
            grep -q ' FreezeDiag_Write$' core-symbols.txt
            test -s modules/iopcore/freezediag/freezediag.irx
            LC_ALL=C grep -aq 'RIPTFRZ.TXT' modules/iopcore/freezediag/freezediag.irx
          elif grep -E ' (FreezeDiag_[A-Za-z0-9_]*|freeze_diag_[A-Za-z0-9_]*|g_freeze_diag[A-Za-z0-9_]*)$' core-symbols.txt || LC_ALL=C grep -aq 'RIPTFRZ' ee_core/ee_core.elf; then
            echo 'freeze report leaked into a build without INGAMEDIAG' >&2
            exit 1
          fi

      - name: Verify RA isolation in linked menu and game core
        env:
          RA_BUILD: ${{ matrix.ra || '0' }}
        run: |
          if command -v mips64r5900el-ps2-elf-nm >/dev/null 2>&1; then
            NM=mips64r5900el-ps2-elf-nm
          else
            NM=ee-nm
          fi
          "$NM" opl.elf > menu-symbols.txt
          sed -n -E 's/^[[:space:]]+0x[0-9a-fA-F]+[[:space:]]+([A-Za-z0-9_]+)[[:space:]]*$/ \1/p' ee_core/ee_core.map > core-symbols.txt
          if [ "$RA_BUILD" = 1 ]; then
            grep -q ' raCaduceusPage$' menu-symbols.txt
            grep -q ' gRAMode$' menu-symbols.txt
            grep -q ' gRAExperimentalCards$' menu-symbols.txt
            grep -q ' sysNeutrinoPrepareRA$' menu-symbols.txt
            grep -q ' raPopsPrepare$' menu-symbols.txt
            grep -q ' raHttpsGet$' menu-symbols.txt
            grep -q ' mbedtls_ssl_handshake$' menu-symbols.txt
            grep -q ' rapops_irx$' menu-symbols.txt
            grep -q ' RA_OverlayOnVblank$' core-symbols.txt
          else
            if grep -E ' (RA_[A-Za-z0-9_]*|ra[A-Z][A-Za-z0-9_]*|ach[A-Z][A-Za-z0-9_]*|gRA[A-Za-z0-9_]*|bdmModeIsUSB|rapops_irx|size_rapops_irx|raudp_irx|size_raudp_irx|sysNeutrinoPrepareRA|sysNeutrinoRA[A-Za-z0-9_]*|mbedtls_[A-Za-z0-9_]*|psa_[A-Za-z0-9_]*|ratls_root_[A-Za-z0-9_]*)$' menu-symbols.txt core-symbols.txt; then
              echo 'RA implementation leaked into a standard ELF' >&2
              exit 1
            fi
            if LC_ALL=C grep -aE 'Caduceus|Xerabora|CADUCEUS.KEY|ORBIT-RA|ript-ra|retroachievements\.org' opl.elf ee_core/ee_core.elf; then
              echo 'RA client text leaked into a standard ELF' >&2
              exit 1
            fi
          fi
          echo "opl.elf size (${{ matrix.flavour }}): $(stat -c %s opl.elf) bytes"

      # Written AFTER the build so the compiler probe reflects what actually compiled. Every probe is
      # `|| true`: this file is a diagnostic and must never be the reason a good build fails to ship.
      # A rolling flavour has no digest to record here (the tag is resolved by the runner before this
      # step exists) -- the compiler version below is what identifies it, and it is the part that
      # actually matters when a toolchain change breaks something.
      - name: Record build manifest (${{ matrix.flavour }})
        if: ${{ always() }}
        run: |
          {
            echo "flavour:      ${{ matrix.flavour }}"
            echo "pinned:       ${{ matrix.pinned }}"
            echo "retroachievements: ${{ matrix.ra || '0' }}"
            echo "opldiag:      ${{ matrix.opldiag }}"
            echo "ingamediag:   ${{ matrix.ingamediag || '0' }}"
            echo "image:        ${{ matrix.image }}"
            echo "digest:       ${{ matrix.digest }}"
            echo "built (UTC):  $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "run:          ${{ github.run_id }}"
            echo "ref:          ${{ github.ref }}"
            echo "commit:       ${{ github.sha }}"
            echo "---- toolchain ----"
            (mips64r5900el-ps2-elf-gcc --version 2>/dev/null || ee-gcc --version 2>/dev/null || echo "ee compiler: not probed") | head -1
            (iop-gcc --version 2>/dev/null || mipsel-none-elf-gcc --version 2>/dev/null || echo "iop compiler: not probed") | head -1
            echo "PS2SDK=${PS2SDK:-unset}"
            for v in "$PS2SDK/../.version" "$PS2SDK/.version" /usr/local/ps2dev/.version; do
              [ -f "$v" ] && { echo "sdk version file ($v):"; cat "$v"; break; }
            done
          } > BUILD-MANIFEST.txt 2>/dev/null || true
          cat BUILD-MANIFEST.txt || true

      # Diagnostic flavour: also ship the ELF before ps2-packer, so a boot that stops before main()
      # can be tried without the unpacker stub in the way.
      - name: Keep the unpacked ELF (${{ matrix.flavour }})
        if: ${{ success() && matrix.opldiag == '1' }}
        run: for f in RIPTOPL-*.ELF; do cp opl_stripped.elf "${f%.ELF}-UNPACKED.ELF"; done

      - name: Upload ELF (${{ matrix.flavour }})
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        with:
          name: OPL-${{ matrix.flavour }}
          path: |
            RIPTOPL-*.ELF
            OPNPS2LD-*.ELF
            BUILD-MANIFEST.txt
            POPS/
            docs/VCD.md
          if-no-files-found: error
          retention-days: 14

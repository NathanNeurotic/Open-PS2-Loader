name: build-flavours

# FOUR FLAVOURS, along two independent axes: WHICH toolchain, and PINNED vs ROLLING.
#
#                      pinned (reproducible)          rolling (early warning)
#   ps2dev             PS2DEVPINNED                   PS2DEVROLLING
#   official OPL CI    OFFICIALPINNED                 OFFICIALROLLING
#
# WHY THIS SPLIT EXISTS. Issue #382: one tester ran the same build in three flavours and got three
# different results -- official worked, ps2dev-latest started the game then black-screened, the
# pinned build failed outright. Identical source. There was then no way to tell whether that spread
# was our bug or the toolchain moving underneath us, because "latest" means something different every
# day: a report from last week was not comparable to a report from today, and neither could be
# reproduced on demand.
#
# The two columns answer two different questions and should be read that way:
#   PINNED  -- what testers should use. Reproducible, comparable across weeks, and the only builds a
#              bug report can meaningfully name. If a pinned build breaks, it is us.
#   ROLLING -- early warning. Tracks upstream so a toolchain regression surfaces here rather than in
#              a release. If a rolling build breaks while its pinned twin does not, it is upstream,
#              and that is a different bug with a different owner.
#
# ⚠ EVERY BUG REPORT MUST NAME ITS FLAVOUR. Each artifact carries BUILD-MANIFEST.txt recording the
# image, the resolved digest where known, the compiler version and the source commit -- so a report
# identifies exactly what ran. Without that this is four names and the same ambiguity as before.
#
# ⚠ THE PINS ARE A DELIBERATE, DATED DECISION, not a snapshot to refresh casually. Moving one
# invalidates comparability with every report gathered against it. Bump them on purpose, note the
# date, and expect to re-baseline.
#
# Each ELF also self-identifies via LOCALVERSION ("-<FLAVOUR>" suffix), so a stray ELF with no zip
# around it is still identifiable.

# push is restricted to the two INTEGRATION branches on purpose. Adding pull_request while leaving
# push on 'rebuild/**' made every PR build TWICE (once for the branch push, once for the PR event) --
# observed on PR #410. Feature branches are covered by their PR; these two are covered by the merge
# that lands on them.
on:
  push:
    branches:
      - master
      - rebuild/main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apa-safety-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check the APA table write fence, driver write policy and raw hdd0 paths
        run: python3 .github/scripts/test_apa_table_safety.py
      - name: Check the APA recovery tool against synthetic damaged disks
        run: python3 .github/scripts/test_apa_recover.py
      - name: Check Apps launch paths and argument limits before teardown
        run: python3 .github/scripts/test_app_launch_args.py
      - name: Check Auto Loading settings discovery and APA+exFAT hybrid detection
        run: python3 .github/scripts/test_autolaunch_settings.py
      - name: Check Automatic Refresh never suppresses a source's first list population
        run: python3 .github/scripts/test_autorefresh_initial_population.py
      - name: Check L3 triggers a PS1 scan from a cached USB device root
        run: python3 .github/scripts/test_libview_l3_rescan.py
      - name: Check that background music never holds audsrv across an open-ended wait
        run: python3 .github/scripts/test_audio_threads.py
      - name: Check that background music survives a card that loses the file's descriptor
        run: python3 .github/scripts/test_bgm_source.py
      - name: Check that the newest menu sound cuts the one still playing
        run: python3 .github/scripts/test_sfx_oneshot_cut.py
      - name: Check that a held button keeps repeating across the tick-counter wrap
        run: python3 .github/scripts/test_pad_repeat_clock.py
      - name: Check masked pattern scan bounds and rejection of short ranges
        run: python3 .github/scripts/test_pad_pattern_bounds.py short
      - name: Check IGR samples from the VBLANK_END handler in every build, and RA Mode 6
        run: python3 .github/scripts/test_igr_polling.py
      - name: Check the in-game freeze report stays in its flavour and cannot hang IGR
        run: python3 .github/scripts/test_ingame_freeze_diag.py
      - name: Check the in-game freeze report text
        run: |
          cc -std=gnu99 -Wall -Wextra -Werror -Iee_core/include ee_core/tests/test_freeze_diag_format.c ee_core/src/freeze_diag_format.c -o /tmp/test_freeze_diag_format
          /tmp/test_freeze_diag_format
      - name: Check IOP reset command bounds and payload offsets
        run: python3 .github/scripts/test_reset_arg_bounds.py
      - name: Check IOP reset failure cleanup and caller gates
        run: python3 .github/scripts/test_reset_failure_lifecycle.py
      - name: Check repeated HDD/APA probes preserve one DEV9 owner and retry failed loads
        run: python3 .github/scripts/test_hdd_module_lifetime.py
      - name: Check that the handoff probe only refuses a target the child cannot load
        run: python3 .github/scripts/test_handoff_probe.py
      - name: Check that a blind button press cannot keep a video mode the TV cannot show
        run: python3 .github/scripts/test_vmode_confirm.py
      - name: Check 3D save icons parse real icons and card images, and refuse damaged ones
        run: python3 .github/scripts/test_save_icons.py
      - name: Check native PS2 logo validation including descriptor zero
        run: |
          python3 .github/scripts/test_ps2_logo_validation.py
          python3 .github/scripts/test_zso_probe_fd.py
      - name: Check PS1 VMC save icons and reject damaged cards
        run: python3 .github/scripts/test_ps1_save_icons.py
      - name: Check packaged BDMA pairs against both production validators
        run: python3 .github/scripts/test_bdma_shipped_pairs.py
      - name: Check a launch names an older release's device BDMA pair instead of copying it
        run: python3 .github/scripts/test_bdma_stale_pair.py
      - name: Check POPSTARTER's i.LINK driver logs back in after an IOP reset
        run: python3 .github/scripts/test_ilink_bd_assault_reset.py
      - name: Check POPS UDPFS config validation and USB save rollback
        run: python3 .github/scripts/test_pops_udpfs.py
      - name: Check unsupported MMCE ioctls cannot report VMC fragmentation
        run: python3 .github/scripts/test_vmc_contiguity.py
      - name: Check FAT fragment walker disk errors, corrupt chains and module installation
        run: |
          python3 .github/scripts/test_bdmfs_frag_walk.py
          python3 .github/scripts/test_safe_bdmfs_install.py
          python3 .github/scripts/test_vmc_contiguous_create.py
          python3 .github/scripts/test_vmc_fatfs_images.py
      - name: Check native VMC mapping refusals and both slot lifetimes
        run: python3 .github/scripts/test_native_vmc_layout.py
      - name: Check HDD VMC creation reserves PFS space and only committed inodes are mapped
        run: |
          python3 .github/scripts/test_vmc_pfs_reserve.py
          python3 .github/scripts/test_pfs_vmc_inode.py
      - name: Check rebuilding a fragmented VMC keeps the card through every fault, and fixes a real image
        run: |
          python3 .github/scripts/test_vmc_rebuild.py
          python3 .github/scripts/test_vmc_rebuild_fatfs.py
      - name: Check Back on a Settings page keeps its edits and only a real change reconnects SMB
        run: python3 .github/scripts/test_settings_back_keeps_edits.py
      - name: Check a memory-card settings path saves and POPSTARTER is made only when needed, with icons
        run: python3 .github/scripts/test_mc_folders.py
      - name: Check Settings pages fit before they scroll, BDM rows indent, and RiptOPL's plasma
        run: python3 .github/scripts/test_settings_fit.py
      - name: Check Settings and its prompts follow the user's confirm button
        run: python3 .github/scripts/test_confirm_button.py
      - name: Check language changes refresh menus when returning to English
        run: python3 .github/scripts/test_language_switch.py
      - name: Check the Language page keeps edits, separates OSD defaults and owns its name list
        run: python3 .github/scripts/test_language_page.py
      - name: Check CWD language precedence, file filtering and dynamic language count
        run: python3 .github/scripts/test_language_discovery.py
      - name: Check translations that would misread their printf arguments fall back to English
        run: python3 .github/scripts/test_lang_format_guard.py
      - name: Check that a broken cheat file is never reported as a missing one
        run: python3 .github/scripts/test_cheat_load.py
      - name: Check that a -bsdfs=bd launch without a device number is refused before teardown
        run: python3 .github/scripts/test_neutrino_bsdfs.py
      - name: Check PSX DVR Neutrino discovery and safety gates
        run: python3 .github/scripts/test_neutrino_dvr.py
      - name: Check DVR refresh and Neutrino mount handoff
        run: python3 .github/scripts/test_dvr_scan_lifecycle.py
      - name: Check Neutrino argument editing preserves full values and rejects overlong saves
        run: python3 .github/scripts/test_neutrino_args_editor.py
      - name: Check Neutrino launch arguments fit before teardown without dropping tokens
        run: python3 .github/scripts/test_neutrino_argv_budget.py
      - name: Check Neutrino pad emulation warnings and forced-core settings
        run: python3 .github/scripts/test_neutrino_pademu.py
      - name: Check cheats reach Neutrino and Select-mode picks are remembered on both cores
        run: python3 .github/scripts/test_neutrino_cheats.py
      - name: Check the UDPFS/UDPBD toml ip sync leaves a parseable file on a memory card (#1010)
        run: python3 .github/scripts/test_neutrino_toml_sync.py
      - name: Check every way back to the menu after sbPrepare restores the cdvdman patch zone
        run: python3 .github/scripts/test_patch_zone_restore.py
      - name: Check a launch that returned to the menu leaves the next one its VMC slots
        run: python3 .github/scripts/test_mcemu_slots.py
      - name: Check the media size CDVDMAN bounds reads by is exact or unknown, never a partial guess
        run: python3 .github/scripts/test_media_lsn_count.py
      - name: Check Accurate Reads keeps its CD/DVD rates and Slow Reads (Mode 8) gives DVD the CD rate
        run: python3 .github/scripts/test_accurate_read_rate.py
      - name: Check an HDD mini argv autolaunch resolves its HDL partition and refuses unmatched sectors
        run: python3 .github/scripts/test_hdd_mini_autolaunch.py
      - name: Check that turning Network Connectivity off and on keeps the chosen protocol
        run: python3 .github/scripts/test_net_protocol_pick.py
      - name: Check quoted config values survive repeated save and reload
        run: python3 .github/scripts/test_config_escape_roundtrip.py
      - name: Check config allocation failures handle NULL safely without dereferencing
        run: python3 .github/scripts/test_config_null_allocation.py
      - name: Check config saves retain files on allocation failures and propagate true I/O errors
        run: python3 .github/scripts/test_config_save_integrity.py
      - name: Check that long theme text stops at the next element and scrolls instead of overlapping
        run: python3 .github/scripts/test_theme_text_room.py
      - name: Check optional game titles fall back without changing metadata
        run: python3 .github/scripts/test_theme_metadata.py
      - name: Check PSBBN Flow rendering and built-in theme lifecycle
        run: python3 .github/scripts/test_psbbn_flow.py
      - name: Check custom theme font reads start with an unknown file size
        run: python3 .github/scripts/test_custom_font_load.py
      - name: Check UTF-8 CJK fallback uses only missing glyphs
        run: python3 .github/scripts/test_cjk_font_fallback.py
      - name: Check automatic VMC creation assigns only a card that exists
        run: python3 .github/scripts/test_auto_vmc.py
      - name: Check saving Favorites never leaves a truncated list
        run: python3 .github/scripts/test_fav_writer.py
      - name: Check optional CFG Titles in game lists are display-only and opt-in
        run: python3 .github/scripts/test_cfg_titles.py
      - name: Check VMC creation can recover after failed or short writes
        run: python3 .github/scripts/test_genvmc_recovery.py
      - name: Check genvmc owns one job, never overlaps, and cancels without blocking
        run: python3 .github/scripts/test_genvmc_lifecycle.py
      - name: Check VMC resizing cannot erase an existing image implicitly
        run: python3 .github/scripts/test_vmc_preserve_existing.py
      - name: Check Create VMC on First Launch creates, reuses, skips and reports correctly
        run: python3 .github/scripts/test_auto_create_vmc.py
      - name: Check Neutrino VMC budget recovery and #831 compat defaults
        run: python3 .github/scripts/test_issues_830_831.py

  release-notes-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check compact release notes and changelog
        run: python3 .github/scripts/test_release_notes.py
      - name: Check release edition titles and classification policy
        run: python3 .github/scripts/test_release_titles.py
      - name: Check pinned ORBIT extraction and RA package isolation
        run: python3 .github/scripts/test_package_orbit_neutrino.py
      - name: Check both RA themes, provenance gates and upload rollback
        run: python3 .github/scripts/test_ra_release.py
      - name: Check a rolling publish never leaves the release missing files when GitHub fails mid-way
        run: python3 .github/scripts/test_rolling_publish_order.py
      - name: Check the MEGA mirror upload is bounded and cannot fail a release
        run: python3 .github/scripts/test_mega_upload_bounded.py

  ra-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check Neutrino RA handoff, network ownership and watch limits
        run: python3 .github/scripts/test_neutrino_ra.py
      - name: Check RA menu actions leave a selected UDP transport's NIC alone
        run: python3 .github/scripts/test_ra_nic_reserved.py
      - name: Check RA menu requests use the mstack link while UDPFS owns the NIC
        run: python3 .github/scripts/test_ra_mstack_link.py
      - name: Check the RA support check runs on UDPFS games
        run: python3 .github/scripts/test_ra_udpfs_check.py
      - name: Check PS1 VCD identification, module ownership and POPS snapshot reads
        run: python3 .github/scripts/test_ra_ps1.py
      - name: Check PS1 scan recovery, launch readiness and optional IOP startup failures
        run: python3 .github/scripts/test_pr894_hardening.py
      - name: Check disc hashing, reset image and launch gates
        run: python3 .github/scripts/test_ra_disc.py
      - name: Check RA language isolation and stable string IDs
        run: python3 .github/scripts/test_ra_language_isolation.py
      - name: Check RA watch validation, persistent layout and EE sampling
        run: python3 .github/scripts/test_ra_watch.py
      - name: Check RA launch resources, optional IOP module failures and card opt-in gates
        run: python3 .github/scripts/test_ra_launch_resources.py
      - name: Check RA snapshot scheduling and transmission retries
        run: python3 .github/scripts/test_ra_sender.py
      - name: Check raw RA notices cannot consume stale frame tails
        run: python3 .github/scripts/test_ra_receive_frame.py
      - name: Check Caduceus in-game card bounds and event handling
        run: python3 .github/scripts/test_caduceus_overlay.py
      - name: Check experimental cards default Off and persist only explicit opt-in
        run: python3 .github/scripts/test_ra_cards_setting.py
      - name: Check Caduceus achievement browsing and pairing
        run: python3 .github/scripts/test_caduceus_browser.py
      - name: Check the Xerabora-mode achievement browser and its HTTP client
        run: python3 .github/scripts/test_ra_xerabora_browser.py
      - name: Check mbedTLS is vendored from its release archive, RA-only, with six pinned roots
        run: python3 .github/scripts/test_mbedtls_vendor.py
      - name: Check the ps2ips DNS reply carries the IPv4 address, not a pointer
        run: python3 .github/scripts/test_ps2ips_dns.py
      - name: Check the verified HTTPS client (TLS 1.3/1.2, certificates, clock, deadline) against local servers
        run: python3 .github/scripts/test_ratls_host.py
      - name: Compile vendored mbedTLS with the RiptOPL configuration (host)
        run: |
          D=third_party/mbedtls
          mkdir -p /tmp/mbedtls-host
          for f in $D/library/*.c; do
            cc -c -O1 -I$D/include -I$D -DMBEDTLS_CONFIG_FILE='"riptopl_mbedtls_config.h"' "$f" -o /tmp/mbedtls-host/$(basename "$f" .c).o
          done
      - name: Check Xerabora and Caduceus discovery and offline sessions
        run: python3 .github/scripts/test_ra_client_mode.py
      - name: Check exact RA watch-list chunk boundaries and counts
        run: python3 .github/scripts/test_ra_chunk_integrity.py
      - name: Check passive RA host stays bound to a verified peer and current settings
        run: python3 .github/scripts/test_ra_verified_peer.py
      - name: Check Caduceus menu and in-game host selection are consistent
        run: python3 .github/scripts/test_ra_caduceus_host.py

  bdm-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check the games.bin cache answers as before without O(n^2) work per scan
        run: python3 .github/scripts/test_iso_cache.py
      - name: Check the BDM block cache never returns stale data on a failed refill
        run: python3 .github/scripts/test_bdm_cache.py
      - name: Check the i.LINK driver logs back in after an IOP reset and only offers a ready drive (#1018)
        run: python3 .github/scripts/test_ilink_bd_reset.py
      - name: Check both i.LINK drivers wait for their own SBP-2 completion
        run: python3 .github/scripts/test_ilink_sbp2_completion.py
      - name: Check CF transfer safety, bus ownership and native handoff
        run: python3 .github/scripts/test_pccf.py
      - name: Check per-game parental lock and test/autolaunch paths
        run: python3 .github/scripts/test_game_parental_lock.py
      - name: Check VMC and PADEMU SIO2MAN version and alias isolation
        run: python3 .github/scripts/test_sio2man_hooks.py
      - name: Check native SIO2MAN packing follows active VMC/PADEMU and preserves MMCE
        run: python3 .github/scripts/test_mmce_sio2man_pack.py
      - name: Check local transport binding and iLink aliases cannot cross-wire devices
        run: python3 .github/scripts/test_bdm_transport_binding.py
      - name: Check BDM partition I/O bounds and sector-size refusal
        run: python3 .github/scripts/test_bdm_partitions.py
      - name: Check BDM allocation failure cannot publish an uninitialized slot
        run: python3 .github/scripts/test_bdm_private_allocation.py
      - name: Test BDM ATA discovery after drive spin-up
        run: python3 .github/scripts/test_bdm_ata_readiness.py
      - name: Check the game-list sort keeps the old order in O(n log n)
        run: python3 .github/scripts/test_menu_sort.py
      - name: Check page-key carousel animation and paging boundaries
        run: python3 .github/scripts/test_page_animation.py
      - name: Check menu allocation failure leaves no stale art indices
        run: python3 .github/scripts/test_menu_allocation.py
      - name: Check queue snapshot and submenu backward links after mutations
        run: python3 .github/scripts/test_io_menu_lifetime.py
      - name: Check tab selection and async config snapshots share a lock
        run: python3 .github/scripts/test_menu_selection_snapshot.py
      - name: Check a failed first PS2 scan runs once and names the folder
        run: python3 .github/scripts/test_bdm_scan_retry.py
      - name: Check iLink readiness always publishes its final device refresh
        run: python3 .github/scripts/test_ilink_readiness.py
      - name: Check Auto Loading skips USB and MX4SIO menu discovery settles
        run: python3 .github/scripts/test_autoload_discovery_settles.py
      - name: Check a settings re-apply keeps the page of a USB/BDM device that is still there (#806)
        run: python3 .github/scripts/test_bdm_keep_page_on_reapply.py
      - name: Check the IO worker skips duplicate module passes and APPS rebuilds on L3
        run: python3 .github/scripts/test_io_queue_trims.py
      - name: Check the selected cover is read first and an abandoned background is aborted (#772)
        run: python3 .github/scripts/test_art_queue_order.py
      - name: Check image cache constructor recovers from allocation failures
        run: python3 .github/scripts/test_cache_allocation.py
      - name: Check Ember settings are only written once changed in RiptOPL
        run: python3 .github/scripts/test_ember_settings.py
      - name: Check UDPFS discovers languages after late server and directory availability
        run: python3 .github/scripts/test_udpfs_languages.py
      - name: Check Ember disc selection changes only the launch argument and Back preserves the menu
        run: python3 .github/scripts/test_ember_disc_selection.py
      - name: Check launch errors do not render the active library behind their opaque background
        run: python3 .github/scripts/test_error_dialog_render.py
      - name: Check a missing Ember core still lists its games and never fails the PS1 scan
        run: python3 .github/scripts/test_ember_scan_missing_core.py
      - name: Check loose files cannot hide Ember games on FAT32 or exFAT
        run: python3 .github/scripts/test_ember_fatfs_images.py
      - name: Check Ember games list on MMCE through the real mmceman directory calls
        run: python3 .github/scripts/test_ember_mmce_dread.py
      - name: Check the per-game logo-art toggle persists and gates the LGO cache
        run: python3 .github/scripts/test_logo_art_toggle.py
      - name: Check the HTTP stream client and games.csv catalog parser against the reference
        run: sh pc/http/tests/run.sh

  udpfs-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check both UDPFS variants compile the same canonical transport sources
        run: python3 .github/scripts/test_udpfs_shared_transport.py
      - name: Check cumulative ACK order and sequence wrap
        run: |
          for variant in udpfs_ioman udpfs_bd; do
            cc -std=c99 -Wall -Wextra -Werror -pedantic -Imodules/network/$variant/src modules/network/udpfs_ioman/tests/test_ack_sequence.c -o /tmp/test_udpfs_ack_$variant
            /tmp/test_udpfs_ack_$variant
          done
          test "$(grep -c 'if (udprdma_ack_covers(' modules/network/udpfs_shared/src/udprdma.c)" -eq 1
          test "$(grep -c 'covered = _wait_ack(socket, sent_seq_nr);' modules/network/udpfs_shared/src/udprdma.c)" -eq 2
          cmp modules/network/udpfs_ioman/src/udprdma_seq.h modules/network/udpfs_bd/src/udprdma_seq.h
      - name: Check stale ACKs keep waiting and a reconnect restarts the session at sequence 0
        run: |
          N=modules/network
          for variant in udpfs_ioman udpfs_bd; do
            cc -std=gnu99 -Wall -Wextra -Wno-unused-parameter -Werror -I$N/udpfs_shared/tests/stubs -I$N/$variant/src -I$N/$variant/include -I$N/udpfs_ministack/include -I$N/udpfs_smap/include $N/udpfs_shared/tests/test_udprdma_session.c -o /tmp/test_udprdma_session_$variant
            /tmp/test_udprdma_session_$variant
          done
      - name: Check another device claiming the PS2's IP is detected and reported
        run: |
          N=modules/network
          cc -std=gnu99 -Wall -Wextra -Wno-unused-parameter -Werror -I$N/udpfs_shared/tests/stubs -I$N/udpfs_ministack/include -I$N/udpfs_smap/include $N/udpfs_shared/tests/test_ministack_conflict.c -o /tmp/test_ministack_conflict
          /tmp/test_ministack_conflict
      - name: Check DEV9-gated UDP chains, UDPFS sub-make dependencies and the IP-conflict notice
        run: python3 .github/scripts/test_udpfs_network_hardening.py
      - name: Check UDPFS delivers the last byte of odd-sized reads
        run: python3 .github/scripts/test_udpfs_smap_fifo_tail.py
      - name: Check UDPFS discovery announces the PS2's IP before the server replies
        run: |
          N=modules/network
          cc -std=gnu99 -Wall -Wextra -Wno-unused-parameter -Werror -I$N/udpfs_shared/tests/stubs -I$N/udpfs_ministack/include -I$N/udpfs_smap/include $N/udpfs_shared/tests/test_ministack_announce.c -o /tmp/test_ministack_announce
          /tmp/test_ministack_announce
      - name: Check the mstack UDP exchange device the RA support check uses under UDPFS
        run: |
          N=modules/network
          cc -std=gnu99 -Wall -Wextra -Wno-unused-parameter -Werror -I$N/udpfs_shared/tests/stubs -I$N/udpfs_ministack/include -I$N/udpfs_ministack/src -I$N/udpfs_smap/include $N/udpfs_shared/tests/test_ministack_xchg.c -o /tmp/test_ministack_xchg
          /tmp/test_ministack_xchg
      - name: Check UDPFS themes are registered only after the server answers
        run: python3 .github/scripts/test_udpfs_themes.py
      - name: Check UDPFS artwork index integrity and case-sensitive ART paths
        run: python3 .github/scripts/test_udpfs_art.py
      - name: Check UDPFS lists launchable ISO games without probing ul.cfg
        run: python3 .github/scripts/test_udpfs_iso_only.py
      - name: Check UDPFS serializes fileXio and LOADFILE operations
        run: python3 .github/scripts/test_udpfs_serialization.py

  site-sync-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check the generator for the site search index and RetroAchievements page
        run: |
          python3 -m venv "$RUNNER_TEMP/site-sync"
          "$RUNNER_TEMP/site-sync/bin/pip" install --quiet beautifulsoup4==4.15.0 markdown-it-py==4.0.0
          "$RUNNER_TEMP/site-sync/bin/python" .github/scripts/test_site_sync.py

  # POPS/usbhdfsd.irx.ilink is a checked-in binary built from modules/bdmassault/ilink_bd_assault.
  # Rebuild it with that module's own Makefile in the PS2DEVPINNED container and require the bytes
  # to match every checked-in copy, so the shipped driver is always the output of the committed
  # source (#1018). This container reproduces both the pre-#1018 binary and the current one exactly.
  # A source change therefore needs the rebuilt binary in the same PR: take it from this job's
  # artifact, or build it locally in the same image.
  popstarter-ilink-driver:
    runs-on: ubuntu-24.04
    container: ghcr.io/ps2dev/ps2dev@sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
    steps:
      - name: Install make
        run: apk add --no-cache make
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build ilink_bd_assault.irx with its Makefile
        run: |
          make -C modules/bdmassault/ilink_bd_assault clean
          make -C modules/bdmassault/ilink_bd_assault
          mipsel-none-elf-gcc --version | head -1
      - name: Require the checked-in usbhdfsd.irx.ilink copies to be this build
        run: |
          built=modules/bdmassault/ilink_bd_assault/ilink_bd_assault.irx
          echo "built: $(wc -c < "$built") bytes, $(sha256sum "$built" | cut -d' ' -f1)"
          status=0
          for copy in modules/bdmassault/usbhdfsd.irx.ilink POPS/usbhdfsd.irx.ilink \
                      Example/APP_RIPTOPL-OFFICIALROLLING-VERSION.ZIP/usbhdfsd.irx.ilink; do
            if cmp -s "$built" "$copy"; then
              echo "OK   $copy"
            else
              echo "DIFF $copy: $(wc -c < "$copy") bytes, $(sha256sum "$copy" | cut -d' ' -f1)" >&2
              status=1
            fi
          done
          if [ "$status" != 0 ]; then
            echo "Checked-in usbhdfsd.irx.ilink is not the output of modules/bdmassault/ilink_bd_assault." >&2
            echo "Replace every copy with this job's artifact and update the pinned size/sha256" >&2
            echo "(src/vcdsupport.c, modules/bdmassault/PROVENANCE.md, docs/VCD.md)." >&2
          fi
          exit $status
      - name: Upload the built driver
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: popstarter-usbhdfsd-irx-ilink
          path: modules/bdmassault/ilink_bd_assault/ilink_bd_assault.irx
          if-no-files-found: ignore

  build-flavour:
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- PINNED: reproducible. Give these to testers. ---
          # ps2dev, pinned 2026-08-13.
          # GHCR and Docker Hub are published from the same ps2dev image manifests.
          # Keep the 2026-08-13 digest unchanged for pinned comparability; avoid
          # anonymous Docker Hub pulls which fail on hosted runners (HTTP 429).
          - flavour: PS2DEVPINNED
            image: ghcr.io/ps2dev/ps2dev@sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
            digest: sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
            pinned: "yes (2026-08-13)"
            opldiag: "0"
          # Official OPL's own CI container, pinned 2026-08-13.
          - flavour: OFFICIALPINNED
            image: ghcr.io/ps2homebrew/ps2homebrew@sha256:a1b1f87f09a88f64efbe11356aae47098d4d54b3b3a84f0609fa42369244e25d
            digest: sha256:a1b1f87f09a88f64efbe11356aae47098d4d54b3b3a84f0609fa42369244e25d
            pinned: "yes (2026-08-13)"
            opldiag: "0"
          # --- ROLLING: early warning. Expect these to move without us changing anything. ---
          - flavour: PS2DEVROLLING
            image: ghcr.io/ps2dev/ps2dev:latest
            digest: ""
            pinned: "no (tracks ps2dev/ps2dev:latest)"
            opldiag: "0"
          - flavour: OFFICIALROLLING
            image: ghcr.io/ps2homebrew/ps2homebrew:main
            digest: ""
            pinned: "no (tracks ps2homebrew:main)"
            opldiag: "0"
          # --- DIAGNOSTIC: same pinned toolchain as PS2DEVPINNED, built with OPLDIAG=1.
          # Adds the on-screen boot-stage labels and the error-code detail suffix. Those are raw
          # untranslated developer strings, which is exactly why they must never reach a build a
          # normal user runs -- and exactly why a tester needs a build that HAS them. This is the
          # ELF to hand out when the question is WHERE a console wedges.
          # It is NOT a DEBUG build: no TTY link, no -g. Everything else matches its pinned twin,
          # so a result gathered here is directly comparable with one gathered on PS2DEVPINNED.
          - flavour: PS2DEVPINNED-DIAG
            image: ghcr.io/ps2dev/ps2dev@sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
            digest: sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
            pinned: "yes (2026-08-13)"
            opldiag: "1"
          # --- FREEZE REPORT: OFFICIALROLLING (the toolchain the release app uses) built with
          # INGAMEDIAG=1. When a game freezes, the IGR combo (L1+L2+R1+R2+Start+Select) saves what
          # the console was doing -- the game's threads, the IOP's disc and VMC activity -- to
          # mc0:/RIPTFRZ.TXT, then exits as usual. An inert combo can also mean IGR input monitoring failed.
          # Hand it out when a tester reports in-game freezes. Compatibility Mode 6 turns IGR off,
          # and with it the report.
          - flavour: OFFICIALROLLING-FREEZEDIAG
            image: ghcr.io/ps2homebrew/ps2homebrew:main
            digest: ""
            pinned: "no (tracks ps2homebrew:main)"
            opldiag: "0"
            ingamediag: "1"
          # RA follows the official rolling toolchain used by the release app.
          - flavour: OFFICIALROLLING-RA
            image: ghcr.io/ps2homebrew/ps2homebrew:main
            digest: ""
            pinned: "no (tracks ps2homebrew:main)"
            opldiag: "0"
            ra: "1"
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      # git must exist BEFORE checkout (ps2dev images are minimal Alpine): without it,
      # actions/checkout falls back to an API tarball, git describe fails, and the version
      # string collapses to "-dirty". Guarded installs no-op where tools already exist
      # (the ps2homebrew image ships official OPL's full build deps).
      - name: Install host dependencies (either package manager)
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash make git zip unzip tar gzip xz python3 py3-pip py3-yaml gmp mpfr4 mpc1 gawk coreutils findutils grep sed diffutils || true
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq bash make git zip unzip python3 python3-yaml gawk || true
          fi

      - name: git checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --prune --unshallow || true

      - name: Install menu-coherent mmceman (#254)
        run: sh .github/scripts/install_coherent_mmce.sh
      - name: Install verified native VMC fragment walker
        run: python3 .github/scripts/install_safe_bdmfs.py

      - name: Compile -> make clean release (${{ matrix.flavour }})
        run: make --trace clean && make --trace LOCALVERSION=${{ matrix.flavour }} OPLDIAG=${{ matrix.opldiag }} RETROACHIEVEMENTS=${{ matrix.ra || '0' }} INGAMEDIAG=${{ matrix.ingamediag || '0' }} release

      - name: Verify the freeze report exists only in its flavour
        env:
          INGAMEDIAG_BUILD: ${{ matrix.ingamediag || '0' }}
        run: |
          sed -n -E 's/^[[:space:]]+0x[0-9a-fA-F]+[[:space:]]+([A-Za-z0-9_]+)[[:space:]]*$/ \1/p' ee_core/ee_core.map > core-symbols.txt
          if [ "$INGAMEDIAG_BUILD" = 1 ]; then
            grep -q ' FreezeDiag_Begin$' core-symbols.txt
            grep -q ' FreezeDiag_Write$' core-symbols.txt
            test -s modules/iopcore/freezediag/freezediag.irx
            LC_ALL=C grep -aq 'RIPTFRZ.TXT' modules/iopcore/freezediag/freezediag.irx
          elif grep -E ' (FreezeDiag_[A-Za-z0-9_]*|freeze_diag_[A-Za-z0-9_]*|g_freeze_diag[A-Za-z0-9_]*)$' core-symbols.txt || LC_ALL=C grep -aq 'RIPTFRZ' ee_core/ee_core.elf; then
            echo 'freeze report leaked into a build without INGAMEDIAG' >&2
            exit 1
          fi

      - name: Verify RA isolation in linked menu and game core
        env:
          RA_BUILD: ${{ matrix.ra || '0' }}
        run: |
          if command -v mips64r5900el-ps2-elf-nm >/dev/null 2>&1; then
            NM=mips64r5900el-ps2-elf-nm
          else
            NM=ee-nm
          fi
          "$NM" opl.elf > menu-symbols.txt
          sed -n -E 's/^[[:space:]]+0x[0-9a-fA-F]+[[:space:]]+([A-Za-z0-9_]+)[[:space:]]*$/ \1/p' ee_core/ee_core.map > core-symbols.txt
          if [ "$RA_BUILD" = 1 ]; then
            grep -q ' raCaduceusPage$' menu-symbols.txt
            grep -q ' gRAMode$' menu-symbols.txt
            grep -q ' gRAExperimentalCards$' menu-symbols.txt
            grep -q ' sysNeutrinoPrepareRA$' menu-symbols.txt
            grep -q ' raPopsPrepare$' menu-symbols.txt
            grep -q ' raHttpsGet$' menu-symbols.txt
            grep -q ' mbedtls_ssl_handshake$' menu-symbols.txt
            grep -q ' rapops_irx$' menu-symbols.txt
            grep -q ' RA_OverlayOnVblank$' core-symbols.txt
          else
            if grep -E ' (RA_[A-Za-z0-9_]*|ra[A-Z][A-Za-z0-9_]*|ach[A-Z][A-Za-z0-9_]*|gRA[A-Za-z0-9_]*|bdmModeIsUSB|rapops_irx|size_rapops_irx|raudp_irx|size_raudp_irx|sysNeutrinoPrepareRA|sysNeutrinoRA[A-Za-z0-9_]*|mbedtls_[A-Za-z0-9_]*|psa_[A-Za-z0-9_]*|ratls_root_[A-Za-z0-9_]*)$' menu-symbols.txt core-symbols.txt; then
              echo 'RA implementation leaked into a standard ELF' >&2
              exit 1
            fi
            if LC_ALL=C grep -aE 'Caduceus|Xerabora|CADUCEUS.KEY|ORBIT-RA|ript-ra|retroachievements\.org' opl.elf ee_core/ee_core.elf; then
              echo 'RA client text leaked into a standard ELF' >&2
              exit 1
            fi
          fi
          echo "opl.elf size (${{ matrix.flavour }}): $(stat -c %s opl.elf) bytes"

      # Written AFTER the build so the compiler probe reflects what actually compiled. Every probe is
      # `|| true`: this file is a diagnostic and must never be the reason a good build fails to ship.
      # A rolling flavour has no digest to record here (the tag is resolved by the runner before this
      # step exists) -- the compiler version below is what identifies it, and it is the part that
      # actually matters when a toolchain change breaks something.
      - name: Record build manifest (${{ matrix.flavour }})
        if: ${{ always() }}
        run: |
          {
            echo "flavour:      ${{ matrix.flavour }}"
            echo "pinned:       ${{ matrix.pinned }}"
            echo "retroachievements: ${{ matrix.ra || '0' }}"
            echo "opldiag:      ${{ matrix.opldiag }}"
            echo "ingamediag:   ${{ matrix.ingamediag || '0' }}"
            echo "image:        ${{ matrix.image }}"
            echo "digest:       ${{ matrix.digest }}"
            echo "built (UTC):  $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "run:          ${{ github.run_id }}"
            echo "ref:          ${{ github.ref }}"
            echo "commit:       ${{ github.sha }}"
            echo "---- toolchain ----"
            (mips64r5900el-ps2-elf-gcc --version 2>/dev/null || ee-gcc --version 2>/dev/null || echo "ee compiler: not probed") | head -1
            (iop-gcc --version 2>/dev/null || mipsel-none-elf-gcc --version 2>/dev/null || echo "iop compiler: not probed") | head -1
            echo "PS2SDK=${PS2SDK:-unset}"
            for v in "$PS2SDK/../.version" "$PS2SDK/.version" /usr/local/ps2dev/.version; do
              [ -f "$v" ] && { echo "sdk version file ($v):"; cat "$v"; break; }
            done
          } > BUILD-MANIFEST.txt 2>/dev/null || true
          cat BUILD-MANIFEST.txt || true

      - name: Upload ELF (${{ matrix.flavour }})
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        with:
          name: OPL-${{ matrix.flavour }}
          path: |
            RIPTOPL-*.ELF
            OPNPS2LD-*.ELF
            BUILD-MANIFEST.txt
          if-no-files-found: error
          retention-days: 14

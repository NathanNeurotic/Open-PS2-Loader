name: RetroAchievements Release

on:
  workflow_run:
    workflows: ["Rolling Release"]
    branches: [rebuild/main]
    types: [completed]
  workflow_dispatch:
    inputs:
      standard_run:
        description: Successful rebuild/main Rolling Release run ID (blank selects latest)
        type: string
  # PR previews only for changes to RA packaging/publishing. RA source changes are already built on
  # every PR by flavours.yml (OFFICIALROLLING-RA); six extra loader builds per unrelated PR, or a
  # fork PR waiting on approval, buy nothing. Publication still follows every Rolling run.
  pull_request:
    branches: [rebuild/main]
    paths:
      - .github/workflows/ra-release.yml
      - .github/workflows/rolling-release.yml
      - .github/scripts/package_ra_release.py
      - .github/scripts/package_orbit_neutrino.py
      - .github/scripts/publish_ra_release.py
      - .github/scripts/package_release_app.py
      - .github/scripts/normalize_release_notes.py
      - .github/scripts/install_coherent_mmce.sh
      - .github/patches/mmceman-*.patch
      - .github/scripts/install_safe_bdmfs.py
      - .github/patches/bdmfs-vmc-fragment-walk.c
      - .github/patches/bdmfs-vmc-sources.json
      - third_party/orbit-neutrino/**
      - pc/xeRAbora.url

permissions:
  contents: read
  actions: read

# Do not interrupt a release while its two-theme asset set is being replaced.
concurrency:
  group: ra-release-${{ github.event_name == 'pull_request' && github.ref || 'rolling-ra' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.input.outputs.revision }}
      version: ${{ steps.input.outputs.version }}
      korium: ${{ steps.input.outputs.korium }}
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_RUN: ${{ inputs.standard_run || github.event.workflow_run.id }}
      EVENT: ${{ github.event_name }}
      PR_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve trusted standard run and freeze both theme inputs
        id: input
        shell: bash
        run: |
          set -euo pipefail
          RUN="$REQUESTED_RUN"
          if [ -z "$RUN" ]; then
            RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/rolling-release.yml/runs?branch=rebuild%2Fmain&status=success&per_page=1" --jq '.workflow_runs[0].id')
          fi
          [[ "$RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" > run.json
          python3 - <<'PY'
          import json, os
          run = json.load(open("run.json"))
          assert run["conclusion"] == "success"
          assert run["head_branch"] == "rebuild/main"
          assert run["head_repository"]["full_name"] == os.environ["GITHUB_REPOSITORY"]
          assert run["path"] == ".github/workflows/rolling-release.yml"
          PY
          if ! gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name standard-release-kit --dir shared; then
            # Bootstrap previews before the new standard artifact exists on main.
            # Publication always requires the immutable same-run artifact.
            [ "$EVENT" = pull_request ]
            mkdir -p shared
            gh release view rolling --repo "$GITHUB_REPOSITORY" --json assets > bootstrap.json
            ASSET=$(python3 - <<'PY'
          import json, sys
          sys.path.insert(0, ".github/scripts")
          from package_ra_release import standard_asset
          print(standard_asset(json.load(open("bootstrap.json"))["assets"]))
          PY
            )
            gh release download rolling --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir shared
            mv "shared/$ASSET" shared/standard.zip
            BOOTSTRAP_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/rolling" --jq .object.sha)
            ASSET="$ASSET" BOOTSTRAP_SHA="$BOOTSTRAP_SHA" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          run = json.load(open("run.json"))
          Path("shared/INPUT.json").write_text(json.dumps(dict(revision=os.environ["BOOTSTRAP_SHA"],
              version=os.environ["ASSET"][8:-4],
              sha256=hashlib.sha256(Path("shared/standard.zip").read_bytes()).hexdigest())))
          PY
          fi
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          data = json.loads(Path("shared/INPUT.json").read_text())
          run = json.load(open("run.json"))
          if os.environ["EVENT"] != "pull_request":
              assert data["revision"] == run["head_sha"]
          assert data["sha256"] == hashlib.sha256(Path("shared/standard.zip").read_bytes()).hexdigest()
          revision = os.environ["PR_SHA"] if os.environ["EVENT"] == "pull_request" else data["revision"]
          # PR packages are previews; only published builds use same-revision shared files.
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"revision={revision}\nversion={data['version']}\n")
          PY
          KORIUM=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/test/korium-audit-remediation" --jq '.object.sha')
          echo "korium=$KORIUM" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: ra-shared-input
          path: shared/
          if-no-files-found: error

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        theme: [inceBtion, Korium]
        sdk:
          - name: OFFICIALROLLING
            image: ghcr.io/ps2homebrew/ps2homebrew:main
          - name: PS2DEVROLLING
            image: ps2dev/ps2dev:latest
          - name: PS2DEVPINNED
            image: ps2dev/ps2dev@sha256:c64ae69c9817865ed98ff054e4ae5360b9e280ed952c97946bca95d9d35be995
    container: ${{ matrix.sdk.image }}
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.revision }}
      KORIUM_SHA: ${{ needs.prepare.outputs.korium }}
      THEME: ${{ matrix.theme }}
      SDK: ${{ matrix.sdk.name }}
    steps:
      - name: Install host dependencies
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash make git zip unzip python3 py3-yaml gmp mpfr4 mpc1 gawk
          else
            apt-get update -qq
            apt-get install -y -qq bash make git zip unzip python3 python3-yaml gawk
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply only the frozen Korium theme delta
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p ra-build
          if [ "$THEME" = Korium ]; then
            git fetch --no-tags origin "$KORIUM_SHA"
            BASE=$(git merge-base "$SOURCE_SHA" "$KORIUM_SHA")
            git diff --binary "$BASE" "$KORIUM_SHA" -- Makefile audio/ gfx/ misc/ include/textures.h src/opl.c src/textures.c src/themes.c > ra-build/Korium.patch
            test -s ra-build/Korium.patch
            git apply --3way --index ra-build/Korium.patch
            git diff --cached --check
            grep -q 'Korium Komblete' misc/conf_theme_OPL.cfg
          fi
      - name: Build packed RA loaders and record exact provenance
        shell: bash
        run: |
          set -euo pipefail
          sh .github/scripts/install_coherent_mmce.sh
          python3 .github/scripts/install_safe_bdmfs.py
          PADS='0 1'
          [ "$SDK" != OFFICIALROLLING ] || PADS=1
          for PAD in $PADS; do
            make clean
            rm -f RIPTOPL.ELF opl.elf
            make --trace RETROACHIEVEMENTS=1 EXTRA_FEATURES=0 PADEMU="$PAD" LOCALVERSION="$SDK-RA-$THEME" RELEASE_CHANNEL="RA-$THEME"
            test -s RIPTOPL.ELF
            test "$(wc -c < RIPTOPL.ELF)" -le 6291456
            NM=mips64r5900el-ps2-elf-nm
            command -v "$NM" >/dev/null 2>&1 || NM=ee-nm
            "$NM" opl.elf > ra-build/symbols.txt
            grep -q ' sysNeutrinoPrepareRA$' ra-build/symbols.txt
            cp RIPTOPL.ELF "ra-build/pademu$PAD.ELF"
          done
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          folder = Path("ra-build")
          data = dict(revision=os.environ["SOURCE_SHA"], korium_revision=os.environ["KORIUM_SHA"],
              theme=os.environ["THEME"], sdk=os.environ["SDK"],
              elf_sha256={p.stem.removeprefix("pademu"): hashlib.sha256(p.read_bytes()).hexdigest() for p in folder.glob("*.ELF")})
          (folder / "BUILD.json").write_text(json.dumps(data, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: ra-${{ matrix.theme }}-${{ matrix.sdk.name }}
          path: ra-build/
          if-no-files-found: error

  package:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ra-shared-input
          path: shared
      - uses: actions/download-artifact@v8
        with:
          pattern: ra-*-*ROLLING
          path: builds
      - uses: actions/download-artifact@v8
        with:
          pattern: ra-*-PS2DEVPINNED
          path: builds
      - name: Assemble and verify both complete theme kits
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.revision }}
          KORIUM_SHA: ${{ needs.prepare.outputs.korium }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for DIR in builds/ra-*; do mv "$DIR" "builds/${DIR##*/ra-}"; done
          PREVIEW=''
          [ "${{ github.event_name }}" != pull_request ] || PREVIEW=--preview
          python3 .github/scripts/package_ra_release.py $PREVIEW --standard-kit shared/standard.zip --builds builds --output release --revision "$SOURCE_SHA" --korium-revision "$KORIUM_SHA" --version "$VERSION"
          python3 .github/scripts/normalize_release_notes.py --assets-dir release --tag rolling-ra --revision "$SOURCE_SHA" --repository "$GITHUB_REPOSITORY" --version "$VERSION" --neutrino-version ORBIT-v1.0.2 > RA-NOTES.md
      - uses: actions/upload-artifact@v6
        with:
          name: RetroAchievements-both-themes
          path: |
            release/
            RA-NOTES.md
          if-no-files-found: error

  publish:
    needs: [prepare, package]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/rebuild/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: RetroAchievements-both-themes
          path: publication
      - name: Publish the complete two-theme RA release (never Latest)
        run: python3 .github/scripts/publish_ra_release.py --assets publication/release --notes publication/RA-NOTES.md --repository "$GITHUB_REPOSITORY"

name: Rolling Release

# Continuously publishes the current build of the PUBLISHING BRANCH to a single "rolling"
# development release. It is a full (non-pre-release) GitHub release marked Latest, and it can be
# pulled directly from a stable URL as development progresses. The publishing branch is
# `rebuild/main`, and only rebuild/main: it is the physical publish knob, fast-forwarded to a
# tested step-chain tip exactly when Nathan wants a rolling build to go out, never
# automatically per step. `master` is the OLD LINEAGE and is deliberately not wired to this
# workflow at all -- see the NOTE(rebuild) on the publish-rolling gate below.
#
# Builds four flavours across the ps2dev and official ps2homebrew toolchain lineages so a regression
# in either moving SDK or either pinned control is visible from the rolling channel (and a hardware
# failure can be triaged by WHICH flavours reproduce it). Each is packaged in its own labelled
# APPS/APP_RIPTOPL-<SDK>/ folder. Raw staging also creates floating ELFs for release assembly and the
# permanent archive; release-normalize.yml consolidates the public GitHub downloads into archives.
# Recommended loader order is by reliability:
#   * ps2dev/ps2dev@sha256 (pin)                  -> -PS2DEVPINNED    (RECOMMENDED #1)
#   * ghcr.io/ps2homebrew/ps2homebrew@sha256      -> -OFFICIALPINNED (RECOMMENDED #2)
#   * ps2dev/ps2dev:latest                        -> -PS2DEVROLLING   (moving canary #3)
#   * ghcr.io/ps2homebrew/ps2homebrew:main        -> -OFFICIALROLLING (moving canary #4)
#
# A source snapshot (RIPTOPL-<version>-src.zip) of the exact built commit is also
# published, so every rolling build is self-preserving: testers can restore and
# rebuild precisely what they ran, even if history is later rewritten.
#
# Deliberately additive and self-contained:
#   * Publishing-branch pushes update ONLY the "rolling" tag/release (created on first run).
#   * `rolling` stays the GitHub Latest release; curated v* tags do not displace it. Only -rc tags
#     are pre-releases.
#   * Does NOT modify any branch. It only uploads release assets.
#   * Builds run inside their toolchain containers; publishing runs on the host
#     runner, which ships the gh CLI.
#
# The WOPLSDK flavour (wOPL's digest-pinned ghcr.io container) was REMOVED 2026-07-27: it crashed
# at the initial setup menu and was not worth fixing. The current four flavours pair pinned and
# moving canaries across both maintained toolchain lineages (issue #270).
#
# GATING: the ps2dev:latest (PS2DEVROLLING) build must COMPILE -- if it fails to build the
# publish FAILS loudly. All available flavours ship as their own labelled comparison folder.
# The ready app under APPS/ selects OFFICIALROLLING when present and records any fallback in its
# metadata, so a toolchain cannot be swapped silently. Each ELF self-identifies with
# its PS2DEVPINNED, OFFICIALPINNED, PS2DEVROLLING, or OFFICIALROLLING version suffix. The compile gate
# catches BUILD breakage only: ps2dev:latest tracks a MOVING tag whose ps2sdk drifts daily and
# can yield a green-but-non-booting binary (issue #102), which is why the pinned PS2DEVPINNED flavour
# is kept as the safe fallback -- see the release notes "Download" section.

on:
  push:
    branches:
      # rebuild/main is THE publishing branch. master is the old lineage: it is kept
      # around for history, and a push to it must never republish the rolling channel with
      # pre-rebuild code. Deliberately not a trigger.
      - rebuild/main
      # The Korium test line (PR #687): the same build with the Korium built-in theme, published to its
      # own "rolling-korium" release. korium-sync.yml keeps it merged with rebuild/main and dispatches
      # this workflow on it (a push made by a workflow's GITHUB_TOKEN starts no workflow by itself).
      - test/korium-audit-remediation
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Per-ref: master pushes still supersede each other (rolling), but a v* tag release runs in its
# own group, so a new master push can't cancel an in-flight release cut (or vice versa).
concurrency:
  group: rolling-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-rolling-pinned:
    runs-on: ubuntu-24.04
    container: ps2dev/ps2dev@sha256:c64ae69c9817865ed98ff054e4ae5360b9e280ed952c97946bca95d9d35be995
    # Fallback/compatibility toolchain: best-effort, must not block the rolling publish.
    continue-on-error: true
    steps:
      # Install git BEFORE checkout: without it, actions/checkout falls back to an API
      # tarball (no .git directory) and git describe fails, collapsing the version string.
      # Required by every ps2dev image, pinned or latest -- they are Alpine and ship no git.
      # The retired ps2max container carried these preinstalled, which is why this job did
      # not need the step before the pin.
      - name: Install host dependencies (Alpine only)
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache \
              bash \
              make \
              git \
              zip \
              unzip \
              tar \
              gzip \
              xz \
              python3 \
              py3-pip \
              py3-yaml \
              gmp \
              mpfr4 \
              mpc1 \
              perl \
              cmake \
              pkgconf \
              coreutils \
              findutils \
              grep \
              sed \
              gawk \
              diffutils
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Mark workspace safe and fetch history
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Resolve release channel (rolling / rolling-korium)
        run: sh .github/scripts/release_channel.sh >> "$GITHUB_ENV"
      - name: Install menu-coherent mmceman (#254)
        run: sh .github/scripts/install_coherent_mmce.sh

      - name: Build (make clean release)
        # LOCALVERSION brands the in-ELF version string ("-PS2DEVPINNED") so hardware reports
        # self-identify which toolchain's binary produced them (Makefile appends it).
        run: make --trace clean && make --trace LOCALVERSION=PS2DEVPINNED release

      - name: Stage rolling assets (pinned = PS2DEVPINNED)
        run: |
          set -eu
          mkdir -p rolling
          # Publish ONLY the stable, version-agnostic name. Versioned filenames
          # embed the commit, so they change every run and pile up as stale
          # assets -- confusing on a rolling channel.
          MAIN_ELF="$(ls RIPTOPL-*.ELF 2>/dev/null | head -n1)"
          if [ -z "${MAIN_ELF:-}" ] || [ ! -f "$MAIN_ELF" ]; then
            echo "No RIPTOPL ELF produced by the pinned build" >&2
            exit 1
          fi
          cp -f "$MAIN_ELF" rolling/RIPTOPL-PS2DEVPINNED.ELF
          # IRX provenance manifest: hash every prebuilt IOP module in this container's SDK, so a
          # silent SDK-side driver swap (the mmceman class) shows up as a manifest diff between
          # runs instead of as a hardware mystery. NOT every module listed is one we embed -- the
          # script writes a header naming the modules the fork builds itself.
          sh ./.github/scripts/irx_manifest.sh PS2DEVPINNED
          echo "Staged pinned rolling assets:"
          ls -la rolling

      - name: Build + stage DualSense (DS5) loader (PS2DEVPINNED)
        # DualSense (DS5 USB) is HW-validated (maintainer, 2026-07-06) but kept OFF in the default
        # build by choice. Ship a ready-made DUALSENSE=1 loader for THIS SDK flavour as a named
        # staging file. release-normalize.yml moves it into the public VARIANTS archive. Best-effort:
        # a DS5 build hiccup must not sink the main flavour.
        # LOCALVERSION carries "-PS2DEVPINNED-ds5" so hardware reports self-identify.
        run: |
          make --trace clean
          rm -f RIPTOPL-*.ELF   # drop the main build's leftover named ELF (already staged) so the DS5 output is unambiguous
          if make --trace LOCALVERSION=PS2DEVPINNED-ds5 DUALSENSE=1 release; then
            DS5_ELF="$(ls RIPTOPL-*.ELF 2>/dev/null | head -n1)"
            if [ -n "${DS5_ELF:-}" ] && [ -f "$DS5_ELF" ]; then
              cp -f "$DS5_ELF" rolling/RIPTOPL-PS2DEVPINNED-ds5.ELF
            else
              echo "WARN: PS2DEVPINNED DUALSENSE=1 build produced no ELF; skipping DS5 asset this run" >&2
            fi
          else
            echo "WARN: PS2DEVPINNED DUALSENSE=1 build failed; skipping DS5 asset this run" >&2
          fi

      - name: Build variant + debug extras (pinned = PS2DEVPINNED)
        # Runs AFTER staging so the per-build `make clean` can't wipe the saved main ELF.
        run: sh ./.github/scripts/build_rolling_extras.sh "-PS2DEVPINNED" "PS2DEVPINNED"

      - name: Upload pinned rolling assets
        uses: actions/upload-artifact@v6
        with:
          name: rolling-assets-pinned
          path: rolling
          if-no-files-found: error
          retention-days: 14

  build-rolling-ps2dev-latest:
    runs-on: ubuntu-24.04
    container: ps2dev/ps2dev:latest
    # PS2DEVROLLING (target) toolchain: REQUIRED to COMPILE. If this fails to build, the publish
    # fails loudly. It ships as its own labeled APP_RIPTOPL-PS2DEVROLLING/ folder (no default slot).
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      # Dependencies BEFORE checkout: with no git in the container, actions/checkout falls
      # back to an API tarball (no .git at all) -> `git fetch --unshallow` fails, the Makefile's
      # `test -d .git` marks the build "-dirty", and the version collapses to an uninformative
      # "vX.Y.Z-Beta-N-dirty" (exactly what hardware reporters were pasting back at us).
      - name: Install host dependencies (Alpine only)
        run: |
          if command -v apk >/dev/null 2>&1; then
            # Consolidated ps2dev Alpine prerequisites: build tools, scripting, packaging, and gcc runtime libs.
            apk add --no-cache \
              bash \
              make \
              git \
              zip \
              unzip \
              tar \
              gzip \
              xz \
              python3 \
              py3-pip \
              py3-yaml \
              gmp \
              mpfr4 \
              mpc1 \
              perl \
              cmake \
              pkgconf \
              coreutils \
              findutils \
              grep \
              sed \
              gawk \
              diffutils
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Mark workspace safe and fetch history
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --prune --unshallow || true
      - name: Resolve release channel (rolling / rolling-korium)
        run: sh .github/scripts/release_channel.sh >> "$GITHUB_ENV"

      - name: Refuse a dirty checkout before versioning
        run: |
          set -eu
          if ! git diff --quiet --; then
            echo "ERROR: tracked files changed immediately after checkout; refusing to publish a -dirty release." >&2
            git status --short >&2
            exit 1
          fi

      - name: Get version
        id: ver
        run: echo "version=$(make oplversion)" >> "$GITHUB_OUTPUT"

      - name: Install menu-coherent mmceman (#254)
        run: sh .github/scripts/install_coherent_mmce.sh

      - name: Build (make clean release)
        # LOCALVERSION brands the in-ELF version string ("-PS2DEVROLLING") so hardware reports
        # self-identify which toolchain's binary produced them (Makefile appends it).
        run: make --trace clean && make --trace LOCALVERSION=PS2DEVROLLING release

      - name: Detailed changelog
        run: sh ./tools/make_changelog.sh

      - name: Stage rolling assets (ps2dev-latest = required version authority)
        run: |
          set -eu
          mkdir -p rolling
          # Publish ONLY the stable, version-agnostic name for the required build.
          MAIN_ELF="$(ls RIPTOPL-*.ELF 2>/dev/null | head -n1)"
          if [ -z "${MAIN_ELF:-}" ] || [ ! -f "$MAIN_ELF" ]; then
            echo "No RIPTOPL ELF produced by the ps2dev-latest build" >&2
            exit 1
          fi
          cp -f "$MAIN_ELF" rolling/RIPTOPL.ELF
          [ -f DETAILED_CHANGELOG ] && cp -f DETAILED_CHANGELOG rolling/ || true
          # IRX provenance manifest for the required container's SDK prebuilts (see the pinned job).
          sh ./.github/scripts/irx_manifest.sh PS2DEVROLLING
          # Standalone language pack (lang_*.lng + their non-Latin fonts, which are NOT embedded in the
          # ELF) -- build it off the just-built lng/ and stage it so 'rolling' carries it too. Soft-fail
          # so a LANGS hiccup can't break rolling.
          # Named with the download-file version (no commit hash), like every other release archive.
          if LNG_PACK_VERSION="$(sh ./.github/scripts/asset_version.sh "${{ steps.ver.outputs.version }}")" ./tools/lng_pack.sh && ls RIPTOPL-LANGS-*.zip >/dev/null 2>&1; then
            cp -f RIPTOPL-LANGS-*.zip rolling/
          else
            echo "WARN: language pack not produced this run"
          fi
          echo "Staged ps2dev-latest rolling assets:"
          ls -la rolling

      - name: Build + stage DualSense (DS5) loader (PS2DEVROLLING)
        # Named DUALSENSE=1 loader on the ps2dev:latest toolchain. Like the plain PS2DEVROLLING
        # build this rides the moving SDK tag (may not boot -- issue #102); DS5 owners who want a
        # reliable build should prefer the -PS2DEVPINNED-ds5 asset. Best-effort so a
        # DS5 hiccup can't sink the required canary flavour. LOCALVERSION carries "-PS2DEVROLLING-ds5".
        run: |
          make --trace clean
          rm -f RIPTOPL-*.ELF   # drop the main build's leftover named ELF (already staged) so the DS5 output is unambiguous
          if make --trace LOCALVERSION=PS2DEVROLLING-ds5 DUALSENSE=1 release; then
            DS5_ELF="$(ls RIPTOPL-*.ELF 2>/dev/null | head -n1)"
            if [ -n "${DS5_ELF:-}" ] && [ -f "$DS5_ELF" ]; then
              cp -f "$DS5_ELF" rolling/RIPTOPL-PS2DEVROLLING-ds5.ELF
            else
              echo "WARN: PS2DEVROLLING DUALSENSE=1 build produced no ELF; skipping DS5 asset this run" >&2
            fi
          else
            echo "WARN: PS2DEVROLLING DUALSENSE=1 build failed; skipping DS5 asset this run" >&2
          fi

      # NOTE(rebuild): the fork builds a SEPARATE GSM1080P=1 loader here as its own asset.
      # No longer needed: 1080p is hardware-confirmed and now ON in every build (Makefile
      # GSM1080P ?= 1), so the main ELF already carries it. Keeping a second 1080p-only asset
      # would also REINTRODUCE the raw-index divergence the default flip exists to remove.

      - name: Build variant + debug extras (ps2dev:latest = standard)
        # Runs after staging the main ELF so the per-build `make clean` can't wipe it.
        run: sh ./.github/scripts/build_rolling_extras.sh "-PS2DEVROLLING" "PS2DEVROLLING"

      - name: Upload ps2dev-latest rolling assets
        uses: actions/upload-artifact@v6
        with:
          name: rolling-assets-ps2dev-latest
          path: rolling
          if-no-files-found: error
          retention-days: 14

  build-rolling-officialsdk:
    runs-on: ubuntu-24.04
    # OFFICIALROLLING (third flavour): the EXACT container official OPL's rolling pre-release
    # compiles in (ghcr.io/ps2homebrew/ps2homebrew:main) -- a separate SDK lineage from
    # ps2dev/ps2dev, so hardware reports can split toolchain effects from RiptOPL code.
    # Best-effort by design (continue-on-error): main ELF + a named DS5 loader + the
    # OFFICIALROLLING standard loader. No full variants/debug matrix here;
    # a failure must never block the required ps2dev flavour from publishing.
    continue-on-error: true
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    steps:
      # The ps2homebrew image ships official OPL's build deps; the guarded installs only
      # top up this fork's extras (py3-yaml for the language overlay compiler, zip/gawk
      # for packaging) and no-op on either package manager if everything is present.
      - name: Install host dependencies (either package manager)
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash make git zip unzip tar gzip xz python3 py3-pip py3-yaml gawk coreutils findutils grep sed diffutils || true
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq bash make git zip unzip python3 python3-yaml gawk || true
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Mark workspace safe and fetch history
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --prune --unshallow || true
      - name: Resolve release channel (rolling / rolling-korium)
        run: sh .github/scripts/release_channel.sh >> "$GITHUB_ENV"

      - name: Install menu-coherent mmceman (#254)
        run: sh .github/scripts/install_coherent_mmce.sh

      - name: Build (make clean release)
        # LOCALVERSION brands the in-ELF version string ("-OFFICIALROLLING") so hardware
        # reports self-identify which toolchain's binary produced them.
        run: make --trace clean && make --trace LOCALVERSION=OFFICIALROLLING release

      - name: Stage rolling assets (officialsdk)
        run: |
          set -eu
          mkdir -p rolling
          MAIN_ELF="$(ls RIPTOPL-*.ELF 2>/dev/null | head -n1)"
          if [ -z "${MAIN_ELF:-}" ] || [ ! -f "$MAIN_ELF" ]; then
            echo "No RIPTOPL ELF produced by the officialsdk build" >&2
            exit 1
          fi
          cp -f "$MAIN_ELF" rolling/RIPTOPL-OFFICIALROLLING.ELF
          # IRX provenance manifest for this container's SDK prebuilts.
          sh ./.github/scripts/irx_manifest.sh OFFICIALROLLING
          echo "Staged officialsdk rolling assets:"
          ls -la rolling

      - name: Build + stage DualSense (DS5) loader (OFFICIALROLLING)
        # Same DS5 policy as the ps2dev flavours, now in the official container (Nathan,
        # 2026-08-13: "there should be a ds5 build for all 4 flavours"). OFF by default;
        # a ready-made DUALSENSE=1 loader is staged for insertion into the VARIANTS archive. Best-effort:
        # if DUALSENSE=1 cannot build in this container the WARN is loud and the flavour
        # simply ships without a DS5 asset, exactly like before this step existed.
        run: |
          make --trace clean
          rm -f RIPTOPL-*.ELF   # drop the main build's leftover named ELF (already staged) so the DS5 output is unambiguous
          if make --trace LOCALVERSION=OFFICIALROLLING-ds5 DUALSENSE=1 release; then
            DS5_ELF="$(ls RIPTOPL-*.ELF 2>/dev/null | head -n1)"
            if [ -n "${DS5_ELF:-}" ] && [ -f "$DS5_ELF" ]; then
              cp -f "$DS5_ELF" rolling/RIPTOPL-OFFICIALROLLING-ds5.ELF
            else
              echo "WARN: OFFICIALROLLING DUALSENSE=1 build produced no ELF; skipping DS5 asset this run" >&2
            fi
          else
            echo "WARN: OFFICIALROLLING DUALSENSE=1 build failed; skipping DS5 asset this run" >&2
          fi

      - name: Upload officialsdk rolling assets
        uses: actions/upload-artifact@v6
        with:
          name: rolling-assets-officialsdk
          path: rolling
          if-no-files-found: error
          retention-days: 14

  build-rolling-official-pinned:
    runs-on: ubuntu-24.04
    # OFFICIALPINNED -- the FOURTH flavour, and the reproducible half of the official lineage.
    # Same container as build-rolling-officialsdk but PINNED BY DIGEST (2026-08-13), so it can be
    # rebuilt byte-for-byte months from now and a bug report against it stays meaningful.
    #
    # It exists because of issue #382: a tester ran one build in three flavours and got three
    # different results, and there was no way to tell our bug from the toolchain moving underneath
    # us -- the official flavour was the one that WORKED, and it was also the only one with no
    # pinned twin to reproduce against. Pair every lineage, or the comparison cannot be made.
    #
    # Best-effort (continue-on-error), matching its rolling twin: main ELF + a named DS5
    # loader, no variants/debug extras. A failure here must never block the ps2dev
    # flavours from publishing.
    continue-on-error: true
    container: ghcr.io/ps2homebrew/ps2homebrew@sha256:a1b1f87f09a88f64efbe11356aae47098d4d54b3b3a84f0609fa42369244e25d
    steps:
      - name: Install host dependencies (either package manager)
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash make git zip unzip tar gzip xz python3 py3-pip py3-yaml gawk coreutils findutils grep sed diffutils || true
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq bash make git zip unzip python3 python3-yaml gawk || true
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Mark workspace safe and fetch history
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --prune --unshallow || true
      - name: Resolve release channel (rolling / rolling-korium)
        run: sh .github/scripts/release_channel.sh >> "$GITHUB_ENV"

      - name: Install menu-coherent mmceman (#254)
        run: sh .github/scripts/install_coherent_mmce.sh

      - name: Build (make clean release)
        run: make --trace clean && make --trace LOCALVERSION=OFFICIALPINNED release

      - name: Stage rolling assets (official-pinned)
        run: |
          set -eu
          mkdir -p rolling
          MAIN_ELF="$(ls RIPTOPL-*.ELF 2>/dev/null | head -n1)"
          if [ -z "${MAIN_ELF:-}" ] || [ ! -f "$MAIN_ELF" ]; then
            echo "No RIPTOPL ELF produced by the official-pinned build" >&2
            exit 1
          fi
          cp -f "$MAIN_ELF" rolling/RIPTOPL-OFFICIALPINNED.ELF
          sh ./.github/scripts/irx_manifest.sh OFFICIALPINNED
          echo "Staged official-pinned rolling assets:"
          ls -la rolling

      - name: Build + stage DualSense (DS5) loader (OFFICIALPINNED)
        # DS5 for the pinned official flavour too, so all four flavours carry a DS5
        # loader and a DS5 owner can stay on a reproducible build of EITHER lineage.
        # Best-effort, same as its rolling twin.
        run: |
          make --trace clean
          rm -f RIPTOPL-*.ELF   # drop the main build's leftover named ELF (already staged) so the DS5 output is unambiguous
          if make --trace LOCALVERSION=OFFICIALPINNED-ds5 DUALSENSE=1 release; then
            DS5_ELF="$(ls RIPTOPL-*.ELF 2>/dev/null | head -n1)"
            if [ -n "${DS5_ELF:-}" ] && [ -f "$DS5_ELF" ]; then
              cp -f "$DS5_ELF" rolling/RIPTOPL-OFFICIALPINNED-ds5.ELF
            else
              echo "WARN: OFFICIALPINNED DUALSENSE=1 build produced no ELF; skipping DS5 asset this run" >&2
            fi
          else
            echo "WARN: OFFICIALPINNED DUALSENSE=1 build failed; skipping DS5 asset this run" >&2
          fi

      - name: Upload official-pinned rolling assets
        uses: actions/upload-artifact@v6
        with:
          name: rolling-assets-official-pinned
          path: rolling
          if-no-files-found: error
          retention-days: 14

  publish-rolling:
    needs: [build-rolling-pinned, build-rolling-ps2dev-latest, build-rolling-officialsdk, build-rolling-official-pinned]
    # NOTE(rebuild): publish gate. Downstream this job has NO ref check -- anything that is not a
    # v* tag falls through to TAG="rolling" and updates the PUBLIC rolling release (see the tag/title block
    # below). The gate therefore names the only branch allowed to publish: rebuild/main (the
    # publish knob -- fast-forwarded to a tested step tip only when a rolling build is meant to go
    # out). Any OTHER ref -- master, a step branch, workflow_dispatch from one, a feature branch --
    # still runs the build jobs (the part worth rehearsing) and uploads their artifacts, while
    # withholding only the publish. master is excluded on purpose: it is the abandoned lineage, and
    # a push to it publishing over the rolling channel would ship pre-rebuild code as Latest. This
    # gate is belt-and-braces with the push trigger above, which no longer lists master either.
    # The Korium test line publishes too, but only to its own rolling-korium release (ROLLING_TAG below).
    if: ${{ github.ref == 'refs/heads/rebuild/main' || github.ref == 'refs/heads/test/korium-audit-remediation' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The rolling channel this ref publishes: rebuild/main -> "rolling" (GitHub's Latest); the Korium
      # test line -> "rolling-korium", identical but for the built-in theme, and never Latest.
      ROLLING_TAG: ${{ github.ref == 'refs/heads/test/korium-audit-remediation' && 'rolling-korium' || 'rolling' }}
      ROLLING_TITLE: ${{ github.ref == 'refs/heads/test/korium-audit-remediation' && 'Rolling (Korium)' || 'Rolling' }}
      ROLLING_LATEST: ${{ github.ref == 'refs/heads/test/korium-audit-remediation' && '--latest=false' || '--latest' }}
      OPL_VERSION: ${{ needs.build-rolling-ps2dev-latest.outputs.version }}
      # Human-readable label for the FALLBACK (-PS2DEVPINNED) build, shown in the release notes.
      # This flavour is a DIGEST PIN of ps2dev:latest, so the label is the date the pin was taken.
      # Bump it and the container digest together in build-rolling-pinned when re-pinning.
      SDK_VER: "ps2dev:latest pinned 2026-07-28"
      # MEGA archival credentials (repo secrets MEGA_USERNAME / MEGA_PASSWORD). Exposed under the
      # names USERNAME / PASSWORD because the upload action (Difegue/action-megacmd) reads exactly
      # those env names, and because it lets the MEGA steps gate on `env.USERNAME != ''` -- a fork
      # (or any run) without the secrets simply SKIPS the MEGA archive instead of failing.
      USERNAME: ${{ secrets.MEGA_USERNAME }}
      PASSWORD: ${{ secrets.MEGA_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download ps2dev-latest rolling assets
        # The required version-authority build (its job failing already failed the workflow).
        uses: actions/download-artifact@v8
        with:
          name: rolling-assets-ps2dev-latest
          path: rolling

      - name: Download pinned rolling assets
        # Optional: the pinned fallback build may have failed; publish what we have.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: rolling-assets-pinned
          path: rolling

      - name: Download officialsdk rolling assets
        # Optional: the official-SDK flavour is best-effort; publish what we have.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: rolling-assets-officialsdk
          path: rolling

      - name: Download official-pinned rolling assets
        # Optional, exactly like its rolling twin: a missing official flavour must not sink the release.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: rolling-assets-official-pinned
          path: rolling


      - name: Compute the download file version
        run: |
          set -eu
          # Download file names carry the version WITHOUT the commit hash (RIPTOPL-v1.2.0-Beta-2910.zip,
          # not RIPTOPL-v1.2.0-Beta-2910-6c5f4b1-3031f67ccece3825.zip): they are what a new user reads
          # on the release page. OPL_VERSION itself is unchanged and still heads the release notes with
          # its commit link. The MEGA archive step keeps OPL_VERSION so its per-build name stays unique.
          echo "ASSET_VERSION=$(sh ./.github/scripts/asset_version.sh "${OPL_VERSION:-rolling}")" >> "$GITHUB_ENV"

      - name: Name assets with the build version
        run: |
          set -eu
          # Apply ONE authoritative version (from the required ps2dev:latest build, which now
          # resolves full git history) to all available flavours. The source commit is identical;
          # the toolchain-brand suffix records which of the four build environments produced it.
          VER="${ASSET_VERSION:-}"
          if [ -z "$VER" ]; then
            VER="rolling-${GITHUB_SHA}"
          fi
          echo "VERSIONED_BASE=RIPTOPL-${VER}" >> "$GITHUB_ENV"
          if [ -f rolling/RIPTOPL.ELF ]; then
            mv -f rolling/RIPTOPL.ELF "rolling/RIPTOPL-${VER}-PS2DEVROLLING.ELF"
          fi
          if [ -f rolling/RIPTOPL-PS2DEVPINNED.ELF ]; then
            mv -f rolling/RIPTOPL-PS2DEVPINNED.ELF "rolling/RIPTOPL-${VER}-PS2DEVPINNED.ELF"
          fi
          if [ -f rolling/RIPTOPL-OFFICIALROLLING.ELF ]; then
            mv -f rolling/RIPTOPL-OFFICIALROLLING.ELF "rolling/RIPTOPL-${VER}-OFFICIALROLLING.ELF"
          fi
          if [ -f rolling/RIPTOPL-OFFICIALPINNED.ELF ]; then
            mv -f rolling/RIPTOPL-OFFICIALPINNED.ELF "rolling/RIPTOPL-${VER}-OFFICIALPINNED.ELF"
          fi
          # DualSense (DS5) named loaders, one per SDK flavour (best-effort -- any may be absent).
          for sdk in PS2DEVPINNED PS2DEVROLLING OFFICIALPINNED OFFICIALROLLING; do
            if [ -f "rolling/RIPTOPL-${sdk}-ds5.ELF" ]; then
              mv -f "rolling/RIPTOPL-${sdk}-ds5.ELF" "rolling/RIPTOPL-${VER}-${sdk}-ds5.ELF"
            fi
          done
          echo "Renamed assets:"
          ls -la rolling

      - name: Stage the one-click RIPTOPL.ELF
        run: |
          set -eu
          # ONE stable, version-agnostic loader asset, so somebody who already has RiptOPL installed
          # can replace just the ELF without downloading and unpacking the whole package (requested
          # by eliminator1403, 2026-09-10). The name is deliberately RIPTOPL.ELF -- exactly the
          # filename it has to have on the card -- and it never changes, so the download URL
          #   .../releases/download/rolling/RIPTOPL.ELF
          # is permanent and can be linked or bookmarked.
          #
          # ONLY ONE of the four flavours can hold that name; publishing four would recreate the
          # "which do I pick" problem the single file exists to remove.
          #
          # SETTLED: OFFICIALROLLING, chosen by Nathan 2026-09-10 and reaffirmed the same day after
          # the objection was put to him -- that it is flavour #4, a MOVING tag which can build
          # green and not boot (issue #102), while every doc ranks PS2DEVPINNED first. It is his
          # call, it is documented honestly wherever the asset is described, and it is not to be
          # "corrected" to a pinned flavour. Moving it is this one line, nothing else.
          ONECLICK_FLAVOUR=OFFICIALROLLING
          SRC="rolling/${VERSIONED_BASE}-${ONECLICK_FLAVOUR}.ELF"
          # Landmine: build-rolling-ps2dev-latest stages its output as rolling/RIPTOPL.ELF and the
          # step above renames it to ...-PS2DEVROLLING.ELF. If that rename is ever moved or removed,
          # a PS2DEVROLLING binary would silently inherit the one-click name. Fail instead.
          if [ -f rolling/RIPTOPL.ELF ]; then
            echo "ERROR: rolling/RIPTOPL.ELF already exists before this step -- the PS2DEVROLLING" >&2
            echo "       rename must run first, or the one-click asset would be the wrong flavour." >&2
            exit 1
          fi
          if [ -f "$SRC" ]; then
            cp -f "$SRC" rolling/RIPTOPL.ELF
            echo "One-click loader: RIPTOPL.ELF == ${ONECLICK_FLAVOUR}"
          else
            # Best-effort, like the flavour it comes from. The publish step deletes every existing
            # asset before uploading, so a missing file this run simply means the release carries no
            # one-click ELF, rather than last run's binary lingering under a stable name.
            echo "WARN: ${ONECLICK_FLAVOUR} ELF missing this run; release ships without RIPTOPL.ELF" >&2
          fi
          echo "ONECLICK_FLAVOUR=${ONECLICK_FLAVOUR}" >> "$GITHUB_ENV"

      - name: Archive source snapshot
        run: |
          set -eu
          # Bundle the exact source that produced these ELFs so the rolling build
          # is self-preserving: a tester can always restore and rebuild this precise
          # commit later, even if history is rewritten or a branch disappears.
          # git archive snapshots only TRACKED files at HEAD (== the built commit);
          # generated files (e.g. the gitignored lang_autogen.h) are intentionally
          # excluded because the build regenerates them. The project has no
          # submodules, so HEAD is the complete source tree. --prefix gives a clean
          # top-level folder on extraction. --format=zip uses git's built-in zip
          # writer (no external tooling needed).
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --format=zip \
            --prefix="${VERSIONED_BASE}-src/" \
            -o "rolling/${VERSIONED_BASE}-src.zip" \
            HEAD
          echo "Source snapshot:"
          ls -la "rolling/${VERSIONED_BASE}-src.zip"

      - name: Check SAS PSU timestamps
        run: python3 .github/scripts/test_psu_timestamps.py

      - name: Build RIPTOPL release package
        run: |
          set -eu
          # Full installable package the user copies to a memory card / device:
          #   APPS/APP_RIPTOPL-PS2DEVPINNED/RIPTOPL.ELF   -- digest pin of ps2dev:latest; SAFE FALLBACK.
          #   APPS/APP_RIPTOPL-OFFICIALPINNED/RIPTOPL.ELF -- digest pin of the official ps2homebrew SDK.
          #   APPS/APP_RIPTOPL-PS2DEVROLLING/RIPTOPL.ELF  -- ps2dev:latest (bleeding-edge MOVING tag; may
          #                                                   not boot, issue #102).
          #   APPS/APP_RIPTOPL-OFFICIALROLLING/RIPTOPL.ELF -- official ps2homebrew:main moving canary.
          #   These four folders are complete alternate app folders beside APPS/APP_RIPTOPL/.
          #   POPS/                           -- POPSTARTER.ELF + every auto-installed MC external + loose BDMA
          #                                      variants (including iLink), plus "POPSTARTER VERSIONS/" holding the alternate
          #                                      POPSTARTER builds (MAIN, DEBUG, USBDELAY*) for users to swap
          #                                      in by hand. Copied wholesale, so the subfolder needs no rule
          #                                      of its own -- only the assertion below that it arrived.
          #
          #   There is deliberately NO POPSTARTER/ folder. It used to ship a second copy of nine files
          #   that POPS/ already carries, plus three templates from popsmb/ that did not belong there:
          #   OPL reads and writes IPCONFIG.DAT / SMBCONFIG.DAT under POPS\ (see vcdsupport.c), and
          #   bdma_config.txt is a marker OPL WRITES to record which BDMA variant it equipped -- the
          #   shipped copy said "fat32", so a fresh install claimed an equipped variant it did not have.
          #   EMBER/                          -- Ember, the second PS1 core (ember.elf + an empty games/).
          #                                      Ships WITHOUT a PS1 BIOS: bios.bin is copyrighted and
          #                                      user-supplied, and the placeholder filename in the folder
          #                                      says so. Peer of POPS/ -- both go to the device ROOT.
          #   neutrino/                       -- the pinned standard Neutrino core with UDPFS ACK repair, extracted for drag-and-drop.
          #   APPS/APP_RIPTOPL/               -- ready-to-install app, with artwork in ART/.
          #   APP_RIPTOPL.psu                 -- memory-card save containing only direct app files.
          #   PS2-Servers.url                 -- link to the UDPFS / SMB / UDPBD all-in-one PC server.
          #   android-udpfs-server.url        -- link to the Android UDPFS server (serve from a phone).
          #   OrbitPS2-Manager.url            -- link to the cross-platform PC library manager.
          #   OPL-PS1-AIO-Converter-GUI.url   -- link to the PS1/POPSTARTER preparation tool.
          #   PS2RD-CHT-Manager.url           -- link to the PS2RD cheat-file manager.
          PKG=riptopl_pkg
          rm -rf "$PKG"
          mkdir -p "$PKG/APPS" "$PKG/POPS" "$PKG/EMBER"
          case "$GITHUB_REF" in
            refs/tags/v*) RELEASE_CHANNEL=Tagged ;;
            *) RELEASE_CHANNEL=Rolling ;;
          esac
          stage_variant_app() {
            APP_NAME="$1"
            SOURCE_ELF="$2"
            FLAVOUR="$3"
            python3 .github/scripts/package_release_app.py stage \
              --package "$PKG" --source-elf "$SOURCE_ELF" \
              --app-name "$APP_NAME" --elf-name RIPTOPL.ELF \
              --title '[APP] Open PS2 Loader: RiptOPL' --pbt-title '[APP] RiptOPL' \
              --version "${ASSET_VERSION:-rolling}" --flavour "$FLAVOUR" \
              --channel "$RELEASE_CHANNEL" --description 'Open PS2 Loader for PS2 and PS3'
            # Variant PSUs are intentionally not release assets; only APPS/ contains these
            # alternate flavours. Staging still gives every folder icon.sys, *.icn,
            # title.cfg, APPINFO.PBT, bgm.ogg and validates that metadata before packaging.
            rm -f "$PKG/${APP_NAME}.psu"
          }
          # PS2DEVROLLING is the required-to-build flavour (its build job failing already fails
          # the workflow); the other three flavours are best-effort, each in its own labelled
          # APPS/ folder with the same metadata set as the selected installable app.
          LATEST_ELF="rolling/${VERSIONED_BASE}-PS2DEVROLLING.ELF"
          PINNED_ELF="rolling/${VERSIONED_BASE}-PS2DEVPINNED.ELF"
          if [ ! -f "$LATEST_ELF" ]; then
            echo "PS2DEVROLLING (ps2dev:latest) ELF missing -- its build job failing already fails the workflow" >&2
            exit 1
          fi
          stage_variant_app APP_RIPTOPL-PS2DEVROLLING "$LATEST_ELF" PS2DEVROLLING
          if [ -f "$PINNED_ELF" ]; then
            stage_variant_app APP_RIPTOPL-PS2DEVPINNED "$PINNED_ELF" PS2DEVPINNED
          else
            echo "WARN: pinned fallback build missing this run; package ships without APPS/APP_RIPTOPL-PS2DEVPINNED" >&2
          fi
          OFFICIALPIN_ELF="rolling/${VERSIONED_BASE}-OFFICIALPINNED.ELF"
          if [ -f "$OFFICIALPIN_ELF" ]; then
            stage_variant_app APP_RIPTOPL-OFFICIALPINNED "$OFFICIALPIN_ELF" OFFICIALPINNED
          else
            echo "WARN: official-pinned build missing this run; package ships without APPS/APP_RIPTOPL-OFFICIALPINNED" >&2
          fi
          OFFICIAL_ELF="rolling/${VERSIONED_BASE}-OFFICIALROLLING.ELF"
          if [ -f "$OFFICIAL_ELF" ]; then
            stage_variant_app APP_RIPTOPL-OFFICIALROLLING "$OFFICIAL_ELF" OFFICIALROLLING
          else
            echo "WARN: officialsdk build missing this run; package ships without APPS/APP_RIPTOPL-OFFICIALROLLING" >&2
          fi
          cp -rf POPS/. "$PKG/POPS/"
          # The supplied install-kit example adds POPStarter's cheats, IGR artwork, KELF and
          # Trojan beside the files already tracked in POPS/. Keep the iLink drivers in POPS/:
          # RiptOPL resolves that pair there, even though the example also has copies at its root.
          EXAMPLE=Example/APP_RIPTOPL-OFFICIALROLLING-VERSION.ZIP
          for f in CHEATS.TXT IGR_BG.TM2 IGR_NO.TM2 IGR_YES.TM2 POPSTARTER.KELF TROJAN_7.BIN; do
            test -s "$EXAMPLE/POPS/$f"
            cp -f "$EXAMPLE/POPS/$f" "$PKG/POPS/$f"
          done
          # Every POPSTARTER BDMA family is intentionally loose-file-only: none of these payloads is
          # embedded in RIPTOPL.ELF. Publishing an incomplete POPS/ stash would leave launch-time
          # preparation with no pair to copy from the device to mc?:/POPSTARTER/.
          for f in \
            usbd.irx.usbexfat usbhdfsd.irx.usbexfat \
            usbd.irx.mx4sio usbhdfsd.irx.mx4sio \
            usbd.irx.mmce usbhdfsd.irx.mmce \
            usbd.irx.ata usbhdfsd.irx.ata \
            usbd.irx.ilink usbhdfsd.irx.ilink \
            usbd.irx.udpfs usbhdfsd.irx.udpfs IPCONFIG.DAT UDPFSCONFIG.DAT; do
            if [ ! -s "$PKG/POPS/$f" ]; then
              echo "ERROR: POPS/$f missing or empty -- the release must contain every loose BDMA pair" >&2
              exit 1
            fi
          done
          # The alternate POPSTARTER builds ride along inside POPS/, so the copy above already has
          # them. Assert it anyway: `*.ELF` in .gitignore is one negation line away from swallowing
          # all five, and `git add` fails that way SILENTLY. Without this the package would ship an
          # empty "POPSTARTER VERSIONS" folder and nobody would notice until a user went looking.
          VERS="$PKG/POPS/POPSTARTER VERSIONS"
          for v in MAIN DEBUG USBDELAY USBDELAY_DEBUG USBDELAY_LONGER_DEBUG; do
            if [ ! -s "$VERS/$v/POPSTARTER.ELF" ]; then
              echo "ERROR: POPSTARTER VERSIONS/$v/POPSTARTER.ELF missing or empty -- check .gitignore" >&2
              exit 1
            fi
          done
          # Ember, the second PS1 core. Copied whole, like POPS/. Asserted rather than best-effort:
          # the loader lists Ember titles whenever a device has an EMBER/ folder, so shipping that
          # folder WITHOUT its ember.elf would hand users a library whose rows cannot launch.
          test -f EMBER/ember.elf
          # Ember's licence (LICENSE-BETA.txt, section 2) permits bundling ONLY IF the build ships
          # unmodified, complete and WITH THE LICENCE FILE, credited to Gageformer by name with a
          # link to the official release page. Shipping the ELF without the licence is not a
          # missing nicety, it is a breach of the terms that let us ship it at all -- so this is a
          # hard failure, exactly like the bios.bin guard below.
          test -f EMBER/LICENSE-BETA.txt
          cp -rf EMBER/. "$PKG/EMBER/"
          mkdir -p "$PKG/EMBER/games/Per-Game-Folder"
          cp -f "$EXAMPLE/EMBER/games/Per-Game-Folder/GAME FILES" "$PKG/EMBER/games/Per-Game-Folder/GAME FILES"
          if [ ! -s "$PKG/EMBER/LICENSE-BETA.txt" ]; then
            echo "ERROR: EMBER/LICENSE-BETA.txt did not reach the package -- bundling Ember without" >&2
            echo "       its licence breaches section 2(a) of that licence. Refusing to publish." >&2
            exit 1
          fi
          # The repository shortcut must accompany the bundled Ember build.
          test -s "$PKG/EMBER/Ember Official Webpage.url"
          grep -Fxq 'URL=https://github.com/Gageformer/Ember' <(tr -d '\r' < "$PKG/EMBER/Ember Official Webpage.url")
          # A PS1 BIOS is copyrighted and must never be redistributed. The folder ships with a
          # zero-byte file whose NAME tells the user to supply their own; guard against one ever
          # being committed by accident.
          if [ -e "$PKG/EMBER/bios.bin" ]; then
            echo "ERROR: EMBER/bios.bin is present -- a PS1 BIOS must never be redistributed" >&2
            exit 1
          fi
          # Keep PC-side servers in their dedicated release stream. The shortcut opens the maintained
          # PS2 Servers all-in-one launcher for UDPFS, SMBv1 and UDPBD; no server binaries or source are
          # embedded in the RiptOPL install package.
          test -f pc/PS2-Servers.url
          cp -f pc/PS2-Servers.url "$PKG/PS2-Servers.url"
          # udpfs-server: the same job from a phone rather than a PC -- an Android UDPFS server,
          # found by broadcast, built on pcm720's udpfsd. Shipped as a shortcut for the same reason
          # as the rest: link the maintained tool, never vendor a copy of it.
          test -f pc/udpfs-server.url
          cp -f pc/udpfs-server.url "$PKG/android-udpfs-server.url"
          # OrbitPS2 Manager: the PC-side library manager (import discs, fetch covers/screenshots,
          # ZSO compression, per-game settings, VMC management). Shipped as a shortcut for the same
          # reason as PS2-Servers -- link the maintained tool, never vendor a copy of it.
          test -f pc/OrbitPS2-Manager.url
          cp -f pc/OrbitPS2-Manager.url "$PKG/OrbitPS2-Manager.url"
          # The PS1 converter and PS2RD cheat manager are external companion repositories too.
          # Ship shortcuts for them alongside the other PC-side tools, never their binaries/source.
          test -f pc/OPL-PS1-AIO-Converter-GUI.url
          cp -f pc/OPL-PS1-AIO-Converter-GUI.url "$PKG/OPL-PS1-AIO-Converter-GUI.url"
          test -f pc/PS2RD-CHT-Manager.url
          cp -f pc/PS2RD-CHT-Manager.url "$PKG/PS2RD-CHT-Manager.url"
          # Standard runtime is pinned to the upstream base plus the UDPFS stale-ACK repair.
          # Never silently replace it with an unreviewed upstream archive at publish time.
          SEVENZ="$(command -v 7z || command -v 7za || true)"
          if [ -z "$SEVENZ" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full && SEVENZ="$(command -v 7z || command -v 7za)"; fi
          python3 .github/scripts/package_standard_neutrino.py \
            --destination "$PKG/neutrino" --sevenzip "$SEVENZ"
          NEUTRINO_VER="$(python3 -c 'import json; print(json.load(open("third_party/neutrino/release.json"))["version"])')"
          echo "NEUTRINO_VER=${NEUTRINO_VER}" >> "$GITHUB_ENV"
          INSTALL_ELF="$OFFICIAL_ELF"
          INSTALL_FLAVOUR=OFFICIALROLLING
          if [ ! -s "$INSTALL_ELF" ]; then
            for flavour in PS2DEVPINNED OFFICIALPINNED PS2DEVROLLING; do
              candidate="rolling/${VERSIONED_BASE}-${flavour}.ELF"
              if [ -s "$candidate" ]; then
                INSTALL_ELF="$candidate"
                INSTALL_FLAVOUR="$flavour"
                break
              fi
            done
          fi
          # OFFICIALROLLING is the selected one-click flavour when present. Use a named build
          # fallback only if it was unavailable; never put the zero-byte example ELF into a ZIP.
          python3 .github/scripts/package_release_app.py stage \
            --package "$PKG" --source-elf "$INSTALL_ELF" \
            --app-name APP_RIPTOPL --elf-name RIPTOPL.ELF \
            --title '[APP] Open PS2 Loader: RiptOPL' --pbt-title '[APP] RiptOPL' \
            --version "${ASSET_VERSION:-rolling}" --flavour "$INSTALL_FLAVOUR" \
            --channel "$RELEASE_CHANNEL" --description 'Open PS2 Loader for PS2 and PS3'
          # Read the deterministic PSU with techwritescode's preserved PSUManager core,
          # then compare every direct app file before the archive is published.
          g++ -std=c++17 -O2 .github/scripts/verify_psu_with_psumanager.cpp \
            third_party/PSUManager/src/core/PsuArchive.cpp \
            third_party/PSUManager/src/core/PsuDate.cpp \
            -o "$RUNNER_TEMP/verify-psu"
          "$RUNNER_TEMP/verify-psu" "$PKG/APP_RIPTOPL.psu" "$PKG/APPS/APP_RIPTOPL"
          cp -f "$PKG/APP_RIPTOPL.psu" rolling/APP_RIPTOPL.psu
          echo "Published standalone PSU: APP_RIPTOPL.psu"
          echo "INSTALL_FLAVOUR=${INSTALL_FLAVOUR}" >> "$GITHUB_ENV"
          REL="${ASSET_VERSION:-rolling}"
          # Just the version: the release is replaced on every publish (every old asset is deleted
          # first), and the version's revision number changes whenever the code does, so no hash
          # suffix is needed to keep the name unique.
          ZIP="RIPTOPL-${REL}.zip"
          (
            cd "$PKG"
            zip -r -X "../rolling/${ZIP}" APPS ART APP_RIPTOPL.psu POPS EMBER neutrino PS2-Servers.url android-udpfs-server.url OrbitPS2-Manager.url OPL-PS1-AIO-Converter-GUI.url PS2RD-CHT-Manager.url >/dev/null
          )
          echo "Built rolling/${ZIP}:"
          unzip -l "rolling/${ZIP}"
          python3 .github/scripts/package_release_app.py verify \
            --zip "rolling/${ZIP}" --source-elf "$INSTALL_ELF" \
            --app-name APP_RIPTOPL --elf-name RIPTOPL.ELF
          if ! unzip -p "rolling/${ZIP}" neutrino/config/bsd-udpfsbd.toml | cmp -s neutrino/bsd-udpfsbd.toml -; then
            echo "ERROR: final RIPTOPL package is missing or changed neutrino/config/bsd-udpfsbd.toml." >&2
            exit 1
          fi

      # RA consumes this immutable run artifact, never a floating release ZIP.
      # Its own workflow builds and publishes both themes independently.
      - name: Record standard kit provenance for the RA workflow
        continue-on-error: true
        run: |
          mkdir -p ra-shared-input
          cp "rolling/RIPTOPL-${ASSET_VERSION}.zip" ra-shared-input/standard.zip
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          kit = Path("ra-shared-input/standard.zip")
          Path("ra-shared-input/INPUT.json").write_text(json.dumps({
              "revision": os.environ["GITHUB_SHA"],
              "version": os.environ["ASSET_VERSION"],
              "sha256": hashlib.sha256(kit.read_bytes()).hexdigest(),
          }, indent=2) + "\n")
          PYCODE
      - name: Preserve shared kit for the independent RA release
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: standard-release-kit
          path: ra-shared-input/
          if-no-files-found: error
          retention-days: 30

      - name: Compute SHA256 checksums
        run: |
          set -eu
          # Run only after the standard standalone ELF and PSU have been staged, so the
          # permanent archive manifest covers every independently downloadable binary/install file
          # as well as the exact source snapshot. release-normalize.yml later removes the floating
          # checksum file from the public GitHub asset list.
          cd rolling
          : > SHA256SUMS.txt
          for f in *.ELF *.psu *-src.zip; do
            if [ -f "$f" ]; then sha256sum "$f" >> SHA256SUMS.txt; fi
          done
          echo "SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Pack RIPTOPL VARIANTS + DEBUG zips
        run: |
          set -eu
          # The EXTRA_FEATURES x PADEMU x DUALSENSE variants and debug builds for the two ps2dev
          # flavours (-PS2DEVROLLING and -PS2DEVPINNED) become two separate release zips. Remove the
          # loose dirs afterward so the final 'gh release upload rolling/*' stays file-only.
          REL="${ASSET_VERSION:-rolling}"
          for kind in variants debug; do
            up="$(echo "$kind" | tr '[:lower:]' '[:upper:]')"
            if [ -d "rolling/$kind" ] && [ -n "$(ls -A "rolling/$kind" 2>/dev/null)" ]; then
              ZN="RIPTOPL-${up}-${REL}.zip"
              (cd "rolling/$kind" && zip -r -X "../${ZN}" . >/dev/null)
              echo "Packed rolling/${ZN}:"
              unzip -l "rolling/${ZN}"
            else
              echo "No $kind builds present; skipping RIPTOPL ${up} zip."
            fi
            rm -rf "rolling/$kind" 2>/dev/null || true
          done

      - name: Build release notes
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then REL_TAG="${GITHUB_REF_NAME}"; else REL_TAG="$ROLLING_TAG"; fi
          python3 .github/scripts/test_release_notes.py
          python3 .github/scripts/normalize_release_notes.py \
            --assets-dir rolling --tag "$REL_TAG" --revision "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" --server "$GITHUB_SERVER_URL" \
            --version "$OPL_VERSION" --neutrino-version "$NEUTRINO_VER" > notes.md
          cat notes.md

      - name: Publish (rolling on the publishing branch, curated release on a v* tag)
        run: |
          set -eu
          # The ref decides the publish target: a v* tag cuts the curated per-version release
          # (full, unless an -rc pre-release); a publishing-branch push updates the single
          # rolling channel. Either path publishes the SAME staged asset set, so packaging
          # can never diverge again.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"; TITLE="${GITHUB_REF_NAME}"; TARGET=""
            # The moving rolling channel intentionally owns GitHub's Latest marker. Curated tags
            # remain directly addressable without displacing it; only -rc tags are pre-releases.
            case "${GITHUB_REF}" in
              *-rc*) RELEASE_FLAGS="--prerelease --latest=false";;
              *) RELEASE_FLAGS="--prerelease=false --latest=false";;
            esac
          else
            TAG="$ROLLING_TAG"; TITLE="$ROLLING_TITLE"; RELEASE_FLAGS="--prerelease=false $ROLLING_LATEST"; TARGET="--target $GITHUB_SHA"
          fi
          # GitHub's release API returns the odd transient HTTP 500, so every call that changes the
          # release is retried, as release-normalize.yml does (#783). Failures go to stderr, so a
          # retried read still captures only its output.
          retry() { for n in 1 2 3 4; do "$@" && return 0; echo "Attempt $n failed: $*" >&2; sleep $((n * 15)); done; return 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release: $TAG"
            # UPLOAD FIRST, then remove only the assets this run did not replace. This used to delete
            # every asset up front: on 2026-10-06 GitHub answered HTTP 500 between those deletes and
            # the upload, and the public release sat for hours without RIPTOPL.ELF, APP_RIPTOPL.psu
            # and the DEBUG and VARIANTS packages. Now the old files stay until the new set is up, and
            # a failure still fails the step, so Normalize does not run on it. Names are read one per
            # line, because an asset name may contain spaces.
            OLD_ASSETS=$(retry gh release view "$TAG" --json assets --jq '.assets[].name')
            # --clobber deletes a same-name asset just before uploading its replacement, so an upload
            # that never succeeds could still drop a fixed-name download such as RIPTOPL.ELF. Keep a
            # copy of every asset this run replaces, and put back any that went missing before failing.
            rm -rf replaced && mkdir replaced
            while IFS= read -r asset; do
              if [ -n "$asset" ] && [ -e "rolling/$asset" ]; then
                retry gh release download "$TAG" --pattern "$asset" --dir replaced --clobber </dev/null
              fi
            done <<< "$OLD_ASSETS"
            if ! retry gh release upload "$TAG" rolling/* --clobber; then
              NOW=$(retry gh release view "$TAG" --json assets --jq '.assets[].name' || true)
              for f in replaced/*; do
                [ -e "$f" ] || continue
                if ! grep -qxF "$(basename "$f")" <<< "$NOW"; then
                  echo "Restoring the previous $(basename "$f"), which the failed upload removed" >&2
                  retry gh release upload "$TAG" "$f" </dev/null || true
                fi
              done
              echo "ERROR: the release upload kept failing; the previous downloads were kept" >&2
              exit 1
            fi
            retry gh release edit "$TAG" --title "$TITLE" --notes-file notes.md $RELEASE_FLAGS
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              [ -e "rolling/$asset" ] && continue # same name: --clobber already replaced it
              echo "Deleting stale asset: $asset"
              retry gh release delete-asset "$TAG" "$asset" --yes </dev/null
            done <<< "$OLD_ASSETS"
            # REFRESH THE ROLLING RELEASE DATE. `gh release edit` updates the body and the assets
            # but never touches published_at, which is what GitHub renders as the relative time --
            # so a package rebuilt today sat under "last month" and read as abandoned. Recreating
            # the release would fix the date but reset the download counters, so it is moved in
            # place.
            #
            # ROLLING ONLY. A refs/tags/v* run reaches this same branch for an existing release, and
            # a stable release must keep the date it was actually published -- rewriting that would
            # be a lie about history, not a cosmetic fix.
            #
            # WHY A DRAFT FLIP. PATCHing published_at does not work: GitHub accepts the request,
            # returns 200, and silently ignores the field -- measured 2026-09-02 against this very
            # release, where the before and after reads were byte-identical. It is not in the
            # documented body for "Update a release", so there is no error to catch and the previous
            # implementation could only ever log that it had failed. The one documented way to move
            # published_at is a draft -> published transition.
            #
            # WHY THE OLD OBJECTION TO THAT FLIP DID NOT HOLD. It was refused because the flip emits
            # a `release: published` event and release-normalize.yml subscribes to that event, which
            # read like a re-entrant normalize of the release still being published. It is not:
            # GitHub does not start a workflow run from an event raised with GITHUB_TOKEN, and that
            # is the only token this job holds. Confirmed against history as well as the docs --
            # every one of the last 30 release-normalize runs was triggered by workflow_run and not
            # one by a release event, over a window that includes the run which CREATED this release
            # (a genuine publish that would have fired the event if it could).
            #
            # A HIDDEN ROLLING RELEASE IS WORSE THAN A STALE DATE, so the flip is bounded twice: a
            # trap republishes if anything between the two edits dies, and the state is asserted
            # afterwards -- still-draft fails the job loudly rather than leaving users with an
            # invisible download page. promote-rolling-latest.yml re-asserts it again after this
            # workflow finishes.
            if [ "$TAG" = "$ROLLING_TAG" ] && [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
              RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id 2>/dev/null || echo "")
              if [ -n "$RELEASE_ID" ]; then
                # Compare against the value BEFORE the flip, not against today's date. A rolling
                # release republished twice in one day already carries today's date, so a
                # date-only test would report success for a flip that did nothing.
                WAS=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .published_at 2>/dev/null || echo "")
                # set -eu is active in this step, so a failed draft=true aborts the script: this
                # trap is what puts the channel back. INT/TERM are covered too, because a cancelled
                # job does not run a bare EXIT trap.
                trap 'gh release edit "$TAG" --draft=false --prerelease=false $ROLLING_LATEST >/dev/null 2>&1 || true' EXIT INT TERM
                gh release edit "$TAG" --draft=true >/dev/null
                # Re-assert the channel's intended state on the way back up: a draft cannot hold the
                # Latest marker, so it has to be claimed again as part of republishing.
                gh release edit "$TAG" --draft=false --prerelease=false $ROLLING_LATEST >/dev/null
                trap - EXIT INT TERM
                GOT=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .published_at 2>/dev/null || echo "")
                # Only a comparison between two SUCCESSFUL reads proves anything. A failed read
                # leaves its variable empty, and empty-vs-anything would otherwise look like a
                # change and log a success the flip never earned.
                if [ -z "$WAS" ] || [ -z "$GOT" ]; then
                  echo "NOTE: could not read published_at back (before='$WAS' after='$GOT'); date refresh unverified"
                elif [ "$GOT" != "$WAS" ]; then
                  echo "Release date refreshed: $WAS -> $GOT"
                else
                  echo "NOTE: published_at did not move (still '$WAS'); the release date will read stale"
                fi
                # Visibility is not optional. Check it independently of whether the date moved.
                DRAFT=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .draft 2>/dev/null || echo "")
                if [ "$DRAFT" = "true" ]; then
                  echo "WARNING: rolling is still a draft after the refresh; republishing" >&2
                  gh release edit "$TAG" --draft=false --prerelease=false $ROLLING_LATEST >/dev/null 2>&1 || true
                  DRAFT=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .draft 2>/dev/null || echo "")
                fi
                if [ "$DRAFT" = "true" ]; then
                  echo "ERROR: rolling release is a DRAFT and could not be republished -- it is invisible to users" >&2
                  exit 1
                fi
              fi
            fi
          else
            echo "Creating release: $TAG"
            gh release create "$TAG" rolling/* \
              --title "$TITLE" \
              --notes-file notes.md \
              $RELEASE_FLAGS \
              $TARGET
          fi
          # The tag must follow the publish, on BOTH paths: `gh release edit/upload` never
          # re-targets it, and `gh release create` REUSES an existing tag as-is (a stale
          # leftover tag outranks --target). Without this the tag drifts from the assets
          # forever -- the same tag-vs-assets mismatch the stale June tag caused, found
          # live on the 2026-08-13 republish one tip behind. Rolling only: a v* tag is the
          # pushed ref itself and must never move.
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "Re-targeting tag $TAG -> $GITHUB_SHA"
            gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -X PATCH -f sha="$GITHUB_SHA" -F force=true >/dev/null
          fi

      # --- MEGA archival (publishing-branch rolling builds only) -------------------------------
      # The GitHub 'rolling' release above keeps OVERWRITING the latest build. To keep a PERMANENT
      # record, every rolling build is ALSO archived to MEGA as ONE immutable, self-contained
      # zip of the entire release payload. Runs AFTER Publish so the GitHub release is completely
      # unchanged and a MEGA hiccup can never block or alter it -- MEGA is purely additive. Gated to
      # the publishing branch (rebuild/main) + secrets present, so v* tag cuts and secret-less
      # forks skip it cleanly. master was dropped 2026-09-02 along with its publish trigger: the
      # old lineage must not archive over the new one's history either.
      - name: Build all-in-one MEGA archive
        if: (github.ref == 'refs/heads/rebuild/main' || github.ref == 'refs/heads/test/korium-audit-remediation') && env.USERNAME != '' && env.PASSWORD != ''
        run: |
          set -eu
          # Validate the payload BEFORE archiving so a broken publish fails loudly instead of pushing
          # a half-empty "permanent" archive to MEGA.
          if [ ! -d rolling ] || [ -z "$(ls -A rolling 2>/dev/null)" ]; then
            echo "rolling/ is empty -- refusing to build a MEGA archive" >&2
            exit 1
          fi
          if ! ls rolling/*-src.zip >/dev/null 2>&1; then
            echo "No *-src.zip source snapshot in rolling/ -- refusing to archive an incomplete payload" >&2
            exit 1
          fi

          VER="${OPL_VERSION:-rolling}"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          ARCHIVE="RIPTOPL-ROLLING-${VER}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}.zip"

          # Build the archive OUTSIDE rolling/ (requirement): if it lived in rolling/ it could zip
          # itself and, worse, be swept into the GitHub release by `gh release upload rolling/*`.
          #
          # Archive the INSTALLABLE + REPRODUCIBLE payload only. The two big diagnostic BUNDLES are
          # deliberately EXCLUDED from the permanent MEGA copy:
          #   RIPTOPL-VARIANTS-*.zip  (~120 MB -- every PADEMU x EXTRA_FEATURES x DUALSENSE combo, two ps2dev flavours)
          #   RIPTOPL-DEBUG-*.zip     (~91 MB  -- iopcore/ingame/eesio/ppctty/DTL debug builds, two ps2dev flavours)
          # RIPTOPL-RetroAchievements-*.zip is NOT in that exclusion: it is an installable package (loader + POPS +
          # EMBER + neutrino + shortcuts), the same shape as the main zip, so it is archived like one.
          # They dominate the size (~10x: ~233 MB -> ~22 MB), they still ship on the GitHub rolling
          # release for the CURRENT build, and a *permanent* per-build archive is for restoring or
          # rebuilding an installable build -- not for old diagnostic permutations (when you debug,
          # it is almost always the current build). Everything a restorer needs is kept: the
          # installable package zip, the bare loader ELFs, the source snapshot, SHA256SUMS.txt, the
          # IRX manifests and the language pack.
          rm -rf mega-out
          mkdir -p mega-out
          MEGA_FILES=""
          for f in rolling/*; do
            b="$(basename "$f")"
            case "$b" in
              RIPTOPL-VARIANTS-*.zip|RIPTOPL-DEBUG-*.zip)
                echo "MEGA archive: excluding diagnostic bundle $b" ;;
              RIPTOPL.ELF)
                # Byte-identical to the versioned <base>-<flavour>.ELF already in this archive --
                # it exists only to give the GitHub release a stable filename. The permanent copy
                # keeps the versioned name, which is the one a restorer can identify.
                echo "MEGA archive: excluding $b (duplicate of the versioned flavour ELF)" ;;
              *)
                MEGA_FILES="$MEGA_FILES $b" ;;
            esac
          done
          ( cd rolling && zip -r -X "../mega-out/${ARCHIVE}" $MEGA_FILES >/dev/null )

          # Copy the regular standalone ELFs in all 4 flavours so they are available
          # directly in the MEGA folder alongside the all-in-one archive.
          for elf in "rolling/${VERSIONED_BASE}-PS2DEVROLLING.ELF" \
                     "rolling/${VERSIONED_BASE}-PS2DEVPINNED.ELF" \
                     "rolling/${VERSIONED_BASE}-OFFICIALROLLING.ELF" \
                     "rolling/${VERSIONED_BASE}-OFFICIALPINNED.ELF"; do
            if [ -f "$elf" ]; then
              cp -f "$elf" mega-out/
            fi
          done

          MEGA_UPLOAD_FILES="mega-out/${ARCHIVE}"
          for f in mega-out/*.ELF; do
            if [ -f "$f" ]; then
              MEGA_UPLOAD_FILES="$MEGA_UPLOAD_FILES $f"
            fi
          done
          echo "MEGA_UPLOAD_FILES=${MEGA_UPLOAD_FILES}" >> "$GITHUB_ENV"

          # Suggested layout: /RiptOPL/Rolling/<version>/run_<run number>/ -- run number keeps every
          # build in its own immutable folder (nothing is ever overwritten on MEGA).
          echo "MEGA_REMOTE_DIR=/RiptOPL/Rolling/${VER}/run_${GITHUB_RUN_NUMBER}/" >> "$GITHUB_ENV"

          echo "== MEGA archive contents =="
          unzip -l "mega-out/${ARCHIVE}"
          echo "== MEGA archive SHA256 =="
          sha256sum "mega-out/${ARCHIVE}" | tee "mega-out/${ARCHIVE}.sha256"
          echo "== MEGA staged files for upload =="
          ls -la mega-out

      - name: Upload archive and regular ELFs in all 4 flavours to MEGA
        if: (github.ref == 'refs/heads/rebuild/main' || github.ref == 'refs/heads/test/korium-audit-remediation') && env.USERNAME != '' && env.PASSWORD != ''
        # The release is already published above; this archive is a mirror. It normally takes seconds,
        # but on 2026-10-13 it hung for 40+ minutes with no limit, and because Normalize Release Assets
        # and the RA release wait for this whole run to SUCCEED, both rolling releases sat with their raw
        # unpacked asset set. Bounded, and a MEGA failure no longer fails the release run.
        timeout-minutes: 10
        continue-on-error: true
        # Pinned to a full commit SHA rather than @master: this third-party action runs with the
        # MEGA credentials, so freeze it to a reviewed snapshot instead of trusting whatever is on
        # its master branch at build time. bf698c6 == the action's v1.4.0 release == the master HEAD
        # validated for this change, so behavior is identical. Bump deliberately (re-review first).
        uses: Difegue/action-megacmd@bf698c68edaf91143b2a52d3468595202011bf17 # v1.4.0
        with:
          # Runs `mega-put -c <files...> <remotedir>/`: -c creates the remote folder path if missing,
          # the trailing slash puts the files INTO that folder. Uploads the all-in-one zip archive
          # and the regular ELFs for all four SDK flavours. Credentials come from the job-level
          # USERNAME/PASSWORD env, which this action reads by those exact names.
          args: put -c ${{ env.MEGA_UPLOAD_FILES }} ${{ env.MEGA_REMOTE_DIR }}

  # Normalize Release Assets normally follows this workflow through `workflow_run`. That event is not raised
  # for a run that a workflow itself started with GITHUB_TOKEN -- which is how korium-sync.yml starts every
  # Korium build -- so the first rolling-korium release was left with its raw 24-asset set. Start it
  # directly in that one case; a person's push or dispatch still gets the workflow_run pass.
  #
  # A job of its own so `actions: write` never reaches publish-rolling, which holds the MEGA credentials and
  # runs a third-party action (CodeRabbit #812). It follows publish-rolling but must not depend on the MEGA
  # archive succeeding, hence !cancelled(); the release tag having moved to this run's commit is the proof
  # that the publish itself completed.
  normalize-workflow-published:
    needs: publish-rolling
    if: ${{ !cancelled() && github.actor == 'github-actions[bot]' && (github.ref == 'refs/heads/rebuild/main' || github.ref == 'refs/heads/test/korium-audit-remediation') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      ROLLING_TAG: ${{ github.ref == 'refs/heads/test/korium-audit-remediation' && 'rolling-korium' || 'rolling' }}
    steps:
      - name: Normalize the release this run published
        run: |
          set -eu
          AT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$ROLLING_TAG" --jq .object.sha 2>/dev/null || echo none)
          if [ "$AT" != "$GITHUB_SHA" ]; then
            echo "$ROLLING_TAG is at ${AT:0:8}, not this run's ${GITHUB_SHA:0:8}: nothing was published, nothing to normalize."
            exit 0
          fi
          gh workflow run release-normalize.yml --repo "$GITHUB_REPOSITORY" --ref rebuild/main -f tag="$ROLLING_TAG"
          echo "Dispatched Normalize Release Assets for $ROLLING_TAG."

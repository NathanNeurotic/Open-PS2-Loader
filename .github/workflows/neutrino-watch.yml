name: Neutrino Watch

# Watches upstream without silently removing the standard runtime's UDPFS repair.
# A changed upstream asset requires a reviewed pin update. Once the pin changes,
# this workflow can refresh a rolling package whose recorded build is older.

on:
  schedule:
    # ~Every 10 days. cron has no "every N days" operator that spans month boundaries, so pin the
    # days explicitly: the 1st, 11th and 21st (gaps of 10, 10, then 8-11 into the next month).
    # Deliberately NOT "*/10" for day-of-month -- that also fires on the 31st, one day after the
    # 21st+10 tick, i.e. two runs back to back in the 7 long months.
    # Off-hour + offset minute to dodge the top-of-hour cron backlog.
    - cron: "41 5 1,11,21 * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write # required to dispatch rolling-release.yml

concurrency:
  group: neutrino-watch
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEUTRINO_REPO: rickgaiser/neutrino
    steps:
      - uses: actions/checkout@v4
      - name: Check upstream and the reviewed standard runtime pin
        run: |
          set -eu
          PIN="third_party/neutrino/release.json"
          EXPECTED="$(python3 -c 'import json; print(json.load(open("third_party/neutrino/release.json"))["upstream_asset"])')"
          NEU="$(python3 -c 'import json; print(json.load(open("third_party/neutrino/release.json"))["version"])')"
          UPSTREAM="$(gh release view latest --repo "$NEUTRINO_REPO" --json assets \
            --jq '.assets[].name' | grep -E '^neutrino_.*\.7z$' | head -n1)"
          if [ "$UPSTREAM" != "$EXPECTED" ]; then
            echo "Upstream Neutrino changed: $EXPECTED -> $UPSTREAM. Review the UDPFS repair before updating $PIN." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Currently bundled: parsed from our rolling release notes (rolling-release.yml writes
          # "Included build: <ver> -- ...").
          CUR="$(gh release view rolling --repo "$GITHUB_REPOSITORY" --json body \
            --jq '.body' 2>/dev/null | sed -n 's/.*Included build: \([^ ]*\).*/\1/p' | head -n1 || true)"
          echo "reviewed Neutrino = [$NEU]"
          echo "rolling bundles   = [$CUR]"

          # Act ONLY on a genuine version difference. If CUR is empty -- rolling has never bundled
          # Neutrino yet, OR an older rolling build wrote no
          # "Included build:" line -- do NOT dispatch: otherwise a persistent upstream outage would
          # re-trigger a full (expensive) rebuild on every cron tick. That state self-heals on the
          # next push to master (rolling-release stages the reviewed pin) or a manual rolling dispatch.
          if [ -z "$CUR" ]; then
            echo "Rolling has no recorded bundled Neutrino version; deferring to the next push-to-master rebuild."
          elif [ "$NEU" != "$CUR" ]; then
            echo "Reviewed Neutrino pin changed ($CUR -> $NEU): dispatching rolling-release.yml to rebundle."
            gh workflow run rolling-release.yml --repo "$GITHUB_REPOSITORY" --ref rebuild/main
          else
            echo "Rolling already bundles the reviewed Neutrino ($NEU). Nothing to do."
          fi

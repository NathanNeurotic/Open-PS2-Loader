name: Profile ELF footprint

on:
  push:
    branches:
      - test/korium-audit-remediation
    paths:
      - .github/workflows/profile-elf-footprint.yml

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    steps:
      - name: Install host dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq bash make git zip unzip python3 python3-yaml gawk binutils || true

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install menu-coherent mmceman
        run: sh .github/scripts/install_coherent_mmce.sh

      - name: Build OFFICIALROLLING unstripped + packed
        run: make clean && make LOCALVERSION=PROFILE OPLDIAG=0 RETROACHIEVEMENTS=0 release

      - name: Report ELF and object footprint
        shell: bash
        run: |
          set -euo pipefail
          echo "=== FILE SIZES ==="
          stat -c '%n %s' opl.elf opl_stripped.elf RIPTOPL.ELF || true

          echo "=== ELF SECTIONS ==="
          mips64r5900el-ps2-elf-size -A opl.elf | sort -k2 -nr | head -40 || true

          echo "=== TOP SYMBOLS ==="
          mips64r5900el-ps2-elf-nm -S --size-sort --radix=d opl.elf 2>/dev/null | tail -120 | tac || true

          echo "=== TOP OBJECT FILES ==="
          find obj -maxdepth 1 -type f -name '*.o' -printf '%s %p\n' | sort -nr | head -160

          echo "=== EMBEDDED RESOURCE SOURCE SIZES ==="
          {
            find gfx audio misc thirdparty -maxdepth 2 -type f               \( -name '*.png' -o -name '*.adp' -o -name '*.ttf' -o -name '*.icn' -o -name '*.sys' -o -name '*.cfg' \)               -printf '%s %p\n'
          } | sort -nr | head -180

          echo "=== STATIC ARRAY / STRING HEAVY SOURCE OBJECTS ==="
          for o in obj/*.o; do
            n=$(mips64r5900el-ps2-elf-size "$o" 2>/dev/null | awk 'NR==2 {print $1+$2+$3}')
            [ -n "$n" ] && printf '%10d %s\n' "$n" "$o"
          done | sort -nr | head -120

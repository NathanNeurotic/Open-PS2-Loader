  HINT_EMBER_DISPLAY: "Mode de sortie utilisé par Ember pour les jeux PS1. 240p ou 480p est écrit dans settings.txt du dossier EMBER du périphérique lancé. Par défaut supprime ce réglage, ainsi que le fichier s'il ne contenait rien d'autre."
  LOGOART: "Logos des jeux"
  HINT_LOGOART: "Affiche le logo du jeu (<ID>_LGO) si le thème l'utilise. Le désactiver masque aussi l'image par défaut, sans changer les jaquettes, disques ni arrière-plans."

# Reviewed additions from the 2026-10 language audit (verify on console).
  CFG_TITLES: "Afficher les titres des CFG dans les listes de jeux"
  HINT_CFG_TITLES: "Affiche le titre du CFG de chaque jeu à la place du nom de fichier et trie selon ce titre. Lit tous les CFG à chaque actualisation, ce qui ralentit le chargement des listes. Affichage uniquement."
  AUTO_VMC_INVALID: "Le fichier VMC de ce jeu existe, mais ce n'est pas une carte mémoire valide : il n'a été ni utilisé ni remplacé. Le jeu démarre sans lui ; vérifiez-le dans le menu VMC."
  AUTO_VMC_STILL_RUNNING: "La VMC de ce jeu est encore en cours de création. Relancez le jeu dans un instant."
  NEUTRINO_DVR_QUICKBOOT: "Le lancement DVR nécessite la transition en mode PSX. Retirez -qb des arguments Neutrino globaux et par jeu."
  NEUTRINO_DVR_FILE_MISSING: "L'installation de Neutrino pour DVR est incomplète. Fichier requis manquant :"
  PARENLOCK_GAME: "Contrôle parental"
  PARENLOCK_GAME_HINT: "Exiger le mot de passe du contrôle parental pour lancer ce jeu."
  PARENLOCK_GAME_NO_PASSWORD: "Définissez un mot de passe de contrôle parental, sinon ce jeu ne sera pas verrouillé."
  HINT_ENABLE_PCCF: "CompactFlash PC CARD expérimentale pour les premières PS2 japonaises. Jeux PS2 natifs uniquement ; CF nécessite un accès exclusif au PC CARD. Redémarrez pour le libérer."
  PCCF_GAMES: "Jeux PC CARD CF"
  PCCF_UNAVAILABLE: "CF indisponible : nécessite une ancienne PS2 japonaise avec PC CARD, une carte compatible et aucun pilote DEV9/HDD/réseau actif."
  PCCF_UNSUPPORTED_GAME: "CF ne prend actuellement en charge que les jeux PS2 natifs. VMC sur CF, jeux PS1 et succès en réseau sont indisponibles."
  HINT_ENABLE_DVR: "Détection expérimentale des ISO du DESR DVR. La source HDD doit être activée ; le lancement nécessite une version externe de Neutrino compatible DVR."
  NEUTRINO_DVR_BACKEND_OVERRIDE: "Le lancement DVR choisit son propre backend. Retirez -bsd= et -bsdfs= des arguments Neutrino globaux et par jeu."
  ERR_VMC_LBA_RANGE_CONTINUE: "La VMC %s dépasse la plage d'adressage disque prise en charge par le cœur natif. Continuer avec la carte mémoire physique du port %d ?"
  ERR_VMC_LAYOUT_CONTINUE: "Impossible de vérifier l'organisation de la VMC %s sur le disque. Continuer avec la carte mémoire physique du port %d ?"
  ERR_VMC_PFS_LIMIT_CONTINUE: "La VMC %s dépasse la limite de mappage PFS du cœur natif. Continuer avec la carte mémoire physique du port %d ?"
  NEUTRINO_VMC_FRAG_BUDGET_CONTINUE: "Le jeu et les fichiers VMC utilisent %d/%d fragments, dépassant la limite partagée de Neutrino. Ignorer la VMC %s et utiliser la carte mémoire physique du port %d ?"
  VMC_PFS_LIMIT_ON_CREATE: "La VMC a été créée, mais le HDD l'a stockée en trop de fragments pour le mappage du cœur natif. Elle sera ignorée au lancement et la carte réelle utilisée. Libérez de l'espace sur la partition OPL et recréez-la."

# Supplemental RiptOPL-label translations adapted from RIPPS2 (Akilluminati47):
# https://github.com/akilluminati47/RIPPS2/tree/main/elf/lang
# Review translated UI text on real hardware; upstream translations retain priority.
  HINT_NEUTRINO_AUTO_ELF: Transmet l'ELF de démarrage du jeu à Neutrino pour chercher sa configuration par titre. Activé par défaut ; une option Boot ELF réglée à la main a la priorité.
  HINT_POPSTARTER_PATH: Emplacement de POPSTARTER.ELF. Laissé vide, RIPPS2 en renseigne un qu'il trouve sur un périphérique ; écrivez par-dessus pour en utiliser un autre, comme usb:/POPS/POPSTARTER.ELF
  NEUTRINO_ARGS_TOO_LONG: Les arguments de Neutrino dépassent la longueur enregistrable. Raccourcissez un champ avant d'enregistrer.
  NEUTRINO_LAUNCH_ARGS_OVERFLOW: Les arguments de lancement de Neutrino dépassent la limite sûre. Raccourcissez les arguments globaux ou ceux du jeu.
  NEUTRINO_AUTO_ELF: Boot ELF automatique (-elf)
  HINT_NEUTRINO_PATH: 'Où se trouve neutrino.elf ? <non défini> = Périphérique du jeu -> mc0/mc1. Un chemin complet personnalisé est essayé en premier. Exemples : mass0:/neutrino/neutrino.elf | ata:/neutrino/neutrino.elf | mmce0:/neutrino/neutrino.elf | mc0:/neutrino/neutrino.elf | pfs0:/neutrino/neutrino.elf'
  GAME_VIEW_MODE: Affichage des jeux PS2/PS1
  HINT_GAME_VIEW_MODE: Tout liste ensemble les jeux PS2 et PS1, et L3 alterne entre Tout, PS1 et PS2. PS2 ou PS1 n'affiche que ce type et désactive L3. APPS et Jeux favoris ont leurs propres règles d'affichage.
  VIEW_MIXED: Jeux PS2 + PS1 affichés
  VIEW_PS1_ELF: Applis PS1 ELF affichées
  APPS_DISPLAY: Affichage des applications
  HINT_APPS_DISPLAY: Tout affiche chaque ELF dans une seule liste APPS, L3 désactivé. Applis / PS1ELF place les titres contenant [PS1] dans une seconde page L3 ; le lancement ne change pas.
  VIEW: Vue
  VIEW_PS2: Jeux PS2 favoris affichés
  VIEW_PS1: Jeux PS1 favoris affichés
  VIEW_ELF: ELF favoris affichés
  VIEW_ALL: Tous les jeux favoris affichés
  VMC_FRAGMENTED_ON_CREATE: VMC créée, mais fragmentée. L'émulation de carte mémoire demande un fichier d'un seul tenant, cette VMC sera donc ignorée au lancement et la vraie carte utilisée à la place. Libérez de l'espace et recréez-la, ou copiez-en une depuis un autre périphérique.
  KEYB_MOVE_CURSOR: Déplacer le curseur
  TITLECOLOR: Couleur du titre du jeu
  RA_CHECK_GAME: Vérifier le support RetroAchievements
  RA_TEST_LINK: Tester la liaison PC RetroAchievements
  RA_CHECKING_IMAGE: Vérification de l'image, cela prend quelques secondes...
  RA_CHECK_RUNNING: Une vérification d'image est déjà en cours
  RA_LOOKING_FOR_PC: Recherche du client PC...
  RA_UL_UNSUPPORTED: Les jeux UL/USBExtreme ne peuvent pas encore être vérifiés
  RA_UL_UNSUPPORTED2: Seules les images .iso simples dans DVD/ ou CD/ sont prises en charge
  RA_UNKNOWN_IMAGE: RetroAchievements ne connaît pas cette image
  RA_STILL_IDENTIFYING: Le PC identifie encore l'image
  RA_TRY_AGAIN: Réessayez dans quelques secondes
  RA_NO_SOCKET: La console n'a pas pu ouvrir de socket réseau
  RA_NO_SOCKET2: Redémarrez la console, ou vérifiez le périphérique ETH dans les paramètres
  RA_TEST_NO_SOCKET2: Vérifiez le câble et ETH dans les paramètres ; si le réseau fonctionne, redémarrez la console
  RA_PC_NO_ANSWER: Le client PC n'a pas répondu
  RA_PC_NO_ANSWER2: Vérifiez que xeRAbora tourne, ou essayez le test de liaison PC
  RA_SUPPORTED: Pris en charge par RetroAchievements
  RA_START_TO_TRACK: Lancez le jeu pour suivre les succès
  RA_ACHIEVEMENTS: '%d succès'
  RA_ACHIEVEMENTS_FULL: '%d succès -- %d débloqués, %d non pris en charge'
  RA_HASH_FAILED: L'empreinte de l'image n'a pas pu être calculée
  RA_HASH_FAILED2: Voir RA/hashes.txt à côté des jeux pour la raison
  RA_NET_BUSY: Le réseau est utilisé par un transport UDP
  RA_NET_BUSY2: RA a besoin de la pile SMB -- changez de protocole, ou créez le .wl sur le PC
  RA_NET_BUSY_HASH: L'empreinte est dans RA/hashes.txt -- xeRAbora peut en créer le .wl
  RA_NO_IP: La console n'a pas d'adresse IP
  RA_NO_IP2: Vérifiez le DHCP ou l'adresse statique dans les paramètres réseau
  RA_TEST_NO_ANSWER: Aucun client PC n'a répondu en 3 secondes
  RA_TEST_NO_ANSWER2: Console%s. Vérifiez que xeRAbora tourne et que le port UDP 18194 est ouvert
  RA_TEST_FOUND: Client PC trouvé%s%s %s
  RA_TEST_FOUND2: Réponse en %u ms, console%s
  RA_NA_NEUTRINO: Le suivi RA demande le noyau <OPL> -- les lancements Neutrino ne chargent jamais ee_core
  RA_NA_UDPFS: Le suivi RA n'est pas disponible sur UDPFS -- les jeux s'y lancent via Neutrino
  RA_NA_PS1: Le suivi RA n'est pas disponible pour les jeux PS1
  RA_NA_HDD: Informations de jeu APA ou dossier de paramètres du disque dur indisponibles
  RA_NA_HDD2: Définissez un dossier de paramètres valide sur le disque dur et actualisez avant de vérifier le support
  RA_TELEMETRY: Télémétrie RetroAchievements
  RA_BADGES: Badges RetroAchievements
  HTTP_GAMES: Jeux HTTP
  HTTP_SERVER: Serveur HTTP
  HTTP_PORT: Port HTTP
  HTTP_BASE_PATH: Chemin de base HTTP
  HTTP_TEST: Tester le serveur HTTP
  HTTP_TEST_OK: Serveur OK -- jeux listés
  HTTP_TEST_EMPTY: Le catalogue est vide -- valide, mais cela ne prouve rien sur les plages d'octets
  HTTP_TEST_NO_ISO: Le catalogue n'a aucune image prise en charge pour tester une plage d'octets
  HTTP_ERR_CONNECT: Impossible de joindre le serveur HTTP
  HTTP_ERR_CATALOG: games.csv est absent, illisible ou trop gros
  HTTP_ERR_RANGE: Le serveur n'a pas renvoyé exactement les octets demandés
  HTTP_LAUNCH_UNAVAILABLE: Le lancement HTTP n'est pas encore implémenté -- le catalogue est seulement consultable
  HTTP_ERR_COMPRESSED: Les images compressées (.zso) ne sont pas encore prises en charge en HTTP
  HTTP_NO_VMC: Les cartes mémoire virtuelles ne sont pas disponibles en HTTP -- utilisez une vraie carte
  HTTP_TAB_HINT: HTTP lit games.csv depuis votre serveur. Réglez l'adresse, le port et le chemin de base dans les paramètres réseau, puis utilisez Tester.
  RA_DISC_CHECK: 'RA : vérifier le support du disque'
  RA_DISC_LAUNCH: 'RA : lancer le disque'
  RA_DISC_CHECKING: Vérification du disque pour RetroAchievements
  RA_DISC_HASH_FAILED: L'empreinte du disque n'a pas pu être calculée -- voir RA/hashes.txt dans le dossier des paramètres
  RA_DISC_HOME_ERROR: Le dossier des paramètres ne peut pas servir aux listes de suivi des disques
  RA_DISC_ENABLE: Activez d'abord la télémétrie RetroAchievements dans les paramètres réseau
  RA_DISC_CHECK_FIRST: 'Aucune liste de suivi pour ce disque -- utilisez d''abord RA : vérifier le support du disque'
  HDD_APA_TABLE_UNREADABLE_ERROR: '%d : disque dur trouvé, mais sa table de partitions APA est illisible. Ne le formatez pas -- vos jeux sont peut-être récupérables.'
  BDM_UNSUPPORTED_SECTOR_SIZE_ERROR: '%d : un périphérique n''a pas été monté car ses secteurs ne font pas 512 octets (par ex. un disque à secteurs de 4K). OPL ne lit que les secteurs de 512 octets.'
  HDD_PARTITION_RENAME_UNSUPPORTED: Ce titre est sa propre partition APA, et OPL ne modifie jamais la table des partitions. Renommez-le sur un PC.
  POPS_SETTINGS_UNREADABLE: Impossible de lire les paramètres de POPSTARTER -- la carte mémoire est occupée ou illisible. Réessayez une fois le chargement terminé.
  GLOBAL_PS_EMULATION_SETTINGS: Paramètres globaux d'émulation PS
  RA_NO_LINK_UNTRACKED: Réseau indisponible -- lancement sans RetroAchievements cette fois.
  IGR_USB_DRIVERS_PROMPT: Le chemin IGR est sur USB, mais il manque USBD.IRX et USBHDFSD.IRX dans %s, dont la console a besoin pour atteindre l'USB après un In-Game Reset. Sans eux, l'IGR retombe sur le navigateur PS2. Copier maintenant les pilotes de RiptOPL ? FMCB, OpenTuna et d'autres exploits chargent aussi ces fichiers et peuvent se comporter différemment avec eux. Les fichiers existants ne sont jamais remplacés. USB FAT32 uniquement.
  IGR_USB_DRIVERS_FAILED: Impossible de copier les pilotes USB dans %s (carte pleine ou non inscriptible). L'IGR retombera sur le navigateur PS2.
  OFFICIAL_CFG_NOTIFICATION: Paramètres officiels d'OPL chargés depuis %s
  CFM_VMODE_HOLD_KEEP: Maintenir pour garder
  BDM_PS2_FOLDERS_UNREADABLE: Impossible d'ouvrir le dossier CD ou DVD dans %s (erreur %d), ce périphérique ne liste donc aucun jeu PS2. Appuyez sur SELECT sur sa page pour réessayer.
  NEUTRINO_BD_NO_DEVICE_NUMBER: Le système de fichiers Neutrino est réglé sur bd, mais ce périphérique n'a jamais indiqué son numéro, Neutrino ne peut donc pas être dirigé vers lui. Réglez le système de fichiers Neutrino de ce jeu sur Auto ou exfat.
  CFM_VMODE_REVERT_IN: Retour en arrière dans %d s
  EMBER_DITHER: Tramage Ember
  HINT_EMBER_DITHER: Tramage d'Ember (activé ou désactivé), écrit dans EMBER/settings.txt du périphérique lancé. Une valeur par jeu a la priorité.
  EMBER_SHADING: Ombrage Ember
  HINT_EMBER_SHADING: 'Profondeur de couleur d''Ember : 15 bits, ou 24 bits (expérimental). Écrite dans EMBER/settings.txt du périphérique lancé. Une valeur par jeu a la priorité.'
  EMBER_CONTROLLER: Manette Ember
  HINT_EMBER_CONTROLLER: 'Mode de manette d''Ember : Auto, Analogique ou D2A. Mieux vaut généralement le régler par jeu (Triangle > Paramètres de jeu Ember), ce qui a la priorité.'
  EMBER_480P_CONFIRM: Ember en 480p n'affiche aucune image en composite. Utiliser le 480p ?
  EMBER_SHADING_24: 24 bits (expérimental)
  EMBER_GAME_SETTINGS: Paramètres de jeu Ember
  HINT_EMBER_GAME_SETTING: Ce jeu seulement. Appuyez sur OK pour écrire EMBER/games/<nom>/settings.txt avant le lancement. Un Défaut non modifié garde la valeur existante du fichier ; remettre une valeur sur Défaut supprime sa surcharge.
  EMBER_TIMING: Synchronisation Ember
  HINT_EMBER_TIMING: 'Synchronisation vidéo d''Ember : Auto suit la région du disque, NTSC force 60 Hz, PAL force 50 Hz. Écrite dans EMBER/settings.txt du périphérique lancé.'
  EMBER_GLOBAL_WARNING: Ces paramètres Ember s'appliquent à tous les jeux PS1, et certains jeux plantent avec eux. Pour n'en changer qu'un, utilisez Triangle > Paramètres de jeu Ember sur ce jeu.
  HINT_COVERFLOW_COUNT: Combien de jaquettes RIPFLOW affiche de chaque côté de celle choisie.
  HINT_COVERFLOW_SCALE: La taille de la jaquette choisie dans RIPFLOW par rapport aux autres.
  HINT_COVERFLOW_ANIM: La vitesse à laquelle les jaquettes glissent quand vous parcourez le flux.
  HINT_NARGS_QB: 'Quick Boot : saute l''écran de démarrage de Neutrino. Activé ici, il est envoyé pour chaque jeu ; désactivé, RIPPS2 l''envoie quand même de lui-même pour les jeux USB, iLink et réseau, où il est nécessaire.'
  HINT_NARGS_DBC: 'Couleurs de débogage : Neutrino remplit l''écran d''une couleur à chaque étape du chargement, pour qu''une photo montre où un jeu s''arrête.'
  HINT_NARGS_LOGO: Affiche le logo PS2 avant le jeu (un second redémarrage de l'IOP, dont certains périphériques iLink ont besoin). Désactivé ici, RIPPS2 suit Lancement des jeux > Logo PS2, et ne l'envoie jamais pour les jeux MMCE ou réseau.
  HINT_NARGS_CWD: 'Le dossier que le jeu voit comme le sien. Vide : celui par défaut de Neutrino.'
  HINT_NARGS_CFG: 'Un fichier de configuration Neutrino à vous (-cfg). Vide : celui de Neutrino.'
  HINT_NARGS_ELF: 'Lance cet ELF au lieu du fichier de démarrage indiqué par le disque. Vide : celui du jeu.'
  HINT_NARGS_ATA0: Une image de disque dur que Neutrino monte comme disque dur interne de la console, pour les jeux qui l'utilisent (-ata0).
  HINT_NARGS_ATA0ID: Le fichier d'identifiant qui accompagne cette image de disque dur (-ata0id).
  HINT_NARGS_ATA1: Une seconde image de disque dur (-ata1).
  PS1_SAVE_GUIDANCE: Les sauvegardes PS1 dépendent d'Ember ou de POPSTARTER ; les réglages VMC PS2 ne s'appliquent pas.
  NEUTRINO_SHOW_ARGS: Afficher les arguments de lancement
  HINT_NEUTRINO_SHOW_ARGS: Avant chaque lancement Neutrino, affiche tous les arguments que Neutrino recevra et demande de continuer. Retour revient au menu sans lancer.
  NEUTRINO_ARGS_CONFIRM: Neutrino va démarrer avec ces arguments. Lancer ?
  HINT_NARGS_EXTRA: D'autres options Neutrino, séparées par des espaces, envoyées après tout ce qui précède. RIPPS2 ajoute toujours -bsd et -dvd pour le périphérique et l'ISO du jeu, -mc0 et -mc1 pour ses VMC, -gsm pour son mode vidéo, et les modes de compatibilité propres au jeu. Une option qui a sa ligne ci-dessus (comme -logo) va dans cette ligne à l'enregistrement, et reste envoyée.
  GAME_TYPE_LABELS: Afficher les étiquettes [PS1]/[PS2]
  NEUTRINO_CHEATS_WRITE_FAILED: La liste de codes n'a pas pu être enregistrée dans le dossier Neutrino, Neutrino ne peut donc pas l'utiliser. Lancer sans codes ?
  AUTO_CREATE_VMC: Créer une VMC au premier lancement
  HINT_AUTO_CREATE_VMC: Lancer un jeu PS2 sans VMC dans l'emplacement 1 crée une carte de 8 Mo sur le périphérique du jeu, nommée comme le propose l'écran VMC (partagée par tous les disques du jeu), et l'attribue. Pas pour le disque dur interne sous Neutrino.
  AUTO_VMC_CREATING: Création de la VMC de ce jeu...
  AUTO_VMC_FAILED: Impossible de créer la VMC de ce jeu. Le jeu démarre sans.
  SAVE_ICONS: Icônes de sauvegarde 3D
  HINT_SAVE_ICONS: Affiche l'icône de sauvegarde du jeu choisi, en rotation, là où le thème lui prévoit une place. Lit d'abord la VMC du jeu, puis les cartes mémoire.
  NETBOOT_RESTART_NOW: Le protocole réseau change après un redémarrage. Enregistrer les paramètres et redémarrer OPL maintenant ?
  HINT_NET_PROTOCOL: 'Le service réseau qu''utilise RiptOPL : un partage SMB, UDPFS, UDPBD ou HTTP. Le même réglage que dans Sources de jeux. Quitter un service déjà en marche demande un redémarrage.'
  HINT_UDPFS_ACCESS: UDPFS seulement. Fichiers lit les ISO isolées du dossier des jeux du serveur ; IMG lit une image disque comme un périphérique. SMB et HTTP utilisent toujours Fichiers, UDPBD toujours IMG.
  HINT_SMB_VERSION: La version de SMB à utiliser avec le partage du PC.
  HINT_NET_ADVANCED: Débloque la modification du mode de liaison Ethernet et du port SMB.
  HINT_ETH_LINK_MODE: Force la vitesse et le duplex de la liaison réseau. Laissez sur Auto sauf si la liaison tombe sans cesse.
  HINT_IP_ADDR_TYPE: Statique utilise l'adresse ci-dessous ; DHCP la demande à votre routeur. UDPFS et UDPBD utilisent toujours Statique.
  HINT_PS2_IP: L'adresse IP de la PS2 elle-même. Choisissez-en une qu'aucun autre appareil n'utilise, dans la même plage que votre PC.
  HINT_NETMASK: Masque de sous-réseau, en général 255.255.255.0.
  HINT_GATEWAY: L'adresse de votre routeur, en général les trois mêmes premiers nombres terminés par .1.
  HINT_DNS: Adresse du serveur DNS. En général la même que la passerelle.
  HINT_SMB_ADDR_TYPE: Joindre le PC par son adresse IP ou par son nom NetBIOS (nom de l'ordinateur).
  HINT_SMB_ADDRESS: 'Le PC qui partage vos jeux : son adresse IP, ou son nom d''ordinateur quand le type d''adresse est NetBIOS.'
  HINT_SMB_PORT: 'Port SMB. Il doit correspondre au PC : PS2 Servers utilise 1111, les partages Windows et Samba utilisent 445.'
  HINT_SMB_USER: Nom d'utilisateur SMB. guest fonctionne pour la plupart des partages.
  HINT_HTTP_SERVER: Adresse IP du serveur de jeux HTTP.
  HINT_HTTP_PORT: Port d'écoute du serveur de jeux HTTP.
  HINT_HTTP_BASE: Dossier du serveur HTTP qui contient games.csv. / est la racine du serveur.
  HINT_HTTP_TEST: Essaie le serveur HTTP avec les valeurs ci-dessus et indique ce qu'il a trouvé.
  HINT_RA_TELEMETRY: Interrupteur général de RetroAchievements. Désactivé lance les jeux sans pile réseau ni instantanés, comme un build normal.
  HINT_RA_BADGES: Marque dans la liste les jeux qui ont des succès. Reste éteint tant que la télémétrie est désactivée.
  HINT_POPS_NET_BUTTON: Modifie les fichiers réseau de POPSTARTER (IPCONFIG.DAT, SMBCONFIG.DAT), dont les jeux PS1 en SMB ont besoin.
  HINT_POPS_IP_TYPE: 'Comment la PS2 obtient son adresse pendant qu''un jeu PS1 tourne en SMB : Statique ou DHCP.'
  HINT_POPS_IP: L'adresse IP de la PS2 pendant qu'un jeu PS1 tourne en SMB.
  HINT_POPS_SMB_IP: Adresse IP du PC qui partage vos jeux PS1.
  HINT_POPS_SMB_SHARE: Nom du partage sur ce PC qui contient le dossier POPS.
  HINT_LASTPLAYED: Démarre sur le dernier jeu lancé.
  HINT_LANGUAGE: Langue des menus. Ajoutez-en en plaçant des fichiers lang_*.lng dans un dossier LNG.
  HINT_GSM_DEFAULTS_BUTTON: Les corrections de mode vidéo que reçoit chaque jeu sauf s'il a ses propres réglages GSM.
  HINT_DEFDEVICE: La page sur laquelle RiptOPL s'ouvre au démarrage.
  HINT_MMCE_MODE: Les jeux sur une SD2PSX ou une MemCard PRO2. Auto démarre au lancement, Manuel à l'ouverture de la page, Désactivé la masque.
  HINT_MMCE_SETTINGS_BUTTON: Emplacement, bootcard IGR, GameID et options de synchronisation pour MMCE.
  HINT_ENABLE_USB: Charge le pilote de stockage USB.
  HINT_ENABLE_MX4SIO: Charge le pilote de l'adaptateur de carte SD MX4SIO.
  HINT_ENABLE_ILINK: Charge le pilote de stockage iLink (FireWire).
  HINT_NETSTART: 'Démarre le réseau : Auto au lancement, Manuel à l''ouverture de sa page. Désactivé laisse l''adaptateur réseau tranquille.'
  HINT_APPMODE: La page Applications. Auto démarre au lancement, Manuel à son ouverture, Désactivé la masque.
  HINT_FAVMODE: La page Jeux favoris. Auto démarre au lancement, Manuel à son ouverture, Désactivé la masque.
  HINT_BDMA_BUTTON: Le pilote exFAT qu'utilise POPSTARTER pour les jeux PS1 sur USB, MX4SIO, MMCE, disque dur ou iLink.
  HINT_VCD_LIST_BUTTON: 'Comment les jeux PS1 sont listés : masquer les identifiants de jeu, n''afficher que le disque 1, afficher les partitions PP du disque dur.'
  HINT_MMCE_SLOT: L'emplacement de carte mémoire où se trouve l'appareil MMCE. Auto le trouve.
  HINT_MMCE_GAMEID: Indique à l'appareil MMCE quel jeu démarre, pour qu'il passe à la carte mémoire de ce jeu.
  HINT_MMCE_COMM_BUTTON: Options de synchronisation de la liaison MMCE. Ne les changez que si les jeux se figent ou chargent lentement.
  HINT_MMCE_PATH_BUTTON: L'endroit de la carte MMCE où se trouvent les dossiers des jeux.
  HINT_MMCE_PREFIX: Sous-dossier de la carte MMCE qui contient CD, DVD et les autres dossiers d'OPL. Vide utilise la racine de la carte.
  HINT_GAME_TYPE_LABELS: Commence chaque nom de jeu par [PS1] ou [PS2]. Affichage seulement.
  HINT_MENU_VMODE: Sortie vidéo du menu. Les jeux utilisent GSM à la place. Maintenez Valider pour garder un nouveau mode.
  HINT_THEME: L'apparence du menu. Les thèmes sont lus dans le dossier THM de chaque périphérique.

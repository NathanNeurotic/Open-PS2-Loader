  HINT_BDMCACHE: 游戏中 USB 和其他 BDM 驱动器的预读缓存。越大越能平滑流式读取，但占用更多内存。
  HINT_HDDCACHE: 游戏中内置硬盘的预读缓存。
  HINT_SMBCACHE: 游戏中 SMB 的预读缓存。
  HINT_CORE_LOADER: 两者都支持时此游戏使用的核心。UDPFS/UDPBD 仅限 Neutrino；SMB/HTTP 仅限 <OPL>。默认跟随“游戏启动”。
  HINT_DMA_MODE: 此游戏的内置硬盘传输模式。游戏卡顿或卡死时调低。
  HINT_DNAS_GAMEID: DNAS 联网游戏的光盘 ID。“从光盘加载”会从原版光盘读取。
  HINT_LOAD_FROM_DISC: 从光驱中的原版光盘读取 DNAS ID。
  HINT_ALTSTARTUP: 从光盘镜像启动这个 ELF，而不是 SYSTEM.CNF 指定的那个。
  HINT_VMC_DEFINE: 选择、创建或调整此插槽虚拟记忆卡的大小。
  HINT_VMC_ACTION: “使用通用”给此插槽一张共享记忆卡；“重置”清除选择。
  HINT_VMC_NAME: 记忆卡文件的名称，存放在 VMC 文件夹中。
  HINT_VMC_CREATE: 创建记忆卡，或为它应用新大小。
  HINT_VMC_DELETE: 删除这个记忆卡文件。

  NEUTRINO_BD_NO_DEVICE_NUMBER: Neutrino 文件系统设为 bd，但这个驱动器从未报告设备编号，所以 Neutrino 无法指向它。请把此游戏的 Neutrino 文件系统设为 Auto 或 exfat。
  CFM_VMODE_REVERT_IN: '%d 秒后恢复'
  EMBER_DITHER: Ember 抖动
  HINT_EMBER_DITHER: Ember 的抖动（开或关），写入启动设备上的 EMBER/settings.txt。单个游戏的设置优先。
  EMBER_SHADING: Ember 着色
  HINT_EMBER_SHADING: Ember 的色深：15 位或 24 位（实验性）。写入启动设备上的 EMBER/settings.txt。单个游戏的设置优先。
  EMBER_CONTROLLER: Ember 手柄
  HINT_EMBER_CONTROLLER: Ember 的手柄模式：自动、模拟或 D2A。通常最好按游戏设置（三角 > Ember 游戏设置），它会优先。
  EMBER_480P_CONFIRM: Ember 在 480p 下通过复合视频没有画面。要使用 480p 吗？
  EMBER_SHADING_24: 24 位（实验性）
  EMBER_GAME_SETTINGS: Ember 游戏设置
  HINT_EMBER_GAME_SETTING: 仅此游戏。按 OK 在启动前写入 EMBER/games/<名称>/settings.txt。未改动的“默认”保留文件中已有的值；把某个值改回“默认”会移除其覆盖。
  EMBER_TIMING: Ember 时序
  HINT_EMBER_TIMING: Ember 的视频时序：自动跟随光盘区域，NTSC 强制 60 Hz，PAL 强制 50 Hz。写入启动设备上的 EMBER/settings.txt。
  EMBER_GLOBAL_WARNING: 这些 Ember 设置对每个 PS1 游戏生效，有些游戏会因此崩溃。若只想改一个游戏，请在该游戏上使用 三角 > Ember 游戏设置。
  HINT_COVERFLOW_COUNT: RIPFLOW 在所选封面两侧各显示多少个封面。
  HINT_COVERFLOW_SCALE: RIPFLOW 中所选封面相对于其他封面的大小。
  HINT_COVERFLOW_ANIM: 在封面流中移动时封面滑动的速度。
  HINT_NARGS_QB: Quick Boot：跳过 Neutrino 自己的启动画面。在这里开启时，每个游戏都会发送；关闭时，RIPPS2 仍会为需要它的 USB、iLink 和网络游戏自动发送。
  HINT_NARGS_DBC: 调试颜色：Neutrino 在每个加载步骤用一种颜色填满屏幕，拍张照片就能看出游戏停在哪里。
  HINT_NARGS_LOGO: 在游戏前显示 PS2 标志（再重启一次 IOP，某些 iLink 驱动器需要）。在这里关闭时，RIPPS2 遵循 游戏启动 > PS2 标志，并且从不为 MMCE 或网络游戏发送。
  HINT_NARGS_CWD: 游戏视为自己目录的文件夹。留空：Neutrino 的默认值。
  HINT_NARGS_CFG: 你自己的 Neutrino 配置文件（-cfg）。留空：Neutrino 自带的。
  HINT_NARGS_ELF: 启动这个 ELF，而不是光盘指定的启动文件。留空：游戏自己的。
  HINT_NARGS_ATA0: Neutrino 挂载为主机内置硬盘的硬盘镜像，用于使用硬盘的游戏（-ata0）。
  HINT_NARGS_ATA0ID: 与该硬盘镜像配套的 ID 文件（-ata0id）。
  HINT_NARGS_ATA1: 第二个硬盘镜像（-ata1）。
  PS1_SAVE_GUIDANCE: PS1 存档取决于 Ember 或 POPSTARTER；PS2 的 VMC 设置不适用。
  NEUTRINO_SHOW_ARGS: 显示启动参数
  HINT_NEUTRINO_SHOW_ARGS: 每次通过 Neutrino 启动前，显示 Neutrino 将收到的全部参数并询问是否继续。返回会回到菜单而不启动。
  NEUTRINO_ARGS_CONFIRM: Neutrino 将使用这些参数启动。启动吗？
  HINT_NARGS_EXTRA: 其他 Neutrino 参数，以空格分隔，在上面所有参数之后发送。RIPPS2 总会为游戏的驱动器和 ISO 加上 -bsd 和 -dvd，为其 VMC 加上 -mc0 和 -mc1，为其视频模式加上 -gsm，以及游戏自己的兼容模式。在上面有专属行的参数（例如 -logo）保存时会移到那一行，并且照常发送。
  GAME_TYPE_LABELS: 显示 [PS1]/[PS2] 标签
  NEUTRINO_CHEATS_WRITE_FAILED: 无法把金手指列表保存到 Neutrino 文件夹，因此 Neutrino 无法使用。不带金手指启动吗？
  AUTO_CREATE_VMC: 首次启动时创建 VMC
  HINT_AUTO_CREATE_VMC: 启动插槽 1 中没有 VMC 的 PS2 游戏时，会在游戏所在驱动器上创建一张 8 MB 的记忆卡，按 VMC 画面建议的名称命名（该游戏的所有光盘共用），并分配给它。不适用于 Neutrino 下的内置硬盘。
  AUTO_VMC_CREATING: 正在创建这个游戏的 VMC...
  AUTO_VMC_FAILED: 无法创建这个游戏的 VMC。游戏将在没有 VMC 的情况下启动。
  SAVE_ICONS: 3D 存档图标
  HINT_SAVE_ICONS: 在主题留有位置的地方显示所选游戏的旋转存档图标。先读取游戏的 VMC，再读取记忆卡。
  NETBOOT_RESTART_NOW: 网络协议会在重启后更改。现在保存设置并重启 OPL 吗？
  HINT_NET_PROTOCOL: RiptOPL 使用哪种网络服务：SMB 共享、UDPFS、UDPBD 或 HTTP。与“游戏来源”中的设置相同。从已在运行的服务切换走需要重启。
  HINT_UDPFS_ACCESS: 仅 UDPFS。“文件”从服务器的游戏文件夹读取单独的 ISO；IMG 把磁盘镜像当作驱动器读取。SMB 和 HTTP 始终使用“文件”，UDPBD 始终使用 IMG。
  HINT_SMB_VERSION: 与电脑共享通信时使用的 SMB 版本。
  HINT_NET_ADVANCED: 解锁以太网连接模式和 SMB 端口的编辑。
  HINT_ETH_LINK_MODE: 强制网络连接的速度和双工模式。除非连接经常断开，否则请保持自动。
  HINT_IP_ADDR_TYPE: 静态使用下面的地址；DHCP 向你的路由器获取。UDPFS 和 UDPBD 始终使用静态。
  HINT_PS2_IP: PS2 自己的 IP 地址。请选一个没有其他设备使用、与电脑在同一网段的地址。
  HINT_NETMASK: 子网掩码，通常为 255.255.255.0。
  HINT_GATEWAY: 你路由器的地址，通常前三段相同、以 .1 结尾。
  HINT_DNS: DNS 服务器地址。通常与网关相同。
  HINT_SMB_ADDR_TYPE: 通过 IP 地址还是 NetBIOS 名称（计算机名）访问电脑。
  HINT_SMB_ADDRESS: 共享你游戏的电脑：它的 IP 地址；地址类型为 NetBIOS 时为计算机名。
  HINT_SMB_PORT: SMB 端口。必须与电脑一致：PS2 Servers 使用 1111，Windows 和 Samba 共享使用 445。
  HINT_SMB_USER: SMB 用户名。大多数共享可用 guest。
  HINT_HTTP_SERVER: HTTP 游戏服务器的 IP 地址。
  HINT_HTTP_PORT: HTTP 游戏服务器监听的端口。
  HINT_HTTP_BASE: HTTP 服务器上存放 games.csv 的文件夹。/ 表示服务器根目录。
  HINT_HTTP_TEST: 用上面的值测试 HTTP 服务器并报告结果。
  HINT_RA_TELEMETRY: RetroAchievements 总开关。关闭时游戏启动不带网络协议栈和快照，与普通版本相同。
  HINT_RA_BADGES: 在列表中标出有成就的游戏。遥测关闭时保持暗色。
  HINT_POPS_NET_BUTTON: 编辑 POPSTARTER 自己的网络文件（IPCONFIG.DAT、SMBCONFIG.DAT），通过 SMB 运行 PS1 游戏时需要。
  HINT_POPS_IP_TYPE: PS1 游戏通过 SMB 运行时 PS2 获取地址的方式：静态或 DHCP。
  HINT_POPS_IP: PS1 游戏通过 SMB 运行时 PS2 的 IP 地址。
  HINT_POPS_SMB_IP: 共享你 PS1 游戏的电脑的 IP 地址。
  HINT_POPS_SMB_SHARE: 那台电脑上存放 POPS 文件夹的共享名称。
  HINT_LASTPLAYED: 从你上次启动的游戏开始。
  HINT_LANGUAGE: 菜单语言。把 lang_*.lng 文件放进 LNG 文件夹即可添加更多语言。
  HINT_GSM_DEFAULTS_BUTTON: 每个游戏都会获得的视频模式修正，除非它有自己的 GSM 设置。
  HINT_DEFDEVICE: RiptOPL 开机时打开的页面。
  HINT_MMCE_MODE: SD2PSX 或 MemCard PRO2 上的游戏。自动在开机时启动，手动在打开页面时启动，关闭则隐藏它。
  HINT_MMCE_SETTINGS_BUTTON: MMCE 的插槽、IGR bootcard、GameID 和时序选项。
  HINT_ENABLE_USB: 加载 USB 存储驱动。
  HINT_ENABLE_MX4SIO: 加载 MX4SIO SD 卡适配器驱动。
  HINT_ENABLE_ILINK: 加载 iLink（FireWire）存储驱动。
  HINT_NETSTART: 启动网络：自动在开机时，手动在打开其页面时。关闭则不碰网络适配器。

  HINT_NEUTRINO_DEFAULTS_BUTTON: 所有游戏的 Neutrino 路径、视频模式和参数。
  HINT_OSD_DEFAULTS_BUTTON: 传给游戏的主机语言、屏幕比例和视频模式。
  HINT_ENWRITEOP: 允许重命名和删除游戏以及创建 VMC。从不改动硬盘分区表。

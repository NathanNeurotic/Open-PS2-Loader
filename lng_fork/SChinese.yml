  HINT_BOOT_SND: RiptOPL 启动时播放声音。
  HINT_BGM: 播放主题的音乐，或你的默认主题音乐文件。
  HINT_SFX_VOLUME: 菜单音效的音量。
  HINT_BOOT_SND_VOLUME: 启动声音的音量。
  HINT_BGM_VOLUME: 背景音乐的音量。
  HINT_SCROLL: 按住方向时列表滚动的速度。
  HINT_SELECTBUTTON: 哪个按键确认：叉或圆圈。
  HINT_XSENSITIVITY: 左摇杆左右移动光标的灵敏度。关闭则忽略它。
  HINT_YSENSITIVITY: 左摇杆上下移动光标的灵敏度。关闭则忽略它。
  HINT_PADEMU_GLOBAL: 为所有游戏启用 USB 或蓝牙的 DualShock 3/4 以及多分插。
  HINT_PADMACRO_GLOBAL: 为所有游戏启用摇杆减速、轴反转和连发。
  HINT_COVERFLOW_DIM: 让两侧的封面变暗。
  HINT_OSD_ENABLE: 把下面的设置传给游戏。关闭则使用主机自己的设置。

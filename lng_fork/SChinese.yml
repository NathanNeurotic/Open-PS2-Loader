  HINT_FAVMODE: 收藏游戏页面。自动在开机时启动，手动在打开时启动，关闭则隐藏。
  HINT_BDMA_BUTTON: POPSTARTER 为 USB、MX4SIO、MMCE、硬盘或 iLink 上的 PS1 游戏使用哪个 exFAT 驱动。
  HINT_VCD_LIST_BUTTON: PS1 游戏的列出方式：隐藏游戏 ID、只显示光盘 1、显示硬盘的 PP 分区。

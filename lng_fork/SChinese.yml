  HINT_MMCE_GAMEID: 告诉 MMCE 设备正在启动哪个游戏，使它切换到该游戏的记忆卡。
  HINT_MMCE_COMM_BUTTON: MMCE 连接的时序选项。仅在游戏卡死或加载缓慢时更改。
  HINT_MMCE_PATH_BUTTON: MMCE 卡上游戏文件夹的位置。
  HINT_MMCE_PREFIX: MMCE 卡上存放 CD、DVD 和其他 OPL 文件夹的子文件夹。留空使用卡的根目录。
  HINT_GAME_TYPE_LABELS: 在每个游戏名称前加上 [PS1] 或 [PS2]。仅影响显示。
  HINT_MENU_VMODE: 菜单的视频输出。游戏改用 GSM。按住确认可保留新模式。
  HINT_THEME: 菜单的外观。主题从各设备的 THM 文件夹读取。
  HINT_COVERFLOW_BUTTON: Coverflow 主题的封面数量、大小、动画和变暗。
  HINT_ARTWORK_BUTTON: 加载哪些图片：封面、光盘图、背景和存档图标。
  HINT_COLORS_BUTTON: 文字、高亮、对话框和背景的颜色。
  HINT_NOTIFICATIONS: 加载配置、主题或语言文件时的简短通知。
  HINT_AUTOSORT: 按 A 到 Z 排序游戏列表。关闭则保持找到时的顺序。
  HINT_AUTOREFRESH: 无需手动刷新即可加入新连接设备上的游戏。
  HINT_COVERART: 从 ART 文件夹加载封面。
  HINT_DISCART: 显示光盘图（<ID>_ICO）。关闭会隐藏光盘，但保留封面和背景。
  HINT_BGART: 主题使用背景时显示游戏的背景（<ID>_BG）。
  HINT_ART_TAR: 也读取打包在 ART/art.tar 中的图片。
  HINT_ART_DELAY: 光标停在游戏上多久后才加载其图片。数值越高，快速滚动时越会跳过图片。
  HINT_TXTCOLOR: 普通菜单文字的颜色。
  HINT_SELCOLOR: 高亮项目的颜色。
  HINT_UICOLOR: 对话框的背景色调。
  HINT_TITLECOLOR: 列表中游戏标题的颜色。
  HINT_BGCOLOR: 菜单背景色。
  HINT_PLASCOLOR: 混入动态背景的颜色。
  HINT_RESETCOLOR: 恢复 RiptOPL 的内置颜色，而不是主题的颜色。
  HINT_WIDESCREEN: 按 16:9 电视绘制菜单。
  HINT_XOFF: 在屏幕上左右移动菜单。
  HINT_YOFF: 在屏幕上上下移动菜单。
  HINT_MENU_OVERSCAN: 如果电视切掉边缘，就把菜单向内缩小。

  POPS_UDPFS_INCOMPLETE_SUFFIX: ' (unvollständig)'
  POPS_UDPFS_DRIVER_NOT_READY: POPS-UDPFS braucht das .udpfs-Treiberpaar auf der Speicherkarte. Richte es von Hand ein oder schalte BDMA Beim Start anwenden ein.
  VMC_REPLACE_REQUIRES_DELETE: Die VMC-Größe zu ändern würde ihre Spielstände löschen. Sichere die vorhandene VMC und nutze Löschen, bevor du eine neue Größe anlegst.
  VMC_CREATE_FAILED: Die VMC konnte nicht angelegt werden. Prüfe Laufwerk, Verbindung und Schreibzugriff. Vorhandene Spielstände wurden nicht ersetzt.
  RA_EXPERIMENTAL_CARDS: Experimentelle Caduceus-Karten
  HINT_RA_EXPERIMENTAL_CARDS: Experimentelle PS2-Erfolgskarten im Spiel. Können flackern oder Spiele einfrieren. Nur Caduceus; Aus nutzt den goldenen Puls. Wirkt beim nächsten Spielstart.
  RA_NEUTRINO_UNTRACKED: Neutrino-RA ist für diesen Start nicht verfügbar. Prüfe das RA-Laufzeitmodul, die Begleiter-IP und die gespeicherte Beobachtungsliste. Ohne Erfolge gestartet.
  UDPFS_IP_CONFLICT: Ein anderes Gerät in deinem Netzwerk nutzt die IP-Adresse dieser PS2, also gehen die Antworten des UDPFS-Servers dorthin. Stelle in den Netzwerkeinstellungen eine andere PS2-IP ein.
  XERA_ACHIEVEMENTS: RetroAchievements-Bibliothek (xeRAbora)
  XERA_USE_LIBRARY: Durchsuche dieses Spiel über die RetroAchievements-Bibliothek im Hauptmenü.
  XERA_OPEN_NETWORK: xeRAbora ist nicht erreichbar. Schalte OPEN TO THE NETWORK in seinen Einstellungen ein, prüfe die IP des RA-Begleiters und die PC-Firewall.
  XERA_UNKNOWN_GAME: xeRAbora kennt dieses Abbild nicht. Führe zuerst die RA-Unterstützungsprüfung aus.
  XERA_NOT_PLAYED: Noch nicht in deiner RetroAchievements-Bibliothek. Spiele es einmal mit Erfolgen und drücke dann Select.
  XERA_CONNECTION_ERROR: Die Liste von xeRAbora lässt sich nicht lesen. Drücke Select für einen neuen Versuch.
  CAD_PAIR_UDPFS: Caduceus ist nicht erreichbar. Kopple ART/CADUCEUS.KEY in dem Ordner, den PS2-Servers freigibt, und stelle die IP des RA-Begleiters ein.
  RA_WL_NOT_SAVED: Die Beobachtungsliste ließ sich nicht speichern. Stelle sicher, dass Laufwerk oder Freigabe des Spiels beschreibbar ist, und prüfe erneut.
  RA_UDPFS_LOAD_FIRST: Öffne einmal die UDPFS-Seite, damit ihr Netzwerkmodul lädt, und versuche es erneut.
  CAD_UDPFS_IMG: 'Der Caduceus-Browser braucht SMB oder UDPFS-Dateien: UDPFS-IMG hat keinen freigegebenen Ordner für seinen Schlüssel.'
  XERA_SET_CLOCK: Noch nicht in deiner RetroAchievements-Bibliothek. Stelle die Uhr der Konsole in den Systemeinstellungen, um seine ganze Liste zu sehen, oder spiele es einmal mit Erfolgen.

  HINT_THEME_VIEW: "Wie das Theme deine Spiele zeigt: List, Coverflow, PSBBN Flow oder Grid. L3 auf der Hauptseite gedrückt halten zum Wechseln. Themes ohne diese Ansicht nutzen ihre Standardansicht."

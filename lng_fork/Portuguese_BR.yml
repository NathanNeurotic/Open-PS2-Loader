# Reviewed additions from the 2026-10 language audit (verify on console).
  CFG_TITLES: "Mostrar títulos do CFG nas listas de jogos"
  HINT_CFG_TITLES: "Mostra o título do CFG de cada jogo no lugar do nome do arquivo e ordena por esse título. Lê todos os CFGs a cada atualização, tornando o carregamento mais lento. Apenas visualização."
  AUTO_VMC_INVALID: "O arquivo VMC deste jogo existe, mas não é um Memory Card válido; ele não foi usado nem substituído. O jogo inicia sem ele. Verifique-o no menu VMC."
  AUTO_VMC_STILL_RUNNING: "A VMC deste jogo ainda está sendo criada. Tente iniciar o jogo novamente em instantes."
  NEUTRINO_DVR_QUICKBOOT: "O início pelo DVR exige a transição para o modo PSX. Remova -qb dos argumentos globais e por jogo do Neutrino."
  NEUTRINO_DVR_FILE_MISSING: "A instalação do Neutrino para DVR está incompleta. Arquivo obrigatório ausente:"
  PARENLOCK_GAME: "Controle dos pais"
  PARENLOCK_GAME_HINT: "Exigir a senha do controle dos pais para iniciar este jogo."
  PARENLOCK_GAME_NO_PASSWORD: "Defina uma senha de controle dos pais; caso contrário, este jogo não ficará bloqueado."
  HINT_ENABLE_PCCF: "CompactFlash PC CARD experimental para os primeiros modelos japoneses de PS2. Apenas jogos nativos de PS2; CF exige acesso exclusivo ao PC CARD. Reinicie para liberá-lo."
  PCCF_GAMES: "Jogos de PC CARD CF"
  PCCF_UNAVAILABLE: "CF indisponível: exige um PS2 japonês antigo com PC CARD, cartão compatível e nenhum driver DEV9/HDD/rede ativo."
  PCCF_UNSUPPORTED_GAME: "Atualmente o CF aceita apenas jogos nativos de PS2. VMC no CF, jogos de PS1 e conquistas em rede estão indisponíveis."
  HINT_ENABLE_DVR: "Detecção experimental de ISO do DESR DVR. Exige a fonte HDD ativada; iniciar jogos requer uma versão externa do Neutrino compatível com DVR."
  NEUTRINO_DVR_BACKEND_OVERRIDE: "O início pelo DVR seleciona seu próprio backend. Remova -bsd= e -bsdfs= dos argumentos globais e por jogo do Neutrino."
  ERR_VMC_LBA_RANGE_CONTINUE: "A VMC %s está fora do intervalo de endereços do disco aceito pelo núcleo nativo. Continuar com o Memory Card físico no slot %d?"
  ERR_VMC_LAYOUT_CONTINUE: "Não foi possível verificar a disposição da VMC %s no disco. Continuar com o Memory Card físico no slot %d?"
  ERR_VMC_PFS_LIMIT_CONTINUE: "A VMC %s excede o limite de mapeamento PFS do núcleo nativo. Continuar com o Memory Card físico no slot %d?"
  NEUTRINO_VMC_FRAG_BUDGET_CONTINUE: "Os arquivos do jogo e da VMC usam %d/%d fragmentos, acima do limite compartilhado do Neutrino. Ignorar a VMC %s e usar o Memory Card físico no slot %d?"
  VMC_PFS_LIMIT_ON_CREATE: "A VMC foi criada, mas o HDD a armazenou em mais fragmentos do que o núcleo nativo consegue mapear. Ela será ignorada ao iniciar e o cartão real será usado. Libere espaço na partição OPL e crie a VMC novamente."

# Supplemental RiptOPL-label translations adapted from RIPPS2 (Akilluminati47):
# https://github.com/akilluminati47/RIPPS2/tree/main/elf/lang
# Review translated UI text on real hardware; upstream translations retain priority.
  MANUAL: Manual
  ENTER: Entrar
  VMC_SLOT1: VMC do slot 1
  VMC_SLOT2: VMC do slot 2
  HINT_NEUTRINO_AUTO_ELF: Passa o ELF de boot do jogo ao Neutrino para buscar a configuração por título. Ligado por padrão; uma opção Boot ELF ajustada à mão tem prioridade.
  HINT_POPSTARTER_PATH: Onde está o POPSTARTER.ELF. Deixado vazio, o RIPPS2 preenche com um que encontrar numa unidade; escreva por cima para usar outro, como usb:/POPS/POPSTARTER.ELF
  NEUTRINO_ARGS_TOO_LONG: Os argumentos do Neutrino passam do tamanho que pode ser salvo. Encurte um campo antes de salvar.
  NEUTRINO_LAUNCH_ARGS_OVERFLOW: Os argumentos de início do Neutrino passam do limite seguro. Encurte os argumentos globais ou os do jogo.
  NEUTRINO_AUTO_ELF: Boot ELF automático (-elf)
  HINT_NEUTRINO_PATH: 'Onde está o neutrino.elf? <não definido> = Unidade do jogo -> mc0/mc1. Um caminho completo personalizado é tentado primeiro. Exemplos: mass0:/neutrino/neutrino.elf | ata:/neutrino/neutrino.elf | mmce0:/neutrino/neutrino.elf | mc0:/neutrino/neutrino.elf | pfs0:/neutrino/neutrino.elf'
  GAME_VIEW_MODE: Exibição de jogos PS2/PS1
  HINT_GAME_VIEW_MODE: Tudo lista juntos os jogos de PS2 e PS1, e o L3 alterna entre Tudo, PS1 e PS2. PS2 ou PS1 mostra só esse tipo e desativa o L3. APPS e Jogos favoritos têm regras próprias.
  VIEW_MIXED: Mostrando jogos de PS2 + PS1
  VIEW_PS1_ELF: Mostrando apps PS1 ELF
  APPS_DISPLAY: Exibição de aplicativos
  HINT_APPS_DISPLAY: Tudo mostra cada ELF numa só lista APPS, com o L3 desativado. Apps / PS1ELF leva os títulos com [PS1] para uma segunda página do L3; o início não muda.
  VIEW: Visão
  VIEW_PS2: Mostrando jogos de PS2 favoritos
  VIEW_PS1: Mostrando jogos de PS1 favoritos
  VIEW_ELF: Mostrando ELFs favoritos
  VIEW_ALL: Mostrando todos os jogos favoritos
  VMC_FRAGMENTED_ON_CREATE: VMC criada, mas fragmentada. A emulação de cartão de memória precisa de um arquivo contínuo, então esta VMC será ignorada ao iniciar e o cartão real será usado. Libere espaço e crie de novo, ou copie uma de outro dispositivo.
  KEYB_MOVE_CURSOR: Mover o cursor
  TITLECOLOR: Cor do título do jogo
  RA_CHECK_GAME: Verificar suporte do RetroAchievements
  RA_TEST_LINK: Testar a conexão do RetroAchievements com o PC
  RA_CHECKING_IMAGE: Verificando a imagem, leva alguns segundos...
  RA_CHECK_RUNNING: Já há uma verificação de imagem em andamento
  RA_LOOKING_FOR_PC: Procurando o cliente do PC...
  RA_UL_UNSUPPORTED: Jogos UL/USBExtreme ainda não podem ser verificados
  RA_UL_UNSUPPORTED2: Só imagens .iso simples em DVD/ ou CD/ são suportadas
  RA_UNKNOWN_IMAGE: O RetroAchievements não conhece esta imagem
  RA_STILL_IDENTIFYING: O PC ainda está identificando a imagem
  RA_TRY_AGAIN: Tente de novo em alguns segundos
  RA_NO_SOCKET: O console não conseguiu abrir um socket de rede
  RA_NO_SOCKET2: Reinicie o console, ou confira o dispositivo ETH nas configurações
  RA_TEST_NO_SOCKET2: Confira o cabo e o ETH nas configurações; se a rede estiver ok, reinicie o console
  RA_PC_NO_ANSWER: O cliente do PC não respondeu
  RA_PC_NO_ANSWER2: Confira se o xeRAbora está rodando, ou tente o teste de conexão com o PC
  RA_SUPPORTED: Suportado pelo RetroAchievements
  RA_START_TO_TRACK: Inicie o jogo para acompanhar as conquistas
  RA_ACHIEVEMENTS: '%d conquistas'
  RA_ACHIEVEMENTS_FULL: '%d conquistas -- %d desbloqueadas, %d sem suporte'
  RA_HASH_FAILED: Não foi possível calcular o hash da imagem
  RA_HASH_FAILED2: Veja RA/hashes.txt ao lado dos jogos para saber o motivo
  RA_NET_BUSY: A rede está em uso por um transporte UDP
  RA_NET_BUSY2: O RA precisa da pilha SMB -- troque o protocolo, ou crie o .wl no PC
  RA_NET_BUSY_HASH: O hash está em RA/hashes.txt -- o xeRAbora pode criar o .wl a partir dele
  RA_NO_IP: O console não tem endereço IP
  RA_NO_IP2: Confira o DHCP ou o endereço fixo nas configurações de rede
  RA_TEST_NO_ANSWER: Nenhum cliente do PC respondeu em 3 segundos
  RA_TEST_NO_ANSWER2: Console%s. Confira se o xeRAbora está rodando e a porta UDP 18194 está aberta
  RA_TEST_FOUND: Cliente do PC encontrado%s%s %s
  RA_TEST_FOUND2: Resposta em %u ms, console%s
  RA_NA_NEUTRINO: O acompanhamento RA precisa do núcleo <OPL> -- inícios pelo Neutrino nunca carregam o ee_core
  RA_NA_UDPFS: O acompanhamento RA não está disponível no UDPFS -- os jogos iniciam pelo Neutrino
  RA_NA_PS1: O acompanhamento RA não está disponível para jogos de PS1
  RA_NA_HDD: Informações de jogo APA ou pasta de configurações do HD indisponíveis
  RA_NA_HDD2: Defina uma pasta de configurações válida no HD e atualize antes de verificar o suporte
  RA_TELEMETRY: Telemetria do RetroAchievements
  RA_BADGES: Emblemas do RetroAchievements
  HTTP_GAMES: Jogos HTTP
  HTTP_SERVER: Servidor HTTP
  HTTP_PORT: Porta HTTP
  HTTP_BASE_PATH: Caminho base HTTP
  HTTP_TEST: Testar o servidor HTTP
  HTTP_TEST_OK: Servidor OK -- jogos listados
  HTTP_TEST_EMPTY: O catálogo está vazio -- é válido, mas não prova nada sobre faixas de bytes
  HTTP_TEST_NO_ISO: O catálogo não tem nenhuma imagem suportada para testar uma faixa de bytes
  HTTP_ERR_CONNECT: Não foi possível alcançar o servidor HTTP
  HTTP_ERR_CATALOG: O games.csv não existe, não pode ser lido ou é grande demais
  HTTP_ERR_RANGE: O servidor não devolveu exatamente os bytes pedidos
  HTTP_LAUNCH_UNAVAILABLE: O início por HTTP ainda não foi implementado -- o catálogo só pode ser navegado
  HTTP_ERR_COMPRESSED: Imagens compactadas (.zso) ainda não são suportadas por HTTP
  HTTP_NO_VMC: Cartões de memória virtuais não estão disponíveis por HTTP -- use um cartão físico
  HTTP_TAB_HINT: O HTTP lê o games.csv do seu servidor. Ajuste endereço, porta e caminho base nas configurações de rede e use Testar.
  RA_DISC_CHECK: 'RA: verificar suporte do disco'
  RA_DISC_LAUNCH: 'RA: iniciar o disco'
  RA_DISC_CHECKING: Verificando o disco para o RetroAchievements
  RA_DISC_HASH_FAILED: Não foi possível calcular o hash do disco -- veja RA/hashes.txt na pasta de configurações
  RA_DISC_HOME_ERROR: A pasta de configurações não pode ser usada para listas de acompanhamento de discos
  RA_DISC_ENABLE: Ligue antes a telemetria do RetroAchievements nas configurações de rede
  RA_DISC_CHECK_FIRST: 'Não há lista de acompanhamento para este disco -- use antes RA: verificar suporte do disco'
  HDD_APA_TABLE_UNREADABLE_ERROR: '%d: HD encontrado, mas a tabela de partições APA dele não pode ser lida. Não formate -- seus jogos talvez possam ser recuperados.'
  BDM_UNSUPPORTED_SECTOR_SIZE_ERROR: '%d: uma unidade não foi montada porque os setores dela não têm 512 bytes (por exemplo, um disco de setores de 4K). O OPL só lê setores de 512 bytes.'
  HDD_PARTITION_RENAME_UNSUPPORTED: Este título é a própria partição APA, e o OPL nunca edita a tabela de partições. Renomeie-o num PC.
  POPS_SETTINGS_UNREADABLE: Não foi possível ler as configurações do POPSTARTER -- o cartão de memória está ocupado ou ilegível. Tente de novo quando o carregamento terminar.
  GLOBAL_PS_EMULATION_SETTINGS: Configurações globais de emulação PS
  RA_NO_LINK_UNTRACKED: Rede indisponível -- iniciando sem RetroAchievements desta vez.
  IGR_USB_DRIVERS_PROMPT: O caminho do IGR está no USB, mas faltam USBD.IRX e USBHDFSD.IRX em %s, que o console precisa para alcançar o USB depois de um In-Game Reset. Sem eles, o IGR cai no navegador do PS2. Copiar agora os drivers do RiptOPL? FMCB, OpenTuna e outros exploits também carregam esses arquivos e podem se comportar diferente com eles. Arquivos existentes nunca são substituídos. Só USB FAT32.
  IGR_USB_DRIVERS_FAILED: Não foi possível copiar os drivers USB para %s (cartão cheio ou sem permissão de gravação). O IGR vai cair no navegador do PS2.
  OFFICIAL_CFG_NOTIFICATION: Configurações oficiais do OPL carregadas de %s
  CFM_VMODE_HOLD_KEEP: Segure para manter
  BDM_PS2_FOLDERS_UNREADABLE: Não foi possível abrir a pasta CD ou DVD em %s (erro %d), então essa unidade não lista jogos de PS2. Aperte SELECT na página dela para tentar de novo.
  NEUTRINO_BD_NO_DEVICE_NUMBER: O sistema de arquivos do Neutrino está em bd, mas esta unidade nunca informou o número de dispositivo, então o Neutrino não pode apontar para ela. Ajuste o sistema de arquivos do Neutrino deste jogo para Auto ou exfat.
  CFM_VMODE_REVERT_IN: Voltando em %d s
  EMBER_DITHER: Pontilhado do Ember
  HINT_EMBER_DITHER: Pontilhado do Ember (ligado ou desligado), gravado em EMBER/settings.txt da unidade de início. Um valor por jogo tem prioridade.
  EMBER_SHADING: Sombreamento do Ember
  HINT_EMBER_SHADING: 'Profundidade de cor do Ember: 15 bits, ou 24 bits (experimental). Gravada em EMBER/settings.txt da unidade de início. Um valor por jogo tem prioridade.'
  EMBER_CONTROLLER: Controle do Ember
  HINT_EMBER_CONTROLLER: 'Modo de controle do Ember: Auto, Analógico ou D2A. Normalmente é melhor ajustar por jogo (Triângulo > Configurações de jogo do Ember), que tem prioridade.'
  EMBER_480P_CONFIRM: O Ember em 480p não mostra imagem pelo cabo composto. Usar 480p?
  EMBER_SHADING_24: 24 bits (experimental)
  EMBER_GAME_SETTINGS: Configurações de jogo do Ember
  HINT_EMBER_GAME_SETTING: Só este jogo. Aperte OK para gravar EMBER/games/<nome>/settings.txt antes de iniciar. Um Padrão não alterado mantém o valor do arquivo; voltar um valor para Padrão remove o ajuste próprio.
  EMBER_TIMING: Sincronia do Ember
  HINT_EMBER_TIMING: 'Sincronia de vídeo do Ember: Auto segue a região do disco, NTSC força 60 Hz, PAL força 50 Hz. Gravada em EMBER/settings.txt da unidade de início.'
  EMBER_GLOBAL_WARNING: Estas configurações do Ember valem para todo jogo de PS1, e alguns jogos travam com elas. Para mudar só um jogo, use Triângulo > Configurações de jogo do Ember nesse jogo.
  HINT_COVERFLOW_COUNT: Quantas capas o RIPFLOW mostra de cada lado da escolhida.
  HINT_COVERFLOW_SCALE: O tamanho da capa escolhida no RIPFLOW em relação às outras.
  HINT_COVERFLOW_ANIM: A velocidade com que as capas deslizam quando você anda pelo fluxo.
  HINT_NARGS_QB: 'Quick Boot: pula a tela de início do Neutrino. Ligado aqui, é enviado para todo jogo; desligado, o RIPPS2 ainda o envia sozinho para jogos em USB, iLink e rede, onde ele é necessário.'
  HINT_NARGS_DBC: 'Cores de depuração: o Neutrino pinta a tela de uma cor a cada etapa do carregamento, para uma foto mostrar onde um jogo para.'
  HINT_NARGS_LOGO: Mostra o logo do PS2 antes do jogo (um segundo reinício do IOP, que algumas unidades iLink precisam). Desligado aqui, o RIPPS2 segue Início de jogos > Logo do PS2, e nunca o envia para jogos em MMCE ou rede.
  HINT_NARGS_CWD: 'A pasta que o jogo vê como dele. Vazio: a padrão do Neutrino.'
  HINT_NARGS_CFG: 'Um arquivo de configuração do Neutrino seu (-cfg). Vazio: o do Neutrino.'
  HINT_NARGS_ELF: 'Inicia este ELF em vez do arquivo de boot que o disco indica. Vazio: o do jogo.'
  HINT_NARGS_ATA0: Uma imagem de HD que o Neutrino monta como HD interno do console, para jogos que usam o HD (-ata0).
  HINT_NARGS_ATA0ID: O arquivo de identificação que acompanha essa imagem de HD (-ata0id).
  HINT_NARGS_ATA1: Uma segunda imagem de HD (-ata1).
  PS1_SAVE_GUIDANCE: Os saves de PS1 dependem do Ember ou do POPSTARTER; as configurações de VMC de PS2 não valem.
  NEUTRINO_SHOW_ARGS: Mostrar argumentos de início
  HINT_NEUTRINO_SHOW_ARGS: Antes de cada início pelo Neutrino, mostra todos os argumentos que o Neutrino vai receber e pergunta se continua. Voltar retorna ao menu sem iniciar.
  NEUTRINO_ARGS_CONFIRM: O Neutrino vai iniciar com estes argumentos. Iniciar?
  HINT_NARGS_EXTRA: Outras opções do Neutrino, separadas por espaços, enviadas depois de tudo acima. O RIPPS2 sempre adiciona -bsd e -dvd para a unidade e a ISO do jogo, -mc0 e -mc1 para as VMCs dele, -gsm para o modo de vídeo dele, e os modos de compatibilidade próprios do jogo. Uma opção com linha própria acima (como -logo) vai para essa linha ao salvar, e continua sendo enviada.
  GAME_TYPE_LABELS: Mostrar rótulos [PS1]/[PS2]
  NEUTRINO_CHEATS_WRITE_FAILED: A lista de cheats não pôde ser salva na pasta do Neutrino, então o Neutrino não pode usá-la. Iniciar sem cheats?
  AUTO_CREATE_VMC: Criar VMC no primeiro início
  HINT_AUTO_CREATE_VMC: Iniciar um jogo de PS2 sem VMC no slot 1 cria um cartão de 8 MB na unidade do jogo, com o nome que a tela de VMC sugere (compartilhado por todos os discos do jogo), e o atribui. Não para o HD interno com o Neutrino.
  AUTO_VMC_CREATING: Criando a VMC deste jogo...
  AUTO_VMC_FAILED: Não foi possível criar a VMC deste jogo. O jogo inicia sem ela.
  SAVE_ICONS: Ícones de save em 3D
  HINT_SAVE_ICONS: Mostra o ícone de save do jogo escolhido, girando, onde o tema tem um lugar para ele. Lê primeiro a VMC do jogo, depois os cartões de memória.
  NETBOOT_RESTART_NOW: O protocolo de rede muda depois de reiniciar. Salvar as configurações e reiniciar o OPL agora?
  HINT_NET_PROTOCOL: 'Qual serviço de rede o RiptOPL usa: um compartilhamento SMB, UDPFS, UDPBD ou HTTP. O mesmo ajuste de Fontes de jogos. Sair de um que já está rodando precisa reiniciar.'
  HINT_UDPFS_ACCESS: Só UDPFS. Arquivos lê ISOs soltas da pasta de jogos do servidor; IMG lê uma imagem de disco como unidade. SMB e HTTP sempre usam Arquivos, UDPBD sempre IMG.
  HINT_SMB_VERSION: Qual versão do SMB usar com o compartilhamento do PC.
  HINT_NET_ADVANCED: Libera a edição do modo de link Ethernet e da porta SMB.
  HINT_ETH_LINK_MODE: Força a velocidade e o duplex do link de rede. Deixe em Auto, a não ser que o link caia toda hora.
  HINT_IP_ADDR_TYPE: Fixo usa o endereço abaixo; DHCP pede ao seu roteador. UDPFS e UDPBD sempre usam Fixo.
  HINT_PS2_IP: O endereço IP do próprio PS2. Escolha um que nenhum outro aparelho use, na mesma faixa do seu PC.
  HINT_NETMASK: Máscara de sub-rede, normalmente 255.255.255.0.
  HINT_GATEWAY: O endereço do seu roteador, normalmente os mesmos três primeiros números terminando em .1.
  HINT_DNS: Endereço do servidor DNS. Normalmente o mesmo do gateway.
  HINT_SMB_ADDR_TYPE: Chegar ao PC pelo endereço IP ou pelo nome NetBIOS (nome do computador).
  HINT_SMB_ADDRESS: 'O PC que compartilha seus jogos: o endereço IP dele, ou o nome do computador quando o tipo de endereço é NetBIOS.'
  HINT_SMB_PORT: 'Porta SMB. Precisa bater com o PC: o PS2 Servers usa 1111, compartilhamentos do Windows e Samba usam 445.'
  HINT_SMB_USER: Usuário SMB. guest funciona na maioria dos compartilhamentos.
  HINT_HTTP_SERVER: Endereço IP do servidor de jogos HTTP.
  HINT_HTTP_PORT: Porta em que o servidor de jogos HTTP escuta.
  HINT_HTTP_BASE: Pasta no servidor HTTP que contém o games.csv. / é a raiz do servidor.
  HINT_HTTP_TEST: Testa o servidor HTTP com os valores acima e mostra o que encontrou.
  HINT_RA_TELEMETRY: Chave geral do RetroAchievements. Desligado inicia os jogos sem pilha de rede nem capturas, igual a um build normal.
  HINT_RA_BADGES: Marca na lista os jogos que têm conquistas. Fica apagado enquanto a telemetria está desligada.
  HINT_POPS_NET_BUTTON: Edita os arquivos de rede do POPSTARTER (IPCONFIG.DAT, SMBCONFIG.DAT), que os jogos de PS1 por SMB precisam.
  HINT_POPS_IP_TYPE: 'Como o PS2 pega o endereço enquanto um jogo de PS1 roda por SMB: Fixo ou DHCP.'
  HINT_POPS_IP: O endereço IP do PS2 enquanto um jogo de PS1 roda por SMB.
  HINT_POPS_SMB_IP: Endereço IP do PC que compartilha seus jogos de PS1.
  HINT_POPS_SMB_SHARE: Nome do compartilhamento nesse PC que contém a pasta POPS.
  HINT_LASTPLAYED: Começa no último jogo que você iniciou.
  HINT_LANGUAGE: Idioma do menu. Adicione mais colocando arquivos lang_*.lng numa pasta LNG.
  HINT_GSM_DEFAULTS_BUTTON: As correções de modo de vídeo que todo jogo recebe, a não ser que tenha as próprias configurações GSM.
  HINT_DEFDEVICE: A página em que o RiptOPL abre ao iniciar.
  HINT_MMCE_MODE: Jogos num SD2PSX ou MemCard PRO2. Auto inicia no boot, Manual ao abrir a página, Desligado a esconde.
  HINT_MMCE_SETTINGS_BUTTON: Slot, bootcard do IGR, GameID e opções de tempo para o MMCE.
  HINT_ENABLE_USB: Carrega o driver de armazenamento USB.
  HINT_ENABLE_MX4SIO: Carrega o driver do adaptador de cartão SD MX4SIO.
  HINT_ENABLE_ILINK: Carrega o driver de armazenamento iLink (FireWire).
  HINT_NETSTART: 'Inicia a rede: Auto no boot, Manual ao abrir a página dela. Desligado deixa o adaptador de rede em paz.'
  HINT_APPMODE: A página Aplicativos. Auto inicia no boot, Manual ao abri-la, Desligado a esconde.
  HINT_FAVMODE: A página Jogos favoritos. Auto inicia no boot, Manual ao abri-la, Desligado a esconde.
  HINT_BDMA_BUTTON: Qual driver exFAT o POPSTARTER usa para jogos de PS1 em USB, MX4SIO, MMCE, HD ou iLink.
  HINT_VCD_LIST_BUTTON: 'Como os jogos de PS1 são listados: esconder IDs de jogo, mostrar só o disco 1, mostrar partições PP do HD.'
  HINT_MMCE_SLOT: Em qual slot de cartão de memória está o dispositivo MMCE. Auto o encontra.
  HINT_MMCE_GAMEID: Avisa o dispositivo MMCE qual jogo está iniciando, para ele trocar para o cartão de memória desse jogo.
  HINT_MMCE_COMM_BUTTON: Opções de tempo da conexão MMCE. Mude só se os jogos travarem ou carregarem devagar.
  HINT_MMCE_PATH_BUTTON: Onde ficam as pastas de jogos no cartão MMCE.
  HINT_MMCE_PREFIX: Subpasta no cartão MMCE que contém CD, DVD e as outras pastas do OPL. Vazio usa a raiz do cartão.
  HINT_GAME_TYPE_LABELS: Começa o nome de cada jogo com [PS1] ou [PS2]. Só visual.
  HINT_MENU_VMODE: Saída de vídeo do menu. Os jogos usam o GSM no lugar. Segure Confirmar para manter um modo novo.
  HINT_THEME: O visual do menu. Os temas são lidos da pasta THM de cada dispositivo.
  HINT_COVERFLOW_BUTTON: Quantidade de capas, tamanho, animação e escurecimento do tema Coverflow.
  HINT_ARTWORK_BUTTON: 'Quais imagens carregam: capas, imagens do disco, fundos e ícones de save.'
  HINT_COLORS_BUTTON: Cores do texto, do destaque, das caixas de diálogo e do fundo.
  HINT_NOTIFICATIONS: Avisos rápidos quando um arquivo de configuração, tema ou idioma carrega.
  HINT_AUTOSORT: Ordena as listas de jogos de A a Z. Desligado mantém a ordem em que foram encontrados.
  HINT_AUTOREFRESH: Adiciona jogos de dispositivos recém-conectados sem atualizar à mão.
  HINT_COVERART: Carrega as capas da pasta ART.
  HINT_DISCART: Mostra a imagem do disco (<ID>_ICO). Desligado esconde o disco, mas mantém capas e fundos.
  HINT_BGART: Mostra o fundo de um jogo (<ID>_BG) quando o tema usa um.
  HINT_ART_TAR: Também lê imagens empacotadas em ART/art.tar.

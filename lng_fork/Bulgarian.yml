  POPS_UDPFS_DRIVER_NOT_READY: POPS UDPFS се нуждае от двойката драйвери .udpfs, инсталирана на картата с памет. Сложете я ръчно или включете BDMA Прилагане при стартиране.
  VMC_REPLACE_REQUIRES_DELETE: Смяната на размера на VMC би изтрила записите в него. Направете резервно копие на съществуващия VMC и използвайте Изтриване, преди да създадете нов размер.
  VMC_CREATE_FAILED: VMC не можа да се създаде. Проверете устройството, връзката и правото за запис. Съществуващите записи не са заменени.
  RA_EXPERIMENTAL_CARDS: Експериментални карти на Caduceus
  HINT_RA_EXPERIMENTAL_CARDS: Експериментални карти с постижения в PS2 игрите. Може да трептят или да замразяват игри. Само Caduceus; Изкл. използва златния пулс. Влиза в сила при следващото стартиране на игра.
  RA_NEUTRINO_UNTRACKED: Neutrino RA не е наличен за това стартиране. Проверете RA средата, IP на помощника и запазения списък за следене. Стартиране без постижения.
  UDPFS_IP_CONFLICT: Друго устройство във вашата мрежа използва IP адреса на тази PS2, затова отговорите на UDPFS сървъра отиват при него. Задайте друг IP на PS2 в мрежовите настройки.
  XERA_ACHIEVEMENTS: Библиотека на RetroAchievements (xeRAbora)
  XERA_USE_LIBRARY: Разгледайте тази игра чрез библиотеката на RetroAchievements в главното меню.
  XERA_OPEN_NETWORK: xeRAbora е недостъпен. Включете OPEN TO THE NETWORK в настройките му и проверете IP на помощника за RA и защитната стена на компютъра.
  XERA_UNKNOWN_GAME: xeRAbora не познава този образ. Първо пуснете проверката на поддръжката на игри на RA.
  XERA_NOT_PLAYED: Още не е във вашата библиотека на RetroAchievements. Изиграйте я веднъж с постижения и натиснете Select.
  XERA_CONNECTION_ERROR: Списъкът от xeRAbora не може да се прочете. Натиснете Select, за да опитате отново.
  CAD_PAIR_UDPFS: Caduceus е недостъпен. Сдвоете ART/CADUCEUS.KEY в папката, която споделя PS2-Servers, и задайте IP на помощника за RA.
  RA_WL_NOT_SAVED: Списъкът за следене не можа да се запази. Уверете се, че устройството или споделянето на играта позволява запис, и проверете отново.
  RA_UDPFS_LOAD_FIRST: Отворете веднъж страницата UDPFS, за да се зареди мрежовият ѝ модул, и опитайте отново.
  CAD_UDPFS_IMG: 'Браузърът на Caduceus се нуждае от SMB или UDPFS Файлове: UDPFS IMG няма споделена папка за ключа си.'
  XERA_SET_CLOCK: Още не е във вашата библиотека на RetroAchievements. Настройте часовника на конзолата в системните настройки, за да видите пълния ѝ списък, или я изиграйте веднъж с постижения.
  CFG_TITLES: Показване на заглавията от CFG в списъците с игри
  HINT_CFG_TITLES: Показва заглавието от CFG на всяка игра вместо името на файла и подрежда по него. Чете всеки CFG при обновяване на списък, затова списъците се зареждат по-бавно. Само за показване.
  AUTO_VMC_INVALID: VMC файлът на тази игра съществува, но не е валидна карта с памет, затова не е използван или заменен. Играта стартира без него; проверете го в менюто VMC.
  AUTO_VMC_STILL_RUNNING: VMC на тази игра още се създава. Стартирайте играта отново след малко.
  NEUTRINO_DVR_QUICKBOOT: Стартирането на DVR изисква преход в режим PSX. Махнете -qb от общите и игровите аргументи на Neutrino.
  NEUTRINO_DVR_FILE_MISSING: 'Инсталацията на Neutrino за DVR е непълна. Липсва задължителен файл:'
  LOGOART: Изображения на логото
  HINT_LOGOART: Показва логото на играта (<ID>_LGO), когато темата го използва. Изкл. скрива и изображението му по подразбиране, но запазва кориците, изображенията на дискове и фоновете.
  PARENLOCK_GAME: Родителски контрол
  PARENLOCK_GAME_HINT: Изисква паролата за родителски контрол за стартиране на тази игра.
  PARENLOCK_GAME_NO_PASSWORD: Задайте парола за родителски контрол, иначе тази игра няма да бъде заключена.
  HINT_ENABLE_PCCF: CompactFlash в PC CARD на ранните японски PS2. Само собствени PS2 игри; CF изисква изключителен достъп до PC CARD. Рестартирайте, за да го освободите.
  PCCF_GAMES: Игри на PC CARD CF
  PCCF_UNAVAILABLE: 'CF не е налично: изисква ранна японска PS2 с PC CARD, съвместима карта и никакъв активен DEV9/HDD/мрежов драйвер.'
  PCCF_UNSUPPORTED_GAME: CF засега поддържа само собствени PS2 игри. VMC на CF, зареждането на PS1 и мрежовите постижения не са налични.
  HINT_ENABLE_DVR: Експериментално откриване на DESR DVR ISO файлове. Изисква включен HDD източник; стартирането на игри изисква външен Neutrino с поддръжка на DVR.

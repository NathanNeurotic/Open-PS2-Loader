  IGR_USB_DRIVERS_PROMPT: Η διαδρομή IGR είναι σε USB, αλλά στο %s λείπουν τα USBD.IRX και USBHDFSD.IRX, που χρειάζεται η κονσόλα για να φτάσει στο USB μετά από In-Game Reset. Χωρίς αυτά το IGR πέφτει στον περιηγητή του PS2. Αντιγραφή των οδηγών του RiptOPL εκεί τώρα; Το FMCB, το OpenTuna και άλλα exploit φορτώνουν επίσης αυτά τα αρχεία και ίσως συμπεριφέρονται διαφορετικά με αυτά. Υπάρχοντα αρχεία δεν αντικαθίστανται ποτέ. Μόνο USB FAT32.
  IGR_USB_DRIVERS_FAILED: Οι οδηγοί USB δεν αντιγράφηκαν στο %s (γεμάτη κάρτα ή χωρίς εγγραφή). Το IGR θα πέφτει στον περιηγητή του PS2.

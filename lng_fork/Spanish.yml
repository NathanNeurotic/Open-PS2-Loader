  NEUTRINO_SHOW_ARGS: Mostrar los argumentos de inicio
  HINT_NEUTRINO_SHOW_ARGS: Antes de cada inicio con Neutrino, muestra todos los argumentos que recibirá Neutrino y pregunta si continuar. Atrás vuelve al menú sin iniciar.
  NEUTRINO_ARGS_CONFIRM: Neutrino se iniciará con estos argumentos. ¿Iniciar?
  HINT_NARGS_EXTRA: Otras opciones de Neutrino, separadas por espacios, enviadas después de todo lo anterior. RIPPS2 siempre añade -bsd y -dvd para la unidad y la ISO del juego, -mc0 y -mc1 para sus VMC, -gsm para su modo de vídeo, y los modos de compatibilidad propios del juego. Una opción con su propia fila arriba (como -logo) pasa a esa fila al guardar, y se sigue enviando.
  GAME_TYPE_LABELS: Mostrar etiquetas [PS1]/[PS2]
  NEUTRINO_CHEATS_WRITE_FAILED: La lista de trucos no se pudo guardar en la carpeta de Neutrino, así que Neutrino no puede usarla. ¿Iniciar sin trucos?
  AUTO_CREATE_VMC: Crear VMC en el primer inicio
  HINT_AUTO_CREATE_VMC: Iniciar un juego de PS2 sin VMC en la ranura 1 crea una tarjeta de 8 MB en la unidad del juego, con el nombre que propone la pantalla VMC (compartida por todos los discos del juego), y la asigna. No para el disco duro interno con Neutrino.
  AUTO_VMC_CREATING: Creando la VMC de este juego...
  AUTO_VMC_FAILED: No se pudo crear la VMC de este juego. El juego se inicia sin ella.

  RA_NO_LINK_UNTRACKED: Red no disponible -- esta vez se inicia sin RetroAchievements.
  IGR_USB_DRIVERS_PROMPT: La ruta del IGR está en USB, pero faltan USBD.IRX y USBHDFSD.IRX en %s, que la consola necesita para llegar al USB tras un In-Game Reset. Sin ellos, el IGR vuelve al navegador de PS2. ¿Copiar ahora los controladores de RiptOPL? FMCB, OpenTuna y otros exploits también cargan estos archivos y pueden comportarse distinto con ellos. Los archivos existentes nunca se reemplazan. Solo USB FAT32.
  IGR_USB_DRIVERS_FAILED: No se pudieron copiar los controladores USB en %s (tarjeta llena o sin permiso de escritura). El IGR volverá al navegador de PS2.

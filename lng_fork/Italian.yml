  PARENLOCK_GAME_HINT: Chiedi la password del blocco genitori per avviare questo gioco.
  PARENLOCK_GAME_NO_PASSWORD: Imposta una password del blocco genitori, altrimenti questo gioco non verrà bloccato.
  HINT_ENABLE_PCCF: CompactFlash su PC CARD delle prime PS2 giapponesi. Solo giochi PS2 nativi; la CF richiede accesso esclusivo alla PC CARD. Riavvia per liberarla.
  PCCF_GAMES: Giochi PC CARD CF
  PCCF_UNAVAILABLE: 'CF non disponibile: richiede una PS2 giapponese con PC CARD dei primi modelli, una scheda compatibile e nessun driver DEV9/hard disk/rete attivo.'
  PCCF_UNSUPPORTED_GAME: La CF per ora supporta solo giochi PS2 nativi. VMC su CF, caricamento PS1 e obiettivi di rete non sono disponibili.
  HINT_ENABLE_DVR: Rilevamento sperimentale delle ISO DESR DVR. Richiede la sorgente hard disk attiva; l'avvio dei giochi richiede un Neutrino esterno compatibile con DVR.

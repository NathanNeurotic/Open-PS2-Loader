  VMC_REPLACE_REQUIRES_DELETE: Cambiare la dimensione della VMC cancellerebbe i suoi salvataggi. Fai un backup della VMC esistente e usa Elimina prima di creare una nuova dimensione.
  VMC_CREATE_FAILED: Impossibile creare la VMC. Controlla l'unità, la connessione e l'accesso in scrittura. I salvataggi esistenti non sono stati sostituiti.
  RA_EXPERIMENTAL_CARDS: Schede sperimentali Caduceus
  HINT_RA_EXPERIMENTAL_CARDS: Schede degli obiettivi sperimentali in gioco su PS2. Possono sfarfallare o bloccare i giochi. Solo Caduceus; Disattivo usa l'impulso dorato. Vale dal prossimo avvio di un gioco.
  RA_NEUTRINO_UNTRACKED: RA con Neutrino non è disponibile per questo avvio. Controlla il modulo RA, l'IP del compagno e la lista di tracciamento salvata. Avvio senza obiettivi.
  UDPFS_IP_CONFLICT: Un altro dispositivo della tua rete usa l'indirizzo IP di questa PS2, quindi le risposte del server UDPFS vanno a lui. Imposta un altro IP per la PS2 nelle impostazioni di rete.
  XERA_ACHIEVEMENTS: Libreria RetroAchievements (xeRAbora)
  XERA_USE_LIBRARY: Sfoglia questo gioco tramite la libreria RetroAchievements nel menu principale.
  XERA_OPEN_NETWORK: Impossibile raggiungere xeRAbora. Attiva OPEN TO THE NETWORK nelle sue impostazioni, controlla l'IP del compagno RA e il firewall del PC.
  XERA_UNKNOWN_GAME: xeRAbora non conosce questa immagine. Esegui prima il controllo del supporto RA.
  XERA_NOT_PLAYED: Non ancora nella tua libreria RetroAchievements. Giocalo una volta con gli obiettivi, poi premi Select.
  XERA_CONNECTION_ERROR: Impossibile leggere la lista da xeRAbora. Premi Select per riprovare.
  CAD_PAIR_UDPFS: Impossibile raggiungere Caduceus. Abbina ART/CADUCEUS.KEY nella cartella condivisa da PS2-Servers e imposta l'IP del compagno RA.
  RA_WL_NOT_SAVED: Impossibile salvare la lista di tracciamento. Assicurati che l'unità o la condivisione del gioco sia scrivibile, poi controlla di nuovo.
  RA_UDPFS_LOAD_FIRST: Apri una volta la pagina UDPFS perché il suo modulo di rete si carichi, poi riprova.
  CAD_UDPFS_IMG: 'Il browser di Caduceus richiede SMB o UDPFS File: UDPFS IMG non ha una cartella condivisa per la sua chiave.'
  XERA_SET_CLOCK: Non ancora nella tua libreria RetroAchievements. Imposta l'orologio della console nelle impostazioni di sistema per vederne la lista completa, o giocalo una volta con gli obiettivi.
  CFG_TITLES: Mostra i titoli CFG nelle liste dei giochi
  HINT_CFG_TITLES: Mostra il titolo del CFG di ogni gioco al posto del nome del file, e ordina in base a esso. Legge ogni CFG quando una lista si aggiorna, quindi le liste si caricano più lentamente. Solo visualizzazione.
  AUTO_VMC_INVALID: Il file VMC di questo gioco esiste ma non è una memory card valida, quindi non è stato usato né sostituito. Il gioco parte senza; controllalo nel menu VMC.
  AUTO_VMC_STILL_RUNNING: La VMC di questo gioco è ancora in creazione. Riavvia il gioco tra un momento.
  NEUTRINO_DVR_QUICKBOOT: L'avvio DVR richiede la transizione in modalità PSX. Rimuovi -qb dagli argomenti di Neutrino globali e del gioco.

  RA_NO_LINK_UNTRACKED: Rete non disponibile -- questa volta avvio senza RetroAchievements.
  IGR_USB_DRIVERS_PROMPT: Il percorso IGR è su USB, ma in %s mancano USBD.IRX e USBHDFSD.IRX, che servono alla console per raggiungere l'USB dopo un In-Game Reset. Senza di essi l'IGR torna al browser della PS2. Copiare ora i driver di RiptOPL? FMCB, OpenTuna e altri exploit caricano anche questi file e potrebbero comportarsi diversamente con essi. I file esistenti non vengono mai sostituiti. Solo USB FAT32.
  IGR_USB_DRIVERS_FAILED: Impossibile copiare i driver USB in %s (memory card piena o non scrivibile). L'IGR tornerà al browser della PS2.

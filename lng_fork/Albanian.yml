  HINT_CFG_TITLES: Shfaq titullin nga CFG e çdo loje në vend të emrit të skedarit, dhe rendit sipas tij. Lexon çdo CFG kur rifreskohet një listë, ndaj listat ngarkohen më ngadalë. Vetëm për shfaqje.
  AUTO_VMC_INVALID: Skedari VMC i kësaj loje ekziston por nuk është kartë memorieje e vlefshme, ndaj nuk u përdor as u zëvendësua. Loja fillon pa të; kontrolloje te menyja VMC.
  AUTO_VMC_STILL_RUNNING: VMC e kësaj loje ende po krijohet. Nise lojën përsëri pas pak.
  NEUTRINO_DVR_QUICKBOOT: Nisja DVR kërkon kalimin në mënyrën PSX. Hiq -qb nga argumentet globale dhe për lojë të Neutrino.
  NEUTRINO_DVR_FILE_MISSING: 'Instalimi i Neutrino për DVR është i paplotë. Mungon skedari i nevojshëm:'
  LOGOART: Imazhi i logos
  HINT_LOGOART: Shfaq logon e një loje (<ID>_LGO) kur tema e përdor. Fikur fsheh edhe imazhin e saj të parazgjedhur, por mban kopertinat, imazhet e disqeve dhe sfondet.
  PARENLOCK_GAME: Kyçi prindëror
  PARENLOCK_GAME_HINT: Kërkon fjalëkalimin e kyçit prindëror për të nisur këtë lojë.
  PARENLOCK_GAME_NO_PASSWORD: Vendos një fjalëkalim për kyçin prindëror, përndryshe kjo lojë nuk do të kyçet.
  HINT_ENABLE_PCCF: CompactFlash përmes PC CARD i PS2-ve të hershme japoneze. Vetëm lojëra native PS2; CF kërkon qasje ekskluzive në PC CARD. Rinis për ta liruar.
  PCCF_GAMES: Lojërat PC CARD CF
  PCCF_UNAVAILABLE: 'CF nuk është i disponueshëm: kërkon një PS2 të hershme japoneze me PC CARD, një kartë të përputhshme dhe asnjë drajver aktiv DEV9/HDD/rrjeti.'
  PCCF_UNSUPPORTED_GAME: CF aktualisht mbështet vetëm lojëra native PS2. VMC në CF, ngarkimi PS1 dhe arritjet në rrjet nuk janë të disponueshme.
  HINT_ENABLE_DVR: Zbulim eksperimental i ISO-ve DESR DVR. Kërkon burimin HDD të ndezur; nisja e lojës kërkon një Neutrino të jashtëm që mbështet DVR.
  THEME_VIEW: "Pamja e temës"
  HINT_THEME_VIEW: "Si i shfaq tema lojërat: List, Coverflow, PSBBN Flow ose Grid. Mbaj L3 në faqen kryesore për të ndërruar. Temat pa atë pamje përdorin pamjen e tyre të paracaktuar."
  BOTH: Të dyja

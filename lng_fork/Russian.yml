  HINT_MMCE_GAMEID: Сообщает устройству MMCE, какая игра запускается, чтобы оно переключилось на карту памяти этой игры.
  HINT_MMCE_COMM_BUTTON: Тайминги связи с MMCE. Меняйте их, только если игры зависают или медленно грузятся.

  HINT_ENABLE_USB: Загружает драйвер USB-накопителей.
  HINT_ENABLE_MX4SIO: Загружает драйвер адаптера SD-карт MX4SIO.
  HINT_ENABLE_ILINK: Загружает драйвер накопителей iLink (FireWire).
  HINT_NETSTART: 'Запускает сеть: «Авто» при запуске, «Вручную» при открытии её страницы. «Выкл.» не трогает сетевой адаптер.'

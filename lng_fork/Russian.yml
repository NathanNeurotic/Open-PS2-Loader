  HINT_MENU_VMODE: Видеовыход меню. Игры используют GSM. Удерживайте «Подтвердить», чтобы оставить новый режим.
  HINT_THEME: Вид меню. Темы читаются из папки THM на каждом устройстве.
  HINT_COVERFLOW_BUTTON: Число, размер, анимация и затемнение обложек для темы Coverflow.

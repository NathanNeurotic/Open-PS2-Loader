  HINT_FAVMODE: Страница избранных игр. «Авто» при запуске, «Вручную» при открытии, «Выкл.» скрывает её.
  HINT_BDMA_BUTTON: Какой драйвер exFAT использует POPSTARTER для игр PS1 на USB, MX4SIO, MMCE, HDD или iLink.
  HINT_VCD_LIST_BUTTON: 'Как показываются игры PS1: скрыть ID игр, показать только диск 1, показать разделы PP на HDD.'

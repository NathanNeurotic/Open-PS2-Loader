  "VCD_HIDE_GAMEID": "Itago ang PS1 Game ID (VCD list)"
  "HINT_VCD_HIDE_GAMEID": "Pangkosmetiko lamang -- itago ang nauunang game-ID prefix (hal. SLUS_005.51.) sa mga pangalan ng PS1/VCD list. Ang mga pangalang walang ID ay ipinapakita nang buo. Hindi binabago ang paglulunsad, cover art, o mga favorites."
  "VCD_FIRST_DISC": "Unang disc lang (multi-disc PS1)"
  "HINT_VCD_FIRST_DISC": "Ipakita lamang ang Disc 1 ng isang multi-disc na PS1 game sa mga listahan ng device (istilong POPSLoader). Itinatago ang mga file na pinangalanang (Disc 2), (CD 2), atbp. Nananatili ang lahat ng disc sa card para sa in-game na pagpapalit; hindi sinasala ang mga Favorites."

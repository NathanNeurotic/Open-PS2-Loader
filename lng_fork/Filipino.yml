  HINT_VCD_SHOW_PP_POPS: HDD lamang -- inililista bilang mga larong PS1 ang mga partition na iisa ang laro at pinangalanang PP.<ID>.POPS.<name> (hal. PP.SCES-01492.POPS.MEDIEVIL). Paglilista lamang; hindi nagbabago ang paglulunsad. Nananatiling nakatago ang iba pang PP.* na partition (mga app, larong PS2).

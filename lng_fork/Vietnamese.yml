  "HINT_NEUTRINO_GSM_COMP": "Bản sửa lỗi đảo trường (field-flipping) cho các game bị rung hoặc xé hình dưới chế độ Neutrino Video được ép buộc. Cần đặt một chế độ Neutrino Video."

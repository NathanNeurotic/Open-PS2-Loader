  HINT_RA_EXPERIMENTAL_CARDS: Thẻ thành tích thử nghiệm bên trong trò chơi PS2. Có thể nhấp nháy hoặc làm treo trò chơi. Chỉ Caduceus; Tắt thì dùng nhịp vàng. Có hiệu lực từ lần chạy trò chơi tiếp theo.

  "NEUTRINO_TOO_FRAGMENTED_NET": "Quá phân mảnh đối với Neutrino (%d mảnh, giới hạn %d bao gồm cả VMC) -- hãy chống phân mảnh trên PC; đã hủy khởi chạy."

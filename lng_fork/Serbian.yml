  HINT_CUSTOM_SETTINGS_PATH: Čuva podešavanja u fascikli koju izaberete, npr. mass0:/OPL. Ostavite prazno za fasciklu iz koje je OPL pokrenut. Uređaj se učitava po potrebi, pa ne mora biti montiran dok kucate.

  UDPBD_NEEDS_STATIC_IP: UDPFS/UDPBD koriste sačuvanu statičku PS2 IP adresu. Za ove prenose nameće se statička; vaš DHCP izbor ostaje za SMB/HTTP.
  NETBOOT_RESTART: Ponovo pokrenite OPL da biste primenili promenu protokola mrežnog pokretanja.
  NET_UDPFS_TAB_HINT: 'UDPFS je uključen: izađite iz Podešavanja, otvorite stranicu UDPFS igre i pritisnite Potvrdi za povezivanje. Na računaru radi udpfsd -fsroot <games folder>.'
  NET_UDPBD_TAB_HINT: 'Mrežni blok-uređaj je uključen: njegova kartica se pojavljuje kada server na računaru odgovori (udpfsd -bdpath za UDPFS sliku, udpbd-server za UDPBD).'
  NEUTRINO_TOO_FRAGMENTED_NET: Previše fragmentisano za Neutrino (%d fragmenata, granica %d uklj. VMC-ove); defragmentirajte na računaru. Pokretanje je prekinuto.
  UDPFS_GAMES: UDPFS igre
  NET_NEEDS_NEUTRINO: Mrežne (UDP) igre mogu da se pokrenu samo preko jezgra Neutrino. Proverite da li neutrino.elf postoji i da li je format podržan.
  VCD_NOT_ON_NET: PS1 (.VCD) igre ne mogu da se pokrenu preko mrežnog uređaja.
  MX4SIO_PADEMU_WARN: MX4SIO i emulacija kontrolera dele SIO2 magistralu, pa igra možda neće hteti da se pokrene.

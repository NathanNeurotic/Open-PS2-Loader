  HINT_LOGOART: "Wyświetla logo gry (<ID>_LGO), jeśli używa go motyw. Wyłączenie ukrywa również obraz domyślny, bez wpływu na okładki, grafiki płyt i tła."

# Supplemental labels adapted from RIPPS2 (Akilluminati47):
# https://github.com/akilluminati47/RIPPS2/tree/main/elf/lang
  OK: OK
  START: Uruchom
  RESET: Resetuj
  VMC_STATUS: Stan
  ENTER: Enter
  VSYNC: Synchronizacja pionowa
  AUTOSTARTLAST: Autostart
  DS34BT_MODE: DualShock3/4 BT
  HINT_NEUTRINO_AUTO_ELF: Przekazuje rozruchowy ELF gry do Neutrino, aby znalazło konfigurację dla danego tytułu. Domyślnie włączone; ręcznie ustawiona opcja Boot ELF ma pierwszeństwo.
  HINT_POPSTARTER_PATH: Gdzie jest POPSTARTER.ELF. Gdy puste, RIPPS2 wpisuje ten znaleziony na dysku; nadpisz, aby użyć innego, np. usb:/POPS/POPSTARTER.ELF
  NEUTRINO_ARGS_TOO_LONG: Argumenty Neutrino przekraczają długość, którą można zapisać. Skróć jakieś pole przed zapisem.
  NEUTRINO_LAUNCH_ARGS_OVERFLOW: Argumenty uruchomienia Neutrino przekraczają bezpieczny limit. Skróć argumenty globalne lub gry.
  NEUTRINO_AUTO_ELF: Automatyczny Boot ELF (-elf)
  HINT_NEUTRINO_PATH: 'Gdzie jest neutrino.elf? <nie ustawiono> = urządzenie gry -> mc0/mc1. Własna pełna ścieżka jest próbowana jako pierwsza. Przykłady: mass0:/neutrino/neutrino.elf | ata:/neutrino/neutrino.elf | mmce0:/neutrino/neutrino.elf | mc0:/neutrino/neutrino.elf | pfs0:/neutrino/neutrino.elf'
  GAME_VIEW_MODE: Wyświetlanie gier PS2/PS1
  HINT_GAME_VIEW_MODE: Wszystko pokazuje gry PS2 i PS1 razem, a L3 przełącza Wszystko, PS1, PS2. PS2 lub PS1 pokazuje tylko ten typ i wyłącza L3. APPS i Ulubione gry mają własne zasady wyświetlania.
  VIEW_MIXED: Pokazywane gry PS2 + PS1
  VIEW_PS1_ELF: Pokazywane aplikacje PS1 ELF
  APPS_DISPLAY: Wyświetlanie aplikacji
  HINT_APPS_DISPLAY: Wszystko pokazuje każdy ELF na jednej liście APPS z wyłączonym L3. Aplikacje / PS1ELF przenosi tytuły zawierające [PS1] na drugą stronę L3; sposób uruchamiania się nie zmienia.
  VIEW: Widok
  VIEW_PS2: Pokazywane ulubione gry PS2
  VIEW_PS1: Pokazywane ulubione gry PS1
  VIEW_ELF: Pokazywane ulubione ELF-y
  VIEW_ALL: Pokazywane wszystkie ulubione gry

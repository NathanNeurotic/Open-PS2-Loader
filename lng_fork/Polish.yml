  RA_TEST_LINK: Testuj połączenie RetroAchievements z PC
  RA_CHECKING_IMAGE: Sprawdzanie obrazu, to potrwa kilka sekund...
  RA_CHECK_RUNNING: Sprawdzanie obrazu już trwa
  RA_LOOKING_FOR_PC: Szukanie klienta na PC...

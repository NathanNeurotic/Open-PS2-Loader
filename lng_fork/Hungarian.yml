  CFG_TITLES: CFG címek mutatása a játéklistákban
  HINT_CFG_TITLES: A fájlnév helyett minden játék CFG-jéből a Címet mutatja, és aszerint rendez. Lista frissítésekor minden CFG-t beolvas, így a listák lassabban töltenek be. Csak megjelenítés.
  AUTO_VMC_INVALID: A játék VMC fájlja létezik, de nem érvényes memóriakártya, ezért nem lett se használva, se lecserélve. A játék VMC nélkül indul; ellenőrizd a VMC menüben.
  AUTO_VMC_STILL_RUNNING: A játék VMC-je még készül. Indítsd újra a játékot egy pillanat múlva.
  NEUTRINO_DVR_QUICKBOOT: A DVR indításához PSX módba váltás kell. Vedd ki a -qb kapcsolót a globális és a játékonkénti Neutrino argumentumokból.
  NEUTRINO_DVR_FILE_MISSING: 'A DVR-es Neutrino telepítés hiányos. Hiányzó szükséges fájl:'
  LOGOART: Logóképek
  HINT_LOGOART: Megmutatja a játék logóját (<ID>_LGO), ha a téma használja. Kikapcsolva az alapértelmezett képét is elrejti, de a borítókat, lemezképeket és háttereket megtartja.
  PARENLOCK_GAME: Szülői zár
  PARENLOCK_GAME_HINT: A játék indításához kérje a szülői zár jelszavát.
  PARENLOCK_GAME_NO_PASSWORD: Állíts be szülői zár jelszót, különben ez a játék nem lesz zárolva.
  HINT_ENABLE_PCCF: A korai japán PS2-k PC CARD CompactFlash-e. Csak natív PS2 játékok; a CF-nek kizárólagos PC CARD hozzáférés kell. A felszabadításhoz indítsd újra.
  PCCF_GAMES: PC CARD CF játékok
  PCCF_UNAVAILABLE: 'A CF nem érhető el: korai japán PC CARD-os PS2, kompatibilis kártya és aktív DEV9/HDD/hálózati illesztőprogram hiánya kell hozzá.'
  PCCF_UNSUPPORTED_GAME: A CF jelenleg csak natív PS2 játékokat támogat. A CF-es VMC, a PS1 betöltés és a hálózati teljesítmények nem érhetők el.
  HINT_ENABLE_DVR: Kísérleti DESR DVR ISO felderítés. Bekapcsolt HDD forrás kell hozzá; a játékindításhoz külső, DVR-képes Neutrino kell.

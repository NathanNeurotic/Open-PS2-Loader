  HINT_RA_EXPERIMENTAL_CARDS: Kartu pencapaian eksperimental di dalam game PS2. Bisa berkedip atau membuat game macet. Hanya Caduceus; Mati memakai denyut emas. Berlaku di peluncuran game berikutnya.
  RA_NEUTRINO_UNTRACKED: Neutrino RA tidak tersedia untuk peluncuran ini. Periksa runtime RA, IP pendamping, dan daftar pantau yang disimpan. Diluncurkan tanpa pencapaian.
  UDPFS_IP_CONFLICT: Perangkat lain di jaringanmu memakai alamat IP PS2 ini, jadi jawaban server UDPFS sampai ke sana. Atur IP PS2 yang berbeda di Pengaturan Jaringan.

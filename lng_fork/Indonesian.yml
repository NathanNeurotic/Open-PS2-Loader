  HINT_DEBUG: 'Bantuan pengembang: layar berwarna saat game boot, dan penghitung pemuatan gambar di menu.'
  HINT_BDMPREFIX: Subfolder di drive USB, MX4SIO, iLink, dan exFAT yang berisi folder game. Kosong memakai root drive.

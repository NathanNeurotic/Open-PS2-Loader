  BDM_UNSUPPORTED_SECTOR_SIZE_ERROR: '%d: Sebuah drive tidak dipasang karena sektornya bukan 512 byte (misalnya drive sektor 4K). OPL hanya bisa membaca sektor 512 byte.'
  HDD_PARTITION_RENAME_UNSUPPORTED: Judul ini adalah partisi APA tersendiri, dan OPL tidak pernah mengedit tabel partisi. Ganti namanya di PC.
  POPS_SETTINGS_UNREADABLE: Tidak bisa membaca pengaturan POPSTARTER -- kartu memori sedang sibuk atau tidak terbaca. Coba lagi setelah pemuatan selesai.
  GLOBAL_PS_EMULATION_SETTINGS: Pengaturan Emulasi PS Global
  RA_NO_LINK_UNTRACKED: Jaringan tidak tersedia -- kali ini diluncurkan tanpa RetroAchievements.
  IGR_USB_DRIVERS_PROMPT: Jalur IGR ada di USB, tetapi %s tidak punya USBD.IRX dan USBHDFSD.IRX, yang dibutuhkan konsol untuk menjangkau USB setelah In-Game Reset. Tanpa keduanya, IGR jatuh ke peramban PS2. Salin driver RiptOPL ke sana sekarang? FMCB, OpenTuna, dan exploit lain juga memuat file ini dan bisa berperilaku berbeda karenanya. File yang ada tidak pernah diganti. Hanya USB FAT32.
  IGR_USB_DRIVERS_FAILED: Tidak bisa menyalin driver USB ke %s (kartu penuh atau tidak bisa ditulisi). IGR akan jatuh ke peramban PS2.
  OFFICIAL_CFG_NOTIFICATION: Pengaturan OPL resmi dimuat dari %s
  CFM_VMODE_HOLD_KEEP: Tahan untuk mempertahankan
  BDM_PS2_FOLDERS_UNREADABLE: Tidak bisa membuka folder CD atau DVD di %s (galat %d), jadi perangkat itu tidak menampilkan game PS2. Tekan SELECT di halamannya untuk mencoba lagi.
  NEUTRINO_BD_NO_DEVICE_NUMBER: Sistem file Neutrino diatur ke bd, tetapi perangkat ini tidak pernah melaporkan nomor perangkatnya, jadi Neutrino tidak bisa diarahkan ke sana. Atur sistem file Neutrino game ini ke Auto atau exfat.
  CFM_VMODE_REVERT_IN: Kembali dalam %d dtk
  EMBER_DITHER: Dithering Ember
  HINT_EMBER_DITHER: Dithering Ember (Nyala atau Mati), ditulis ke EMBER/settings.txt di perangkat yang diluncurkan. Nilai per game lebih diutamakan.
  EMBER_SHADING: Shading Ember
  HINT_EMBER_SHADING: 'Kedalaman warna Ember: 15-bit, atau 24-bit (eksperimental). Ditulis ke EMBER/settings.txt di perangkat yang diluncurkan. Nilai per game lebih diutamakan.'
  EMBER_CONTROLLER: Kontroler Ember
  HINT_EMBER_CONTROLLER: 'Mode kontroler Ember: Otomatis, Analog, atau D2A. Biasanya paling baik diatur per game (Segitiga > Pengaturan Game Ember), yang lebih diutamakan.'
  EMBER_480P_CONFIRM: Ember 480p tidak menampilkan gambar lewat komposit. Pakai 480p?
  EMBER_SHADING_24: 24-bit (eksperimental)
  EMBER_GAME_SETTINGS: Pengaturan Game Ember
  HINT_EMBER_GAME_SETTING: Hanya game ini. Tekan OK untuk menulis EMBER/games/<nama>/settings.txt sebelum peluncuran. Bawaan yang tidak disentuh mempertahankan nilai yang sudah ada di file; mengubah nilai kembali ke Bawaan menghapus penimpaannya.
  EMBER_TIMING: Timing Ember
  HINT_EMBER_TIMING: 'Timing video Ember: Otomatis mengikuti region disk, NTSC memaksa 60 Hz, PAL memaksa 50 Hz. Ditulis ke EMBER/settings.txt di perangkat yang diluncurkan.'
  EMBER_GLOBAL_WARNING: Pengaturan Ember ini berlaku untuk setiap game PS1, dan beberapa game crash karenanya. Untuk mengubah satu game saja, pakai Segitiga > Pengaturan Game Ember di game itu.
  HINT_COVERFLOW_COUNT: Berapa sampul yang ditampilkan RIPFLOW di setiap sisi sampul yang dipilih.
  HINT_COVERFLOW_SCALE: Seberapa besar RIPFLOW menggambar sampul yang dipilih dibanding yang lain.
  HINT_COVERFLOW_ANIM: Seberapa cepat sampul meluncur saat kamu bergerak di sepanjang aliran.
  HINT_NARGS_QB: 'Quick Boot: melewati layar awal Neutrino sendiri. Nyala di sini, dikirim untuk setiap game; mati, RIPPS2 tetap mengirimnya sendiri untuk game USB, iLink, dan jaringan, tempat ia dibutuhkan.'
  HINT_NARGS_DBC: 'Warna Debug: Neutrino mengisi layar dengan satu warna di setiap langkah pemuatan, sehingga foto menunjukkan di mana game berhenti.'
  HINT_NARGS_LOGO: Menampilkan logo PS2 sebelum game (boot ulang IOP kedua, yang dibutuhkan beberapa drive iLink). Mati di sini, RIPPS2 mengikuti Peluncuran Game > Logo PS2, dan tidak pernah mengirimnya untuk game MMCE atau jaringan.
  HINT_NARGS_CWD: 'Folder yang dianggap game sebagai miliknya. Kosong: bawaan Neutrino.'
  HINT_NARGS_CFG: 'File konfigurasi Neutrino milikmu sendiri (-cfg). Kosong: milik Neutrino.'
  HINT_NARGS_ELF: 'Menjalankan ELF ini alih-alih file boot yang ditunjuk disk. Kosong: milik game sendiri.'
  HINT_NARGS_ATA0: Image HDD yang dipasang Neutrino sebagai HDD internal konsol, untuk game yang memakai HDD (-ata0).
  HINT_NARGS_ATA0ID: File ID yang menyertai image HDD itu (-ata0id).
  HINT_NARGS_ATA1: Image HDD kedua (-ata1).

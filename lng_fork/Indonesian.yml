  NEUTRINO_SHOW_ARGS: Tampilkan Argumen Peluncuran
  HINT_NEUTRINO_SHOW_ARGS: Sebelum setiap peluncuran Neutrino, tampilkan semua argumen yang akan diterima Neutrino dan tanyakan apakah lanjut. Kembali kembali ke menu tanpa meluncurkan.
  NEUTRINO_ARGS_CONFIRM: Neutrino akan mulai dengan argumen ini. Luncurkan?
  HINT_NARGS_EXTRA: Flag Neutrino lainnya, dipisahkan spasi, dikirim setelah semua yang di atas. RIPPS2 selalu menambahkan -bsd dan -dvd untuk drive dan ISO game, -mc0 dan -mc1 untuk VMC-nya, -gsm untuk mode videonya, dan mode kompatibilitas milik game. Flag yang punya baris sendiri di atas (seperti -logo) dipindah ke baris itu saat disimpan, dan tetap dikirim.
  GAME_TYPE_LABELS: Tampilkan Label [PS1]/[PS2]
  NEUTRINO_CHEATS_WRITE_FAILED: Daftar cheat tidak bisa disimpan ke folder Neutrino, jadi Neutrino tidak bisa memakainya. Luncurkan tanpa cheat?
  AUTO_CREATE_VMC: Buat VMC saat Peluncuran Pertama
  HINT_AUTO_CREATE_VMC: Meluncurkan game PS2 tanpa VMC di slot 1 membuat kartu 8 MB di perangkat game, dinamai seperti saran layar VMC (dipakai bersama oleh setiap disk game itu), lalu memasangnya. Tidak untuk HDD internal di bawah Neutrino.
  AUTO_VMC_CREATING: Membuat VMC game ini...
  AUTO_VMC_FAILED: Tidak bisa membuat VMC game ini. Game dimulai tanpa VMC.

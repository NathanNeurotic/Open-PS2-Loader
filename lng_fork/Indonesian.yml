  HINT_CFG_TITLES: Menampilkan Judul dari CFG setiap game alih-alih nama filenya, dan mengurutkan berdasarkan itu. Membaca setiap CFG saat daftar disegarkan, jadi daftar dimuat lebih lambat. Hanya tampilan.

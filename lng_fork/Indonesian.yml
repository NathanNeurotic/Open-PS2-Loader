  HINT_NET_ADVANCED: Membuka Mode Link Ethernet dan Port SMB untuk diedit.
  HINT_ETH_LINK_MODE: Memaksa kecepatan link jaringan dan duplex. Biarkan Otomatis kecuali link terus putus.

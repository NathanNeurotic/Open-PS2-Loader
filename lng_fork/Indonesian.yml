  RA_NO_IP: Konsol tidak punya alamat IP
  RA_NO_IP2: Periksa DHCP atau alamat statis di pengaturan Jaringan
  RA_TEST_NO_ANSWER: Tidak ada klien PC yang menjawab dalam 3 detik
  RA_TEST_NO_ANSWER2: Konsol%s. Pastikan xeRAbora berjalan dan UDP 18194 terbuka
  RA_TEST_FOUND: Klien PC ditemukan%s%s %s
  RA_TEST_FOUND2: Jawaban dalam %u ms, konsol%s

  RA_DISC_HASH_FAILED: Hash disk tidak bisa dihitung -- periksa RA/hashes.txt di folder pengaturan
  RA_DISC_HOME_ERROR: Jalur pengaturan tidak bisa dipakai untuk daftar pantau disk
  RA_DISC_ENABLE: Nyalakan telemetri RetroAchievements di pengaturan Jaringan lebih dulu

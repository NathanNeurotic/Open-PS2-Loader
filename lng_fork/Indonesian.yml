  HINT_SELCOLOR: Warna item yang disorot.
  HINT_UICOLOR: Rona latar kotak dialog.
  HINT_TITLECOLOR: Warna judul game di daftar.
  HINT_BGCOLOR: Warna latar menu.
  HINT_PLASCOLOR: Warna yang dicampur ke latar animasi.
  HINT_RESETCOLOR: Mengembalikan warna bawaan RiptOPL, bukan warna tema.
  HINT_WIDESCREEN: Menggambar menu untuk TV 16:9.
  HINT_XOFF: Menggeser menu ke kiri atau kanan di layar.
  HINT_YOFF: Menggeser menu ke atas atau bawah di layar.
  HINT_MENU_OVERSCAN: Mengecilkan menu ke dalam jika TV memotong tepinya.

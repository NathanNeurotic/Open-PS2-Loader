  HINT_FAVMODE: Halaman Game Berbintang. Otomatis mulai saat boot, Manual saat kamu membukanya, Mati menyembunyikannya.
  HINT_BDMA_BUTTON: Driver exFAT yang dipakai POPSTARTER untuk game PS1 di USB, MX4SIO, MMCE, HDD, atau iLink.
  HINT_VCD_LIST_BUTTON: 'Cara game PS1 ditampilkan: sembunyikan ID game, hanya tampilkan disk 1, tampilkan partisi PP di HDD.'

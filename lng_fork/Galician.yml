  POPSTARTER_NET_INVALID: A configuración de rede de POPSTARTER non é válida. Corríxaa en Configuración de rede de POPSTARTER.
  POPSTARTER_SMB_NEEDS_STATIC: POPSTARTER SMB require unha configuración de rede estática. Axuste primeiro a Configuración de rede de POPSTARTER.
  POPS_OVERWRITE_TITLE: Substituír a configuración de POPSTARTER?
  POPS_OVERWRITE_MSG: Xa existe unha configuración de rede de POPSTARTER. Substituíla por estes axustes?
  POPS_KEEP_EXISTING: Manter a existente
  POPS_REPLACE: Substituír

  DEFAULT_CORE: Núcleo do cargador predeterminado
  DISPLAY_SETTINGS: Pantalla
  ENABLEIMAGE: Imaxe de trucos PS2RD
  ENABLE_ART_TAR: Arquivo .tar de portadas
  FOLDER_NAV: Explorar cartafoles na lista de xogos
  GAME_LAUNCHING: Inicio de xogos
  GAME_LIST_SETTINGS: Configuración da lista de xogos
  GAME_SOURCES: Orixes de xogos
  HINT_BDMA_APPLY: 'Activado: antes de iniciar un VCD, prepara o contorno BDMA de POPSTARTER necesario na tarxeta de memoria cando é posible. POPSTARTER iníciase aínda que falle a preparación. Desactivado: xestione os controladores da tarxeta cos selectores Orixe/Modo de abaixo.'
  HINT_BDMA_MODE: Controlador de dispositivo de bloques que carga POPSTARTER. Cambialo copia os módulos na tarxeta; FAT32 = ningún (controlador integrado).
  HINT_BDMA_SOURCE: Dispositivo cuxo cartafol POPS contén os seus ficheiros do controlador BDMAssault (usbd.irx.* / usbhdfsd.irx.*); iLink usa o sufixo .ilink.
  HINT_DEFAULT_CORE: Predeterminado global só onde se admiten os dous núcleos. UDPFS/UDPBD usan sempre Neutrino; SMB/HTTP usan sempre <OPL>. Unha escolla de núcleo por xogo ten prioridade onde estea dispoñible.
  HINT_ENABLEIMAGE: Aplica ao xogo un parche .img de PS2RD xa feito.
  HINT_FOLDER_NAV: Mostra os subcartafoles de CD/DVD como entradas explorables; escolla para abrir, cancele para volver
  HINT_MMCEIGR_SLOT: A orde de cambiar á tarxeta de arranque envíase ás ranuras escollidas no IGR
  HINT_MMCE_USE_ALARMS: DESACTIVADO pode axudar ao rendemento, pero un tempo esgotado de MMCE pode conxelar o xogo
  HINT_MMCE_WAIT_CYCLES: Valores máis baixos poden mellorar o rendemento pero causar inestabilidade
  HINT_MODE7: 'Só Neutrino: corrixe xogos que desbordan un búfer do IOP (-gc=7)'
  HINT_NEUTRINO_ARGS: Opcións avanzadas de Neutrino. Global aplícase a todos os xogos; por xogo engádese por riba. Extra admite outras marcas compatibles. Poña $ diante dunha marca para desactivala sen borrala.
  HINT_NEUTRINO_AUTO_ELF: Pasa a Neutrino o ELF de arranque do xogo para buscar a configuración de cada título. Activado por defecto; unha opción de ELF de arranque posta a man ten prioridade.
  HINT_NEUTRINO_BSDFS: Forza o sistema de ficheiros de dispositivo de bloques de Neutrino (-bsdfs). Auto = o predeterminado de cada dispositivo. hdl/bd son opcións para expertos; combíneas cun -dvd= axeitado nos argumentos de inicio se a forma automática da ruta non encaixa.
  HINT_NEUTRINO_DEVICE: Dispositivo que contén neutrino.elf (nun cartafol NEUTRINO/ ou neutrino/). Auto = o dispositivo do propio xogo e despois mc0/mc1. Dispositivo do xogo = só o dispositivo do xogo.
  HINT_NEUTRINO_GSM_COMP: Corrección de campos para xogos que tremen ou se rachan cun modo de vídeo de Neutrino forzado. Precisa un modo de vídeo de Neutrino definido.
  HINT_NEUTRINO_VIDEO: Forza o modo de vídeo de saída GS de Neutrino (-gsm). Desactivado mantén o predeterminado do xogo.
  HINT_POPSTARTER_DEVICE: Dispositivo que contén POPS/POPSTARTER.ELF para iniciar VCD de PS1. Predeterminado = dispositivo de arranque (cwd) e despois o propio dispositivo do VCD. Dispositivo do xogo = só o dispositivo do VCD. Personalizado mostra unha ruta de texto libre.
  HINT_POPSTARTER_PATH: Onde está POPSTARTER.ELF. Se queda baleiro, RIPPS2 enche un que atope nunha unidade; escriba enriba para usar outro, como usb:/POPS/POPSTARTER.ELF
  HINT_POPSTARTER_RETROGEM_GAMEID: Debuxa o código de barras Game ID real do disco para Pixel FX / RetroGEM / PS2Digital ao iniciar xogos de PS1 (POPSTARTER VCD e Ember)
  HINT_POPS_IMPORT: Le IPCONFIG.DAT e SMBCONFIG.DAT de POPSTARTER do cartafol POPS do recurso SMB conectado. Non se escribe nada ata que confirme con Aceptar.
  HINT_POPS_PORT: Porto SMB no servidor; 445 é o predeterminado. Déixeo en 0 (ou 445) para un recurso normal; use 139 para servidores SMB1 antigos.
  HINT_RUMBLE: Vibración curta ao mover o cursor, confirmar ou volver; precisa un DualShock en modo analóxico
  HINT_VCD_FIRST_DISC: Mostra só o disco 1 dun xogo de PS1 de varios discos nas listas de dispositivos (ao estilo de POPSLoader). Oculta ficheiros chamados (Disc 2), (CD 2), etc. Todos os discos quedan na tarxeta para cambialos no xogo; os favoritos non se filtran.
  HINT_VCD_HIDE_GAMEID: 'Só estético: oculta un prefixo de ID de xogo inicial (p. ex. SLUS_005.51.) nos nomes das listas PS1/VCD. Os nomes sen ID móstranse tal cal. Non cambia o inicio, as portadas nin os favoritos.'
  HINT_VCD_SHOW_PP_POPS: 'Só HDD: lista como xogos de PS1 as particións dun só xogo chamadas PP.<ID>.POPS.<name> (p. ex. PP.SCES-01492.POPS.MEDIEVIL). Só listaxe; o inicio non cambia. As outras particións PP.* (aplicacións, xogos de PS2) seguen ocultas.'
  HINT_VMC_SLOT_DISABLE: Inicia sen o VMC desta ranura mantendo a súa tarxeta configurada. Só inicios con Neutrino; o xogo usa entón a tarxeta real desa ranura.

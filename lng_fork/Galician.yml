  CHEAT_SELECTION: Selección de trucos
  HDD_HINT: 'APA: Xogos do HDD. exFAT (MBR/GPT): Xogos BDM. Pódense activar os dous.'
  ERROR_SAVING_SETTINGS_TO: Non se puido escribir a configuración en %s (erro %d)

  MMCE_SEMA: Método de bloqueo da cola de semáforos
  HINT_MMCE_SEMA: THFIFO pode axudar á compatibilidade pero empeorar o rendemento
  WRITE_POPSTARTER_NET: Escribir a configuración de rede de POPSTARTER
  HINT_WRITE_POPSTARTER_NET: Garda tamén estes valores IP + recurso SMB nos propios IPCONFIG.DAT / SMBCONFIG.DAT de POPSTARTER na tarxeta de memoria (para VCD por SMB).
  NEUTRINO_PATH: Ruta de Neutrino
  HINT_NEUTRINO_PATH: 'Onde está neutrino.elf? <not set> = Dispositivo do xogo -> mc0/mc1. Próbase primeiro unha ruta completa personalizada. Exemplos: mass0:/neutrino/neutrino.elf | ata:/neutrino/neutrino.elf | mmce0:/neutrino/neutrino.elf | mc0:/neutrino/neutrino.elf | pfs0:/neutrino/neutrino.elf'

  BOOT_LOADING_SOUNDS: Cargando os sons do tema...
  BOOT_BUILDING_MENU: Construíndo o menú...
  GSM_1080P_WARNING: 'AVISO: o 1080p progresivo forzado usa un raster GSM non estándar. Pasou as probas en hardware real, pero a súa pantalla pode non mostrar imaxe. Continúe baixo a súa responsabilidade.'
  GSM_1080P_PROCEED: Forzar 1080p para este xogo?
  GSM_1080P_SURE: Está seguro? Isto aplica 1080p progresivo forzado a este xogo.
  CUSTOM_SETTINGS_PATH: Ruta de configuración personalizada
  HINT_CUSTOM_SETTINGS_PATH: Garda a configuración nun cartafol que escolla, p. ex. mass0:/OPL. Déixeo baleiro para usar o cartafol desde o que arrincou OPL. O dispositivo cárgase cando se precisa, así que non ten que estar montado ao escribilo.
  PERGAME_MIXED_SETTINGS: Por xogo + global
  GSM_DEFAULTS: Predeterminados GSM (todos os xogos)
  ERR_DEVICE_BUSY_TIMEOUT: 'Dispositivo ocupado: a escritura da configuración nunca comezou. Inténteo de novo cando remate a carga.'
  SETTINGS_NO_HOME: Non se atopou ningunha tarxeta de memoria; non se pode gardar a configuración. OPL arrincou desde un dispositivo de rede, cuxa configuración debe estar nunha tarxeta local.
  BDMA_EQUIPPING: Preparando o controlador de PS1 na tarxeta de memoria...
  VCD_USB_BDMA: Controlador BDMA de USB
  HINT_VCD_USB_BDMA: 'Xogos de PS1 en USB: o controlador de POPSTARTER para a memoria. Preguntar pregunta en cada inicio; exFAT ou fat32 saltan a pregunta.'
  VCD_USB_BDMA_ASK: Preguntar

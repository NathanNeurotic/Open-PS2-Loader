  VCD_HIDE_GAMEID: Ocultar o Game ID de PS1 (lista VCD)
  VCD_SHOW_PP_POPS: Mostrar xogos de particións PP.<ID>.POPS (HDD)
  VCD_USB_MODE_HINT: Recoméndase fat32 para quen non use USB exFAT.
  VCD_USB_MODE_QUESTION: Modo USB fat32 ou exFAT?
  VCD_USB_MODE_TITLE: Modo VCD por USB
  VMC_SLOT1_DISABLE: Desactivar o VMC 1 (manter a tarxeta)
  VMC_SLOT2_DISABLE: Desactivar o VMC 2 (manter a tarxeta)
  NONE: Ningún

  VMC_FRAGMENTED_ON_CREATE: Creouse o VMC, pero está fragmentado. A emulación de tarxeta de memoria precisa un ficheiro continuo, así que este VMC omitirase ao iniciar e usarase a tarxeta real. Libere espazo e créeo de novo, ou cópieo doutro dispositivo.

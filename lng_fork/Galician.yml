  MENU_CONTROLLER: Mando
  MENU_AUDIO: Son
  NEUTRINO_DEV_UNSUPPORTED: Neutrino non pode iniciar desde este dispositivo; inicio cancelado.
  NEUTRINO_TOML_SYNC_FAILED: A configuración de rede de Neutrino (bsd toml) falta ou non se pode escribir; inicio cancelado, comprobe o cartafol neutrino.
  NEUTRINO_VMC_MISSING: Non se atopou o ficheiro VMC do xogo; iníciase sen el (o xogo usa a súa tarxeta real).
  GAMES_DEVICE: Dispositivo do xogo
  NEUTRINO_BAD_FORMAT: Neutrino non admite este formato de ficheiro, iniciando co núcleo <OPL>
  NEUTRINO_NOT_FOUND: Non se atopou o ELF de Neutrino, iniciando co núcleo <OPL>
  NEUTRINO_TOO_FRAGMENTED: Demasiado fragmentado para Neutrino (%d fragmentos, límite %d incl. VMC); probando no seu lugar o núcleo OPL.
  BDMA_ERR_SRC: Non se atoparon os ficheiros dos módulos BDMA no dispositivo de orixe.
  BDMA_ERR_SPACE: Non hai espazo abondo na tarxeta de memoria para os módulos BDMA.
  BDMA_ERR_IO: Erro ao escribir os módulos BDMA na tarxeta de memoria.
  UDPBD_NEEDS_STATIC_IP: UDPFS/UDPBD usan a IP estática gardada da PS2. Para estes transportes fórzase a estática; a súa preferencia DHCP mantense para SMB/HTTP.
  NETBOOT_RESTART: Reinicie OPL para aplicar o cambio de protocolo de arranque por rede.
  NET_UDPFS_TAB_HINT: 'UDPFS activado: saia da Configuración, abra a páxina Xogos UDPFS e prema Confirmar para conectar. No PC execútase udpfsd -fsroot <games folder>.'
  NET_UDPBD_TAB_HINT: 'Dispositivo de bloques en rede activado: a súa lapela aparece cando responde o servidor do PC (udpfsd -bdpath para Imaxe UDPFS, udpbd-server para UDPBD).'
  NEUTRINO_TOO_FRAGMENTED_NET: Demasiado fragmentado para Neutrino (%d fragmentos, límite %d incl. VMC); desfragmente no PC. Inicio cancelado.
  UDPFS_GAMES: Xogos UDPFS
  NET_NEEDS_NEUTRINO: Os xogos en rede (UDP) só poden arrincar co núcleo Neutrino. Comprobe que neutrino.elf está presente e que o formato é compatible.
  VCD_NOT_ON_NET: Os xogos de PS1 (.VCD) non se poden iniciar desde o dispositivo de rede.
  MX4SIO_PADEMU_WARN: MX4SIO e a emulación do mando comparten o bus SIO2 e o xogo pode non arrincar.
  MMCE_GAMEID_UNSETTLED: Non se confirmou o cambio de tarxeta MMCE; iníciase igualmente
  UDPFSBD_GAMES: Xogos UDPFSBD
  UDPBD_GAMES: Xogos UDPBD

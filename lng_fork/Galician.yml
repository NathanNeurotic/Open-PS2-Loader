  NEUTRINO_LAUNCH_ARGS_OVERFLOW: Os argumentos de inicio de Neutrino superan o límite seguro. Acurte os argumentos globais ou do xogo.
  NEUTRINO_AUTO_ELF: ELF de arranque automático (-elf)
  NEUTRINO_BSDFS: Sistema de ficheiros de Neutrino

# Supplemental RiptOPL-label translations adapted from RIPPS2 (Akilluminati47):
# https://github.com/akilluminati47/RIPPS2/tree/main/elf/lang
# Review translated UI text on real hardware; upstream translations retain priority.
  HINT_OSD_SETTINGS_LNG: Forzar unha configuración de idioma personalizada
  OSD_SETTINGS_TVASPECT: Tamaño da pantalla
  FULL_SCREEN: Pantalla completa
  OSD_SETTINGS_VMODE: Modo de vídeo
  SYSTEM_DEFAULT: Predeterminado do sistema
  HIGH: Alta
  LOW: Baixa
  XSENSITIVITY: Sensibilidade do eixe X analóxico

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPL Theme Previewer</title>
<style>
:root{
  --bg:#14171c; --panel:#1c2128; --panel2:#232a33; --line:#333c47;
  --fg:#e6edf3; --dim:#8b96a3; --accent:#00aeff; --warn:#e3b341; --err:#f85149; --ok:#3fb950;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:4px 9px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);border-color:var(--accent);color:#04121c;font-weight:600}
select,input[type=text],input[type=number]{background:#11151a;border:1px solid var(--line);border-radius:4px;padding:3px 6px}
input[type=number]{width:76px}
label{color:var(--dim)}
h3{margin:0;padding:7px 10px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
   border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:2}

#app{display:grid;grid-template-rows:auto 1fr;height:100%}
#bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#bar .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
#bar .grow{flex:1}
#main{display:grid;grid-template-columns:230px 1fr 330px;min-height:0}
#left,#right{background:var(--panel);overflow:auto;min-height:0}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line);display:flex;flex-direction:column}
#center{display:grid;grid-template-rows:1fr auto;min-height:0;min-width:0}
#stage{position:relative;overflow:auto;display:grid;place-items:center;background:
  repeating-conic-gradient(#191d23 0% 25%,#15181d 0% 50%) 50%/16px 16px}
#stack{position:relative;line-height:0;box-shadow:0 0 0 1px var(--line),0 8px 40px #0008}
#stack canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#stack canvas:first-child{position:relative}
#cOverlay{cursor:default}

#tabs{display:flex;gap:4px;padding:6px 10px 0}
#tabs button{border-bottom-left-radius:0;border-bottom-right-radius:0;padding:4px 12px}

#tree{font-family:var(--mono);font-size:11.5px}
.el{padding:3px 8px;border-left:3px solid transparent;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.el:hover{background:#ffffff08}
.el.sel{background:#00aeff22;border-left-color:var(--accent)}
.el.ghost{color:var(--dim);font-style:italic}
.el .n{color:var(--dim)}
.el .b{display:inline-block;margin-left:5px;font-size:9px;padding:0 4px;border-radius:6px;background:#f8514933;color:var(--err)}
.el .b.w{background:#e3b34133;color:var(--warn)}

#insp{padding:6px 10px 14px}
.row{display:grid;grid-template-columns:88px 1fr auto;gap:6px;align-items:center;margin:3px 0}
.row>label{font-size:11.5px;font-family:var(--mono)}
.row.def>label{opacity:.55}
.row .rst{visibility:hidden;font-size:10px;padding:1px 5px;background:none;border-color:transparent;color:var(--dim)}
.row:hover .rst{visibility:visible}
.row.def .rst{visibility:hidden!important}
.grp{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.grp>summary{cursor:pointer;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.07em}
.hint{color:var(--dim);font-size:11px;margin:4px 0 8px}
.swatch{display:flex;gap:5px;align-items:center}
.swatch input[type=color]{width:26px;height:22px;padding:0;border:1px solid var(--line);background:none;border-radius:4px}

#cfg{width:100%;height:100%;min-height:120px;border:0;border-top:1px solid var(--line);background:#0f1216;
  color:#cdd9e5;font-family:var(--mono);font-size:11.5px;padding:8px 10px;resize:none;outline:none;tab-size:4}
#cfgWrap{display:grid;grid-template-rows:auto 1fr;min-height:0;height:210px}
#cfgWrap.big{height:52vh}

#diags{overflow:auto;flex:1;min-height:120px}
.d{display:grid;grid-template-columns:auto 1fr;gap:7px;padding:5px 9px;border-bottom:1px solid #ffffff0d;cursor:pointer;font-size:11.5px}
.d:hover{background:#ffffff08}
.d .ic{font-weight:700;font-size:10px;letter-spacing:.05em}
.d.error .ic{color:var(--err)} .d.warn .ic{color:var(--warn)} .d.info .ic{color:var(--dim)}
.d code{font-family:var(--mono);font-size:10.5px;color:var(--dim);display:block;margin-top:2px}
#memTable{width:100%;border-collapse:collapse;font-size:11px;font-family:var(--mono)}
#memTable th,#memTable td{text-align:left;padding:2px 9px;border-bottom:1px solid #ffffff0d}
#memTable td.n{text-align:right}
.mem-ok{color:var(--ok)} .mem-warn{color:var(--warn)} .mem-err{color:var(--err)}

#drop{position:fixed;inset:0;background:#000c;display:none;place-items:center;z-index:50;font-size:20px;color:var(--accent)}
#drop.on{display:grid}
.empty{padding:14px 10px;color:var(--dim);font-size:12px}
kbd{font-family:var(--mono);font-size:10.5px;background:#0f1216;border:1px solid var(--line);border-radius:3px;padding:0 4px}
/* Screen only. Everything that is chrome collapses and the stage takes the
   window, so a page can be judged at the size it will actually be watched at
   rather than in a 330px column between two panels. The canvas is untouched --
   this is purely layout, so "fit" recomputes and nothing about the render or
   its metrics changes. */
body.fullscreen #bar > *:not(#btnFull),
body.fullscreen #left,
body.fullscreen #right,
body.fullscreen #cfgWrap { display:none }
body.fullscreen #bar{position:fixed;top:0;right:0;z-index:20;background:transparent;border:0;padding:6px;opacity:.25}
/* #bar is a grid item of #app, and taking it out of flow leaves #main as the
   only in-flow child -- so it lands in row 1, which is `auto`, and collapses to
   its content instead of filling the window. One row, and it fills. */
body.fullscreen #app{grid-template-rows:1fr}
body.fullscreen #bar:hover{opacity:1}
body.fullscreen #main{grid-template-columns:1fr}
body.fullscreen #stage{background:#000}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button id="btnFolder">Open theme folder…</button>
    <button id="btnLive" title="File System Access API: watch the folder and reload on change">Live reload</button>
    <button id="btnArt" title="Optional ART folder with &lt;SERIAL&gt;_&lt;PATTERN&gt;.png files">ART folder…</button>
    <span class="sep"></span>
    <label>Aspect</label>
    <button id="btn43" class="on">4:3</button><button id="btn169">16:9</button>
    <span class="sep"></span>
    <label>Zoom</label>
    <select id="zoom">
      <option value="fit" selected>Fit</option><option value="1">1×</option>
      <option value="2">2×</option><option value="3">3×</option>
    </select>
    <button id="btnSmooth" title="Smooth vs nearest-neighbour upscaling">Smooth</button>
    <span class="sep"></span>
    <button id="btnGrid" title="8px grid">Grid</button>
    <button id="btnSnap" title="Snap drags to 8px">Snap</button>
    <button id="btnFull" title="Screen only — hide every panel (F, or Esc to leave)">Full screen</button>
    <button id="btnDrawer" title="Expand the SHELF sidebar and push the page (B)">Sidebar</button>
    <button id="btnPlasma" class="on" title="Plasma vs flat bg_color fill">Plasma</button>
    <button id="btnLoad" title="Show the LoadingIcon overlay">Busy icon</button>
    <span class="sep"></span>
    <label>Device</label>
    <select id="device" title="Which device page MenuText names. Arrows only show when another device is connected."></select>
    <select id="devCount" title="How many devices OPL sees, which decides whether the MenuText arrows appear">
      <option value="1">1 connected</option><option value="2">2</option>
      <option value="3" selected>3</option><option value="4">4</option><option value="5">5</option>
    </select>
    <button id="btnLaunch" title="Simulate launching the selected game. Only launching moves the recently-played list — selecting does not.">Launch ▶</button>
    <label>Sort</label>
    <select id="sortMode" title="Matches the patch's sort modes, cycled on hardware with R3. A–Z is stock OPL's autosort.">
      <option value="0" selected>A–Z</option><option value="1">Z–A</option>
      <option value="2">Recent first</option><option value="3">Unsorted</option>
    </select>
    <span class="grow"></span>
    <span id="status" style="color:var(--dim)"></span>
    <button id="btnExport">Export conf_theme.cfg</button>
    <button id="btnSave" title="Write back to the opened folder" disabled>Save in place</button>
  </div>

  <div id="main">
    <div id="left">
      <h3>Elements</h3>
      <div id="tree"></div>
      <h3>Game list</h3>
      <div id="games" style="font-size:11.5px"></div>
    </div>

    <div id="center">
      <div id="stage">
        <div id="stack">
          <canvas id="cScreen" width="640" height="480"></canvas>
          <canvas id="cOverlay" width="640" height="480" tabindex="0"></canvas>
        </div>
      </div>
      <div id="cfgWrap">
        <h3 style="display:flex;justify-content:space-between;align-items:center">
          <span>conf_theme.cfg</span>
          <span><button id="btnBig" style="padding:1px 7px;font-size:10px">Expand</button></span>
        </h3>
        <textarea id="cfg" spellcheck="false" placeholder="Open a theme folder, or paste a conf_theme.cfg here."></textarea>
      </div>
    </div>

    <div id="right">
      <div id="tabs"></div>
      <h3>Inspector</h3>
      <div id="insp"><div class="empty">Select an element on the canvas or in the list.</div></div>
      <h3>Validation</h3>
      <div id="diags"></div>
      <h3>PS2 art cache estimate</h3>
      <div id="mem"></div>
    </div>
  </div>
</div>
<div id="drop">Drop a theme folder</div>

<script>
"use strict";
/* =========================================================================
   OPL Theme Previewer
   Behaviour is derived from Open-PS2-Loader main @ 3e3f34e (v1.2.0-Beta).
   Section references like (§6.1) point at docs/THEME-FORMAT.md.
   ========================================================================= */

// ===== OPL-CORE-BEGIN =====
// Pure, DOM-free logic: cfg parsing, cfg writing, theme building, validation.
// tests/run.mjs extracts everything between the CORE markers and imports it,
// so the tests exercise exactly the code that ships.

/* ---------------------------------------------------------------- constants */

const SCREEN_W = 640, SCREEN_H = 480;          // rmGetScreenExtents (§9)
const MENU_ITEM_HEIGHT = 19;                    // include/opl.h:222
const MENU_POS_V = 50, HINT_HEIGHT = 32;        // themes.c:13
const DECORATOR_SIZE = 20;                      // themes.c:15
const DIM_UNDEF = -1;
const ALIGN_NONE = 0, ALIGN_CENTER = 10;        // VCENTER|HCENTER (renderman.h:29)
const SCALING_NONE = 0, SCALING_RATIO = 1;
const SIZING_NONE = -1, SIZING_CLIP = 0, SIZING_WRAP = 1;
const DISPLAY_ALWAYS = 0, DISPLAY_DEFINED = 1, DISPLAY_NEVER = 2;
const FNT_DEFAULT_SIZE = 17;                    // FNTSYS_DEFAULT_SIZE
const KEY_MAX = 32, VAL_MAX = 256;              // config.h:131
const TINT = { r: 0x80, g: 0x80, b: 0x80 };     // gDefaultCol — neutral multiply

// elementsType[] in declaration order (themes.c:62). Case-sensitive.
const ELEMENT_TYPES = ["AttributeText","StaticText","AttributeImage","GameImage","StaticImage",
  "Background","MenuIcon","MenuText","ItemsList","ItemIcon","ItemCover","ItemText","HintText",
  "InfoHintText","LoadingIcon","BdmIndex","GameCountText","RecentImage","RecentText","MenuTabs",
  "AttributeList"];

// Per-type defaults, transcribed from addGUIElem (themes.c:1023-1083) — see §7.
// `color:'text'` = theme textColor, `color:'tint'` = gDefaultCol.
const D = (x,y,aligned,width,height,scaled,color,internal,extra) =>
  ({x,y,aligned,width,height,scaled,color,internal,...(extra||{})});
const ELEMENT_DEFAULTS = {
  AttributeText:  D(0,0,ALIGN_CENTER,DIM_UNDEF,DIM_UNDEF,SCALING_RATIO,"text","AttributeText"),
  AttributeList:  D(0,0,ALIGN_NONE,DIM_UNDEF,DIM_UNDEF,SCALING_RATIO,"text","AttributeList"),
  StaticText:     D(0,0,ALIGN_CENTER,DIM_UNDEF,DIM_UNDEF,SCALING_RATIO,"text","StaticText"),
  GameCountText:  D(0,0,ALIGN_CENTER,DIM_UNDEF,DIM_UNDEF,SCALING_RATIO,"text","StaticText"),
  AttributeImage: D(0,0,ALIGN_CENTER,DIM_UNDEF,DIM_UNDEF,SCALING_RATIO,"tint","AttributeImage",{count:1}),
  GameImage:      D(0,0,ALIGN_CENTER,DIM_UNDEF,DIM_UNDEF,SCALING_RATIO,"tint","GameImage",{count:1}),
  StaticImage:    D(0,0,ALIGN_CENTER,DIM_UNDEF,DIM_UNDEF,SCALING_RATIO,"tint","StaticImage"),
  Background:     D(0,0,ALIGN_NONE,SCREEN_W,SCREEN_H,SCALING_NONE,"tint","Background",{count:1}),
  MenuIcon:       D(320,400,ALIGN_CENTER,DIM_UNDEF,DIM_UNDEF,SCALING_RATIO,"tint","MenuIcon"),
  MenuText:       D(320,20,ALIGN_CENTER,200,20,SCALING_RATIO,"text","MenuText"),
  ItemsList:      D(0,0,ALIGN_NONE,DIM_UNDEF,DIM_UNDEF,SCALING_RATIO,"text","ItemsList"),
  ItemIcon:       D(0,0,ALIGN_CENTER,64,64,SCALING_RATIO,"tint","GameImage",{pattern:"ICO",count:20}),
  ItemCover:      D(0,0,ALIGN_CENTER,DIM_UNDEF,DIM_UNDEF,SCALING_RATIO,"tint","GameImage",{pattern:"COV",count:10}),
  ItemText:       D(0,0,ALIGN_CENTER,DIM_UNDEF,DIM_UNDEF,SCALING_RATIO,"text","ItemText"),
  HintText:       D(16,-HINT_HEIGHT,ALIGN_NONE,12,20,SCALING_RATIO,"text","HintText"),
  InfoHintText:   D(16,-HINT_HEIGHT,ALIGN_NONE,12,20,SCALING_RATIO,"text","InfoHintText"),
  LoadingIcon:    D(-40,-60,ALIGN_CENTER,DIM_UNDEF,DIM_UNDEF,SCALING_RATIO,"tint","LoadingIcon"),
  BdmIndex:       D(320,355,ALIGN_CENTER,DIM_UNDEF,DIM_UNDEF,SCALING_RATIO,"tint","BdmIndex"),
  RecentImage:    D(0,0,ALIGN_CENTER,DIM_UNDEF,DIM_UNDEF,SCALING_RATIO,"tint","RecentImage",{pattern:"COV",count:1}),
  RecentText:     D(0,0,ALIGN_CENTER,DIM_UNDEF,DIM_UNDEF,SCALING_RATIO,"text","RecentText"),
  MenuTabs:       D(320,20,ALIGN_CENTER,16,24,SCALING_RATIO,"text","MenuTabs"),
};
// The 2nd ItemsList in a theme is built from different defaults (themes.c:1058).
const ITEMSLIST_2ND = D(42,42,ALIGN_NONE,400,360,SCALING_RATIO,"text","ItemsList");
// Injected fallbacks (validateBackgroundElems / validateItemsList).
const INJECTED_BG = D(0,0,ALIGN_NONE,SCREEN_W,SCREEN_H,SCALING_NONE,"tint","Background",{pattern:"BG",count:1});
const INJECTED_IL = D(42,42,ALIGN_NONE,373,316,SCALING_RATIO,"text","ItemsList");

const THEME_DEFAULTS = {                        // §8
  bg_color:      { r:0x28, g:0xC5, b:0xF9 },
  text_color:    { r:0xFF, g:0xFF, b:0xFF },
  ui_text_color: { r:0x58, g:0x68, b:0xB4 },
  sel_text_color:{ r:0x00, g:0xAE, b:0xFF },
};

// Which keys each cfg type actually reads (§6.6). Used by the inspector and INVALID_ATTR.
const COMMON_ATTRS = ["enabled","type","x","y","width","height","aligned","scaled","color","font","x_scaled"];
const OVERLAY_ATTRS = ["overlay","overlay_ulx","overlay_uly","overlay_urx","overlay_ury",
                       "overlay_llx","overlay_lly","overlay_lrx","overlay_lry"];
const TYPE_ATTRS = {
  AttributeText:  ["attribute","title","display","wrap"],
  AttributeList:  ["attributes","separator","gap"],
  StaticText:     ["value","title","display","wrap"],
  GameCountText:  ["title","display","wrap","prefix","suffix"],
  AttributeImage: ["attribute","default",...OVERLAY_ATTRS],
  GameImage:      ["pattern","count","default","offset",...OVERLAY_ATTRS],
  StaticImage:    ["default",...OVERLAY_ATTRS],
  ItemIcon:       ["pattern","count","default","offset",...OVERLAY_ATTRS],
  ItemCover:      ["pattern","count","default","offset",...OVERLAY_ATTRS],
  Background:     ["pattern","count","default"],
  ItemsList:      ["decorator","columns","cell_width","cell_height","gap","text","frame","label_height"],
  RecentImage:    ["pattern","count","default","index"],
  RecentText:     ["index"],
  MenuTabs:       ["pad","frame","sel_color","sel_text_color","hint_font","hint_color",
                   "prev_text","next_text","cap_left","cap_right",
                   "label_usb","label_ilink","label_mx4sio","label_bdm",
                   "label_eth","label_hdd","label_app"],
  MenuIcon:[], MenuText:[], ItemText:[], HintText:[], InfoHintText:["show_run"], LoadingIcon:[], BdmIndex:[],
};
// Attributes added by patches/opl-tile-grid.patch. Stock OPL ignores them
// silently, so the previewer names them rather than letting a theme look right
// here and wrong on an unpatched console.
const PATCHED_ATTRS = new Set(["offset","columns","cell_width","cell_height","gap","text","frame",
                               "label_height","index","pad","sel_color","sel_text_color","hint_font",
                               "hint_color","prev_text","next_text","cap_left","cap_right",
                               "label_usb","label_ilink","label_mx4sio","label_bdm","label_eth",
                               "label_hdd","label_app","prefix","suffix","x_scaled"]);
// Element types that only exist in a patched build.
const PATCHED_TYPES = new Set(["RecentImage","RecentText","MenuTabs"]);

const REQUIRED_ATTR = {   // missing ⇒ element is built but never draws
  StaticText:"value", AttributeText:"attribute", AttributeImage:"attribute",
  AttributeList:"attributes",
  GameImage:"pattern", StaticImage:"default",
};

/* ------------------------------------------------------------ tiny helpers */

const isWS = c => c === " " || c === "\t";

/** atoi(3): leading integer, trailing garbage ignored, non-numeric ⇒ 0 (config.c:342). */
function atoi(s) {
  const m = /^[ \t\n\r]*([+-]?\d+)/.exec(s || "");
  return m ? (parseInt(m[1], 10) | 0) : 0;
}

/**
 * strToColor (config.c:30). Returns {r,g,b} plus how it failed, because both
 * failure modes are silent in OPL: no '#' ⇒ black, short value ⇒ partial.
 */
function parseColor(s) {
  const out = { r:0, g:0, b:0, ok:true, reason:null };
  if (!s || s[0] !== "#") { out.ok = false; out.reason = "nohash"; return out; }   // §1.5
  const ch = ["r","g","b"];
  let n = 0, cnt = 0, digits = 0;
  for (let i = 1; i < s.length; i++) {
    const v = parseInt(s[i], 16);
    if (Number.isNaN(v)) break;                       // stops at the first non-hex digit
    digits++;
    if (n < 3) out[ch[n]] = out[ch[n]] * 16 + v;      // C accumulates: color[n] = color[n]*16 + fh
    if (cnt === 1) { cnt = 0; n++; } else cnt++;
  }
  if (digits !== 6) { out.ok = false; out.reason = digits > 6 ? "long" : "short"; }
  return out;
}
const colorToHex = c => "#" + [c.r,c.g,c.b].map(v => v.toString(16).padStart(2,"0").toUpperCase()).join("");
const byteLen = s => { let n = 0; for (const ch of s) n += ch.codePointAt(0) < 0x80 ? 1 : encodeURIComponent(ch).split("%").length - 1; return n; };

/* ============================================================ 1. cfg-parse */

/**
 * Parse a conf_theme.cfg into an ordered list of line records plus a key index,
 * mirroring configReadFileBuffer (config.c:468). Nothing is discarded: comments,
 * blank lines and malformed lines survive as records so writing is lossless.
 */
function parseConfig(text) {
  const doc = { eol:"\n", trailingNewline:false, hadBOM:false, lines:[], index:new Map(), diags:[] };
  if (text == null) text = "";
  if (text.charCodeAt(0) === 0xFEFF) { doc.hadBOM = true; text = text.slice(1); }   // util.c:250
  doc.eol = /\r\n/.test(text) ? "\r\n" : "\n";
  if (text.endsWith("\n")) { doc.trailingNewline = true; text = text.replace(/\r?\n$/, ""); }

  const rawLines = text.length === 0 && !doc.trailingNewline ? [] : text.split(/\r?\n/);
  let prefix = "";

  rawLines.forEach((raw, i) => {
    const rec = { raw, kind:"other", indent:"", prefix:null, key:null, rawKey:null,
                  value:null, lineNo:i+1 };
    let p = 0;
    while (p < raw.length && isWS(raw[p])) p++;                     // splitAssignment skips WS
    const eq = raw.indexOf("=");

    if (eq >= 0) {
      // An assignment at column 0 clears the active prefix (config.c:487).
      if (!isWS(raw[0])) prefix = "";
      rec.kind = "assign";
      rec.indent = raw.slice(0, p);
      rec.rawKey = raw.slice(p, eq);
      rec.value = raw.slice(eq + 1);
      rec.prefix = prefix || null;
      rec.key = prefix ? prefix + "_" + rec.rawKey : rec.rawKey;
      if (byteLen(rec.key) >= KEY_MAX)
        doc.diags.push(dg("warn","KEY_TOO_LONG",`Key "${rec.key}" is ${byteLen(rec.key)} bytes; OPL truncates keys to ${KEY_MAX-1}.`,i+1));
      if (byteLen(rec.value) >= VAL_MAX)
        doc.diags.push(dg("warn","VALUE_TOO_LONG",`Value on line ${i+1} is ${byteLen(rec.value)} bytes; OPL truncates values to ${VAL_MAX-1}.`,i+1));
      if (!doc.index.has(rec.key)) doc.index.set(rec.key, []);
      doc.index.get(rec.key).push(doc.lines.length);
    } else {
      // parsePrefix sees the untrimmed line and requires colon != position 0 (config.c:104).
      const colon = raw.indexOf(":");
      if (colon > 0) {
        rec.kind = "prefix";
        prefix = raw.slice(0, colon);
        rec.prefix = prefix;
        rec.indent = raw.slice(0, p);
        if (raw.trim()[0] === "#")
          doc.diags.push(dg("warn","COMMENT_PREFIX",
            `Line ${i+1} looks like a comment but contains ":", so OPL treats it as a section header and every following indented key is stored under it. Remove the colon.`,i+1));
        else if (p > 0)
          doc.diags.push(dg("warn","INDENTED_SECTION",`Section "${prefix}" is indented, so its keys become "${prefix}_…" including the leading whitespace.`,i+1));
      } else {
        rec.kind = raw.trim() === "" ? "blank" : "other";
        // blank/comment lines do NOT clear the prefix (config.c:500)
      }
    }
    doc.lines.push(rec);
  });

  for (const [key, idxs] of doc.index) {
    if (idxs.length > 1) {
      const winner = doc.lines[idxs[idxs.length-1]];
      doc.diags.push(dg("warn","DUP_KEY",
        `"${key}" is set ${idxs.length} times (lines ${idxs.map(i=>doc.lines[i].lineNo).join(", ")}). OPL keeps the last value: "${winner.value.trim()}".`,
        winner.lineNo));
    }
  }
  return doc;
}

const dg = (severity, code, message, line, element) => ({ severity, code, message, line, element });

/**
 * The apps chains re-instantiate their main<N> twins (§2.3), so the same fault
 * is reported once per chain. Identical diagnostics are one problem.
 */
function dedupeDiags(list) {
  const seen = new Set(), out = [];
  for (const d of list) {
    const key = `${d.severity}|${d.code}|${d.line}|${d.element}|${d.message}`;
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(d);
  }
  return out;
}

/** Effective value of a key: the LAST occurrence wins (§11.4). null when absent. */
function getStr(doc, key) {
  const idxs = doc.index.get(key);
  if (!idxs || !idxs.length) return null;
  return doc.lines[idxs[idxs.length - 1]].value;
}
const hasKey = (doc, key) => doc.index.has(key);
function getInt(doc, key, dflt) { const v = getStr(doc, key); return v === null ? dflt : atoi(v); }

/**
 * Every attribute suffix written for an element, whatever its type reads. The
 * inspector needs this to tell "explicit" from "defaulted", and INVALID_ATTR
 * needs to see keys the element's own init function never looks at.
 */
function keysFor(doc, name) {
  if (!doc._suffix) {
    doc._suffix = new Map();
    for (const key of doc.index.keys()) {
      const u = key.lastIndexOf("_");
      if (u <= 0) continue;
      // "main0_overlay_ulx" belongs to main0, not to main0_overlay.
      for (let i = key.indexOf("_"); i > 0; i = key.indexOf("_", i + 1)) {
        const el = key.slice(0, i), suf = key.slice(i + 1);
        if (!doc._suffix.has(el)) doc._suffix.set(el, new Set());
        doc._suffix.get(el).add(suf);
      }
    }
  }
  return doc._suffix.get(name) || new Set();
}

/* ============================================================ 2. cfg-write */

function writeConfig(doc) {
  let out = doc.lines.map(l => l.raw).join(doc.eol);
  if (doc.trailingNewline) out += doc.eol;
  return (doc.hadBOM ? "﻿" : "") + out;
}

function reindex(doc) {
  doc.index = new Map();
  doc.lines.forEach((l, i) => {
    if (l.kind !== "assign") return;
    if (!doc.index.has(l.key)) doc.index.set(l.key, []);
    doc.index.get(l.key).push(i);
  });
  doc.lines.forEach((l, i) => { l.lineNo = i + 1; });
}

/** Split "main3_x" into ["main3","x"] using the section names actually present. */
function splitKey(doc, key) {
  const sections = new Set();
  for (const l of doc.lines) if (l.prefix) sections.add(l.prefix);
  let best = null;
  for (const s of sections)
    if (key.startsWith(s + "_") && (!best || s.length > best.length)) best = s;
  if (best) return [best, key.slice(best.length + 1)];
  const m = /^((?:apps)?(?:Main|Info|main|info|bg|il)\d*)_(.+)$/.exec(key);
  return m ? [m[1], m[2]] : [null, key];
}

/**
 * Set a key, rewriting a single existing line where possible (§3.1). Comments,
 * ordering, indentation and unknown keys are untouched.
 */
function setKey(doc, key, value) {
  value = String(value);
  const idxs = doc.index.get(key);
  if (idxs && idxs.length) {
    const rec = doc.lines[idxs[idxs.length - 1]];      // edit the winner
    rec.value = value;
    rec.raw = rec.indent + rec.rawKey + "=" + value;
    return doc;
  }
  const [section, sub] = splitKey(doc, key);

  // Prefer inserting into an existing "section:" block.
  if (section) {
    let last = -1, indent = "\t";
    for (let i = 0; i < doc.lines.length; i++) {
      const l = doc.lines[i];
      if (l.kind === "assign" && l.prefix === section) { last = i; indent = l.indent || "\t"; }
    }
    if (last >= 0) {
      doc.lines.splice(last + 1, 0, mkAssign(indent, sub, value, section, key));
      reindex(doc); return doc;
    }
    // Flat style: main3_type=… with no section header.
    let flatLast = -1;
    for (let i = 0; i < doc.lines.length; i++) {
      const l = doc.lines[i];
      if (l.kind === "assign" && !l.prefix && l.key.startsWith(section + "_")) flatLast = i;
    }
    if (flatLast >= 0) {
      doc.lines.splice(flatLast + 1, 0, mkAssign("", key, value, null, key));
      reindex(doc); return doc;
    }
    // No trace of the section at all (e.g. an injected default element): start one.
    const prefersFlat = doc.lines.some(l => l.kind === "assign" && !l.prefix);
    if (prefersFlat) {
      doc.lines.push(mkAssign("", key, value, null, key));
    } else {
      if (doc.lines.length && doc.lines[doc.lines.length-1].kind !== "blank")
        doc.lines.push({ raw:"", kind:"blank", indent:"", prefix:null, key:null, rawKey:null, value:null, lineNo:0 });
      doc.lines.push({ raw:section + ":", kind:"prefix", indent:"", prefix:section, key:null, rawKey:null, value:null, lineNo:0 });
      doc.lines.push(mkAssign("\t", sub, value, section, key));
    }
    reindex(doc); return doc;
  }
  doc.lines.push(mkAssign("", key, value, null, key));
  reindex(doc); return doc;
}

const mkAssign = (indent, rawKey, value, prefix, key) =>
  ({ raw: indent + rawKey + "=" + value, kind:"assign", indent, prefix, key, rawKey, value, lineNo:0 });

/** Remove every line defining `key` (configRemoveKey drops all duplicates too). */
function deleteKey(doc, key) {
  const idxs = doc.index.get(key);
  if (!idxs || !idxs.length) return doc;
  const drop = new Set(idxs);
  doc.lines = doc.lines.filter((_, i) => !drop.has(i));
  reindex(doc);
  return doc;
}

const cloneDoc = doc => parseConfig(writeConfig(doc));

/* =========================================================== 3. theme-build */

/** POS_MID / DIM_INF are 7-char prefix matches in the C (§6.1). */
const isPosMid = s => s.startsWith("POS_MID");
const isDimInf = s => s.startsWith("DIM_INF");

/**
 * initBasic (themes.c:668): resolve the ten common attributes for one element.
 */
function initBasic(doc, name, typeName, def, theme, diags) {
  const el = {
    name, typeName, internal: def.internal,
    posX:0, posY:0, aligned:def.aligned, width:def.width, height:def.height,
    scaled:def.scaled, font:0, color:null,
    explicit:new Set(), extended:{}, injected:false, drawable:true, notes:[],
  };
  el.explicit = new Set(keysFor(doc, name));   // everything written for this element

  let x = def.x, y = def.y;
  const sx = getStr(doc, name + "_x");
  if (sx !== null) x = isPosMid(sx) ? (SCREEN_W >> 1) : atoi(sx);
  el.posX = x < 0 ? SCREEN_W + x : x;                                   // §6.1 right-edge relative
  el.rawX = x;

  const sy = getStr(doc, name + "_y");
  if (sy !== null) y = isPosMid(sy) ? (SCREEN_H >> 1) : atoi(sy);
  el.posY = y < 0 ? Math.ceil((SCREEN_H + y) * theme.usedHeight / SCREEN_H) : y;
  el.rawY = y;

  const sw = getStr(doc, name + "_width");
  if (sw !== null) el.width = isDimInf(sw) ? SCREEN_W : atoi(sw);
  const sh = getStr(doc, name + "_height");
  if (sh !== null) el.height = isDimInf(sh) ? SCREEN_H : atoi(sh);

  const sa = getStr(doc, name + "_aligned");
  if (sa !== null) el.aligned = atoi(sa) === 0 ? ALIGN_NONE : ALIGN_CENTER;
  const ss = getStr(doc, name + "_scaled");
  if (ss !== null) el.scaled = atoi(ss) === 0 ? SCALING_NONE : SCALING_RATIO;

  const sc = getStr(doc, name + "_color");
  if (sc !== null) {
    const c = parseColor(sc);
    el.color = { r:c.r, g:c.g, b:c.b };
    if (!c.ok) colorDiag(diags, doc, name + "_color", sc, c, name);
  } else {
    el.color = def.color === "text" ? theme.textColor : TINT;
  }

  el.xScaled = atoi(getStr(doc, name + "_x_scaled") || "0") !== 0;
  // InfoHintText only, patch 06. Defaults on, so an unpatched theme is unchanged.
  el.showRun = atoi(getStr(doc, name + "_show_run") ?? "1") !== 0;

  el.font = 0;
  const sf = getStr(doc, name + "_font");
  if (sf !== null) { const v = atoi(sf); if (v > 0 && v < 16) el.font = v; }   // font=0 rejected (§6.1)
  return el;
}

function colorDiag(diags, doc, key, raw, c, element) {
  const line = lineOf(doc, key);
  if (c.reason === "nohash")
    diags.push(dg("error","COLOR_NO_HASH",`${key}="${raw}" has no leading "#", so OPL parses it as #000000 (black), not as an error.`,line,element));
  else
    diags.push(dg("warn","COLOR_MALFORMED",`${key}="${raw}" is not exactly 6 hex digits; OPL reads ${colorToHex(c)}.`,line,element));
}
function lineOf(doc, key) {
  const idxs = doc.index.get(key);
  return idxs && idxs.length ? doc.lines[idxs[idxs.length-1]].lineNo : undefined;
}

/** initMutableText (themes.c:99): derives the sizing mode and may rewrite w/h. */
function initText(doc, name, el, kind, diags) {
  const t = { kind, sizingMode:SIZING_NONE, displayMode:DISPLAY_ALWAYS, value:null, alias:null };
  t.displayMode = getInt(doc, name + "_display", DISPLAY_ALWAYS);

  const sw = getStr(doc, name + "_wrap");
  if (sw !== null) { const v = atoi(sw); t.sizingMode = v > 0 ? SIZING_WRAP : v; }

  if (el.width !== DIM_UNDEF || el.height !== DIM_UNDEF) {
    if (t.sizingMode === SIZING_NONE) t.sizingMode = SIZING_CLIP;
    if (el.width === DIM_UNDEF) el.width = SCREEN_W;
    if (el.height === DIM_UNDEF) el.height = SCREEN_H;
  } else t.sizingMode = SIZING_NONE;

  if (kind === "StaticText") {
    t.value = getStr(doc, name + "_value");
    if (t.value === null) { el.drawable = false; el.missing = "value"; }
  } else if (kind === "AttributeText") {
    t.value = getStr(doc, name + "_attribute");
    if (t.value === null) { el.drawable = false; el.missing = "attribute"; }
    else {
      let alias = getStr(doc, name + "_title");
      if (alias === null) alias = t.value[0] === "#" ? t.value.slice(1) : t.value;
      t.alias = alias + (t.sizingMode === SIZING_WRAP ? ":\n" : ": ");
    }
  } else if (kind === "AttributeList") {
    // Split on commas, trimming leading spaces, exactly as initAttributeList does.
    const raw = getStr(doc, name + "_attributes");
    if (raw === null) { el.drawable = false; el.missing = "attributes"; }
    else {
      t.keys = raw.split(",").map(k => k.replace(/^ +/, "")).filter(Boolean).slice(0, 8);
      t.separator = getStr(doc, name + "_separator") ?? "\u00b7";
      const g = getStr(doc, name + "_gap");
      t.gap = g === null ? 6 : Math.max(0, atoi(g));
    }
  } else if (kind === "GameCountText") {
    t.alias = "";
    t.countPrefix = getStr(doc, name + "_prefix");
    t.countSuffix = getStr(doc, name + "_suffix");
  }
  el.extended = t;
  return t;
}

/** initMutableImage (themes.c:457). `theme.caches` implements findDuplicate sharing. */
function initImage(doc, name, el, typeName, def, theme, diags) {
  const m = { pattern:null, count:def.count ?? 1, defaultTexture:null, overlay:null, overlayRect:null,
              cacheShared:false, offset:0, useOffset:false };
  if (typeName === "AttributeImage") {
    m.pattern = getStr(doc, name + "_attribute");
    m.count = 1;
  } else if (def.internal === "GameImage" || def.internal === "Background" || def.internal === "RecentImage") {
    m.pattern = def.pattern ?? null;
    const sp = getStr(doc, name + "_pattern");
    if (sp !== null) m.pattern = sp;
    const sc = getStr(doc, name + "_count");
    if (sc !== null) m.count = atoi(sc);
  }

  // Tile placement (patched builds only): bind to a fixed slot on the page
  // instead of to the highlighted entry.
  const so = getStr(doc, name + "_offset");
  if (so !== null && (def.internal === "GameImage" || def.internal === "Background")) {
    m.useOffset = true;
    m.offset = Math.max(0, atoi(so));
  }

  m.defaultTexture = getStr(doc, name + "_default");
  if (def.internal !== "Background") m.overlay = getStr(doc, name + "_overlay");

  if (m.overlay !== null) {
    m.overlayRect = {};
    let anyMissing = false;
    for (const c of ["ulx","uly","urx","ury","llx","lly","lrx","lry"]) {
      const v = getStr(doc, name + "_overlay_" + c);
      if (v === null) { anyMissing = true; m.overlayRect[c] = 0; }         // §11.3
      else m.overlayRect[c] = atoi(v);
    }
    if (anyMissing)
      diags.push(dg("warn","OVERLAY_PARTIAL",
        `${name}: overlay corner offsets are only partly defined. OPL leaves the rest uninitialised (undefined on hardware); the previewer uses 0.`,
        lineOf(doc, name + "_overlay"), name));
  }

  // findDuplicate (themes.c:305): one cache per distinct pattern across all chains.
  if (m.pattern) {
    if (theme.caches.has(m.pattern)) { m.cacheShared = true; theme.caches.get(m.pattern).users.push(name); }
    else theme.caches.set(m.pattern, { pattern:m.pattern, count:m.count, owner:name, users:[name], el });
  }
  el.extended = m;

  const req = REQUIRED_ATTR[typeName];
  if (req === "pattern" && !m.pattern) { el.drawable = false; el.missing = "pattern"; }
  if (req === "default" && !m.defaultTexture) { el.drawable = false; el.missing = "default"; }
  if (typeName === "AttributeImage" && !m.pattern) { el.drawable = false; el.missing = "attribute"; }
  return m;
}

/** initItemsList (themes.c:878). */
function initItemsList(doc, name, el) {
  if (el.width === DIM_UNDEF) el.width = SCREEN_W;
  if (el.height === DIM_UNDEF) el.height = 480 - (MENU_POS_V + HINT_HEIGHT);   // 398

  const num = (key, dflt) => { const v = getStr(doc, name + "_" + key); return v === null ? dflt : atoi(v); };
  const columns = Math.max(1, num("columns", 1));
  const gap = Math.max(0, num("gap", 4));
  const showText = num("text", 1);
  const frameSize = Math.max(0, num("frame", columns > 1 ? 2 : 0));
  const labelHeight = Math.max(1, num("label_height", MENU_ITEM_HEIGHT));

  let cellWidth, cellHeight, displayedItems;
  if (columns > 1) {
    cellWidth = Math.max(1, num("cell_width", Math.floor(el.width / columns)));
    cellHeight = Math.max(1, num("cell_height", cellWidth));
    displayedItems = Math.max(1, Math.floor(el.height / cellHeight)) * columns;
  } else {
    cellWidth = el.width;
    cellHeight = MENU_ITEM_HEIGHT;
    displayedItems = Math.floor(el.height / MENU_ITEM_HEIGHT);
  }

  el.extended = {
    displayedItems, columns, cellWidth, cellHeight, gap, showText, frameSize, labelHeight,
    decorator: getStr(doc, name + "_decorator"),
    decoratorImage: null,
  };
}

/**
 * addGUIElem (themes.c:1010). Returns 'stop' when `<name>_type` is absent — the
 * gap rule (§2.2) — 'skip' when nothing was appended, or the element.
 */
function addGUIElem(doc, name, theme, chain, diags) {
  const enabled = getInt(doc, name + "_enabled", 1);
  if (enabled === 0) {
    if (hasKey(doc, name + "_type"))
      diags.push(dg("info","DISABLED",`${name} (${getStr(doc,name+"_type")}) is disabled with ${name}_enabled=0. Numbering continues past it.`,
        lineOf(doc, name + "_enabled"), name));
    return "skip";
  }
  const typeName = getStr(doc, name + "_type");
  if (typeName === null) return "stop";

  if (!ELEMENT_TYPES.includes(typeName)) {
    const near = ELEMENT_TYPES.find(t => t.toLowerCase() === typeName.trim().toLowerCase());
    diags.push(dg("error","UNKNOWN_TYPE",
      `${name}_type="${typeName}" is not a known element type, so the element is dropped. ` +
      (near ? `Types are case-sensitive — did you mean "${near}"?` : `Numbering continues, so later elements still load.`),
      lineOf(doc, name + "_type"), name));
    return "skip";
  }

  if (typeName === "Background" && chain.length > 0) {
    diags.push(dg("error","BG_NOT_FIRST",
      `${name} is a Background but is not the first element in this page, so OPL discards it and injects a default background instead.`,
      lineOf(doc, name + "_type"), name));
    return "skip";
  }

  let def = ELEMENT_DEFAULTS[typeName];
  if (typeName === "ItemsList") {
    if (theme.itemsListCount === 0) def = ELEMENT_DEFAULTS.ItemsList;
    else if (theme.itemsListCount === 1) def = ITEMSLIST_2ND;
    else {
      diags.push(dg("warn","THIRD_ITEMSLIST",
        `${name}: a theme keeps at most two ItemsList elements (games + apps); this one is ignored.`,
        lineOf(doc, name + "_type"), name));
      return "skip";
    }
  }

  const el = initBasic(doc, name, typeName, def, theme, diags);

  switch (typeName) {
    case "AttributeList":
    case "StaticText": case "AttributeText": case "GameCountText":
      initText(doc, name, el, typeName, diags); break;
    case "StaticImage": case "AttributeImage": case "GameImage":
    case "ItemIcon": case "ItemCover": case "Background": case "RecentImage":
      initImage(doc, name, el, typeName, def, theme, diags);
      if (typeName === "RecentImage") el.extended.recentIndex = Math.max(0, getInt(doc, name + "_index", 0));
      break;
    case "RecentText":
      el.extended = { recentIndex: Math.max(0, getInt(doc, name + "_index", 0)), sizingMode: SIZING_NONE };
      break;
    case "MenuTabs": {
      const col = (key, dflt) => {
        const raw = getStr(doc, name + "_" + key);
        if (raw === null) return dflt;
        const c = parseColor(raw);
        if (!c.ok) colorDiag(diags, doc, name + "_" + key, raw, c, name);
        return { r:c.r, g:c.g, b:c.b };
      };
      let hintFont = 0;
      const hf = getStr(doc, name + "_hint_font");
      if (hf !== null) { const v = atoi(hf); if (v > 0 && v < 16) hintFont = v; }
      el.extended = {
        pad: Math.max(0, getInt(doc, name + "_pad", 10)),
        frameSize: Math.max(0, getInt(doc, name + "_frame", 2)),
        selColor: col("sel_color", theme.selTextColor),
        selTextColor: col("sel_text_color", theme.bgColor),
        hintFont,
        hintColor: col("hint_color", null),
        prevText: getStr(doc, name + "_prev_text"),
        nextText: getStr(doc, name + "_next_text"),
        capLeft: getStr(doc, name + "_cap_left"),
        capRight: getStr(doc, name + "_cap_right"),
        labels: { usb:getStr(doc, name + "_label_usb"), ilink:getStr(doc, name + "_label_ilink"),
                  mx4sio:getStr(doc, name + "_label_mx4sio"), bdm:getStr(doc, name + "_label_bdm"),
                  eth:getStr(doc, name + "_label_eth"), hdd:getStr(doc, name + "_label_hdd"),
                  app:getStr(doc, name + "_label_app") },
      };
      break;
    }
    case "ItemsList":
      initItemsList(doc, name, el);
      el.slot = theme.itemsListCount === 0 ? "games" : "apps";
      theme.itemsListLists[theme.itemsListCount] = el;
      theme.itemsListCount++;
      break;
    case "LoadingIcon":
      if (!theme.loadingIcon) theme.loadingIcon = el;
      return "skip";      // never appended to a chain (§3.2)
  }

  if (el.missing) {
    diags.push(dg("error","MISSING_REQUIRED",
      `${name} (${typeName}) has no ${name}_${el.missing}, so OPL builds the element but never draws it.`,
      lineOf(doc, name + "_type"), name));
  }
  return el;
}

function scanChain(doc, prefixName, theme, diags) {
  const chain = [];
  let i = 0;
  for (;; i++) {
    const name = prefixName + i;
    const r = addGUIElem(doc, name, theme, chain, diags);
    if (r === "stop") break;
    if (r !== "skip") { r.index = i; r.chain = prefixName; chain.push(r); }
    if (i > 512) break;                              // runaway guard, not an OPL behaviour
  }
  // Gap detection: keys beyond the stop index are dead weight (§2.2).
  const orphans = [];
  for (let j = i + 1; j <= i + 64; j++)
    if (hasKey(doc, prefixName + j + "_type")) orphans.push(prefixName + j);
  if (orphans.length)
    diags.push(dg("error","NUMBER_GAP",
      `${prefixName}${i} has no "type", which ends the scan for this page. ${orphans.length} later element${orphans.length>1?"s are":" is"} never read: ${orphans.join(", ")}. Renumber so the sequence is consecutive.`,
      lineOf(doc, orphans[0] + "_type")));
  return { chain, stoppedAt: i };
}

/** thmLoad (themes.c:1246): four chains, apps inheritance, then validation. */
function buildTheme(doc) {
  const diags = [...doc.diags];
  const theme = {
    usedHeight: SCREEN_H, useDefault:1,
    bgColor:{...THEME_DEFAULTS.bg_color}, textColor:{...THEME_DEFAULTS.text_color},
    uiTextColor:{...THEME_DEFAULTS.ui_text_color}, selTextColor:{...THEME_DEFAULTS.sel_text_color},
    fonts:{}, caches:new Map(), itemsListCount:0, itemsListLists:[], loadingIcon:null,
    chains:{}, diags,
  };

  theme.useDefault = getInt(doc, "use_default", 1);
  if (getInt(doc, "use_real_height", 0)) theme.usedHeight = SCREEN_H;   // no-op in practice (§8)

  for (const [key, prop] of [["bg_color","bgColor"],["text_color","textColor"],
                             ["ui_text_color","uiTextColor"],["sel_text_color","selTextColor"]]) {
    const raw = getStr(doc, key);
    if (raw === null) continue;
    const c = parseColor(raw);
    theme[prop] = { r:c.r, g:c.g, b:c.b };
    if (!c.ok) colorDiag(diags, doc, key, raw, c, null);
  }

  for (let i = 0; i < 16; i++) {
    const fileKey = i === 0 ? "default_font" : "font" + i;
    const sizeKey = i === 0 ? "default_font_size" : "font" + i + "_size";
    const file = getStr(doc, fileKey);
    let size = FNT_DEFAULT_SIZE;
    const rawSize = getStr(doc, sizeKey);
    if (rawSize !== null) { const v = atoi(rawSize); size = v > 0 ? v : FNT_DEFAULT_SIZE; }
    theme.fonts[i] = { file, size, slot:i };
  }

  const main = scanChain(doc, "main", theme, diags);
  theme.chains.main = main.chain;
  theme.chains.appsMain = inheritChain(doc, "appsMain", "main", main.stoppedAt, theme, diags);
  const info = scanChain(doc, "info", theme, diags);
  theme.chains.info = info.chain;
  theme.chains.appsInfo = inheritChain(doc, "appsInfo", "info", info.stoppedAt, theme, diags);

  validateBackground(doc, theme, "main", "info", diags);
  validateBackground(doc, theme, "appsMain", "appsInfo", diags);
  validateItemsList(doc, theme, theme.itemsListLists[0], "main", diags);
  validateItemsList(doc, theme, theme.itemsListLists[1], "appsMain", diags);
  theme.diags = dedupeDiags(diags);
  return theme;
}

/** themes.c:1314 — try appsMain<j>, else re-instantiate main<j>. */
function inheritChain(doc, appsName, baseName, count, theme, diags) {
  const chain = [];
  for (let j = 0; j <= count; j++) {
    let r = addGUIElem(doc, appsName + j, theme, chain, diags);
    if (r === "stop") {
      r = addGUIElem(doc, baseName + j, theme, chain, diags);
      if (r === "stop" || r === "skip") continue;
      r.inheritedFrom = baseName + j;
    } else if (r === "skip") continue;
    r.index = j; r.chain = appsName; chain.push(r);
  }
  return chain;
}

/** validateBackgroundElems (themes.c:947). */
function validateBackground(doc, theme, mainKey, infoKey, diags) {
  for (const [key, required] of [[mainKey, true], [infoKey, false]]) {
    const chain = theme.chains[key];
    if (!required && chain.length === 0) continue;         // absent info page stays absent
    if (chain.length && chain[0].typeName === "Background") continue;
    const el = initBasic(doc, "bg", "Background", INJECTED_BG, theme, diags);
    el.injected = true; el.chain = key; el.index = -1; el.name = "bg";
    initImage(doc, "bg", el, "Background", INJECTED_BG, theme, diags);
    chain.unshift(el);
    diags.push(dg("info","BG_INJECTED",
      `${key}: no Background as the first element, so OPL injects a default one (pattern=BG, full screen). It reads bg_* keys if you define them.`,
      undefined, "bg"));
  }
}

/** validateItemsList (themes.c:968). */
function validateItemsList(doc, theme, list, chainKey, diags) {
  const chain = theme.chains[chainKey];
  if (!list) {
    if (!chain.length) return;
    const el = initBasic(doc, "il", "ItemsList", INJECTED_IL, theme, diags);
    el.injected = true; el.chain = chainKey; el.index = -1; el.name = "il";
    initItemsList(doc, "il", el);
    chain.splice(1, 0, el);
    theme.itemsListLists[chainKey === "main" ? 0 : 1] = el;
    diags.push(dg("info","IL_INJECTED",
      `${chainKey}: no ItemsList declared, so OPL injects one at 42,42 sized 373×316 (${Math.floor(316/MENU_ITEM_HEIGHT)} rows), right after the background. It reads il_* keys if you define them.`,
      undefined, "il"));
    return;
  }
  if (chain.indexOf(list) < 0) return;
  const want = list.extended.decorator;
  if (!want) return;
  let found = null, target = null;
  for (const e of chain) {
    if (e.internal !== "GameImage") continue;
    if (!e.extended || !e.extended.pattern) continue;      // OPL would null-deref here (§5.3)
    if (e.extended.pattern === want) { found = e; break; }
  }
  if (!found) {
    diags.push(dg("warn","DECORATOR_NO_TARGET",
      `${list.name}_decorator="${want}" matches no GameImage/ItemIcon/ItemCover on this page, so no row icons are drawn.`,
      lineOf(doc, list.name + "_decorator"), list.name));
    return;
  }
  const cache = theme.caches.get(want);
  const need = list.extended.displayedItems;
  if (cache && cache.count < need) {
    diags.push(dg("warn","DECORATOR_DROPPED",
      `${list.name}_decorator="${want}" is ignored: the ${found.typeName} caches ${cache.count} images but the list shows ${need} rows. OPL requires count ≥ rows — raise ${found.name}_count to ${need}, or shorten the list.`,
      lineOf(doc, found.name + "_count") ?? lineOf(doc, list.name + "_decorator"), list.name));
    return;
  }
  list.extended.decoratorImage = found;
  target = found;
  if (list.aligned === ALIGN_CENTER && target)
    diags.push(dg("info","ALIGNED_DECORATOR",
      `${list.name} is centred (aligned=1) and has a decorator. OPL centres the row icons but not the row text (themes.c:868), so they sit ${list.width>>1}px apart. This is OPL's behaviour, reproduced as-is.`,
      lineOf(doc, list.name + "_aligned"), list.name));
}

/* ============================================================= 4. validate */

/**
 * Lint beyond what OPL itself does: bad filenames, missing assets, attributes the
 * element type never reads, and the PS2 art-cache memory estimate (§7 of PLAN).
 */
function validateTheme(doc, theme, assets) {
  const diags = [];
  /* Theme files and game art are two different asset sets, and only the first
     one can answer "is backdrop.png present". The caller enables validation when
     *either* set is loaded, so loading art alone used to make every theme
     `default=` report as missing against an empty file list -- a false error on
     files that were sitting in the folder the whole time. An empty name set
     means "no theme folder opened", not "opened and empty". */
  const have = (assets && assets.names.size) ? assets.names : null;

  const allElements = [];
  for (const k of Object.keys(theme.chains)) allElements.push(...theme.chains[k]);
  if (theme.loadingIcon) allElements.push(theme.loadingIcon);

  for (const el of allElements) {
    if (el.injected) continue;
    const allowed = new Set([...COMMON_ATTRS, ...(TYPE_ATTRS[el.typeName] || [])]);
    for (const k of el.explicit) {
      if (!allowed.has(k))
        diags.push(dg("info","INVALID_ATTR",
          `${el.name}_${k} is not read by ${el.typeName} elements; it has no effect.`,
          lineOf(doc, el.name + "_" + k), el.name));
    }
    if (PATCHED_TYPES.has(el.typeName))
      diags.push(dg("info","PATCHED_ONLY",
        `${el.name} is a ${el.typeName}, which only exists with patches/02-opl-sort-and-recent.patch. Stock OPL treats it as an unknown type and drops the element.`,
        lineOf(doc, el.name + "_type"), el.name));

    for (const k of el.explicit) {
      if (PATCHED_ATTRS.has(k) && allowed.has(k))
        diags.push(dg("info","PATCHED_ONLY",
          `${el.name}_${k} needs patches/opl-tile-grid.patch. Stock OPL ignores it, so on an unpatched build this element falls back to its non-grid behaviour.`,
          lineOf(doc, el.name + "_" + k), el.name));
    }

    const ex = el.extended || {};
    for (const [attr, val] of [["default", ex.defaultTexture], ["overlay", ex.overlay]]) {
      if (!val) continue;
      if (/\.(png|jpe?g|bmp)$/i.test(val))
        diags.push(dg("warn","EXT_IN_FILENAME",
          `${el.name}_${attr}="${val}" includes a file extension. OPL appends ".png" itself, so it looks for "${val}.png".`,
          lineOf(doc, el.name + "_" + attr), el.name));
      if (have) {
        const want = (val.replace(/\.(png|jpe?g|bmp)$/i, "") + ".png").toLowerCase();
        if (!have.has(want)) {
          const alt = [".jpg",".jpeg",".bmp"].find(e => have.has(want.replace(/\.png$/, e)));
          diags.push(alt
            ? dg("warn","JPG_ASSET",
                `${el.name}_${attr}="${val}": only ${want.replace(/\.png$/, alt)} is present. OPL dropped JPG/BMP support on 2024-10-22 and now loads .png only — convert it.`,
                lineOf(doc, el.name + "_" + attr), el.name)
            : dg("error","MISSING_ASSET",
                `${el.name}_${attr}="${val}": ${want} is not in the theme folder, so nothing is drawn.`,
                lineOf(doc, el.name + "_" + attr), el.name));
        }
      }
    }
  }

  const fontFiles = [];
  for (let i = 0; i < 16; i++) { const f = theme.fonts[i]; if (f && f.file) fontFiles.push([i, f.file]); }
  if (have) for (const [slot, file] of fontFiles)
    if (!have.has(file.toLowerCase()))
      diags.push(dg("error","MISSING_ASSET",
        `Font slot ${slot} references "${file}", which is not in the theme folder. OPL falls back to its built-in font.`,
        lineOf(doc, slot === 0 ? "default_font" : "font" + slot)));

  return { diags: dedupeDiags(diags), memory: estimateMemory(theme, assets),
           vram: estimateVram(theme, assets) };
}

/**
 * Art cache memory: count × w × h × 3 bytes per distinct cache (§6.5), shared
 * caches counted once, which is what findDuplicate makes OPL do.
 */
// Assumed source dimensions when an element uses DIM_UNDEF and no sample art is
// loaded. Sized after a real art pack rather than optimistically, because this
// figure is a hardware-safety estimate — measured art always overrides it.
const PATTERN_SIZE = { COV:{w:300,h:450}, COV2:{w:300,h:450}, ICO:{w:64,h:64}, BG:{w:460,h:215},
                       SCR:{w:250,h:188}, SCR2:{w:250,h:188}, LGO:{w:400,h:278} };
/**
 * VRAM is the tighter budget and the one nothing else models. gsKit is given
 * 4 MB (`__VRAM_SIZE`, renderman.c:15); OPL takes two 640x480 double-buffered
 * CT24 framebuffers out of it with Z-buffering off, leaving roughly this much
 * for textures. CT24 occupies a full 32-bit word per pixel in VRAM.
 */
const VRAM_TOTAL = 4 * 1024 * 1024;
// NTSC is 640x448 (renderman.c rm_mode_table), not 640x480. The 480 here is
// the virtual coordinate space the theme is authored in; the framebuffer that
// actually occupies VRAM is 448 tall, so this was under-reporting the texture
// budget by 163,840 bytes.
const VRAM_FRAMEBUFFERS = 2 * 640 * 448 * 4;
const VRAM_FOR_TEXTURES = VRAM_TOTAL - VRAM_FRAMEBUFFERS;   // ~1.66 MB

/**
 * Textures that must be resident in the same frame. A grid binds one per tile,
 * everything else binds one. Exceeding this does not fail cleanly — the texture
 * manager evicts and re-uploads every frame, which thrashes.
 */
/**
 * gsKit_texture_size (gsKit ee/gs/src/gsTexture.c), ported faithfully.
 *
 * The GS allocates in 256-byte blocks and gsKit rounds the block counts up to a
 * 4x8 alignment, so a texture costs meaningfully more than width x height x
 * bytes. A 640x448 T8 background is 327,680 rather than the 286,720 the naive
 * arithmetic gives. Estimating from the naive figure understates every asset.
 */
function gsTextureSize(w, h, psm) {
  let wb, hb;
  switch (psm) {
    case "CT32": case "CT24": wb = Math.ceil(w / 8);  hb = Math.ceil(h / 8);  break;
    case "CT16": case "CT16S": wb = Math.ceil(w / 16); hb = Math.ceil(h / 8);  break;
    case "T8":  wb = Math.ceil(w / 16); hb = Math.ceil(h / 16); break;
    case "T4":  wb = Math.ceil(w / 32); hb = Math.ceil(h / 16); break;
    default: throw new Error("gsTextureSize: unknown psm " + psm);
  }
  let wa, ha;
  if (wb <= 2 && hb <= 1)      { wa = 1; ha = 1; }
  else if (wb <= 2 && hb <= 2) { wa = 2; ha = 2; }
  else if (wb <= 2 && hb <= 8) { wa = 2; ha = 8; }
  else                         { wa = 4; ha = 8; }
  wb = (-wa) & (wb + wa - 1);
  hb = (-ha) & (hb + ha - 1);
  return wb * hb * 256;
}

/** VRAM a texture occupies, palette included — gsKit allocates both as one block. */
function textureVramCost(w, h, psm) {
  const clut = (psm === "T8") ? gsTextureSize(16, 16, "CT32")
             : (psm === "T4") ? gsTextureSize(8, 2, "CT32") : 0;
  return gsTextureSize(w, h, psm) + clut;
}

function estimateVram(theme, assets) {
  // Per screen, not per theme: main and info are never drawn in the same frame,
  // so the peak is the worst single chain rather than their sum.
  const perChain = {};

  for (const key of Object.keys(theme.chains)) {
    const rows = [];
    let total = 0;

    for (const el of theme.chains[key]) {
      const ex = el.extended || {};
      let pattern = null, concurrent = 1;

      if (el.internal === "ItemsList" && ex.decoratorImage) {
        pattern = ex.decoratorImage.extended.pattern;
        concurrent = ex.displayedItems;
      } else if (ex.pattern && (el.internal === "GameImage" || el.internal === "Background" || el.internal === "RecentImage")) {
        pattern = ex.pattern;
      }
      if (!pattern) continue;

      const measured = assets && assets.artSize && assets.artSize.get(pattern);
      const nat = measured || PATTERN_SIZE[pattern] || { w:256, h:256 };
      // Indexed sources cost a quarter as much and carry a palette; the loader
      // (textures.c:502) already handles them, so the estimate has to as well.
      const psm = nat.psm || "CT32";
      const bytes = concurrent * textureVramCost(nat.w, nat.h, psm);
      total += bytes;
      rows.push({ el: el.name, pattern, concurrent, w:nat.w, h:nat.h, psm, bytes,
                  basis: measured ? "measured" : "assumed for this pattern — load your ART folder for a real figure" });
    }

    rows.sort((a, b) => b.bytes - a.bytes);
    perChain[key] = { rows, total };
  }

  let worst = "main", total = 0;
  for (const key of Object.keys(perChain))
    if (perChain[key].total > total) { total = perChain[key].total; worst = key; }

  return { chain: worst, rows: perChain[worst].rows, perChain, total, budget: VRAM_FOR_TEXTURES,
           level: total > VRAM_FOR_TEXTURES ? "err" : total > VRAM_FOR_TEXTURES * 0.75 ? "warn" : "ok" };
}

function estimateMemory(theme, assets) {
  const rows = [];
  let total = 0;
  for (const cache of theme.caches.values()) {
    // The cache holds the DECODED SOURCE image (texLoad decodes the PNG at its
    // native size); the element's width/height only scale the draw quad. Sizing
    // this off the element would under-report, which is the wrong direction for
    // a hardware-safety figure.
    const measured = assets && assets.artSize && assets.artSize.get(cache.pattern);
    const nat = measured || PATTERN_SIZE[cache.pattern] || { w:256, h:256 };
    const w = nat.w, h = nat.h;
    const basis = measured ? "measured from your art"
                : PATTERN_SIZE[cache.pattern] ? "assumed source size for this pattern"
                : "assumed source size";
    const bytes = Math.max(0, cache.count) * Math.max(0,w) * Math.max(0,h) * 3;
    total += bytes;
    rows.push({ pattern:cache.pattern, count:cache.count, w, h, bytes, basis,
                users:cache.users, shared:cache.users.length > 1 });
  }
  rows.sort((a,b) => b.bytes - a.bytes);
  return { rows, total,
    level: total > 12e6 ? "err" : total > 6e6 ? "warn" : "ok" };
}

/* ------------------------------------------------- text layout (§9.3, §9.4) */

/**
 * fntFitString (fntsys.c:735): inserts newlines at word boundaries, in place and
 * once at load time. `measure(str)` returns a width in virtual pixels.
 */
function fitString(measure, string, width) {
  let cw = 0;
  const spacewidth = measure(" ");
  const chars = string.split("");
  let i = 0, prevSpace = -1;
  while (i < chars.length) {
    let sp = i;
    while (sp < chars.length && chars[sp] !== " " && chars[sp] !== "\n") sp++;
    if (chars[sp] === "\n") { cw = 0; i = sp + 1; prevSpace = -1; continue; }
    const word = chars.slice(i, sp).join("");
    const ww = measure(word);
    if (cw + ww > width) {
      if (prevSpace >= 0) { chars[prevSpace] = "\n"; cw = ww; prevSpace = sp; }
      else { if (sp < chars.length) chars[sp] = "\n"; cw = 0; }
    } else { cw += ww; prevSpace = sp; }
    cw += spacewidth;
    i = sp + 1;
  }
  return chars.join("");
}

/** Baseline offset applied by fntRenderString before drawing (§9.3). */
const textBaselineOffset = (aligned, fontSize) =>
  aligned === ALIGN_CENTER ? ((fontSize - 4) >> 1) : (fontSize - 2);

/** rmSetupQuad geometry (§9.1/§9.2). aspectWidth is 4 for 4:3, 3 for 16:9. */
function setupQuad(x, y, aligned, w, h, scaled, aspectWidth) {
  w = (scaled & SCALING_RATIO) ? ((w * aspectWidth) >> 2) : w;
  const ulx = (aligned & 8) ? x - (w >> 1) : x;      // ALIGN_HCENTER
  const uly = (aligned & 2) ? y - (h >> 1) : y;      // ALIGN_VCENTER
  return { x:ulx, y:uly, w, h };
}

const FONT_FAMILY = "OPLPoeVetica";
let fontReady = false;

async function loadBuiltinFont() {
  if (!FONT_B64 || FONT_B64.startsWith("__")) return false;      // not embedded yet
  try {
    const bin = atob(FONT_B64);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    const face = new FontFace(FONT_FAMILY, buf.buffer);
    await face.load();
    document.fonts.add(face);
    fontReady = true;
    return true;
  } catch (e) { console.warn("built-in font unavailable:", e); return false; }
}

/** Load a theme-supplied TTF so `default_font` / `fontN` render with the real face. */
async function loadThemeFont(file, family) {
  try {
    const face = new FontFace(family, await file.arrayBuffer());
    await face.load();
    document.fonts.add(face);
    return true;
  } catch { return false; }
}

const lower = s => s.toLowerCase();

/** Ingest a FileList / array of Files into the asset store. */
async function ingestFiles(files) {
  S.files = new Map();
  S.images = new Map();
  S.art = new Map();
  S.themeFonts = new Map();
  let cfgText = null, cfgFile = null;

  for (const f of files) {
    const rel = (f.webkitRelativePath || f.name).replace(/^[^/]*\//, "");
    S.files.set(lower(rel), f);
    const base = lower(rel.split("/").pop());
    if (base === "conf_theme.cfg" && (!cfgFile || rel.length < cfgFile.length)) { cfgFile = rel; cfgText = await f.text(); }
  }

  const jobs = [];
  for (const [rel, f] of S.files) {
    const base = rel.split("/").pop();
    if (/\.(png|jpe?g|bmp|gif)$/.test(base)) {
      if (rel.startsWith("art/")) jobs.push(loadArt(base, f));
      else jobs.push(loadImage(base, f));
    }
  }
  await Promise.all(jobs);
  return cfgText;
}

function loadImage(name, file) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => { S.images.set(lower(name), img); res(); };
    img.onerror = () => res();
    img.src = URL.createObjectURL(file);
  });
}
/** PNG colour type and bit depth, straight out of IHDR.
 *
 * An <img> cannot tell you whether its source was indexed, and that is exactly
 * what decides the VRAM cost -- palette type 3 becomes T8 or T4 on the GS, a
 * quarter the size plus a CLUT. Read the header rather than guess.
 */
async function pngPsm(file) {
  try {
    const head = new Uint8Array(await file.slice(0, 33).arrayBuffer());
    if (head[0] !== 0x89 || head[1] !== 0x50) return "CT32";   // not a PNG
    const depth = head[24], colorType = head[25];
    if (colorType === 3) return depth === 4 ? "T4" : depth === 8 ? "T8" : "CT32";
    if (colorType === 2) return "CT24";
    return "CT32";
  } catch { return "CT32"; }
}

function loadArt(name, file) {
  return new Promise(res => {
    const img = new Image();
    img.onload = async () => {
      img._psm = await pngPsm(file);
      S.art.set(lower(name.replace(/\.[^.]+$/, "")), img);
      res();
    };
    img.onerror = () => res();
    img.src = URL.createObjectURL(file);
  });
}

/* Art, without the folder picker.
 *
 * The picker is an <input webkitdirectory>, and nothing it hands over can
 * outlive a reload -- so every refresh silently dropped the art and the mock
 * pages went back to drawing placeholder swatches. That looks exactly like art
 * that is missing or misnamed, which is the one thing this tool exists to tell
 * you the truth about.
 *
 * When the file is served over HTTP the art is simply fetchable, so fetch it.
 * Parsed out of the directory index rather than guessed from the game list,
 * because a file that is present under an unexpected name is a finding, not
 * something to silently skip. From file:// this fetch fails and the picker is
 * still there, which is why it stays.
 */
const ART_DIR = "_deploy/ART/";
async function autoLoadArt() {
  if (!location.protocol.startsWith("http")) return 0;
  let names;
  try {
    const html = await (await fetch(ART_DIR)).text();
    names = [...html.matchAll(/href="([^"]+\.(?:png|jpe?g))"/gi)].map(m => decodeURIComponent(m[1]));
  } catch { return 0; }
  const loaded = await Promise.all(names.map(async name => {
    try {
      const blob = await (await fetch(ART_DIR + encodeURIComponent(name))).blob();
      await loadArt(name, blob);
      return 1;
    } catch { return 0; }
  }));
  return loaded.reduce((a, b) => a + b, 0);
}

/** The set validateTheme() checks referenced filenames against. */
function assetIndex() {
  // Largest per pattern, not the last one seen: the memory and VRAM figures are
  // safety estimates, so a mixed-size art pack has to be judged on its worst
  // case rather than on whichever file happened to load last.
  const artSize = new Map();
  for (const [key, img] of S.art) {
    const pattern = key.split("_").pop().toUpperCase();
    const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    const prev = artSize.get(pattern);
    if (!prev || w * h > prev.w * prev.h) artSize.set(pattern, { w, h, psm: img._psm || "CT32" });
  }
  return { names: new Set([...S.files.keys()].map(k => k.split("/").pop())), artSize };
}

const artCache = new Map();
/**
 * Stand-in art at the conventional aspect for a pattern, stamped with the
 * serial so per-game mapping is visible. Real art wins when the ART folder has
 * <SERIAL>_<PATTERN>.png (§6.5).
 */
function gameArt(serial, pattern) {
  const real = S.art.get(lower(serial + "_" + pattern));
  if (real) return real;
  if (!S.placeholderArt) return null;
  const key = serial + "_" + pattern;
  if (artCache.has(key)) return artCache.get(key);

  const size = PATTERN_SIZE[pattern] || { w: 200, h: 200 };
  const c = document.createElement("canvas");
  c.width = size.w; c.height = size.h;
  const g = c.getContext("2d");
  let h = 0;
  for (const ch of key) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const hue = h % 360;
  const grad = g.createLinearGradient(0, 0, size.w, size.h);
  grad.addColorStop(0, `hsl(${hue} 55% 42%)`);
  grad.addColorStop(1, `hsl(${(hue + 48) % 360} 55% 22%)`);
  g.fillStyle = grad; g.fillRect(0, 0, size.w, size.h);
  g.strokeStyle = "#ffffff55"; g.lineWidth = 2; g.strokeRect(1, 1, size.w - 2, size.h - 2);
  g.fillStyle = "#fff";
  const fs = Math.max(8, Math.round(Math.min(size.w, size.h) / 9));
  g.font = `700 ${fs}px system-ui,sans-serif`;
  g.textAlign = "center";
  g.fillText(pattern, size.w / 2, size.h / 2 - fs * 0.2);
  g.font = `${Math.round(fs * 0.72)}px ui-monospace,monospace`;
  g.fillStyle = "#ffffffcc";
  g.fillText(serial, size.w / 2, size.h / 2 + fs);
  const img = new Image();
  img.src = c.toDataURL();
  artCache.set(key, img);
  return img;
}

/** The list in the order OPL would show it: autosort is on by default. */
function gameList() {
  const byTitle = (a, b) => {
    const x = a.title.toLowerCase(), y = b.title.toLowerCase();
    return x < y ? -1 : x > y ? 1 : 0;
  };
  switch (S.sortMode) {
    case 1: return GAMES.slice().sort((a, b) => -byTitle(a, b));
    case 2: {                                     // recent first, then A-Z
      const rank = s => { const i = S.recent.indexOf(s); return i < 0 ? 99 : i; };
      return GAMES.slice().sort((a, b) => (rank(a.serial) - rank(b.serial)) || byTitle(a, b));
    }
    case 3: return GAMES;                          // as scanned
    default: return GAMES.slice().sort(byTitle);
  }
}

/** Per-game values an AttributeText element can look up. */
function gameAttr(game, attr) {
  const key = attr.replace(/^#/, "").toLowerCase();
  switch (key) {
    // No "Title" case on purpose. OPL never writes that key -- the display name
    // is CONFIG_ITEM_NAME, "#Name" -- so a theme asking for Title must come back
    // empty here too, or the previewer hides the bug instead of showing it.
    // Shaped like the real thing, not like filler. These are the longest values
    // the generated metadata actually produces, so a box that looks roomy here
    // is roomy on hardware, and one that clips here clips there.
    case "genre": return "Action Adventure";
    case "release": return "2003";
    case "developer": return "Insomniac Games";
    case "size": return game.size;              // real, from the dump manifest
    case "description": return GAME_DESC;
    case "name": case "longname": return game.title;
    case "startup": return game.serial;
    case "media": return "DVD";
    case "format": return "ISO";
    case "rating": return "CERO B";
    case "vmode": return "NTSC";
    case "aspect": return "4:3";
    case "scan": return "480p";
    case "device": return "USB";
    default: return null;
  }
}
// English labels for the attributes OPL localises (lng_tmpl/_base.yml).
const ATTR_LABEL = { title:"Title", genre:"Genre", release:"Release", developer:"Developer",
                     size:"Size", description:"Description" };

/* =============================================================== 7. render */

const cScreen = document.getElementById("cScreen");
const cOverlay = document.getElementById("cOverlay");
const ctx = cScreen.getContext("2d");
const octx = cOverlay.getContext("2d");

const S = {
  shelfSel: 0,                                  // SHELF Apps mock: highlighted card
  doc:null, theme:null, validation:null, chain:"main", sel:null,
  files:new Map(), images:new Map(), art:new Map(), themeFonts:new Map(),
  aspect:4, zoom:"fit", smooth:false, grid:false, snap:false, plasma:true,
  showLoading:false, placeholderArt:true,
  gameIndex:3, pageStart:0, device:0, deviceCount:3, sortMode:0,
  recent:["SLPM_657.90","SCPS_150.56","SLPS_250.50","SLPM_654.88"], dirHandle:null, live:false, liveTimer:null,
  undo:[], redo:[], syncing:false, typing:0,
};

const rgb = c => `rgb(${c.r},${c.g},${c.b})`;

/* ------------------------------------------------------------ text layout */

const glyphCache = new Map();
/**
 * OPL bakes the size into the font handle, so a slot whose TTF fails to load
 * reverts to slot 0 completely — size included (themes.c:1220/1240). Only apply
 * that when a folder is loaded and we can tell the file is genuinely absent;
 * with a pasted cfg, honour the declared size so the layout stays useful.
 */
function fontSpec(el) {
  // Accepts an element or a bare slot number. It used to take only an element,
  // and a number fell through `el.font` as undefined to the default font --
  // silently measuring 17px PoeVetica where the caller meant a 10px theme slot.
  // Anything that reports the wrong font quietly is worse than one that throws,
  // because measurements taken with it agree with each other and with nothing
  // that is actually drawn.
  const slot = typeof el === "number" ? el : (el ? el.font : 0);
  const fonts = (S.theme && S.theme.fonts) || {};
  const size = s => (fonts[s] && fonts[s].size) || FNT_DEFAULT_SIZE;
  const loaded = s => { const fam = S.themeFonts.get(s); return fam ? { size: size(s), family: fam } : null; };

  const got = loaded(slot);
  if (got) return got;
  if (fonts[slot] && fonts[slot].file && S.files.size)
    return loaded(0) || { size: FNT_DEFAULT_SIZE, family: FONT_FAMILY };
  return { size: size(slot), family: FONT_FAMILY };
}
function useFont(spec) { ctx.font = `${spec.size}px "${spec.family}", sans-serif`; }

/**
 * PoeVeticaNew has no `kern` table, so FT_HAS_KERNING is false and OPL's
 * advance is exactly `glyph->shx >> 6` — an integer per glyph. Summing rounded
 * per-glyph advances reproduces that, unlike measuring the whole string.
 */
function glyphMetrics(ch, spec) {
  // fntUpdateAspectRatio sets the horizontal DPI to fDPI * PAR, and PAR picks up
  // a 0.75 factor in anamorphic 16:9 — so OPL re-rasterises glyphs 3/4 as wide
  // and text comes out undistorted after the display stretch. Metrics have to
  // follow, or centring and clipping land in the wrong place.
  const sx = S.aspect / 4;
  const key = spec.family + "|" + spec.size + "|" + sx + "|" + ch;
  let m = glyphCache.get(key);
  if (!m) {
    useFont(spec);
    const t = ctx.measureText(ch);
    m = { adv: Math.round(t.width * sx),
          ink: Math.ceil(((t.actualBoundingBoxRight || t.width) + (t.actualBoundingBoxLeft || 0)) * sx) };
    glyphCache.set(key, m);
  }
  return m;
}
function textWidth(str, spec) {
  let w = 0;
  for (const ch of String(str)) w += glyphMetrics(ch, spec).adv;
  return w;
}

/** fntRenderString (fntsys.c:502) — §9.3. Returns the final pen x. */
function renderString(el, x, y, aligned, width, height, string, color) {
  const spec = fontSpec(el);
  string = String(string ?? "");
  if (aligned & 8)
    x -= (width ? Math.min(textWidth(string, spec), width) : textWidth(string, spec)) >> 1;
  y += textBaselineOffset(aligned & 2 ? ALIGN_CENTER : ALIGN_NONE, spec.size);

  useFont(spec);
  ctx.fillStyle = rgb(color);
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";

  let pen = x;
  const xmax = x + width, ymax = y + height;
  const sx = S.aspect / 4;
  if (sx !== 1) { ctx.save(); ctx.scale(sx, 1); }   // squeeze glyphs, not positions
  for (const ch of string) {
    const g = glyphMetrics(ch, spec);
    if (width) {
      if (ch === "\n") { pen = x; y += MENU_ITEM_HEIGHT; continue; }
      if (y > ymax) break;
      if (pen + g.ink > xmax) { pen = xmax + 1; continue; }   // rest of the line is dropped
    }
    if (ch !== "\n") ctx.fillText(ch, pen / sx, y);
    pen += g.adv;
  }
  if (sx !== 1) ctx.restore();
  return pen;
}

/* -------------------------------------------------------------- primitives */

/** rmDrawPixmap (§9.1/§9.2), recording the rect for hit-testing. */
function drawPixmap(el, img, x, y, aligned, w, h, scaled, tint) {
  if (w === DIM_UNDEF) w = img ? img.naturalWidth || img.width : 0;
  if (h === DIM_UNDEF) h = img ? img.naturalHeight || img.height : 0;
  const q = setupQuad(x, y, aligned, w, h, scaled, S.aspect);
  if (img && q.w > 0 && q.h > 0) {
    // gDefaultCol (#808080) is the neutral multiply; anything else tints.
    if (tint && (tint.r !== 0x80 || tint.g !== 0x80 || tint.b !== 0x80)) {
      const t = tintedCopy(img, tint);
      ctx.drawImage(t, q.x, q.y, q.w, q.h);
    } else ctx.drawImage(img, q.x, q.y, q.w, q.h);
  }
  return q;
}

const tintCache = new Map();
function tintedCopy(img, tint) {
  const key = (img.src || "").slice(-64) + colorToHex(tint);
  if (tintCache.has(key)) return tintCache.get(key);
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = "multiply";
  // 0x80 is "1.0" on the GS, so the multiplier is component/128.
  g.fillStyle = `rgb(${Math.min(255, tint.r * 2)},${Math.min(255, tint.g * 2)},${Math.min(255, tint.b * 2)})`;
  g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = "destination-in";
  g.drawImage(img, 0, 0);
  tintCache.set(key, c);
  return c;
}

/** A labelled stand-in for an icon OPL compiles in rather than reads from the theme. */
function drawStub(q, label, accent) {
  if (q.w <= 0 || q.h <= 0) return;
  ctx.save();
  // Mid-grey with alpha so the stub stays visible on both dark and paper-white
  // themes — a white stub vanished entirely on light backgrounds.
  ctx.fillStyle = accent || "rgba(128,128,128,0.22)";
  ctx.fillRect(q.x, q.y, q.w, q.h);
  ctx.strokeStyle = "rgba(128,128,128,0.8)"; ctx.lineWidth = 1;
  ctx.setLineDash([3, 2]);
  ctx.strokeRect(q.x + .5, q.y + .5, q.w - 1, q.h - 1);
  ctx.setLineDash([]);
  if (q.w >= 14 && q.h >= 10) {
    ctx.fillStyle = "rgba(128,128,128,0.95)";
    ctx.font = `${Math.min(10, Math.max(7, q.h - 4))}px system-ui,sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(label, q.x + q.w / 2, q.y + q.h / 2, q.w - 4);
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  }
  ctx.restore();
}

/* ---------------------------------------------------------------- plasma */

let plasmaCache = null;
/**
 * guiDrawBGPlasma (gui.c:1269) renders a 32x32 Perlin field tinted by bg_color
 * and stretches it to the screen, updating 6 rows a frame. A layout tool wants
 * a stable image, so this is the converged field, static (§11.6).
 */
function plasmaTexture(color) {
  const key = colorToHex(color);
  if (plasmaCache && plasmaCache.key === key) return plasmaCache.canvas;
  const N = 32;
  const c = document.createElement("canvas");
  c.width = N; c.height = N;
  const g = c.getContext("2d");
  const im = g.createImageData(N, N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const u = x / N * 2, v = y / N * 2;
    const n = (Math.sin(u * 3.1) * Math.cos(v * 2.7) + Math.sin((u + v) * 2.2) * 0.6
             + Math.sin(u * 5.3 + v * 1.7) * 0.35) / 1.95;
    const f = Math.max(0, Math.min(1, n * 0.5 + 0.5));
    const o = (y * N + x) * 4;
    im.data[o]   = f * color.r;
    im.data[o+1] = f * color.g;
    im.data[o+2] = f * color.b;
    im.data[o+3] = 255;
  }
  g.putImageData(im, 0, 0);
  plasmaCache = { key, canvas: c };
  return c;
}
function drawPlasma(color) {
  const prev = ctx.imageSmoothingEnabled;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(plasmaTexture(color), 0, 0, SCREEN_W, SCREEN_H);
  ctx.imageSmoothingEnabled = prev;
}

/* ------------------------------------------------------- element drawing */

/**
 * texDiscoverLoad appends ".png" and nothing else (§6.4) — no extension
 * stripping, no other formats. Being lenient here would hide the very bug
 * EXT_IN_FILENAME warns about, so `default=logo.png` really does miss.
 */
const themeImage = name => name ? S.images.get(lower(name + ".png")) || null : null;

function drawElement(el) {
  // Clamp: the list length changes with the device and sort mode, so a stale
  // index from a longer list would otherwise crash every draw.
  const _games = gameList();
  if (_games.length) S.gameIndex = Math.min(Math.max(S.gameIndex, 0), _games.length - 1);
  const game = _games[S.gameIndex];
  const ex = el.extended || {};
  let q = null;
  // GameCountText and ItemIcon/ItemCover are registered under another internal
  // type (§3), so dispatch on the cfg type where the drawing differs.
  const kind = el.typeName === "GameCountText" ? "GameCountText" : el.internal;

  switch (kind) {
    case "Background": {
      let img = ex.pattern ? gameArt(game.serial, ex.pattern) : null;
      if (!img || !img.complete) img = themeImage(ex.defaultTexture);
      if (img && img.complete && img.naturalWidth) {
        q = drawPixmap(el, img, el.posX, el.posY, el.aligned, el.width, el.height, el.scaled, el.color);
      } else {
        if (S.plasma) drawPlasma(S.theme.bgColor);
        else { ctx.fillStyle = rgb(S.theme.bgColor); ctx.fillRect(0, 0, SCREEN_W, SCREEN_H); }
        q = { x:0, y:0, w:SCREEN_W, h:SCREEN_H };
      }
      break;
    }
    case "StaticImage": {
      const img = themeImage(ex.defaultTexture);
      q = drawPixmap(el, img, el.posX, el.posY, el.aligned, el.width, el.height, el.scaled, el.color);
      if (!img) q = stubQuad(el, "no image");
      if (ex.overlay) drawOverlay(el, q);
      break;
    }
    case "GameImage": {
      // Tile elements render a fixed slot on the page, not the selection.
      const g2 = ex.useOffset ? gameList()[S.pageStart + ex.offset] : game;
      if (ex.useOffset && !g2) { el._rect = { x:el.posX, y:el.posY, w:0, h:0 }; return; }
      let img = ex.pattern ? gameArt(g2.serial, ex.pattern) : null;
      if (!img) img = themeImage(ex.defaultTexture);
      if (img && img.complete && img.naturalWidth)
        q = drawPixmap(el, img, el.posX, el.posY, el.aligned, el.width, el.height, el.scaled, el.color);
      else q = stubQuad(el, (ex.pattern || "art") + (ex.useOffset ? " #" + ex.offset : ""));
      if (ex.overlay) drawOverlay(el, q);
      if (ex.useOffset && S.pageStart + ex.offset === S.gameIndex) markSelectedTile(q);
      break;
    }
    case "AttributeImage": {
      const v = ex.pattern ? gameAttr(game, ex.pattern) : null;
      const img = themeImage(ex.defaultTexture);
      if (img) q = drawPixmap(el, img, el.posX, el.posY, el.aligned, el.width, el.height, el.scaled, el.color);
      else q = stubQuad(el, v ? `${(ex.pattern||"").replace(/^#/,"")}=${v}` : (ex.pattern || "attr"));
      break;
    }
    case "RecentImage": {
      const g3 = recentList()[ex.recentIndex];
      let img = g3 && ex.pattern ? gameArt(g3.serial, ex.pattern) : null;
      if (!img) img = themeImage(ex.defaultTexture);
      if (img && img.complete && img.naturalWidth)
        q = drawPixmap(el, img, el.posX, el.posY, el.aligned, el.width, el.height, el.scaled, el.color);
      else q = stubQuad(el, "recent " + ex.recentIndex);
      break;
    }
    case "RecentText": {
      const g4 = recentList()[ex.recentIndex];
      q = drawSingleText(el, g4 ? g4.title : "");
      break;
    }
    case "MenuTabs":   q = drawMenuTabs(el); break;
    case "ItemsList":  q = drawItemsList(el); break;
    case "ItemText":   q = drawSingleText(el, game.serial); break;
    case "StaticText": q = drawSingleText(el, ex.value ?? ""); break;
    case "GameCountText": {
      // prefix/suffix replace OPL's localised "Files found: %i" (patch 03).
      const n = gameList().length;
      const txt = (ex.countPrefix || ex.countSuffix)
        ? `${ex.countPrefix || ""}${n}${ex.countSuffix || ""}`
        : `Files found: ${n}`;

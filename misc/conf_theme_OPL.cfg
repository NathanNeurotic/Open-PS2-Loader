# Korium Komblete -- graphics by Berion, script by KrahJohlito and Ripto.
# Ported to the built-in theme by RiptOPL.
#
# NO GLOBAL COLOUR KEYS. The built-in themes take their colours from the Colours picker
# (thmLoad in src/themes.c, #574) -- a bg_color / text_color / sel_text_color here would
# override the user's own choice on every boot. Per-element color is still fine, and the
# info page below uses it over the lighter info plate.
#
# NO default_font either. The built-in theme has no folder to load a TTF from, so the
# embedded PoeVeticaNew is already slot 0.
#
# Element names are scanned consecutively from 0 and a NUMBERING GAP SILENTLY STOPS THE
# SCAN (docs/THEME-FORMAT.md section 2.2). To switch an element off, set its enabled key
# to 0 rather than deleting it.
#
# Careful with comment lines. This format has no comment character -- a line containing a
# colon and no equals sign parses as a SECTION HEADER and re-homes every key under it. So
# comment text must avoid both characters.
main0:
	type=Background
	default=background
	aligned=0
	scaled=0
	width=DIM_INF
	height=DIM_INF
# The device tab bar. One UNFILTERED MenuIcon is the whole bar -- drawMenuIcon draws the
# texture for the current page's icon_id, and Korium ships a full-width 640 by 128 strip per
# device with that device's tab lit. The old per-device filtered elements existed only
# because the previous art was a different bespoke size per device.
main1:
	type=MenuIcon
	x=0
	y=0
	aligned=0
	scaled=0
	width=640
	height=128
main2:
	type=BdmIndex
	x=24
	y=132
	aligned=0
	scaled=0
	width=128
	height=16
main3:
	type=ItemsList
	x=28
	y=152
	aligned=0
	width=316
	height=248
# Cover furniture. The three case frames share a 256 by 256 canvas with the art anchored
# top-left, so the element is the whole canvas and the overlay corners below are the case's
# front face measured off that canvas. Each family's y is chosen so all three kinds rest on
# a COMMON BOTTOM EDGE near 412 rather than a common top.
main4:
	type=ItemCover
	default=cover
	x=390
	y=156
	aligned=0
	width=256
	height=256
	overlay=case
	overlay2=case_overlay
	overlay_ulx=0
	overlay_uly=12
	overlay_urx=167
	overlay_ury=22
	overlay_llx=0
	overlay_lly=240
	overlay_lrx=167
	overlay_lry=250
appsMain4:
	type=ItemCover
	default=cover
	x=390
	y=230
	aligned=0
	width=256
	height=256
	overlay=apps_case
	overlay2=case_overlay
	overlay_ulx=0
	overlay_uly=12
	overlay_urx=167
	overlay_ury=22
	overlay_llx=0
	overlay_lly=165
	overlay_lrx=167
	overlay_lry=175
# PS1 titles get the jewel case. No overlay2 -- case_overlay is a gloss shaped for the tall
# PS2 case and reads wrong stretched over a landscape jewel case.
vcdMain4:
	type=ItemCover
	default=cover
	x=394
	y=251
	aligned=0
	width=256
	height=256
	overlay=case_ps1
	overlay_ulx=17
	overlay_uly=11
	overlay_urx=155
	overlay_ury=21
	overlay_llx=17
	overlay_lly=140
	overlay_lrx=155
	overlay_lry=150

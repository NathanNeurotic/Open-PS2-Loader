# Korium Komblete -- graphics by Berion, script by KrahJohlito and Ripto.
# Ported to the built-in theme by RiptOPL.
#
# THIS IS KORIUM'S OWN CFG, element for element and number for number. It wrote positions as
# negative offsets, which the parser folds as x plus 640 and y plus 480, and most elements default
# to centre alignment -- so the literals below are the theme's own layout, kept as written.
#
# EXACTLY THREE THINGS DIFFER from it, each marked in place -- the MenuIcon and BdmIndex sizes,
# because their bitmaps changed size under the cfg, and the ItemCover overlay corners, because
# Korium's were authored against its own older case art and no longer match the delivered frames.
#
# NO GLOBAL COLOUR KEYS. The built-in themes take their colours from the Colours picker
# (thmLoad in src/themes.c, #574) -- a bg_color / text_color / sel_text_color here would override
# the user's own choice on every boot. Korium set text_color to white globally; the info page
# below keeps that as a per-element colour, which is also what the previous built-in did.
#
# NO default_font either. The built-in theme has no folder to load a TTF from, so the embedded
# PoeVeticaNew is already slot 0.
#
# Element names are scanned consecutively from 0 and a NUMBERING GAP SILENTLY STOPS THE SCAN
# (docs/THEME-FORMAT.md section 2.2). To switch an element off, set its enabled key to 0.
#
# Careful with comment lines. This format has no comment character -- a line containing a colon
# and no equals sign parses as a SECTION HEADER and re-homes every key under it. So comment text
# must avoid both characters.
main0:
	type=Background
	default=background
	aligned=0
	scaled=0
	width=DIM_INF
	height=DIM_INF
# Korium's, untouched -- including decorator of ICO and the full 306 height.
main1:
	type=ItemsList
	decorator=ICO
	x=40
	y=38
	width=400
	height=306
# SIZE ONLY. Korium declared just width and height here and let a MenuIcon's default centre of
# (320, 400) place it, so the bar has always floated at the bottom. That is kept exactly -- no x,
# no y, no aligned. Only the forced dimensions grow, because the strip is now a 640 by 128 bitmap
# per device with that device's tab lit where Korium's was 256 by 64; 480 by 96 holds the art's
# 5 to 1 aspect and still ends at 448, leaving the hint on its own default row underneath.
# One UNFILTERED element is the whole bar, exactly as Korium had it -- drawMenuIcon draws the
# texture for the current page's icon_id.
#
# The strip reads BDM, MMCE, APA, NET, APPS, FAV left to right, and initAllSupport in src/opl.c
# initialises the pages in that same order (menuAppendItem links each page at the tail, so call
# order IS tab order). Change one and you must change the other or the wrong tab lights up.
main2:
	type=MenuIcon
	width=480
	height=96
# Korium's covers -- same element, same position, and NO overlay2 (the case art carries its own
# gloss in the face alpha; layering case_overlay over it greys the face and fringes the spine).
#
# THE CORNERS ARE MEASURED, NOT KORIUM'S, and that is deliberate. They are not proportional to the
# element -- rmDrawOverlayPixmap adds them to the quad's top-left in SCREEN space and drawGameImage
# passes them unscaled -- so they only line up if they match the delivered bitmap exactly. Korium's
# were authored against its own older case art and sat 3 px high, running the artwork past the
# case's bottom lip. Re-measure these against the PNG if the art is ever redrawn.
main3:
	type=ItemCover
	default=cover
	x=-86
	y=-296
	overlay=case
	overlay_ulx=0
	overlay_uly=12
	overlay_urx=167
	overlay_ury=20
	overlay_llx=0
	overlay_lly=242
	overlay_lrx=167
	overlay_lry=250
appsMain3:
	type=ItemCover
	default=cover
	x=-86
	y=-254
	overlay=apps_case
	overlay_ulx=0
	overlay_uly=12
	overlay_urx=167
	overlay_ury=20
	overlay_llx=0
	overlay_lly=167
	overlay_lrx=167
	overlay_lry=175
# NEW, because Korium predates this fork's VCD family. PS1 titles get the jewel case; the corners
# are measured off case_ps1.png the same way Korium's were off its own case art.
vcdMain3:

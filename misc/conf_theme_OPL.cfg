# Korium Komblete -- graphics by Berion, script by KrahJohlito and Ripto.
# Ported to the built-in theme by RiptOPL.
#
# The main page keeps KORIUM'S OWN geometry. Its cfg wrote positions as negative offsets, which
# the parser folds as x plus 640 and y plus 480, and most elements default to centre alignment,
# so the numbers below are the same layout the theme always had. Only two things moved, and only
# because the artwork changed size under them -- see the MenuIcon and BdmIndex notes.
#
# NO GLOBAL COLOUR KEYS. The built-in themes take their colours from the Colours picker
# (thmLoad in src/themes.c, #574) -- a bg_color / text_color / sel_text_color here would
# override the user's own choice on every boot. Per-element color is still fine, and the
# info page below uses it over the lighter info plate.
#
# NO default_font either. The built-in theme has no folder to load a TTF from, so the
# embedded PoeVeticaNew is already slot 0.
#
# Element names are scanned consecutively from 0 and a NUMBERING GAP SILENTLY STOPS THE
# SCAN (docs/THEME-FORMAT.md section 2.2). To switch an element off, set its enabled key
# to 0 rather than deleting it.
#
# Careful with comment lines. This format has no comment character -- a line containing a
# colon and no equals sign parses as a SECTION HEADER and re-homes every key under it. So
# comment text must avoid both characters.
main0:
	type=Background
	default=background
	aligned=0
	scaled=0
	width=DIM_INF
	height=DIM_INF
# The device tab bar. Korium already put this at the BOTTOM -- a MenuIcon defaults to centre
# (320, 400) and it declared no position. What changed is the art. The new strip is a full-width
# 640 by 128 bitmap per device with that device's tab lit, where the old one was 256 by 64, so it
# is pinned to the bottom edge instead of floating at 400. One UNFILTERED element is the whole
# bar -- drawMenuIcon draws the texture for the current page's icon_id, and the old per-device
# filtered elements only existed because the previous art was a bespoke size per device.
#
# The strip reads BDM, MMCE, APA, NET, APPS, FAV left to right, and initAllSupport in src/opl.c
# initialises the pages in that same order (menuAppendItem links each page at the tail, so call
# order IS tab order). Change one and you must change the other or the wrong tab lights up.
main1:
	type=MenuIcon
	x=0
	y=352
	aligned=0
	scaled=0
	width=640
	height=128
main2:
	type=ItemsList
	x=40
	y=38
	aligned=0
	width=400
	height=282
# Covers. Korium centred the PS2 case on 554, 184 and the apps box slightly lower so the two
# read as the same optical centre; the PS1 jewel case is placed on that same centre here. All
# three frames share a 256 by 256 canvas with the art anchored top-left, so the element is the
# whole canvas and the overlay corners are each frame's front face measured off it.
main3:
	type=ItemCover
	default=cover
	x=-86
	y=-296
	width=256
	height=256
	overlay=case
	overlay2=case_overlay
	overlay_ulx=0
	overlay_uly=12
	overlay_urx=167
	overlay_ury=22
	overlay_llx=0
	overlay_lly=240
	overlay_lrx=167
	overlay_lry=250
appsMain3:
	type=ItemCover
	default=cover
	x=-86
	y=-254
	width=256
	height=256
	overlay=apps_case
	overlay2=case_overlay
	overlay_ulx=0
	overlay_uly=12
	overlay_urx=167
	overlay_ury=22
	overlay_llx=0
	overlay_lly=165
	overlay_lrx=167
	overlay_lry=175
# PS1 titles get the jewel case. No overlay2 -- case_overlay is a gloss shaped for the tall PS2
# case and reads wrong stretched over a landscape jewel case.
vcdMain3:
	type=ItemCover
	default=cover
	x=-86
	y=-246
	width=256
	height=256
	overlay=case_ps1
	overlay_ulx=17
	overlay_uly=11
	overlay_urx=155
	overlay_ury=21
	overlay_llx=17
	overlay_lly=140
	overlay_lrx=155
	overlay_lry=150
# The disc tucked in behind and left of the case, at Korium's own 420, 250. Korium hid it on the
# apps page by giving it zero size; enabled of 0 is the supported way and costs no element.
# NOTE the ItemsList above deliberately does NOT carry Korium's decorator of ICO. That draws a
# per-row icon, which turns every settled row into an art lookup -- and a MISSING cover open is
# the expensive one on a slow bus. The selected-item disc below gives the same look for one slot.
main4:
	type=ItemIcon
	default=disc
	x=-220
	y=-230
	width=128
	height=128
vcdMain4:
	type=ItemIcon
	default=disc_ps1
	x=-220
	y=-230
	width=128
	height=128
appsMain4:
	enabled=0
	type=ItemIcon
main5:
	type=ItemText
	x=-124
	y=-155
appsMain5:
	type=ItemText
	x=-124
	y=-185
# Korium put BdmIndex just above its 256 by 64 bar and the hint below that, at 448. The taller
# strip covers both of those rows, so the index moves into the thin band left above the bar and
# the hint goes to the TOP -- at 330 it ran into both the last list row and ItemText, which sits
# directly under the cover and should stay there.
main6:
	type=BdmIndex
	x=24
	y=330
	aligned=0
	scaled=0
	width=128
	height=16
main7:
	type=HintText
	aligned=1
	x=POS_MID
	y=14
main8:
	type=LoadingIcon
	x=-60
	y=20
	width=32
	height=32

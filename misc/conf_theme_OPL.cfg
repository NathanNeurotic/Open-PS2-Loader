# Korium Komblete -- graphics by Berion, script by KrahJohlito and Ripto.
# Ported to the built-in theme by RiptOPL.
#
# THIS IS KORIUM'S OWN CFG, element for element and number for number. It wrote positions as
# negative offsets, which the parser folds as x plus 640 and y plus 480, and most elements default
# to centre alignment -- so the literals below are the theme's own layout, kept as written.
#
# EXACTLY FIVE THINGS DIFFER, and each is forced by an asset that changed size under the cfg.
# Every one is marked FORCED at its element. Nothing else was re-derived, re-measured or retuned.
#
# NO GLOBAL COLOUR KEYS. The built-in themes take their colours from the Colours picker
# (thmLoad in src/themes.c, #574) -- a bg_color / text_color / sel_text_color here would override
# the user's own choice on every boot. Korium set text_color to white globally; the info page
# below keeps that as a per-element colour, which is also what the previous built-in did.
#
# NO default_font either. The built-in theme has no folder to load a TTF from, so the embedded
# PoeVeticaNew is already slot 0.
#
# Element names are scanned consecutively from 0 and a NUMBERING GAP SILENTLY STOPS THE SCAN
# (docs/THEME-FORMAT.md section 2.2). To switch an element off, set its enabled key to 0.
#
# Careful with comment lines. This format has no comment character -- a line containing a colon
# and no equals sign parses as a SECTION HEADER and re-homes every key under it. So comment text
# must avoid both characters.
main0:
	type=Background
	default=background
	aligned=0
	scaled=0
	width=DIM_INF
	height=DIM_INF
# FORCED, height only. Korium's 306 ran to 344, which the taller tab bar leaves alone -- but its
# hint sat at 448, under the old short bar, and had to move up. 282 keeps the list clear of the
# BdmIndex row. Everything else, including decorator of ICO, is Korium's.
main1:
	type=ItemsList
	decorator=ICO
	x=40
	y=38
	width=400
	height=282
# FORCED, size and position. Korium already had the bar at the BOTTOM -- a MenuIcon defaults to
# centre (320, 400) and this element declared no position at all. What changed is the artwork -- the
# strip is now a full-width 640 by 128 bitmap per device with that device's tab lit, where Korium's
# was 256 by 64, so it is pinned to the bottom edge instead of floating at 400. One UNFILTERED
# element is still the whole bar, exactly as Korium had it -- drawMenuIcon draws the texture for
# the current page's icon_id.
#
# The strip reads BDM, MMCE, APA, NET, APPS, FAV left to right, and initAllSupport in src/opl.c
# initialises the pages in that same order (menuAppendItem links each page at the tail, so call
# order IS tab order). Change one and you must change the other or the wrong tab lights up.
main2:
	type=MenuIcon
	x=0
	y=352
	aligned=0
	scaled=0
	width=640
	height=128
# Korium's covers, verbatim -- including NO overlay2. The case art carries its own gloss in the
# face alpha; layering case_overlay over it greys the face and puts a light fringe down the spine.
main3:

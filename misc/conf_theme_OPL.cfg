appsMain4:
	enabled=0
	type=ItemIcon
main5:
	type=ItemText
	x=-124
	y=-155
appsMain5:
	type=ItemText
	x=-124
	y=-185
# Korium's, untouched -- no y, so it takes the default 448 row under the bar.
main6:
	type=HintText
	aligned=1
	x=POS_MID
# Korium's forced 64 by 8 is kept (the new Index bitmaps are 128 by 16, the same 8 to 1 aspect,
# so they scale down cleanly) along with its default centre x. ONLY y moves, from the default 355
# to 348, because this bar's top edge is at 352 where Korium's was at 368.
main7:
	type=BdmIndex
	y=348
	width=64
	height=8
# Korium's, untouched -- 580, 400 clears the 480-wide bar, which ends at x 560.
main8:
	type=LoadingIcon
	x=-60
	y=-80
	width=32
	height=32
# Korium's info page, verbatim. Dropped only what has no asset behind it in this delivery, with
# the survivors renumbered to close the gaps -- the Device indicator (no_Device was retired with
# it), the LGO publisher logo (no official or unofficial art shipped), and the three $Enable
# badges. Those last are worth a note -- $EnableGSM and friends are INTS, so the attribute value is
# "0" or "1" and there is no <attribute>_<value> glyph for it to resolve to. They would have drawn
# their default unconditionally, reading as "cheats on" for every game.

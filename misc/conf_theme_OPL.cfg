	default=cover
	x=-86
	y=-246
	overlay=case_ps1
	overlay_ulx=17
	overlay_uly=11
	overlay_urx=155
	overlay_ury=17
	overlay_llx=17
	overlay_lly=144
	overlay_lrx=155
	overlay_lry=150

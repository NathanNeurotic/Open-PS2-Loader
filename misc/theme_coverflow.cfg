# FR #49's console (#System, PS1 or PS2) and disc (#Media, CD or DVD) glyphs are NOT drawn on
# this theme's main page. The ENGINE still supports them everywhere -- any theme that wants
# them just declares AttributeImage elements, and the info page below still shows #Media and
# #Format. They are only kept off OUR browse view, for two reasons.
#
#   1. VRAM. Two more textures resident for a badge this theme does not need.
#   2. AND THE BIGGER ONE. They were the ONLY config-consuming elements in this family. An
#      AttributeImage sets needsItemConfig, and that flag is what makes the menu open the
#      per-game cfg on the game device for EVERY settled row -- measured on hardware at
#      roughly three storage operations per second while merely browsing, on the worker that
#      outranks the art thread and shares its one file channel. rebuild-155 gated that read
#      on the flag; with these gone the flag is clear for the main page of both built-in
#      themes, so browsing issues no per-row config read at all.
#
# Re-adding either element re-arms that read. That is a fair trade for a theme that displays
# them -- it is not a fair trade for one that does not.

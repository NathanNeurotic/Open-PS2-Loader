# Korium Komblete, coverflow variant -- graphics by Berion, script by KrahJohlito and Ripto.
# Ported to the built-in theme by RiptOPL. Same furniture as conf_theme_OPL, but the list becomes
# a single centred title line and the covers become a carousel.
#
# No global colour keys -- see thmLoad in src/themes.c (#574) and the note in conf_theme_OPL.
font1=builtin
font1_size=20
coverflow_cover_offset=0
main0:
	type=Background
	default=background
	aligned=0
	scaled=0
	width=DIM_INF
	height=DIM_INF
# Tab bar along the bottom, matching conf_theme_OPL. See that file for why one unfiltered
# MenuIcon is the whole bar, and why the page order in initAllSupport must track the strip art.
main1:
	type=MenuIcon
	x=0
	y=352
	aligned=0
	scaled=0
	width=640
	height=128
# Carousel. y is the cover's CENTRE, not its top -- drawCoverFlow draws every cover ALIGN_CENTER
# and derives a per-cover recentre from that cover's OWN overlay corners, so a mixed shelf shares
# one baseline across portrait and square frames (#623/#643) and each family below only has to
# declare its own frame.
#
# The element stays 256 by 256 for all three, matching conf_theme_OPL, because the corner offsets
# are declared in ELEMENT space and the engine rescales them to the drawn size
# (ov->upperLeft_x times drawW over csw). Keeping the element at the canvas size means these are
# the same numbers as the ItemCover page -- shrink the element and every corner has to be rescaled.
#
# A centre of 172 puts a full-size cover at 44 to 300, clear of the title above and the bar at 352.
# That leaves roughly 52 px for the reflection where the old bar-free layout had about 119. The
# reflection is a fade, so it reads as shortened rather than cut off.
main2:
	type=Coverflow
	default=cover
	reflection=1
	reflection_offset=0
	y=172
	width=256
	height=256
	overlay=case
	overlay2=case_overlay
	overlay_ulx=0
	overlay_uly=12
	overlay_urx=167
	overlay_ury=22
	overlay_llx=0
	overlay_lly=240
	overlay_lrx=167
	overlay_lry=250

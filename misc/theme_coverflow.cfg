# Korium Komblete, coverflow variant -- graphics by Berion, script by KrahJohlito and Ripto.
# Ported to the built-in theme by RiptOPL.
#
# Korium predates this fork's Coverflow render mode, so there is no source cfg to honour for the
# carousel itself. Everything that DOES exist in Korium is kept from it -- the background, the tab
# bar, the hint, the BdmIndex, the loading icon and the whole info page are the same elements at
# the same numbers as conf_theme_OPL. Only the cover presentation differs -- the list collapses to
# a single centred title line and the ItemCover becomes a Coverflow.
#
# No global colour keys -- see thmLoad in src/themes.c (#574) and the note in conf_theme_OPL.
font1=builtin
font1_size=20
coverflow_cover_offset=0
# Per-game background art behind the list, gated by the Background Art toggle (gEnableBGArt).
#
# Two layers, the same way the original built-in theme and Korium's own "game background version"
# recipe both did it. main0 draws the game's ART/<id>_BG.png; main1 lays a translucent plate over it
# so the list stays legible. The delivered background.png is used for BOTH, with a uniform alpha of
# 204 -- about 80 percent, the value the original incebtion.png and the delivered background_info
# plate both use. One asset instead of a second 134 KB copy.
#
#   art present   main0 draws the art, main1 tints it charcoal -- the game reads through at 20 percent
#   no art        main0 falls to its default -- the same charcoal -- over the black frame clear, and
#                 main1 lands on top, so it is indistinguishable from a plain opaque background
#   toggle OFF    getGameImageTextureEx returns NULL for the BG cache BEFORE any request is made, so
#                 there is no I/O at all -- this is the setting to reach for if browsing feels slow
#
# Korium's recipe had two faults, corrected here. It set default to BG, but BG is a PATTERN, not an
# image name, so it would never have loaded game art. And background_transparent was not shipped.
main0:
	type=Background
	pattern=BG
	default=background
	aligned=0
	scaled=0
	width=DIM_INF
	height=DIM_INF
main1:
	type=StaticImage
	default=background
	aligned=0
	scaled=0
	width=DIM_INF
	height=DIM_INF
# The carousel's title line, in the ItemsList slot Korium used for the game list.
main2:
	type=ItemsList
	x=POS_MID
	y=26
	width=400
	height=24
	aligned=1
	font=1
# Carousel. y is the cover's CENTRE, not its top -- drawCoverFlow draws every cover ALIGN_CENTER
# and derives a per-cover recentre from that cover's OWN overlay corners, so a mixed shelf shares
# one baseline across portrait and square frames (#623/#643) and each family below only declares
# its own frame.
#
# The corners are Korium's, unchanged from the ItemCover page -- they are declared in ELEMENT space
# and the engine rescales them to the drawn size (ov->upperLeft_x times drawW over csw), so the
# element stays at the 256 by 256 canvas size and the numbers carry over untouched. NO overlay2,
# for the same reason as conf_theme_OPL -- the case art carries its own gloss in the face alpha.
#
# A centre of 172 puts a full-size cover at 44 to 300, clear of the title above and the bar at 352.
main3:
	type=Coverflow
	default=cover
	reflection=1
	reflection_offset=0
	y=172
	width=256
	height=256
	overlay=case
	overlay_ulx=0
	overlay_uly=12
	overlay_urx=167
	overlay_ury=20
	overlay_llx=0
	overlay_lly=242
	overlay_lrx=167
	overlay_lry=250
# The apps sleeve and the PS1 jewel case are shorter than the PS2 case, and on a single-kind page
# each face centres on its OWN y, so at 172 they floated high above the bar. 207 and 217 put their
# front faces on the PS2 case's bottom edge at 278. Mixed shelves use the page element's y, so
# they are unaffected.
appsMain3:
	type=Coverflow
	default=cover
	reflection=1
	reflection_offset=0
	y=207
	width=256
	height=256
	overlay=apps_case
	overlay_ulx=0
	overlay_uly=12
	overlay_urx=167
	overlay_ury=20
	overlay_llx=0
	overlay_lly=167
	overlay_lrx=167
	overlay_lry=175
vcdMain3:
	type=Coverflow
	default=cover
	reflection=1
	reflection_offset=0
	y=217
	width=256
	height=256
	overlay=case_ps1
	overlay_ulx=17
	overlay_uly=11
	overlay_urx=155
	overlay_ury=17
	overlay_llx=17
	overlay_lly=144
	overlay_lrx=155
	overlay_lry=150
# The bar is drawn AFTER the carousel here, unlike conf_theme_OPL where Korium's order puts it
# before the cover. A static ItemCover sits up at y 56 and never reaches the bar, but a cover
# reflection runs from the cover's bottom edge down past 352 -- drawn in Korium's order it would
# wash over the tabs. Nothing of Korium's is disturbed by this; it has no Coverflow.
main4:
	type=MenuIcon
	width=480
	height=96
main5:
	type=HintText
	aligned=1
	x=POS_MID
main6:
	type=BdmIndex
	y=348
	width=64
	height=8
main7:
	type=LoadingIcon
	x=-60
	y=-80
	width=32
	height=32
# FR #49's console (#System, PS1 or PS2) and disc (#Media, CD or DVD) glyphs are NOT drawn on this
# theme's main page. The ENGINE still supports them everywhere -- any theme that wants them just
# declares AttributeImage elements, and the info page below still shows #Media and #Format. They
# are only kept off OUR browse view, for two reasons.
#
#   1. VRAM. Two more textures resident for a badge this theme does not need.
#   2. AND THE BIGGER ONE. They were the ONLY config-consuming elements in this family. An
#      AttributeImage sets needsItemConfig, and that flag is what makes the menu open the per-game
#      cfg on the game device for EVERY settled row -- measured on hardware at roughly three
#      storage operations per second while merely browsing, on the worker that outranks the art
#      thread and shares its one file channel. rebuild-155 gated that read on the flag; with these
#      gone the flag is clear for this page, so browsing issues no per-row config read at all.
#
# Re-adding either element re-arms that read. That is a fair trade for a theme that displays them
# -- it is not a fair trade for one that does not.
# Two layers, exactly as Korium wrote them. info0 is the GAME'S OWN background art (ART/<id>_BG.png);
# with no art and no default, drawGameImage falls through to guiDrawBGPlasma, so a game without a
# background shows the animated plasma instead -- in the Colours picker's colour. info1 lays the
# info plate over it. That plate is deliberately translucent -- every pixel is alpha 204, about 80
# percent -- so the art underneath reads through as a tint. Collapsing these into a single
# Background that draws the plate leaves nothing behind it and the page goes flat grey.
#
# Unlike the MAIN page, a per-game background is cheap here. The main page issues an art request for
# every row the selection settles on while browsing; the info page shows ONE game, so this is one
# lookup per visit, and drawGameImage already holds it back until the cover has loaded.
info0:
	type=Background
	pattern=BG
info1:
